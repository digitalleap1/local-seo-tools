<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holiday & Special Hours Manager - GBP Holiday Hours + Seasonal Marketing</title>
<meta name="description" content="Plan GBP special hours for every US holiday + custom dates. Generate seasonal marketing campaigns, GBP post templates per holiday, schema.org specialOpeningHoursSpecification, and timing reminders so you never forget to update hours.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#ea580c; --accent-h:#c2410c; --accent-soft:rgba(234,88,12,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed; --green:#16a34a;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#fb923c; --accent-h:#fdba74; --accent-soft:rgba(251,146,60,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa; --green:#22c55e;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--amber));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.upcoming strong{color:var(--accent);font-size:14px}
.hdr-stat.set strong{color:var(--success)}
.hdr-stat.todo strong{color:var(--warn)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:340px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}

.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.s::before{background:var(--success)}.kpi.w::before{background:var(--warn)}.kpi.d::before{background:var(--danger)}
.kpi .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:900;font-family:var(--mono);color:var(--text);line-height:1.05}
.kpi.s .v{color:var(--success)}.kpi.w .v{color:var(--warn)}.kpi.d .v{color:var(--danger)}
.kpi .s{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

.holiday-row{padding:11px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:60px 1fr auto auto;gap:14px;align-items:center;font-size:12px}
.holiday-row:last-child{border-bottom:none}
.holiday-row .date{text-align:center}
.holiday-row .date .month{font-size:9px;font-family:var(--mono);font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.holiday-row .date .day{font-size:22px;font-weight:900;font-family:var(--mono);color:var(--text);line-height:1}
.holiday-row .date .dow{font-size:9px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;margin-top:1px}
.holiday-row .info .name{font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.holiday-row .info .emoji{font-size:15px}
.holiday-row .info .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.holiday-row .info .tag{font-size:9.5px;font-family:var(--mono);font-weight:700;padding:1px 6px;border-radius:3px;background:var(--bg);border:1px solid var(--border);color:var(--text2)}
.holiday-row .info .tag.federal{background:rgba(220,38,38,.1);color:var(--danger);border-color:rgba(220,38,38,.25)}
.holiday-row .info .tag.major{background:rgba(245,158,11,.1);color:var(--amber);border-color:rgba(245,158,11,.25)}
.holiday-row .status{font-size:10px;font-family:var(--mono);font-weight:800;padding:3px 9px;border-radius:11px}
.holiday-row .status.set{background:rgba(22,163,74,.13);color:var(--success)}
.holiday-row .status.open{background:rgba(37,99,235,.13);color:var(--blue)}
.holiday-row .status.closed{background:rgba(220,38,38,.13);color:var(--danger)}
.holiday-row .status.special{background:rgba(245,158,11,.13);color:var(--warn)}
.holiday-row .status.todo{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.holiday-row select{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:11px;color:var(--text);font-family:var(--mono);font-weight:700}

.code-block{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--text2);overflow-x:auto;white-space:pre-wrap;max-height:500px;overflow-y:auto}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:340px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="16" r="2"/></svg></div>
    <div><div class="logo-name">Holiday<span>Hours</span></div></div>
    <span class="logo-tag">SEASONAL</span>
  </div>

  <div class="hdr-stat set">Set: <strong id="stat-set">0</strong></div>
  <div class="hdr-stat todo">Untracked: <strong id="stat-todo">0</strong></div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">Dashboard</a>
  <a href="post-scheduler.html" class="hdr-link" style="border-color:rgba(234,88,12,.4);color:var(--accent)">GBP Posts</a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">
  <div id="left">
    <div class="lh-bar"><h3>Defaults</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Default Hours</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="row2"><div class="f"><label>Opens</label><input type="time" id="i-opens" value="09:00" oninput="saveSettings()"></div><div class="f"><label>Closes</label><input type="time" id="i-closes" value="17:00" oninput="saveSettings()"></div></div>
          <div class="f hint">Used as default for "Open special hours" actions.</div>
        </div>
      </div>
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Year & Region</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Year</label><select id="i-year" onchange="saveSettings()"><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option></select></div>
          <div class="f"><label>Holiday set</label><select id="i-region" onchange="saveSettings()"><option value="us">US (Federal + Major)</option><option value="us_only_federal">US Federal only</option><option value="us_canada">US + Canada</option></select></div>
        </div>
      </div>
      <div class="fsec collapsed">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Add Custom Date</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Date</label><input type="date" id="i-date"></div>
          <div class="f"><label>Name</label><input id="i-name" placeholder="Company anniversary"></div>
          <button class="btn-sub" onclick="addCustom()">+ Add custom date</button>
        </div>
      </div>
    </div>
    <div id="left-footer">
      <button class="btn-go" onclick="setTab('schema')">Generate Schema</button>
      <div style="display:flex;gap:5px">
        <button class="btn-sub" onclick="exportCSV()">CSV</button>
        <button class="btn-sub" onclick="exportICS()">.ics</button>
      </div>
    </div>
  </div>

  <div id="center">
    <div id="cbar">
      <button class="tab active" data-tab="upcoming" onclick="setTab('upcoming')">Upcoming</button>
      <button class="tab" data-tab="all" onclick="setTab('all')">All Year</button>
      <button class="tab" data-tab="schema" onclick="setTab('schema')">Schema</button>
      <button class="tab" data-tab="campaigns" onclick="setTab('campaigns')">Campaigns</button>
      <button class="tab" data-tab="guide" onclick="setTab('guide')">Best Practices</button>
      <div class="cb-sp"></div>
    </div>
    <div id="cbody"></div>
  </div>
</div>

<div id="footer">
  <div style="display:flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="ft-status">Never miss a holiday hours update again</span></div>
  <div class="ft-spacer"></div>
  <div>Built by <strong>Mukesh Kr</strong></div>
  <a class="ft-link" href="mailto:techie1418@gmail.com">Email</a>
</div>

<div id="toast"></div>

    {date:'2027-07-04', name:'Independence Day', emoji:'🎆', type:'federal'},
    {date:'2027-09-06', name:'Labor Day', emoji:'🛠️', type:'federal'},

    {date:'2027-10-31', name:'Halloween', emoji:'🎃', type:'major'},

    {date:'2027-12-25', name:'Christmas Day', emoji:'🎄', type:'federal'},
    {date:'2027-12-31', name:"New Year's Eve", emoji:'🥂', type:'major'},
  ],
};

const defaultState={
  defaultOpens:'09:00', defaultCloses:'17:00',
  year:'2026', region:'us',
  hours:{}, // dateKey -> {status:'open'|'closed'|'special', opens:'', closes:'', note:''}
  custom:[],
  view:'upcoming'
};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}
function toggleSec(h){h.parentElement.classList.toggle('collapsed');}

function fillInputs(){document.getElementById('i-opens').value=state.defaultOpens;document.getElementById('i-closes').value=state.defaultCloses;document.getElementById('i-year').value=state.year;document.getElementById('i-region').value=state.region;}
function saveSettings(){state.defaultOpens=document.getElementById('i-opens').value;state.defaultCloses=document.getElementById('i-closes').value;state.year=document.getElementById('i-year').value;state.region=document.getElementById('i-region').value;saveState();render();}

function getHolidays(){
  let list=HOLIDAY_DATA[state.year]||[];
  if(state.region==='us_only_federal') list=list.filter(h=>h.type==='federal');
  // Add custom
  return list.concat((state.custom||[]).filter(c=>c.date.startsWith(state.year)).map(c=>({...c, type:'custom', emoji:'⭐'}))).sort((a,b)=>a.date.localeCompare(b.date));
}

function setStatus(date, status){
  if(!state.hours[date])state.hours[date]={};
  state.hours[date].status=status;
  if(!state.hours[date].opens)state.hours[date].opens=state.defaultOpens;
  if(!state.hours[date].closes)state.hours[date].closes=state.defaultCloses;
  saveState();render();
}

function addCustom(){
  const date=document.getElementById('i-date').value;
  const name=document.getElementById('i-name').value.trim();
  if(!date||!name){toast('Date + name required','err');return;}
  state.custom=state.custom||[];
  state.custom.push({date, name});
  saveState();
  document.getElementById('i-date').value='';
  document.getElementById('i-name').value='';
  render();
  toast(`Added "${name}"`,'success');
}

function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function isFutureOrSoon(date){return date>=TODAY;}

function render(){
  const holidays=getHolidays();
  const upcoming=holidays.filter(h=>isFutureOrSoon(h.date));
  const set=holidays.filter(h=>state.hours[h.date]?.status);
  const todo=upcoming.filter(h=>!state.hours[h.date]?.status);
  document.getElementById('stat-upcoming').textContent=upcoming.length;
  document.getElementById('stat-set').textContent=set.length;
  document.getElementById('stat-todo').textContent=todo.length;
  if(state.view==='upcoming') return renderList(upcoming, 'Upcoming Holidays');
  if(state.view==='all') return renderList(holidays, 'All Holidays');
  if(state.view==='schema') return renderSchema(holidays);
  if(state.view==='campaigns') return renderCampaigns(upcoming);
  if(state.view==='guide') return renderGuide();
}

function renderList(holidays, label){
  if(!holidays.length){document.getElementById('cbody').innerHTML='<div class="empty"><div class="et">No holidays in this view</div></div>';return;}
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>${escapeHtml(label)}</h3><span class="badge">${holidays.length}</span></div><div>
    ${holidays.map(h=>{
      const d=new Date(h.date+'T12:00:00');
      const month=d.toLocaleString('en-US',{month:'short'});
      const day=d.getDate();
      const dow=d.toLocaleString('en-US',{weekday:'short'});
      const hrs=state.hours[h.date];
      const status=hrs?.status;
      return `<div class="holiday-row">
        <div class="date"><div class="month">${month}</div><div class="day">${day}</div><div class="dow">${dow}</div></div>
        <div class="info">
          <div class="name"><span class="emoji">${h.emoji||'•'}</span>${escapeHtml(h.name)}</div>
          <div class="tags">
            ${h.type==='federal'?'<span class="tag federal">Federal</span>':h.type==='major'?'<span class="tag major">Major</span>':h.type==='custom'?'<span class="tag" style="background:rgba(124,58,237,.13);color:var(--purple);border-color:rgba(124,58,237,.25)">Custom</span>':''}
            ${h.campaignAngle?'<span class="tag">📣 Campaign</span>':''}
            ${status?`<span class="tag" style="background:var(--accent-soft);color:var(--accent);border-color:var(--accent)">${status}${status==='special'&&hrs.opens?' '+hrs.opens+'-'+hrs.closes:''}</span>`:''}
          </div>
        </div>
        <div class="status ${status||'todo'}">${status?status.toUpperCase():'TODO'}</div>
        <select onchange="setStatus('${h.date}', this.value)" value="${status||''}">
          <option value="">Select…</option>
          <option value="open" ${status==='open'?'selected':''}>Open (regular)</option>
          <option value="closed" ${status==='closed'?'selected':''}>Closed</option>
          <option value="special" ${status==='special'?'selected':''}>Special hours</option>
        </select>
      </div>`;
    }).join('')}
  </div></div>`;
}

function renderSchema(holidays){
  const setHours=holidays.filter(h=>state.hours[h.date]?.status && state.hours[h.date].status!=='open');
  const specialSpec=setHours.map(h=>{
    const hrs=state.hours[h.date];
    if(hrs.status==='closed'){return {'@type':'OpeningHoursSpecification', validFrom:h.date, validThrough:h.date, opens:'00:00', closes:'00:00'};}
    return {'@type':'OpeningHoursSpecification', validFrom:h.date, validThrough:h.date, opens:hrs.opens||state.defaultOpens, closes:hrs.closes||state.defaultCloses};
  });
  const schema={'@context':'https://schema.org','@type':'LocalBusiness', specialOpeningHoursSpecification: specialSpec};
  const json=JSON.stringify(schema, null, 2);
  document.getElementById('cbody').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="l">Special dates</div><div class="v">${setHours.length}</div><div class="s">closed or special hours</div></div>
      <div class="kpi s"><div class="l">All set</div><div class="v">${setHours.filter(h=>state.hours[h.date].opens).length}</div><div class="s">have specific times</div></div>
    </div>
    <div class="section"><div class="section-hdr"><h3>specialOpeningHoursSpecification Schema</h3><button class="cb-btn" onclick="copySchema()">Copy</button></div><div style="padding:14px"><pre class="code-block">${escapeHtml(json)}</pre></div></div>
    <div class="section"><div class="section-hdr"><h3>How to Use</h3></div><div style="padding:14px;font-size:12.5px;line-height:1.7;color:var(--text2)">
      <p>Add this to your LocalBusiness schema's <code>specialOpeningHoursSpecification</code> array. Google honors this for overriding regular hours on holidays.</p>
      <p><strong>Also update GBP:</strong></p>
      <ol style="padding-left:22px;margin-top:6px">
        <li>Go to your Google Business Profile dashboard</li>
        <li>Click "Edit profile" → "Hours"</li>
        <li>Click "Add special hours"</li>
        <li>Add each special date</li>
        <li>Update at least 7 days before each holiday</li>
      </ol>
      <p style="margin-top:10px">Use the <a href="post-scheduler.html" style="color:var(--accent)">GBP Post Scheduler</a> to publish a "We're closed on [holiday]" announcement post 2-3 days before.</p>
    </div></div>
  `;
}
window.copySchema=function(){const holidays=getHolidays();const setHours=holidays.filter(h=>state.hours[h.date]?.status && state.hours[h.date].status!=='open');const specialSpec=setHours.map(h=>{const hrs=state.hours[h.date];if(hrs.status==='closed'){return {'@type':'OpeningHoursSpecification', validFrom:h.date, validThrough:h.date, opens:'00:00', closes:'00:00'};}return {'@type':'OpeningHoursSpecification', validFrom:h.date, validThrough:h.date, opens:hrs.opens||state.defaultOpens, closes:hrs.closes||state.defaultCloses};});const schema={'@context':'https://schema.org','@type':'LocalBusiness', specialOpeningHoursSpecification:specialSpec};navigator.clipboard.writeText(JSON.stringify(schema,null,2));toast('Schema copied','success');};

function renderCampaigns(upcoming){
  const withCampaigns=upcoming.filter(h=>h.campaignAngle);
  document.getElementById('cbody').innerHTML=`<div style="margin-bottom:14px;font-size:12.5px;color:var(--text2);background:var(--bg2);padding:11px 14px;border-radius:8px;border-left:3px solid var(--accent);line-height:1.55">Plan GBP posts + social campaigns around each upcoming holiday. Templates use <code>{biz}</code>, <code>{city}</code>, <code>{hours}</code>, <code>{nextDay}</code> placeholders.</div>
    ${withCampaigns.length?withCampaigns.map(h=>{
      const d=new Date(h.date+'T12:00:00');
      const dateStr=d.toLocaleString('en-US',{weekday:'long', month:'long', day:'numeric'});
      return `<div class="section"><div class="section-hdr"><h3>${h.emoji} ${escapeHtml(h.name)} — ${dateStr}</h3></div><div style="padding:14px">
        <h4 style="font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;font-family:var(--mono);margin-bottom:7px">Campaign angle</h4>
        <p style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px">${escapeHtml(h.campaignAngle)}</p>
        ${h.postTemplate?`<h4 style="font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;font-family:var(--mono);margin-bottom:7px">GBP post template</h4><pre style="background:var(--bg);padding:12px 14px;border-radius:7px;font-size:12.5px;line-height:1.55;font-family:Georgia,serif;white-space:pre-wrap;border:1px solid var(--border)">${escapeHtml(h.postTemplate)}</pre><div style="display:flex;gap:6px;margin-top:9px"><button class="cb-btn" onclick="navigator.clipboard.writeText('${escapeHtml(h.postTemplate).replace(/'/g,'&#39;')}');toast('Copied','success')">Copy Template</button><a class="cb-btn" href="post-scheduler.html">Schedule in GBP Posts</a></div>`:''}
      </div></div>`;
    }).join(''):'<div class="empty"><div class="et">No campaign templates available</div><div class="ed">Campaign templates are predefined for major holidays. Add your own dates with custom angles via the left panel.</div></div>'}`;
}

function renderGuide(){
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Holiday Hours Best Practices</h3></div><div style="padding:18px;font-size:13px;line-height:1.7;color:var(--text2)">
    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700">Why Holiday Hours Matter for Local SEO</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li>Customers Google "Is X open on [holiday]?" — outdated answers = lost trust + sales</li>
      <li>Google may show "Hours might differ" warning if you don't set special hours</li>
      <li>Wrong hours = bad reviews ("They were closed when their site said open!")</li>
      <li>Properly-set hours rank better in time-aware queries ("open now near me")</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Update Cadence</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li><strong>2-4 weeks before</strong> — Set special hours in GBP for major holidays</li>
      <li><strong>1 week before</strong> — Publish GBP post + social announcement</li>
      <li><strong>3 days before</strong> — Reminder post if closed; offer post if open</li>
      <li><strong>Day of</strong> — Reply quickly to any "are you open?" inquiries</li>
      <li><strong>Day after</strong> — Verify GBP reverted to normal hours</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Which Holidays to Plan For</h4>
    <p><strong>Federal holidays (always plan):</strong> New Year's Day, MLK Day, Presidents Day, Memorial Day, Juneteenth, July 4th, Labor Day, Columbus Day, Veterans Day, Thanksgiving, Christmas</p>
    <p style="margin-top:8px"><strong>Major retail holidays (plan if relevant):</strong> Valentine's Day, Mother's/Father's Day, Easter, Halloween, Black Friday, Cyber Monday, Christmas Eve, New Year's Eve</p>
    <p style="margin-top:8px"><strong>Industry-specific:</strong> Restaurants → all. Service businesses → federal only. Retail → all + sale days.</p>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Seasonal Campaign Hooks</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li><strong>Pre-holiday rush</strong> — "Book before [holiday] to avoid the wait"</li>
      <li><strong>Holiday tie-in</strong> — Service relevant to the season</li>
      <li><strong>Closed announcement</strong> — Show you care about staff (community goodwill)</li>
      <li><strong>Open exception</strong> — "We're open while others are closed" = competitive advantage</li>
      <li><strong>Community giving</strong> — Charity tie-in to holiday for PR + backlinks</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Schema Implementation</h4>
    <p>Use <code>specialOpeningHoursSpecification</code> in your LocalBusiness schema. This overrides regular hours for specific dates. Generate it in the Schema tab → paste into your homepage's JSON-LD.</p>
  </div></div>`;
}

function exportCSV(){
  const holidays=getHolidays();
  const rows=[['date','name','type','status','opens','closes','note']];
  holidays.forEach(h=>{const hrs=state.hours[h.date]||{};rows.push([h.date, h.name, h.type, hrs.status||'', hrs.opens||'', hrs.closes||'', hrs.note||'']);});
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='holiday-hours.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('CSV exported','success');
}
function exportICS(){
  const holidays=getHolidays();
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LocalSEOTools//HolidayHours//EN'];
  holidays.forEach(h=>{const hrs=state.hours[h.date]||{};const summary=`${h.emoji||''} ${h.name}${hrs.status?' ('+hrs.status+')':''}`;const dtStart=h.date.replace(/-/g,'');lines.push('BEGIN:VEVENT');lines.push(`UID:${h.date}@localseotools`);lines.push(`DTSTART;VALUE=DATE:${dtStart}`);lines.push(`SUMMARY:${summary.replace(/[,;]/g,' ')}`);if(hrs.status==='special'){lines.push(`DESCRIPTION:Special hours: ${hrs.opens||'TBD'} - ${hrs.closes||'TBD'}`);}else if(hrs.status==='closed'){lines.push('DESCRIPTION:Closed for the day');}lines.push('END:VEVENT');});
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='holidays.ics';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('ICS exported','success');
}

fillInputs();
render();
window.addEventListener('beforeunload',saveState);
</script>
<script src="global-nav.js"></script>
</body>
