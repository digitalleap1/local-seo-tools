<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBP Q&A Bulk Manager - Seed Google Business Profile Questions & Answers</title>
<meta name="description" content="Generate and manage Google Business Profile Q&A section. AI-generated FAQ-style questions and ideal owner answers, copy-paste workflow for the GBP dashboard, common-question library by industry, tone tuning.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#d97706; --accent-h:#b45309; --accent-soft:rgba(217,119,6,.08);
  --teal:#0d9488;
  --amber:#d97706;
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#f59e0b; --accent-h:#fbbf24; --accent-soft:rgba(245,158,11,.14);
  --teal:#14b8a6;
  --amber:#f59e0b;
  --danger:#ef4444; --success:#22c55e;
  --purple:#a78bfa; --pink:#ec4899; --blue:#3b82f6;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--blue));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(217,119,6,.3)}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.q strong{color:var(--accent)}
.hdr-stat.ans strong{color:var(--success)}
.hdr-stat.posted strong{color:var(--blue)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none;transition:all .15s}
.hdr-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hdr-link svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

#app{flex:1;display:flex;overflow:hidden}

/* LEFT */
#left{width:320px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:6px}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;flex:1}

#left-body{flex:1;overflow-y:auto;padding:14px}

.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}

.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f textarea{font-family:var(--font);min-height:50px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}

.pp-row{display:flex;flex-wrap:wrap;gap:4px}
.pp{padding:5px 9px;border-radius:5px;font-size:10px;font-family:var(--mono);font-weight:700;background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer}
.pp:hover{border-color:var(--accent);color:var(--accent)}
.pp.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pp .free{font-size:9px;background:rgba(255,255,255,.25);padding:1px 4px;border-radius:3px;margin-left:4px}
.pp:not(.active) .free{background:rgba(22,163,74,.13);color:var(--success)}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

/* CENTER */
#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab svg{width:13px;height:13px}
.tab .count{font-family:var(--mono);background:rgba(255,255,255,.25);border-radius:3px;padding:0 5px;font-size:10px}
.tab:not(.active) .count{background:var(--bg);color:var(--text2)}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
.cb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.scard.ok::before{background:var(--success)}
.scard.warn::before{background:var(--amber)}
.scard-label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.scard-val{font-size:24px;font-weight:800;color:var(--text);margin-top:4px;font-family:var(--mono);line-height:1.1}
.scard-sub{font-size:10.5px;color:var(--text3);margin-top:3px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

/* QA CARDS */
.qacard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.qacard.posted{background:rgba(22,163,74,.04);border-color:rgba(22,163,74,.3)}
.qacard.draft{border-left:4px solid var(--text3)}
.qacard.scheduled{border-left:4px solid var(--blue)}
.qacard.posted{border-left:4px solid var(--success)}
.qacard .qh{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.qacard .qcat{padding:3px 8px;border-radius:4px;background:var(--bg3);color:var(--text2);font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.qacard .qstatus{padding:3px 9px;border-radius:4px;font-family:var(--mono);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-left:auto}
.qacard .qstatus.draft{background:var(--bg3);color:var(--text2)}
.qacard .qstatus.scheduled{background:rgba(37,99,235,.13);color:var(--blue)}
.qacard .qstatus.posted{background:rgba(22,163,74,.13);color:var(--success)}
.qacard .qtext{font-size:14px;font-weight:700;color:var(--text);margin-bottom:7px;line-height:1.4}
.qacard .qtext::before{content:'Q:';color:var(--accent);margin-right:6px;font-weight:800}
.qacard .atext{font-size:13px;color:var(--text);line-height:1.65;padding:11px 13px;background:var(--bg);border-radius:7px;border-left:3px solid var(--accent);white-space:pre-wrap;font-family:var(--font)}
.qacard .atext::before{content:'A:';color:var(--accent);font-weight:800;margin-right:6px}
.qacard .atext.empty{font-style:italic;color:var(--text3);border-left-color:var(--text3)}
.qacard .qmeta{font-size:10.5px;color:var(--text3);font-family:var(--mono);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.qacard .qactions{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.qacard .qactions button{padding:6px 11px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.qacard .qactions button:hover{border-color:var(--accent);color:var(--accent)}
.qacard .qactions .copy{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff}
.qacard .qactions .copy:hover{background:var(--accent-h)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

.progress-line{height:3px;background:var(--bg3);overflow:hidden;flex-shrink:0}
.progress-line .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));width:0;transition:width .3s}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-item{display:flex;align-items:center;gap:5px}
.ft-item svg{width:12px;height:12px}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
#toast.info{border-color:var(--accent);color:var(--accent)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:320px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <div><div class="logo-name">GBP<span>Q&A</span></div></div>
    <span class="logo-tag">BULK</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat q"><strong id="stat-q">0</strong> questions</div>
  <div class="hdr-stat ans"><strong id="stat-ans">0</strong> answered</div>
  <div class="hdr-stat posted"><strong id="stat-posted">0</strong> marked posted</div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </a>
  <a href="gbp-audit.html" class="hdr-link" style="border-color:rgba(217,119,6,.4);color:var(--amber)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 11 12 14 22 4"/></svg>
    GBP Audit
  </a>
  <a href="voice-faq.html" class="hdr-link" style="border-color:rgba(124,58,237,.4);color:var(--purple)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/></svg>
    Voice FAQ
  </a>
  <a href="ai-assistant.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
    AI
  </a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">

  <!-- LEFT -->
  <div id="left">
    <div class="lh-bar"><h3>Setup</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Business Context</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Business name</label><input id="i-name" placeholder="Acme Plumbing" oninput="saveInputs()"></div>
          <div class="f"><label>Industry</label><select id="i-industry" onchange="saveInputs()">
            <option value="">— Select —</option>
            <option value="plumber">Plumber / Trade</option>
            <option value="restaurant">Restaurant</option>
            <option value="dentist">Dentist</option>
            <option value="lawyer">Lawyer / Attorney</option>
            <option value="salon">Salon / Beauty</option>
            <option value="realtor">Real Estate</option>
            <option value="auto">Auto Repair</option>
            <option value="medical">Medical / Clinic</option>
            <option value="fitness">Fitness / Gym</option>
            <option value="retail">Retail / Shop</option>
            <option value="contractor">Contractor</option>
            <option value="cleaning">Cleaning Service</option>
            <option value="pet">Pet Services</option>
          </select></div>
          <div class="row2">
            <div class="f"><label>City</label><input id="i-city" placeholder="Boston" oninput="saveInputs()"></div>
            <div class="f"><label>Phone</label><input id="i-phone" placeholder="(555) 123-4567" oninput="saveInputs()"></div>
          </div>
          <div class="f"><label>Top services (comma sep)</label><textarea id="i-services" placeholder="drain cleaning, water heater install, emergency response" oninput="saveInputs()"></textarea></div>
          <button class="btn-sub" onclick="syncFromTools()">↻ Auto-fill</button>
        </div>
      </div>
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Generation</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Categories</label>
            <div class="pp-row" id="cat-pills">
              <button class="pp active" data-c="hours">Hours</button>
              <button class="pp active" data-c="services">Services</button>
              <button class="pp active" data-c="pricing">Pricing</button>
              <button class="pp active" data-c="booking">Booking</button>
              <button class="pp active" data-c="location">Location</button>
              <button class="pp" data-c="parking">Parking</button>
              <button class="pp" data-c="accessibility">Accessibility</button>
              <button class="pp" data-c="payment">Payment</button>
              <button class="pp active" data-c="experience">Experience</button>
              <button class="pp" data-c="emergency">Emergency</button>
            </div>
          </div>
          <div class="f"><label>Tone</label><select id="i-tone" onchange="saveInputs()">
            <option value="friendly">Friendly</option>
            <option value="professional" selected>Professional</option>
            <option value="warm">Warm</option>
            <option value="brief">Brief / Direct</option>
          </select></div>
          <div class="f"><label>Per-category questions</label><input type="number" id="i-perCat" value="2" min="1" max="5"></div>
        </div>
      </div>
      <div class="fsec collapsed">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>AI Provider (for answers)</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="pp-row" id="ai-pills"></div>

<script>
/* ==========================================================================
 * GBP Q&A BULK MANAGER
 * Seed and manage Google Business Profile Q&A section
 * ========================================================================== */

/* ---------- QUESTION TEMPLATES BY CATEGORY ---------- */
const TEMPLATES = {
  hours: (ctx)=>[
    `What are your hours${ctx.city?' in '+ctx.city:''}?`,
    `Are you open on weekends?`,
    `Do you offer extended evening hours?`,
    `Are you open on holidays?`,
    `What time do you close on weekdays?`,
  ],
  services: (ctx)=>{
    const svc = ctx.services||['our services'];
    return [
      `Do you offer ${svc[0]||'this service'}?`,
      `What ${ctx.industry||'services'} do you specialize in?`,
      `Do you handle ${svc[1]||svc[0]||'complex jobs'}?`,
      `Can you do ${svc[2]||svc[0]||'custom work'}?`,
      `Do you provide free estimates?`,
    ];
  },
  pricing: (ctx)=>[
    `How much does ${(ctx.services||[ctx.industry||'this'])[0]} cost?`,
    `Do you offer free estimates?`,
    `Are there any hidden fees?`,
    `Do you offer financing or payment plans?`,
    `Is there a service call fee?`,
  ],
  booking: (ctx)=>[
    `How do I book an appointment?`,
    `Can I book online?`,
    `How far in advance should I book?`,
    `What's your cancellation policy?`,
    `Do you accept walk-ins?`,
  ],
  location: (ctx)=>[
    `Where exactly are you located${ctx.city?' in '+ctx.city:''}?`,
    `What's the nearest landmark to your location?`,
    `Is there a specific entrance I should use?`,
    `Are you accessible by public transit?`,
    `What neighborhood are you in?`,
  ],
  parking: (ctx)=>[
    `Is parking available?`,
    `Is parking free?`,
    `Where should I park?`,
    `Is there street parking nearby?`,
    `Is your parking lot wheelchair accessible?`,
  ],
  accessibility: (ctx)=>[
    `Is your business wheelchair accessible?`,
    `Do you have accessible restrooms?`,
    `Do you accommodate special needs?`,
    `Are service animals welcome?`,
    `Is there elevator access?`,
  ],
  payment: (ctx)=>[
    `What payment methods do you accept?`,
    `Do you accept credit cards?`,
    `Can I pay with Apple Pay or Google Pay?`,
    `Do you accept checks?`,
    `Do you offer financing?`,
  ],
  experience: (ctx)=>[
    `How long have you been in business?`,
    `Are you licensed and insured?`,
    `What certifications do you have?`,
    `How experienced is your team?`,
    `Are you ${ctx.city?ctx.city+'-':''}locally owned?`,
  ],
  emergency: (ctx)=>[
    `Do you offer emergency service?`,
    `Are you available 24/7?`,
    `How quickly can you respond to an emergency?`,
    `Do you charge extra for after-hours service?`,
    `What's considered an emergency?`,
  ],
};

/* OFFLINE FALLBACK ANSWERS */
function offlineAnswer(q, ctx){
  const t = q.toLowerCase();
  const city = ctx.city || 'our area';
  const biz = ctx.name || 'we';
  const phone = ctx.phone || 'our office';
  const services = (ctx.services||[]).slice(0,2).join(' and ') || 'our services';
  if(/hours|open|close|weekend|holiday/.test(t)) return `Our standard hours are Monday-Friday 8AM-6PM, Saturday 9AM-3PM. We're closed Sundays and major holidays. Special hours may apply — check our website or call ${phone} to confirm.`;
  if(/cost|price|fee|much|charge|estimate/.test(t)) return `Pricing depends on the scope of the job. ${biz} provides free estimates with no hidden fees. Call ${phone} to discuss your specific needs and get a transparent quote.`;
  if(/book|appointment|schedule|reservation/.test(t)) return `You can book by calling ${phone} or through our website. We recommend scheduling 1-2 days in advance for routine appointments. Same-day availability may be possible — just ask.`;
  if(/where|location|find|address|landmark/.test(t)) return `We're located in ${city}. Specific address and directions are on our Google Business Profile listing. Look for our signage out front.`;
  if(/parking/.test(t)) return `Yes, parking is available on-site for our customers. Street parking is also nearby. If you have specific accessibility needs, please let us know in advance.`;
  if(/accessible|wheelchair|disability/.test(t)) return `Yes, our business is wheelchair accessible. We accommodate guests with mobility needs and welcome service animals.`;
  if(/payment|credit|card|apple pay|check|cash/.test(t)) return `${biz} accepts all major credit cards, debit cards, cash, and digital payments including Apple Pay and Google Pay. Ask about financing options for larger jobs.`;
  if(/long|years|experience|certified|license|insured/.test(t)) return `${biz} has been serving ${city} for years. We are fully licensed, insured, and our team brings significant industry experience to every job.`;
  if(/emergency|24|after.hours|urgent/.test(t)) return `Yes, we offer emergency service for urgent situations. Call ${phone} day or night. After-hours rates may apply — ask when you call.`;
  if(/service|specialize|do you/.test(t)) return `${biz} specializes in ${services}. Call ${phone} or visit our website to discuss your specific needs.`;
  return `Thanks for asking! Please call us at ${phone} or visit our website for detailed information.`;
}

/* ---------- AI PROVIDERS ---------- */
const AI_PROVIDERS = {
  gemini: {label:'Gemini', free:'free', fields:[{key:'key',label:'API Key',type:'password'}],
    note:'<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>',
    async ask(prompt, keys){
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(keys.key)}`;
      const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      if(!res.ok) throw new Error('Gemini '+res.status);
      const j = await res.json(); return j.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }
  },
  openai: {label:'OpenAI', free:'paid', fields:[{key:'key',label:'API Key',type:'password'}],
    async ask(prompt, keys){
      const r = await fetch('https://api.openai.com/v1/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${keys.key}`}, body:JSON.stringify({model:'gpt-4o-mini', messages:[{role:'user',content:prompt}], temperature:0.7})});
      if(!r.ok) throw new Error('OpenAI '+r.status); const j = await r.json(); return j.choices?.[0]?.message?.content || '';
    }
  },
  claude: {label:'Claude', free:'paid', fields:[{key:'key',label:'API Key',type:'password'}],
    async ask(prompt, keys){
      const r = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'Content-Type':'application/json','x-api-key':keys.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify({model:'claude-haiku-4-5-20251001', max_tokens:600, messages:[{role:'user',content:prompt}]})});
      if(!r.ok) throw new Error('Claude '+r.status); const j = await r.json(); return j.content?.[0]?.text || '';
    }
  },
  groq: {label:'Groq', free:'free', fields:[{key:'key',label:'API Key',type:'password'}],
    async ask(prompt, keys){
      const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${keys.key}`}, body:JSON.stringify({model:'llama-3.3-70b-versatile', messages:[{role:'user',content:prompt}], temperature:0.7})});
      if(!r.ok) throw new Error('Groq '+r.status); const j = await r.json(); return j.choices?.[0]?.message?.content || '';
    }
  },
};

/* ---------- STATE ---------- */
const STORE_KEY = 'qa_state_v1';
const defaultState = {
  inputs: {name:'', industry:'', city:'', phone:'', services:'', tone:'professional', perCat:2},
  categories: ['hours','services','pricing','booking','location','experience'],
  ai: {provider:'gemini', keys:{}},
  questions: [], // [{id, category, q, a, status, ts}]
  view: 'all',
};
let state = loadState();
function loadState(){ try { return Object.assign(clone(defaultState), JSON.parse(localStorage.getItem(STORE_KEY))||{}); } catch(e){ return clone(defaultState); } }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return Math.random().toString(36).slice(2,11)+Date.now().toString(36).slice(-4);}

// Inherit
(function inherit(){
  try {
    if(!state.inputs.name){
      const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
      const b = cf?.businesses?.[0];
      if(b){ state.inputs.name = b.name; state.inputs.city = b.city||''; state.inputs.phone = b.phone||''; state.inputs.industry = b.category||''; }
    }
    if(!Object.keys(state.ai.keys).length){
      ['gbp_state_v1','rr_state_v1','ai_state_v1','ps_state_v1','vf_state_v1'].forEach(k=>{
        const o = JSON.parse(localStorage.getItem(k)||'null');
        if(o?.ai?.keys){ Object.entries(o.ai.keys).forEach(([id, keys])=>{if(keys.key && !state.ai.keys[id]?.key) state.ai.keys[id] = clone(keys);}); }
      });
    }
  } catch(e){}
  saveState();
})();

/* ---------- THEME ---------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('seohub_theme_v1', next);
  document.getElementById('theme-label').textContent = next==='dark'?'Dark':'Light';
}
document.getElementById('theme-label').textContent = (document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

/* ---------- UTILS ---------- */
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(msg,type){const t=document.getElementById('toast');t.className='';t.classList.add('show');if(type)t.classList.add(type);t.innerHTML='<span>'+escapeHtml(msg)+'</span>';setTimeout(()=>t.classList.remove('show'),2500);}
function toggleSec(hdr){hdr.parentElement.classList.toggle('collapsed');}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ---------- INPUTS ---------- */
function saveInputs(){
  state.inputs.name = document.getElementById('i-name').value.trim();
  state.inputs.industry = document.getElementById('i-industry').value;
  state.inputs.city = document.getElementById('i-city').value.trim();
  state.inputs.phone = document.getElementById('i-phone').value.trim();
  state.inputs.services = document.getElementById('i-services').value.trim();
  state.inputs.tone = document.getElementById('i-tone').value;
  state.inputs.perCat = parseInt(document.getElementById('i-perCat').value)||2;
  saveState();
}
function fillInputs(){
  ['name','industry','city','phone','services','tone','perCat'].forEach(k=>{
    const el = document.getElementById('i-'+k); if(el) el.value = state.inputs[k]||(k==='perCat'?2:'');
  });
  document.querySelectorAll('#cat-pills .pp').forEach(b=>{
    b.classList.toggle('active', state.categories.includes(b.dataset.c));
    b.onclick = ()=>{const c=b.dataset.c; if(state.categories.includes(c)) state.categories=state.categories.filter(x=>x!==c); else state.categories.push(c); b.classList.toggle('active'); saveState();};
  });
  document.getElementById('ai-pills').innerHTML = Object.entries(AI_PROVIDERS).map(([id,p])=>`<button class="pp ${state.ai.provider===id?'active':''}" onclick="selAi('${id}')">${escapeHtml(p.label)}</button>`).join('');
  renderAiCfg();
}
function selAi(id){state.ai.provider=id;saveState();document.querySelectorAll('#ai-pills .pp').forEach(b=>b.classList.toggle('active',b.textContent.includes(AI_PROVIDERS[id].label)));renderAiCfg();}
function renderAiCfg(){
  const p=AI_PROVIDERS[state.ai.provider]; const k=state.ai.keys[state.ai.provider]||{};
  document.getElementById('ai-cfg').innerHTML = p.fields.map(f=>`<div class="f"><label>${escapeHtml(f.label)}</label><input type="${f.type}" id="ai-${f.key}" value="${escapeAttr(k[f.key]||'')}" oninput="saveAiKey()"></div>`).join('') + (p.note?`<div class="f"><div class="hint">${p.note}</div></div>`:'');
  document.getElementById('ft-ai').textContent = k.key ? p.label : 'offline';
}
function saveAiKey(){const p=AI_PROVIDERS[state.ai.provider]; const keys=state.ai.keys[state.ai.provider]||{}; p.fields.forEach(f=>{keys[f.key]=document.getElementById('ai-'+f.key).value.trim();}); state.ai.keys[state.ai.provider]=keys; saveState(); document.getElementById('ft-ai').textContent = keys.key ? AI_PROVIDERS[state.ai.provider].label : 'offline';}

function syncFromTools(){
  let added = 0;
  try {
    const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
    const b = cf?.businesses?.[0];
    if(b){
      if(!state.inputs.name) state.inputs.name = b.name||'';
      if(!state.inputs.city) state.inputs.city = b.city||'';
      if(!state.inputs.phone) state.inputs.phone = b.phone||'';
      if(!state.inputs.industry) state.inputs.industry = b.category||'';
      added++;
    }
  } catch(e){}
  try {
    const ps = JSON.parse(localStorage.getItem('ps_state_v1')||'null');
    if(ps?.brand && !state.inputs.services){ state.inputs.services = ps.brand.services||''; added++; }
  } catch(e){}
  saveState(); fillInputs();
  toast(added?'Auto-filled':'No data','info');
}

/* ---------- GENERATE ---------- */
async function generateQA(){
  saveInputs();
  if(!state.inputs.name){ toast('Set business name first','err'); return; }
  if(!state.categories.length){ toast('Select at least one category','err'); return; }
  const ctx = {...state.inputs, services: state.inputs.services.split(',').map(s=>s.trim()).filter(Boolean)};

  // Generate questions
  let added = 0;
  state.categories.forEach(cat=>{
    const templates = TEMPLATES[cat] || (()=>[]);
    const qs = templates(ctx);
    const slice = qs.slice(0, state.inputs.perCat);
    slice.forEach(q=>{
      if(!state.questions.some(x=>x.q.toLowerCase()===q.toLowerCase())){
        state.questions.push({id:uid(), category:cat, q, a:'', status:'draft', ts:Date.now()});
        added++;
      }
    });
  });
  saveState();
  toast(`Added ${added} questions`,'success');
  renderAll();

  // Try AI for missing answers
  if(state.ai.keys[state.ai.provider]?.key){
    if(confirm('Use AI to answer all draft questions now?')) await answerAll();
  }
}

async function answerAll(){
  const needAnswer = state.questions.filter(q=>!q.a);
  if(!needAnswer.length){ toast('All answered','info'); return; }
  const p = AI_PROVIDERS[state.ai.provider]; const keys = state.ai.keys[state.ai.provider];
  const offlineMode = !keys?.key;
  if(offlineMode && !confirm(`No AI key — use offline template answers for ${needAnswer.length} questions?`)) return;
  document.getElementById('prog-fill').style.width = '5%';
  let done = 0;
  const ctx = {...state.inputs, services: state.inputs.services.split(',').map(s=>s.trim()).filter(Boolean)};
  for(const q of needAnswer){
    if(offlineMode){
      q.a = offlineAnswer(q.q, ctx);
    } else {
      try {
        const prompt = `You are the owner of ${ctx.name}${ctx.industry?', a '+ctx.industry+' business':''}${ctx.city?' in '+ctx.city:''}.

Phone: ${ctx.phone || 'unspecified'}
Top services: ${ctx.services.join(', ') || 'unspecified'}

Customer question (from Google Business Profile):
"${q.q}"

Write a Q&A-style owner answer (50-120 words):
- ${ctx.tone==='friendly'?'Friendly, warm':ctx.tone==='professional'?'Professional, confident':ctx.tone==='warm'?'Warm, personable':'Brief and direct'} tone
- Answer the question directly first, then add helpful context
- Include phone (${ctx.phone||'phone'}) where natural
- No emojis, no markdown, no "Great question!"
- Sound like the actual business owner

Output ONLY the answer text.`;
        q.a = (await p.ask(prompt, keys)).trim().replace(/^"|"$/g,'');
      } catch(e){
        q.a = offlineAnswer(q.q, ctx);
      }
    }
    done++;
    document.getElementById('prog-fill').style.width = (done/needAnswer.length*100)+'%';
    document.getElementById('ft-status').textContent = `Answered ${done}/${needAnswer.length}`;
    saveState(); renderAll();
    if(!offlineMode) await sleep(400);
  }
  document.getElementById('prog-fill').style.width = '0';
  toast(`Answered ${done} questions`,'success');
}

function addManual(){
  const q = prompt('Enter question:'); if(!q) return;
  state.questions.push({id:uid(), category:'manual', q, a:'', status:'draft', ts:Date.now()});
  saveState(); renderAll();
}

function setStatus(id, status){const q=state.questions.find(x=>x.id===id); if(q){q.status=status; saveState(); renderAll(); toast('Status updated','success');}}
function editQA(id){
  const q = state.questions.find(x=>x.id===id); if(!q) return;
  const nq = prompt('Edit question:', q.q); if(nq===null) return;
  const na = prompt('Edit answer:', q.a); if(na===null) return;
  q.q = nq.trim(); q.a = na.trim(); saveState(); renderAll();
}
function delQA(id){if(!confirm('Delete?')) return; state.questions = state.questions.filter(q=>q.id!==id); saveState(); renderAll();}
function copyQA(id){const q=state.questions.find(x=>x.id===id); if(!q) return; navigator.clipboard.writeText(`Q: ${q.q}\nA: ${q.a||'(no answer)'}`); toast('Copied','success');}
function copyAll(){if(!state.questions.length){toast('No data','err'); return;} const txt = state.questions.map(q=>`Q: ${q.q}\nA: ${q.a||'(no answer)'}`).join('\n\n'); navigator.clipboard.writeText(txt); toast(`Copied ${state.questions.length} Q&A`,'success');}
function clearAll(){if(!confirm('Clear all Q&A?')) return; state.questions=[]; saveState(); renderAll();}

/* ---------- RENDER ---------- */
function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderCenter();}

function renderAll(){
  const total = state.questions.length;
  const ans = state.questions.filter(q=>q.a).length;
  const posted = state.questions.filter(q=>q.status==='posted').length;
  document.getElementById('stat-q').textContent = total;
  document.getElementById('stat-ans').textContent = ans;
  document.getElementById('stat-posted').textContent = posted;
  document.getElementById('ct-all').textContent = total;
  document.getElementById('ct-draft').textContent = state.questions.filter(q=>q.status==='draft').length;
  document.getElementById('ct-scheduled').textContent = state.questions.filter(q=>q.status==='scheduled').length;
  document.getElementById('ct-posted').textContent = posted;
  renderCenter();
}

function renderCenter(){
  const body = document.getElementById('cbody');
  if(state.view==='guide') return renderGuide(body);
  let qs = state.questions.slice();
  if(state.view!=='all') qs = qs.filter(q=>q.status===state.view);
  if(!qs.length){
    body.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div><div class="et">GBP Q&A Bulk Manager</div><div class="ed">Generate FAQ-style questions and ideal owner answers for your Google Business Profile Q&A section. Common customer questions by category (hours, pricing, booking, etc.) + AI-generated answers in your brand voice. Copy-paste workflow for the GBP dashboard.</div></div></div>`;
    return;
  }
  body.innerHTML = qs.map(q=>`<div class="qacard ${q.status}">
    <div class="qh">
      <span class="qcat">${q.category}</span>
      <span class="qstatus ${q.status}">${q.status}</span>
    </div>
    <div class="qtext">${escapeHtml(q.q)}</div>
    <div class="atext ${q.a?'':'empty'}">${q.a?escapeHtml(q.a):'No answer yet — click AI Answer or Edit'}</div>
    <div class="qmeta"><span>${(q.a||'').split(/\s+/).filter(Boolean).length} words</span><span>${new Date(q.ts).toLocaleDateString()}</span></div>
    <div class="qactions">
      <button onclick="editQA('${q.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>Edit</button>
      ${q.status==='draft'?`<button onclick="setStatus('${q.id}','scheduled')">📅 Schedule</button>`:''}
      ${q.status!=='posted'?`<button onclick="setStatus('${q.id}','posted')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><polyline points="20 6 9 17 4 12"/></svg>Mark Posted</button>`:`<button onclick="setStatus('${q.id}','draft')">↶ Unpost</button>`}
      <button onclick="delQA('${q.id}')">Delete</button>
      <button class="copy" onclick="copyQA('${q.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Q&A</button>
    </div>
  </div>`).join('');
}

    <p style="color:var(--text2);margin-bottom:14px"><strong>Important:</strong> GBP doesn't have a bulk Q&A API. Google explicitly removed it years ago to prevent spam. You must post each Q&A manually as an "owner-asked" question, then immediately answer it as the owner.</p>

    <h4 style="font-size:14px;font-weight:700;margin-top:14px">Step-by-step</h4>
    <ol style="padding-left:20px;margin-top:8px;color:var(--text2)">
      <li>Open Google Maps in your browser (logged in as the business owner).</li>
      <li>Search for your business name and open your listing.</li>
      <li>Scroll to the <strong>Questions & answers</strong> section.</li>
      <li>Click <strong>Ask a question</strong>.</li>
      <li>Paste a question from this tool.</li>
      <li>Click <strong>Post</strong>.</li>
      <li>The question now appears. Tap <strong>Answer</strong> below it.</li>
      <li>Paste the matching answer from this tool.</li>
      <li>Mark the Q&A as <strong>"Mark Posted"</strong> in this tool.</li>
      <li>Repeat for each Q&A.</li>
    </ol>

    <h4 style="font-size:14px;font-weight:700;margin-top:18px">Tips for max impact</h4>
    <ul style="padding-left:20px;margin-top:8px;color:var(--text2)">
      <li><strong>Pace yourself:</strong> Post 2-3 per week, not 20 in one day. Bulk posting looks spammy and Google may filter.</li>

      <li><strong>Monitor for new questions:</strong> Set up a daily check. Unanswered customer questions often get answered (incorrectly) by other Google users — and stay there.</li>

      <li>Identical phrasing across answers (looks templated)</li>
      <li>Forgetting to upvote your answers</li>
      <li>Posting under your personal Google account instead of the business profile</li>
      <li>Never coming back to monitor or update</li>
    </ul>
  </div></div>`;

/* ---------- EXPORT ---------- */
function exportCSV(){
  if(!state.questions.length){toast('No data','err'); return;}
  const rows = [['question','answer','category','status','words','date_added']];
  state.questions.forEach(q=>rows.push([q.q, q.a||'', q.category, q.status, (q.a||'').split(/\s+/).filter(Boolean).length, new Date(q.ts).toISOString().slice(0,10)]));
  const blob = new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`gbp-qa-${(state.inputs.name||'biz').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.csv`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Exported','success');
}
