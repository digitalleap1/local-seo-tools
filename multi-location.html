<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Location Hub - Bulk Local SEO for Franchises, Chains & Multi-Location Brands</title>
<meta name="description" content="Import N business locations from CSV/JSON → bulk LocalBusiness schema generation, aggregate health dashboard, location-page content brief generator, XML sitemap export, store locator HTML. 100% client-side. Built for franchises and multi-location brands.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<style>
:root {
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#0d9488; --accent-h:#0f766e; --accent-soft:rgba(13,148,136,.08);
  --teal:#0d9488;
  --amber:#d97706;
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --map-filter:none;
  --code-bg:#0c1828;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#14b8a6; --accent-h:#2dd4bf; --accent-soft:rgba(20,184,166,.14);
  --teal:#14b8a6;
  --amber:#f59e0b;
  --danger:#ef4444; --success:#22c55e;
  --purple:#a78bfa; --pink:#ec4899; --blue:#3b82f6;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
  --map-filter:brightness(.82) saturate(.9);
  --code-bg:#040b18;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--blue));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(13,148,136,.3)}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.loc strong{color:var(--accent)}
.hdr-stat.geo strong{color:var(--success)}
.hdr-stat.missing strong{color:var(--danger)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none;transition:all .15s}
.hdr-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hdr-link svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

#app{flex:1;display:flex;overflow:hidden}

/* LEFT — LOCATIONS LIST */
#left{width:280px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:6px}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;flex:1}
.btn-add{padding:5px 10px;border-radius:5px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border:none}
.btn-add:hover{background:var(--accent-h)}

.brand-card{padding:12px 14px;background:linear-gradient(135deg,var(--accent-soft),transparent);border-bottom:1px solid var(--border)}
.brand-card .bf{display:flex;flex-direction:column;gap:6px}
.brand-card input{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-size:11.5px;color:var(--text)}
.brand-card input:focus{border-color:var(--accent);outline:none}

#loc-list{flex:1;overflow-y:auto;padding:6px}
.empty-list{padding:30px;text-align:center;color:var(--text3);font-size:11.5px;line-height:1.55}

.loc-item{padding:9px 12px;border-radius:8px;margin-bottom:4px;cursor:pointer;display:flex;align-items:flex-start;gap:9px;transition:all .12s;border:1px solid transparent}
.loc-item:hover{background:var(--bg3)}
.loc-item.active{background:var(--accent-soft);border-color:var(--accent)}
.loc-item .num{width:24px;height:24px;border-radius:6px;background:var(--bg3);color:var(--text2);font-family:var(--mono);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
.loc-item.active .num{background:var(--accent);color:#fff;border-color:var(--accent)}
.loc-item .info{flex:1;min-width:0}
.loc-item .ln{font-size:11.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-item .lm{font-size:10px;color:var(--text2);font-family:var(--mono);margin-top:1px;display:flex;gap:5px;align-items:center}
.loc-item .lm .dot{width:6px;height:6px;border-radius:50%}
.loc-item .lm .dot.ok{background:var(--success)}
.loc-item .lm .dot.warn{background:var(--amber)}
.loc-item .lm .dot.bad{background:var(--danger)}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

/* CENTER */
#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab svg{width:13px;height:13px}
.tab .count{font-family:var(--mono);background:rgba(255,255,255,.25);border-radius:3px;padding:0 5px;font-size:10px}
.tab:not(.active) .count{background:var(--bg);color:var(--text2)}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
.cb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-btn svg{width:13px;height:13px}

#cbody{flex:1;overflow-y:auto;background:var(--bg);padding:14px}

/* DASHBOARD */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.scard.ok::before{background:var(--success)}
.scard.warn::before{background:var(--amber)}
.scard.bad::before{background:var(--danger)}
.scard-label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.scard-val{font-size:26px;font-weight:800;color:var(--text);margin-top:4px;font-family:var(--mono);line-height:1.1}
.scard.ok .scard-val{color:var(--success)}
.scard.warn .scard-val{color:var(--amber)}
.scard.bad .scard-val{color:var(--danger)}
.scard-sub{font-size:10.5px;color:var(--text3);margin-top:3px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

/* MAP */
#map-wrap{height:320px;border-radius:8px;overflow:hidden;border:1px solid var(--border)}
#map{height:100%;width:100%;background:var(--bg3)}
#map .leaflet-tile-pane{filter:var(--map-filter);transition:filter .4s}
.leaflet-container{font-family:var(--font)}
.loc-marker{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-weight:800;font-size:11px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);background:var(--accent)}
.loc-marker.ok{background:var(--success)}
.loc-marker.warn{background:var(--amber)}
.loc-marker.bad{background:var(--danger)}
.loc-marker span{transform:rotate(45deg)}

/* TABLE */
table.ltable{width:100%;border-collapse:collapse;font-size:11.5px}
table.ltable thead{background:var(--bg);position:sticky;top:0;z-index:5}
table.ltable th{padding:8px 10px;text-align:left;font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);white-space:nowrap}
table.ltable td{padding:8px 10px;border-bottom:1px solid var(--border)}
table.ltable tr:hover{background:var(--bg3)}
table.ltable .ln{font-weight:600;color:var(--text)}
table.ltable .lm{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px}
table.ltable .health-pill{display:inline-block;font-family:var(--mono);font-weight:800;font-size:11px;padding:2px 8px;border-radius:4px;color:#fff}
table.ltable .health-pill.ok{background:var(--success)}
table.ltable .health-pill.warn{background:var(--amber)}
table.ltable .health-pill.bad{background:var(--danger)}
table.ltable .row-actions{display:flex;gap:4px}
table.ltable .row-actions button{width:22px;height:22px;border-radius:4px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:10px;display:flex;align-items:center;justify-content:center}
table.ltable .row-actions button:hover{border-color:var(--accent);color:var(--accent)}

/* CODE OUTPUT */
.code-out{background:var(--code-bg);color:#e2ecf8;padding:14px;border-radius:8px;font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow:auto;max-height:500px;white-space:pre-wrap;word-break:break-word}
.code-out .k{color:#f59e0b}
.code-out .s{color:#34d399}
.code-out .n{color:#60a5fa}

/* EDIT MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:680px;width:100%;max-height:90vh;overflow:hidden;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.modal-hdr h2{font-size:14px;font-weight:700;flex:1}
.modal-hdr .close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg3)}
.modal-foot button{padding:8px 14px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.modal-foot button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;font-weight:600}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text)}
.field .hint{font-size:10.5px;color:var(--text3);font-family:var(--mono);line-height:1.4}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:600px}
.empty .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;width:100%;max-width:700px;margin-top:8px}
.empty .actions button{padding:13px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;text-align:left;font-size:12px;color:var(--text);cursor:pointer;transition:all .15s}
.empty .actions button:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.empty .actions button strong{display:block;font-size:13px;margin-bottom:3px}
.empty .actions button span{font-size:11px;color:var(--text2);line-height:1.4}

.progress-line{height:3px;background:var(--bg3);overflow:hidden;flex-shrink:0}
.progress-line .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));width:0;transition:width .3s}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-item{display:flex;align-items:center;gap:5px}
.ft-item svg{width:12px;height:12px}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
#toast.info{border-color:var(--accent);color:var(--accent)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:80%;max-width:280px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    </div>
    <div><div class="logo-name">Multi<span>Location</span></div></div>
    <span class="logo-tag">HUB</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat loc"><strong id="stat-loc">0</strong> locations</div>
  <div class="hdr-stat geo"><strong id="stat-geo">0</strong> geocoded</div>
  <div class="hdr-stat missing"><strong id="stat-missing">0</strong> incomplete</div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </a>
  <a href="citation-finder.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
    Citations
  </a>
  <a href="schema-generator.html" class="hdr-link" style="border-color:rgba(13,148,136,.4);color:var(--teal)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    Schema
  </a>
  <a href="ai-assistant.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
    AI
  </a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">

  <!-- LEFT -->
  <div id="left">
    <div class="lh-bar">
      <h3>Locations</h3>
      <button class="btn-add" onclick="openEdit()">+ Add</button>
    </div>
    <div class="brand-card">
      <div class="bf">
        <input id="brand-name" placeholder="Brand name (e.g. Acme Plumbing Co.)" oninput="saveBrand()">

<script>
/* ==========================================================================
 * MULTI-LOCATION HUB
 * Manage N business locations, bulk schema, briefs, sitemap, store locator
 * ========================================================================== */

const STORE_KEY = 'ml_state_v1';
const defaultState = {
  brand: {name:'', url:'', cat:'LocalBusiness'},
  locations: [], // {id, label, slug, addr, city, state, zip, country, phone, email, url, lat, lng, hours, manager, landmarks}
  activeId: null,
  view: 'dashboard',
};
let state = loadState();
function loadState(){ try { return Object.assign(clone(defaultState), JSON.parse(localStorage.getItem(STORE_KEY))||{}); } catch(e){ return clone(defaultState); } }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return Math.random().toString(36).slice(2,11)+Date.now().toString(36).slice(-4);}

// Inherit brand from Citation Finder
(function inherit(){
  if(state.brand.name) return;
  try {
    const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
    const b = cf?.businesses?.[0];
    if(b){ state.brand.name = b.name; state.brand.url = b.website; state.brand.cat = b.category || 'LocalBusiness'; saveState(); }
  } catch(e){}
})();

/* ---------- THEME ---------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('seohub_theme_v1', next);
  document.getElementById('theme-label').textContent = next==='dark'?'Dark':'Light';
}
document.getElementById('theme-label').textContent = (document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

/* ---------- UTILS ---------- */
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(msg,type){const t=document.getElementById('toast');t.className='';t.classList.add('show');if(type)t.classList.add(type);t.innerHTML='<span>'+escapeHtml(msg)+'</span>';setTimeout(()=>t.classList.remove('show'),2500);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function slugify(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);}

function healthOf(loc){
  let pts=0, max=0;
  const reqd = ['label','addr','city','zip','phone'];
  reqd.forEach(k=>{ max+=2; if(loc[k]) pts+=2; });
  const rec = ['state','country','email','url','lat','lng'];
  rec.forEach(k=>{ max++; if(loc[k]) pts++; });
  if(loc.hours && (loc.hours.mon || loc.hours.sat)) pts++; max++;
  if(loc.landmarks) pts++; max++;
  const pct = Math.round(pts/max*100);
  return {score:pct, level: pct>=80?'ok':pct>=50?'warn':'bad'};
}

/* ---------- BRAND ---------- */
function saveBrand(){
  state.brand.name = document.getElementById('brand-name').value;
  state.brand.url = document.getElementById('brand-url').value;
  state.brand.cat = document.getElementById('brand-cat').value || 'LocalBusiness';
  saveState();
}
function fillBrand(){
  document.getElementById('brand-name').value = state.brand.name||'';
  document.getElementById('brand-url').value = state.brand.url||'';
  document.getElementById('brand-cat').value = state.brand.cat||'';
}

/* ---------- LOCATIONS CRUD ---------- */
let editingId = null;
function openEdit(id){
  editingId = id || null;
  const loc = id ? state.locations.find(x=>x.id===id) : {country:'US', hours:{}};
  document.getElementById('em-title').textContent = id?'Edit Location':'Add Location';
  document.getElementById('e-label').value = loc.label||'';
  document.getElementById('e-slug').value = loc.slug||'';
  document.getElementById('e-addr').value = loc.addr||'';
  document.getElementById('e-city').value = loc.city||'';
  document.getElementById('e-state').value = loc.state||'';
  document.getElementById('e-zip').value = loc.zip||'';
  document.getElementById('e-country').value = loc.country||'US';
  document.getElementById('e-phone').value = loc.phone||'';
  document.getElementById('e-email').value = loc.email||'';
  document.getElementById('e-url').value = loc.url||'';
  document.getElementById('e-lat').value = loc.lat||'';
  document.getElementById('e-lng').value = loc.lng||'';
  document.getElementById('e-hrs-mon').value = loc.hours?.mon||'';
  document.getElementById('e-hrs-sat').value = loc.hours?.sat||'';
  document.getElementById('e-manager').value = loc.manager||'';
  document.getElementById('e-landmarks').value = loc.landmarks||'';
  document.getElementById('edit-modal').classList.add('show');
}
function closeEdit(){document.getElementById('edit-modal').classList.remove('show');}
function saveLocation(){
  const label = document.getElementById('e-label').value.trim();
  const city = document.getElementById('e-city').value.trim();
  if(!label && !city){ toast('Label or city required','err'); return; }
  let slug = document.getElementById('e-slug').value.trim() || slugify(label || city);
  const loc = {
    id: editingId || uid(),
    label: label || (city + ', ' + document.getElementById('e-state').value.trim()),
    slug,
    addr: document.getElementById('e-addr').value.trim(),
    city,
    state: document.getElementById('e-state').value.trim(),
    zip: document.getElementById('e-zip').value.trim(),
    country: document.getElementById('e-country').value,
    phone: document.getElementById('e-phone').value.trim(),
    email: document.getElementById('e-email').value.trim(),
    url: document.getElementById('e-url').value.trim(),
    lat: document.getElementById('e-lat').value.trim(),
    lng: document.getElementById('e-lng').value.trim(),
    hours: {mon: document.getElementById('e-hrs-mon').value.trim(), sat: document.getElementById('e-hrs-sat').value.trim()},
    manager: document.getElementById('e-manager').value.trim(),
    landmarks: document.getElementById('e-landmarks').value.trim(),
  };
  if(editingId){
    const idx = state.locations.findIndex(x=>x.id===editingId);
    if(idx>=0) state.locations[idx] = loc;
  } else {
    state.locations.push(loc);
  }
  saveState(); closeEdit(); renderAll();
  toast('Saved','success');
}
function delLocation(id){
  if(!confirm('Delete this location?')) return;
  state.locations = state.locations.filter(l=>l.id!==id);
  if(state.activeId===id) state.activeId = null;
  saveState(); renderAll();
}

/* ---------- IMPORT/EXPORT ---------- */
function downloadTemplate(){
  const csv = 'label,slug,addr,city,state,zip,country,phone,email,url,lat,lng,hours_mon,hours_sat,manager,landmarks\n' +
              '"Downtown Boston","boston-downtown","123 Main St","Boston","MA","02108","US","+1 617 555 0142","boston@acme.com","https://acme.com/locations/boston","42.3601","-71.0589","9:00-17:00","closed","Jane Doe","Near the State House"\n';
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='multi-location-template.csv'; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Template downloaded','success');
}

function importCSV(){
  const input = document.createElement('input'); input.type='file'; input.accept='.csv';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try {
        const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){ toast('CSV needs header + rows','err'); return; }
        const header = parseCSVLine(lines[0]).map(h=>h.toLowerCase().replace(/\s/g,'_'));
        const idx = k=>header.indexOf(k);
        let added = 0;
        for(let i=1;i<lines.length;i++){
          const c = parseCSVLine(lines[i]);
          const loc = {
            id: uid(),
            label: c[idx('label')]||'',
            slug: c[idx('slug')]||slugify((c[idx('label')]||'')+(c[idx('city')]||'')),
            addr: c[idx('addr')]||c[idx('address')]||c[idx('street')]||'',
            city: c[idx('city')]||'',
            state: c[idx('state')]||c[idx('region')]||'',
            zip: c[idx('zip')]||c[idx('postal')]||'',
            country: (c[idx('country')]||'US').toUpperCase(),
            phone: c[idx('phone')]||c[idx('tel')]||'',
            email: c[idx('email')]||'',
            url: c[idx('url')]||c[idx('page')]||'',
            lat: c[idx('lat')]||c[idx('latitude')]||'',
            lng: c[idx('lng')]||c[idx('lon')]||c[idx('longitude')]||'',
            hours: {mon: c[idx('hours_mon')]||c[idx('mon')]||'', sat: c[idx('hours_sat')]||c[idx('sat')]||''},
            manager: c[idx('manager')]||'',
            landmarks: c[idx('landmarks')]||c[idx('neighborhood')]||'',
          };
          if(loc.label || loc.city) { state.locations.push(loc); added++; }
        }
        saveState(); renderAll();
        toast(`Imported ${added} locations`,'success');
      } catch(err){ toast('Bad CSV: '+err.message,'err'); }
    };
    r.readAsText(f);
  };
  input.click();
}
function parseCSVLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){ if(c==='"' && line[i+1]==='"'){cur+='"';i++;} else if(c==='"'){inQ=false;} else cur+=c; }
    else { if(c===','){out.push(cur);cur='';} else if(c==='"' && !cur){inQ=true;} else cur+=c; }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}

function importJSON(){
  const input = document.createElement('input'); input.type='file'; input.accept='.json';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try {
        const data = JSON.parse(ev.target.result);
        const arr = Array.isArray(data) ? data : (data.locations||[]);
        let added = 0;
        arr.forEach(l=>{ state.locations.push({...l, id:uid()}); added++; });
        if(data.brand) state.brand = {...state.brand, ...data.brand};
        saveState(); fillBrand(); renderAll();
        toast(`Imported ${added}`,'success');
      } catch(e){ toast('Bad JSON','err'); }
    };
    r.readAsText(f);
  };
  input.click();
}

function clearAll(){
  if(!confirm('Clear all locations? (Brand info kept.)')) return;
  state.locations = []; state.activeId=null;
  saveState(); renderAll();
  toast('Cleared','success');
}

/* ---------- GEOCODING ---------- */
async function geocodeAll(){
  const todo = state.locations.filter(l=>!l.lat || !l.lng);
  if(!todo.length){ toast('All locations already geocoded','info'); return; }
  if(todo.length>15){ if(!confirm(`Geocoding ${todo.length} locations via Nominatim — please respect their rate limit (1/sec). Continue?`)) return; }
  document.getElementById('btn-geocode').disabled = true;
  let done=0;
  for(const loc of todo){
    const q = [loc.addr, loc.city, loc.state, loc.zip, loc.country].filter(Boolean).join(', ');
    if(!q){ done++; continue; }
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`, {headers:{'Accept':'application/json'}});
      const j = await r.json();
      if(j[0]){
        loc.lat = parseFloat(j[0].lat).toFixed(6);
        loc.lng = parseFloat(j[0].lon).toFixed(6);
      }
    } catch(e){}
    done++;
    document.getElementById('prog-fill').style.width = (done/todo.length*100)+'%';
    document.getElementById('ft-status').textContent = `Geocoding ${done}/${todo.length}`;
    saveState();
    if(done<todo.length) await sleep(1100); // Nominatim 1 req/sec limit
  }
  document.getElementById('prog-fill').style.width = '0';
  document.getElementById('btn-geocode').disabled = false;
  renderAll();
  toast(`Geocoded ${done} locations`,'success');
}

/* ---------- BULK SCHEMA ---------- */
function generateSchemas(){
  const brand = state.brand;
  const out = state.locations.map(loc=>{
    const obj = {
      '@context':'https://schema.org',
      '@type': brand.cat||'LocalBusiness',
      '@id': `${brand.url||''}/locations/${loc.slug}/#location`,
      name: `${brand.name||'Business'} — ${loc.label||loc.city}`,
      url: loc.url || `${brand.url||''}/locations/${loc.slug}/`,
    };
    if(loc.phone) obj.telephone = loc.phone;
    if(loc.email) obj.email = loc.email;
    if(loc.addr || loc.city){
      obj.address = {'@type':'PostalAddress'};
      if(loc.addr) obj.address.streetAddress = loc.addr;
      if(loc.city) obj.address.addressLocality = loc.city;
      if(loc.state) obj.address.addressRegion = loc.state;
      if(loc.zip) obj.address.postalCode = loc.zip;
      if(loc.country) obj.address.addressCountry = loc.country;
    }
    if(loc.lat && loc.lng){
      obj.geo = {'@type':'GeoCoordinates', latitude: parseFloat(loc.lat), longitude: parseFloat(loc.lng)};
    }
    if(loc.hours?.mon || loc.hours?.sat){
      const specs = [];
      if(loc.hours.mon && !/closed/i.test(loc.hours.mon)){
        const [opens, closes] = loc.hours.mon.split(/[-–]/).map(s=>s.trim());
        if(opens && closes) specs.push({'@type':'OpeningHoursSpecification', dayOfWeek:['Monday','Tuesday','Wednesday','Thursday','Friday'], opens, closes});
      }
      if(loc.hours.sat && !/closed/i.test(loc.hours.sat)){
        const [opens, closes] = loc.hours.sat.split(/[-–]/).map(s=>s.trim());
        if(opens && closes) specs.push({'@type':'OpeningHoursSpecification', dayOfWeek:'Saturday', opens, closes});
      }
      if(specs.length) obj.openingHoursSpecification = specs;
    }
    if(brand.url){
      obj.parentOrganization = {'@type':'Organization', name: brand.name, url: brand.url};
    }
    return obj;
  });
  return out;
}

/* ---------- BRIEF GENERATION ---------- */
function generateBrief(loc){
  const brand = state.brand;
  const city = loc.city || 'your area';
  const state2 = loc.state ? `, ${loc.state}` : '';
  const phone = loc.phone || brand.phone || '(your phone)';
  const url = loc.url || `${brand.url||''}/locations/${loc.slug}/`;
  const services = brand.cat || 'services';
  return `# Location Page Brief — ${brand.name||'Business'} in ${city}

## URL
${url}

## Title Tag (target ≤60 chars)
${brand.name||'Acme'} in ${city}${state2} | ${services} Near Me

## Meta Description (target ~150 chars)
Looking for ${services.toLowerCase()} in ${city}${state2}? ${brand.name||'Acme'} has served the neighborhood since [YEAR]. Call ${phone} for same-day service.

## H1
${services} in ${city}${state2}

## Required Sections

### 1. Hero (above the fold)
- H1 with city + service
- Click-to-call: ${phone}
- "Get Directions" link to Google Maps
- Hero image: real photo of this location's storefront (not stock)

### 2. About This Location
- Year opened, manager${loc.manager?` (${loc.manager})`:''}
- Unique-to-this-location facts (don't reuse text from other locations)
${loc.landmarks?`- Mention landmark: "${loc.landmarks}"`:'- Add 1 sentence about local landmarks or neighborhood feel'}

### 3. Services Offered
- Full service list (link to service pages where they exist)
- Mention any location-specific services

### 4. Hours & Contact
- Full weekly hours (rendered as a structured table)
- NAP block visible to humans AND in JSON-LD
- Click-to-call CTA repeated

### 5. Service Area
- List of cities/neighborhoods this location serves
- Optional: embedded service area map

### 6. Why Choose Us (Local Trust Signals)
- Number of customers served in ${city}
- Local reviews quote (real customer, real first name)
- Certifications, licenses, insurance numbers
- Years in business at this location

### 7. Reviews (from this location specifically)
- 3-5 testimonials embedded
- AggregateRating in schema (real numbers only)

### 8. Embedded Google Map
- iframe pointing to ${url ? `${city} ${brand.name}` : 'this location'}
- Caption: "Find us at ${loc.addr||'our location'}"

### 9. FAQ (3-5 questions specific to this location)
- "What areas do you serve from ${city}?"
- "Do you offer emergency service in ${city}?"
- "What's the easiest place to park near your ${city} office?"

### 10. Footer
- Full NAP block
- Link to brand homepage
- Links to nearby locations (max 5)

## Content Guidelines
- Word count: 600-1200 words
- Avoid duplicating text from other location pages — write ~70% unique content
- Use "${city}" + "${services.toLowerCase()}" naturally 3-7 times each
- Internal links: 3-5 to other location pages and main service pages
- External: 1-2 to authoritative local sources (city government, chamber, etc.)

## Schema.org
- LocalBusiness (subtype: ${brand.cat}) with all NAP + geo + hours + sameAs
- BreadcrumbList: Home > Locations > ${city}
- FAQPage for the FAQ section
- AggregateRating only if you have real on-page reviews

## Internal Linking
From other pages:
- Homepage → this location page (in city dropdown / locator)
- /locations/ index page → this page
- Nearby location pages → "Other ${city}-area locations"
- Service pages → "Find a ${city} ${services.toLowerCase()} pro"

## Common Mistakes to Avoid
- Don't duplicate descriptions across locations (Google merges them)
- Don't stuff city name in title or H1 ("Boston Plumber Boston Boston Boston")
- Don't use the same photos across locations — Google can detect this
- Don't list the same phone for multiple locations (suspension risk)`;
}

/* ---------- SITEMAP / LOCATOR ---------- */
function generateSitemap(){
  const brand = state.brand;
  const base = (brand.url||'').replace(/\/$/,'');
  const today = new Date().toISOString().slice(0,10);
  const urls = state.locations.filter(l=>l.url || l.slug).map(l=>{
    const u = l.url || `${base}/locations/${l.slug}/`;
    return `  <url>\n    <loc>${u}</loc>\n    <lastmod>${today}</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls}\n</urlset>`;
}

function generateLocator(){
  const brand = state.brand;
  const locs = state.locations;
  const css = `*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}body{padding:24px;background:#f7fafc;color:#1a202c;font-size:14px;line-height:1.55}.wrap{max-width:1200px;margin:0 auto}h1{font-size:28px;font-weight:800;margin-bottom:8px}p.sub{color:#718096;margin-bottom:28px}.search{display:flex;gap:8px;margin-bottom:24px}.search input{flex:1;padding:12px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif}.search button{padding:12px 20px;background:#0d9488;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.loc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;transition:all .15s}.loc:hover{border-color:#0d9488;box-shadow:0 4px 12px rgba(13,148,136,.15)}.loc h3{font-size:16px;font-weight:700;margin-bottom:6px}.loc .city{color:#718096;font-size:12px;margin-bottom:10px}.loc .info{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#4a5568}.loc .info span{display:flex;align-items:center;gap:7px}.loc .info svg{width:14px;height:14px;color:#0d9488;flex-shrink:0}.loc .actions{display:flex;gap:6px;margin-top:14px}.loc .actions a{flex:1;padding:8px;background:#f7fafc;border:1px solid #e2e8f0;border-radius:6px;text-align:center;text-decoration:none;color:#4a5568;font-size:12px;font-weight:600}.loc .actions a:hover{background:#0d9488;color:#fff;border-color:#0d9488}.empty{padding:60px;text-align:center;color:#a0aec0}`;
  const cards = locs.map(l=>`<div class="loc" data-search="${escapeAttr((l.city+' '+l.state+' '+l.zip+' '+(l.label||'')).toLowerCase())}"><h3>${escapeHtml(l.label||l.city)}</h3><div class="city">${escapeHtml([l.city,l.state].filter(Boolean).join(', '))}</div><div class="info">${l.addr?`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${escapeHtml(l.addr)}</span>`:''}${l.phone?`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><a href="tel:${escapeAttr(l.phone)}" style="color:inherit;text-decoration:none">${escapeHtml(l.phone)}</a></span>`:''}${l.hours?.mon?`<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Mon: ${escapeHtml(l.hours.mon)}</span>`:''}</div><div class="actions">${l.url?`<a href="${escapeAttr(l.url)}">View Page</a>`:''}${l.lat&&l.lng?`<a href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}" target="_blank" rel="noopener">Directions</a>`:''}</div></div>`).join('');
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(brand.name||'Business')} Locations</title><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>${css}</style></head><body><div class="wrap"><h1>${escapeHtml(brand.name||'Our Locations')}</h1><p class="sub">${locs.length} location${locs.length===1?'':'s'} ready to serve you.</p><div class="search"><input id="q" placeholder="Search by city, ZIP, or address..." oninput="filter()"><button onclick="document.getElementById('q').value='';filter()">Clear</button></div><div class="grid" id="g">${cards}</div><div class="empty" id="e" style="display:none">No locations match your search.</div></div><script>function filter(){const q=document.getElementById('q').value.toLowerCase().trim();const cards=document.querySelectorAll('.loc');let visible=0;cards.forEach(c=>{const s=c.getAttribute('data-search');const show=!q||s.includes(q);c.style.display=show?'':'none';if(show)visible++});document.getElementById('e').style.display=visible?'none':'block';}<\/script><script src="global-nav.js"><\/script>
</body></html>`;
}

/* ---------- TAB / RENDER ---------- */
function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));renderCenter();}

function renderAll(){
  document.getElementById('stat-loc').textContent = state.locations.length;
  document.getElementById('stat-geo').textContent = state.locations.filter(l=>l.lat&&l.lng).length;
  document.getElementById('stat-missing').textContent = state.locations.filter(l=>healthOf(l).level==='bad').length;
  document.getElementById('tc-loc').textContent = state.locations.length;
  fillBrand();
  renderLocList();
  renderCenter();
}

function renderLocList(){
  const wrap = document.getElementById('loc-list');
  if(!state.locations.length){
    wrap.innerHTML = `<div class="empty-list">No locations yet — click <strong>+ Add</strong> or import a CSV.</div>`;
    return;
  }
  wrap.innerHTML = state.locations.map((l,i)=>{
    const h = healthOf(l);
    return `<div class="loc-item ${state.activeId===l.id?'active':''}" onclick="selectLocation('${l.id}')">
      <div class="num">${i+1}</div>
      <div class="info">
        <div class="ln">${escapeHtml(l.label||l.city||'(unnamed)')}</div>
        <div class="lm"><span class="dot ${h.level==='ok'?'ok':h.level==='warn'?'warn':'bad'}"></span>${escapeHtml([l.city, l.state].filter(Boolean).join(', '))} · ${h.score}%</div>
      </div>
    </div>`;
  }).join('');
}

function selectLocation(id){state.activeId=id; saveState(); renderLocList();}

function renderCenter(){
  if(!state.locations.length){
    renderEmpty();
    return;
  }
  if(state.view==='dashboard') return renderDashboard();
  if(state.view==='locations') return renderTable();
  if(state.view==='map') return renderMap();
  if(state.view==='schema') return renderSchema();
  if(state.view==='briefs') return renderBriefs();
  if(state.view==='sitemap') return renderSitemap();
}

function renderEmpty(){
  document.getElementById('cbody').innerHTML = `<div class="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <div><div class="et">Multi-Location Hub</div><div class="ed">Manage 5 or 5,000 locations: bulk LocalBusiness schema generation, location-page content briefs, aggregate health dashboard, XML sitemap, and a ready-to-deploy store locator HTML page.</div></div>
    <div class="actions">
      <button onclick="openEdit()"><strong>+ Add Location Manually</strong><span>Add one location at a time via form</span></button>
      <button onclick="importCSV()"><strong>📄 Import CSV</strong><span>Bulk import from spreadsheet</span></button>
      <button onclick="downloadTemplate()"><strong>📥 Download Template</strong><span>Get a sample CSV to fill out</span></button>
    </div>
  </div>`;
}

function renderDashboard(){
  const total = state.locations.length;
  const geocoded = state.locations.filter(l=>l.lat&&l.lng).length;
  const withUrl = state.locations.filter(l=>l.url).length;
  const withPhone = state.locations.filter(l=>l.phone).length;
  const withHours = state.locations.filter(l=>l.hours?.mon).length;
  const avgHealth = state.locations.length ? Math.round(state.locations.reduce((s,l)=>s+healthOf(l).score,0)/state.locations.length) : 0;
  document.getElementById('cbody').innerHTML = `
    <div class="summary">
      <div class="scard"><div class="scard-label">Locations</div><div class="scard-val">${total}</div></div>
      <div class="scard ${geocoded/total>=.9?'ok':geocoded/total>=.5?'warn':'bad'}"><div class="scard-label">Geocoded</div><div class="scard-val">${geocoded}/${total}</div><div class="scard-sub">${Math.round(geocoded/total*100)}%</div></div>
      <div class="scard ${withPhone/total>=.9?'ok':'warn'}"><div class="scard-label">Has Phone</div><div class="scard-val">${withPhone}/${total}</div></div>
      <div class="scard ${withUrl/total>=.5?'ok':'warn'}"><div class="scard-label">Has Page URL</div><div class="scard-val">${withUrl}/${total}</div></div>
      <div class="scard ${withHours/total>=.5?'ok':'warn'}"><div class="scard-label">Has Hours</div><div class="scard-val">${withHours}/${total}</div></div>
      <div class="scard ${avgHealth>=80?'ok':avgHealth>=50?'warn':'bad'}"><div class="scard-label">Avg Health</div><div class="scard-val">${avgHealth}%</div></div>
    </div>
    <div class="section"><div class="section-hdr"><h3>Map Preview</h3><span class="badge">${geocoded} pinned</span></div><div style="padding:14px"><div id="map-wrap"><div id="map-mini"></div></div></div></div>
    <div class="section"><div class="section-hdr"><h3>Quick Actions</h3></div><div style="padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px">
      <button class="cb-btn" onclick="setTab('schema')">📝 Generate ${total} schemas</button>
      <button class="cb-btn" onclick="setTab('briefs')">📋 Page briefs for all locations</button>
      <button class="cb-btn" onclick="setTab('sitemap')">🗺 Sitemap + Store Locator</button>
      <button class="cb-btn" onclick="geocodeAll()">📍 Geocode missing (${total-geocoded})</button>
    </div></div>
  `;
  setTimeout(()=>renderMiniMap(),50);
}

let miniMap;
function renderMiniMap(){
  const el = document.getElementById('map-mini'); if(!el) return;
  el.style.height='240px';
  if(miniMap) miniMap.remove();
  miniMap = L.map(el).setView([39, -98], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OSM'}).addTo(miniMap);
  const pts = state.locations.filter(l=>l.lat&&l.lng);
  pts.forEach(l=>{
    const h = healthOf(l);
    L.marker([parseFloat(l.lat), parseFloat(l.lng)], {icon:L.divIcon({html:`<div class="loc-marker ${h.level}"><span>${state.locations.indexOf(l)+1}</span></div>`, className:'', iconSize:[30,30], iconAnchor:[15,30]})}).addTo(miniMap).bindTooltip(l.label||l.city, {direction:'top'});
  });
  if(pts.length){
    const lats = pts.map(l=>parseFloat(l.lat));
    const lngs = pts.map(l=>parseFloat(l.lng));
    miniMap.fitBounds([[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]], {padding:[30,30]});
  }
}

function renderTable(){
  document.getElementById('cbody').innerHTML = `
    <div class="section"><div class="section-hdr"><h3>All Locations</h3><span class="badge">${state.locations.length}</span></div><div style="padding:0;overflow-x:auto">
      <table class="ltable">
        <thead><tr><th>#</th><th>Label / City</th><th>Address</th><th>Phone</th><th>Geo</th><th>Health</th><th>Actions</th></tr></thead>
        <tbody>${state.locations.map((l,i)=>{const h=healthOf(l); return `<tr>
          <td style="font-family:var(--mono);color:var(--text3)">${i+1}</td>
          <td><div class="ln">${escapeHtml(l.label||l.city||'(unnamed)')}</div><div class="lm">${escapeHtml([l.city, l.state, l.zip].filter(Boolean).join(', '))}</div></td>
          <td style="font-size:11px;color:var(--text2)">${escapeHtml(l.addr||'')}</td>
          <td style="font-family:var(--mono);font-size:11px">${escapeHtml(l.phone||'')}</td>
          <td style="font-family:var(--mono);font-size:11px">${l.lat&&l.lng?`${parseFloat(l.lat).toFixed(3)},${parseFloat(l.lng).toFixed(3)}`:'<span style="color:var(--text3)">—</span>'}</td>
          <td><span class="health-pill ${h.level}">${h.score}%</span></td>
          <td><div class="row-actions"><button onclick="openEdit('${l.id}')" title="Edit">✎</button><button onclick="delLocation('${l.id}')" title="Delete">×</button></div></td>
        </tr>`;}).join('')}</tbody>
      </table>
    </div></div>
  `;
}

let bigMap;
function renderMap(){
  document.getElementById('cbody').innerHTML = `<div style="height:calc(100vh - 180px);border-radius:8px;overflow:hidden;border:1px solid var(--border)"><div id="map-big" style="width:100%;height:100%"></div></div>`;
  setTimeout(()=>{
    const el = document.getElementById('map-big');
    if(bigMap) bigMap.remove();
    bigMap = L.map(el).setView([39, -98], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OSM'}).addTo(bigMap);
    const pts = state.locations.filter(l=>l.lat&&l.lng);
    pts.forEach(l=>{
      const h = healthOf(l);
      L.marker([parseFloat(l.lat), parseFloat(l.lng)], {icon:L.divIcon({html:`<div class="loc-marker ${h.level}"><span>${state.locations.indexOf(l)+1}</span></div>`, className:'', iconSize:[30,30], iconAnchor:[15,30]})}).addTo(bigMap).bindPopup(`<strong>${escapeHtml(l.label||l.city)}</strong><br>${escapeHtml(l.addr||'')}<br>${escapeHtml(l.phone||'')}`);
    });
    if(pts.length){
      const lats = pts.map(l=>parseFloat(l.lat)); const lngs = pts.map(l=>parseFloat(l.lng));
      bigMap.fitBounds([[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]], {padding:[30,30]});
    }
  }, 50);
}

function renderSchema(){
  const schemas = generateSchemas();
  const json = JSON.stringify(schemas.length===1?schemas[0]:schemas, null, 2);
  document.getElementById('cbody').innerHTML = `
    <div class="section"><div class="section-hdr"><h3>Bulk JSON-LD — ${schemas.length} schemas</h3>
      <button class="cb-btn" onclick="navigator.clipboard.writeText(${JSON.stringify(json).replace(/"/g,'&quot;')});toast('Copied','success')">📋 Copy</button>
      <button class="cb-btn" onclick="downloadText(${JSON.stringify(json).replace(/"/g,'&quot;')}, 'schemas.json', 'application/json')">⬇ Download</button>
    </div><div style="padding:14px"><div class="code-out">${escapeHtml(json)}</div></div></div>
  `;
}

function renderBriefs(){
  const briefs = state.locations.map(l=>({loc:l, brief: generateBrief(l)}));
  document.getElementById('cbody').innerHTML = briefs.map((b,i)=>`
    <div class="section">
      <div class="section-hdr"><h3>📋 ${escapeHtml(b.loc.label||b.loc.city)}</h3>
        <button class="cb-btn" onclick="navigator.clipboard.writeText(${JSON.stringify(b.brief).replace(/"/g,'&quot;')});toast('Copied','success')">Copy</button>
        <button class="cb-btn" onclick="downloadText(${JSON.stringify(b.brief).replace(/"/g,'&quot;')}, 'brief-${b.loc.slug}.md', 'text/markdown')">⬇</button>
      </div>
      <div style="padding:14px"><div class="code-out" style="white-space:pre-wrap;max-height:400px;font-size:11px">${escapeHtml(b.brief)}</div></div>
    </div>
  `).join('') || '<div class="empty"><div class="et">No locations</div></div>';
}

function renderSitemap(){
  const sitemap = generateSitemap();
  const locator = generateLocator();
  document.getElementById('cbody').innerHTML = `
    <div class="section">
      <div class="section-hdr"><h3>XML Sitemap (locations)</h3>
        <button class="cb-btn" onclick="downloadText(${JSON.stringify(sitemap).replace(/"/g,'&quot;')}, 'sitemap-locations.xml', 'application/xml')">⬇ Download</button>
      </div>
      <div style="padding:14px"><div class="code-out" style="max-height:300px">${escapeHtml(sitemap)}</div></div>
    </div>
    <div class="section">
      <div class="section-hdr"><h3>Store Locator HTML (drop-in ready)</h3>
        <button class="cb-btn" onclick="downloadText(${JSON.stringify(locator).replace(/"/g,'&quot;')}, 'store-locator.html', 'text/html')">⬇ Download</button>
        <button class="cb-btn" onclick="previewLocator()">👁 Preview</button>
      </div>
      <div style="padding:14px"><div class="code-out" style="max-height:300px;font-size:10.5px">${escapeHtml(locator.slice(0,2000))}...</div></div>
    </div>
  `;
}

function previewLocator(){
  const html = generateLocator();
  const w = window.open('', '_blank');
  w.document.write(html); w.document.close();
}

/* ---------- DOWNLOAD HELPER ---------- */
function downloadText(text, filename, mime){
  const blob = new Blob([text], {type: mime||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Downloaded','success');
}

function exportAll(){
  // Export full state as JSON
  const data = {brand:state.brand, locations:state.locations, schemas:generateSchemas(), sitemap:generateSitemap(), exportedAt:new Date().toISOString()};
  downloadText(JSON.stringify(data, null, 2), `multi-location-${(state.brand.name||'export').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.json`, 'application/json');
}

/* ---------- BOOT ---------- */
renderAll();
window.addEventListener('beforeunload', saveState);
</script>
<script src="global-nav.js"></script>
