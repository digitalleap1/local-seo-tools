<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local SEO Command Center - Unified Dashboard for 69 Tools</title>
<meta name="description" content="Unified dashboard for the entire Local SEO toolkit. Fixed categorized sidebar with all 33 tools, live data status, pillar scores, action items, and white-label client reporting.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --primary:#2563eb; --primary-h:#1d4ed8; --primary-soft:rgba(37,99,235,.08);
  --teal:#0d9488; --purple:#7c3aed; --pink:#db2777;
  --amber:#d97706; --green:#16a34a; --red:#dc2626; --orange:#ea580c;
  --success:#16a34a; --danger:#dc2626; --warn:#f59e0b;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --sidebar-w:280px;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --primary:#3b82f6; --primary-h:#60a5fa; --primary-soft:rgba(59,130,246,.14);
  --teal:#14b8a6; --purple:#a78bfa; --pink:#ec4899;
  --amber:#f59e0b; --green:#22c55e; --red:#ef4444; --orange:#fb923c;
  --success:#22c55e; --danger:#ef4444; --warn:#fbbf24;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
a{color:inherit;text-decoration:none}

/* ========== HEADER ========== */
#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--primary),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.logo-icon svg{width:19px;height:19px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px;line-height:1}
.logo-name span{color:var(--primary)}
.logo-sub{font-size:9px;color:var(--text3);font-family:var(--mono);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:2px;display:block}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:800;color:var(--purple);border:1px solid var(--purple);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px;background:rgba(124,58,237,.06)}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13.5px;font-family:var(--mono);font-weight:800;min-width:18px;text-align:center}
.hdr-stat.score strong{color:var(--primary);font-size:15px}
.hdr-stat.tools strong{color:var(--success)}
.hdr-stat.actions strong{color:var(--amber)}
.hdr-spacer{flex:1}
.hdr-search{position:relative;width:220px}
.hdr-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:6px 9px 6px 30px;font-size:11.5px;color:var(--text);font-family:var(--font)}
.hdr-search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text3)}
.hdr-search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);outline:none}
.hdr-btn{display:flex;align-items:center;gap:5px;padding:6px 11px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer}
.hdr-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:var(--primary);color:var(--primary)}
.hdr-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.hdr-btn.primary:hover{background:var(--primary-h)}
.hdr-btn svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600;cursor:pointer}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

/* ========== APP ========== */
#app{flex:1;display:flex;overflow:hidden;min-height:0}

/* ========== SIDEBAR ========== */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;position:relative}
.sb-search{padding:10px 12px;border-bottom:1px solid var(--border);position:relative;flex-shrink:0}
.sb-search input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 9px 7px 30px;font-size:12px;color:var(--text);font-family:var(--font)}
.sb-search svg{position:absolute;left:21px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3);pointer-events:none}
.sb-search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);outline:none}
.sb-clear{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--bg3);color:var(--text2);font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer}
.sb-clear.show{display:flex}

#sb-body{flex:1;overflow-y:auto;padding:8px 6px 12px}

.sb-cat{margin-bottom:6px}
.sb-cat-hdr{display:flex;align-items:center;gap:6px;padding:8px 11px 5px;font-size:9.5px;color:var(--text3);font-family:var(--mono);font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;user-select:none}
.sb-cat-hdr:hover{color:var(--text2)}
.sb-cat-hdr .ch-icon{width:14px;height:14px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0}
.sb-cat-hdr .ch-count{margin-left:auto;font-size:9px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:8px;font-weight:700}
.sb-cat-hdr .ch-toggle{font-family:var(--mono);font-size:11px;color:var(--text3);transition:transform .2s;margin-left:4px}
.sb-cat.collapsed .ch-toggle{transform:rotate(-90deg)}
.sb-cat.collapsed .sb-items{display:none}

.sb-items{display:flex;flex-direction:column;gap:1px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:6px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .12s;text-decoration:none;position:relative}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}
.sb-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
.sb-item .sbi-icon{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#fff;flex-shrink:0;font-weight:700;font-family:var(--mono)}
.sb-item .sbi-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .sbi-status{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0}
.sb-item .sbi-status.live{background:var(--success);box-shadow:0 0 0 2px rgba(22,163,74,.18)}
.sb-item .sbi-status.warn{background:var(--warn)}
.sb-item .sbi-status.err{background:var(--danger)}
.sb-item .sbi-new{font-size:8.5px;font-family:var(--mono);font-weight:800;color:#fff;background:var(--purple);padding:1px 4px;border-radius:3px;letter-spacing:.4px}

#sb-footer{padding:10px 12px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.sb-foot-row{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text3);font-family:var(--mono)}
.sb-foot-row strong{color:var(--text2);font-weight:700}
.sb-foot-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;cursor:pointer}
.sb-foot-btn:hover{border-color:var(--primary);color:var(--primary)}
.sb-foot-btn svg{width:12px;height:12px}

/* ========== MAIN ========== */
#main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#tabs{display:flex;align-items:center;gap:5px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{padding:7px 13px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{border-color:var(--primary);color:var(--primary)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.tab svg{width:13px;height:13px}
.tabs-spacer{flex:1}
.tabs-stat{font-size:11px;color:var(--text3);font-family:var(--mono);white-space:nowrap;display:flex;align-items:center;gap:5px}
.tabs-stat strong{color:var(--text)}

#content{flex:1;overflow-y:auto;padding:18px}

/* ========== OVERVIEW CARDS ========== */
.welcome{background:linear-gradient(135deg,var(--primary),var(--purple));border-radius:var(--radius-lg);padding:24px 28px;color:#fff;margin-bottom:18px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow-md)}
.welcome::before{content:'';position:absolute;top:-50px;right:-50px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);border-radius:50%}
.welcome::after{content:'';position:absolute;bottom:-30px;left:30%;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);border-radius:50%}
.welcome-text{position:relative;z-index:2}
.welcome-text h1{font-size:22px;font-weight:800;margin-bottom:4px;letter-spacing:-.4px}
.welcome-text p{font-size:13px;opacity:.92;line-height:1.55;max-width:620px}
.welcome-stats{display:flex;gap:18px;position:relative;z-index:2}
.welcome-stat{text-align:right}
.welcome-stat .v{font-size:30px;font-weight:900;font-family:var(--mono);letter-spacing:-.5px;line-height:1}
.welcome-stat .l{font-size:10.5px;opacity:.88;font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:3px}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;cursor:pointer;transition:all .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--primary)}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.kpi.s::before{background:var(--success)}
.kpi.w::before{background:var(--warn)}
.kpi.d::before{background:var(--danger)}
.kpi.p::before{background:var(--purple)}
.kpi .kl{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.kpi .kv{font-size:26px;font-weight:900;color:var(--text);font-family:var(--mono);line-height:1;letter-spacing:-.6px}
.kpi.s .kv{color:var(--success)}
.kpi.w .kv{color:var(--warn)}
.kpi.d .kv{color:var(--danger)}
.kpi.p .kv{color:var(--purple)}
.kpi .ks{font-size:10.5px;color:var(--text3);font-family:var(--mono);margin-top:3px}

/* Categories grid */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:18px}
.cat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:all .2s;display:flex;flex-direction:column}
.cat-card:hover{box-shadow:var(--shadow-md)}
.cat-hdr{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.cat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:var(--shadow-sm)}
.cat-icon svg{width:18px;height:18px}
.cat-meta{flex:1;min-width:0}
.cat-meta .cn{font-size:14px;font-weight:800}
.cat-meta .cs{font-size:11px;color:var(--text2);font-family:var(--mono);margin-top:1px}
.cat-count{font-size:11px;font-family:var(--mono);font-weight:800;color:var(--text);background:var(--bg3);padding:3px 9px;border-radius:14px;border:1px solid var(--border)}

.cat-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;padding:11px 14px}
.cat-tool{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--border);font-size:11.5px;color:var(--text);text-decoration:none;transition:all .12s;cursor:pointer;position:relative;min-height:36px}
.cat-tool:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);transform:translateY(-1px)}
.cat-tool.has-data{border-color:rgba(22,163,74,.4)}
.cat-tool.has-data::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--success);position:absolute;top:6px;right:6px}
.cat-tool .ct-icon{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:800;font-family:var(--mono);flex-shrink:0}
.cat-tool .ct-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cat-tool .ct-new{font-size:8px;font-family:var(--mono);font-weight:800;color:#fff;background:var(--purple);padding:1px 3px;border-radius:3px;letter-spacing:.3px}

/* Pillar score row */
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.pillar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 15px;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .15s}
.pillar:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--primary)}
.pillar.empty{opacity:.55}
.pillar.empty:hover{opacity:.9}
.pillar-hdr{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.pillar-hdr .pi{width:22px;height:22px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;font-family:var(--mono)}
.pillar-hdr .pn{font-size:12px;font-weight:700;flex:1}
.pillar-score{display:flex;align-items:baseline;gap:5px}
.pillar-score .v{font-size:22px;font-weight:900;font-family:var(--mono);letter-spacing:-.4px}
.pillar-score .v.good{color:var(--success)}
.pillar-score .v.ok{color:var(--amber)}
.pillar-score .v.bad{color:var(--danger)}
.pillar-score .v.no{color:var(--text3)}
.pillar-score .u{font-size:11px;color:var(--text3);font-family:var(--mono)}
.pillar .ps{font-size:10.5px;color:var(--text2);margin-top:5px;line-height:1.4;font-family:var(--mono)}

/* Section */
.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.section-hdr .btn{padding:5px 10px;border-radius:5px;font-size:10.5px;font-weight:700;background:var(--bg2);border:1px solid var(--border);color:var(--text);cursor:pointer}
.section-hdr .btn:hover{border-color:var(--primary);color:var(--primary)}

/* Actions list */
.act-list{display:flex;flex-direction:column}
.act{padding:10px 16px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:24px 1fr auto;gap:11px;align-items:center;font-size:12.5px;transition:background .12s}
.act:hover{background:var(--bg)}
.act:last-child{border-bottom:none}
.act .ai{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.act.p1 .ai{background:rgba(220,38,38,.15);color:var(--danger)}
.act.p2 .ai{background:rgba(245,158,11,.15);color:var(--warn)}
.act.p3 .ai{background:rgba(37,99,235,.15);color:var(--primary)}
.act .at{font-weight:700;margin-bottom:1px}
.act .ad{font-size:11px;color:var(--text2);line-height:1.4}
.act .ad strong{color:var(--text)}
.act .ag{padding:5px 11px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:10.5px;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:5px;white-space:nowrap}
.act .ag:hover{border-color:var(--primary);color:var(--primary)}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;color:var(--text3);gap:14px}
.empty svg{width:54px;height:54px;opacity:.3}
.empty .et{font-size:16px;font-weight:700;color:var(--text)}
.empty .ed{font-size:12.5px;line-height:1.55;max-width:480px}

/* Brand panel */
.brand-bar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm)}
.brand-bar .bl{width:42px;height:42px;border-radius:9px;background:var(--bg3);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px;font-weight:900;overflow:hidden}
.brand-bar .bl img{width:100%;height:100%;object-fit:contain;padding:5px}
.brand-bar .bm{flex:1;min-width:0}
.brand-bar .bm .bn{font-size:14.5px;font-weight:800}
.brand-bar .bm .bs{font-size:11px;color:var(--text2);font-family:var(--mono)}
.brand-bar .ba{display:flex;gap:6px;flex-wrap:wrap}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:5000;padding:14px}
.modal.show{display:flex}
.modal-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:560px;width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-hdr h3{font-size:14px;font-weight:800;flex:1}
.modal-hdr .x{padding:6px;background:var(--bg3);border:none;border-radius:6px;color:var(--text);font-size:14px;font-weight:700;cursor:pointer}
.modal-body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.mf{display:flex;flex-direction:column;gap:3px}
.mf label{font-size:10.5px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.mf input,.mf select,.mf textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text)}
.mf input:focus,.mf textarea:focus,.mf select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);outline:none}
.mbtn{padding:8px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text)}
.mbtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.mbtn:hover{transform:translateY(-1px)}

/* Footer */
#footer{height:30px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px;flex-shrink:0;font-size:10.5px;color:var(--text2);font-family:var(--mono)}
.ft-spacer{flex:1}
.ft-link{color:var(--primary);font-weight:600;text-decoration:none}
.ft-link:hover{text-decoration:underline}

/* Toast */
#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}

.mobile-toggle{display:none;padding:7px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:12px;font-weight:700;align-items:center;gap:5px}

@media (max-width:1100px){
  .welcome{grid-template-columns:1fr}
  .welcome-stats{justify-content:flex-start;flex-wrap:wrap}
  .welcome-stat{text-align:left}
}
@media (max-width:880px){

  #sidebar.open{transform:translateX(0)}
  .mobile-toggle{display:flex}
  .hdr-search{display:none}
  .cat-grid{grid-template-columns:1fr}
}

let DATA = {};
function loadAllData(){
  DATA = {};
  for(const [id, t] of Object.entries(TOOLS)){
    if(!t.key) { DATA[id] = null; continue; }
    try { DATA[id] = JSON.parse(localStorage.getItem(t.key)||'null'); }
    catch(e){ DATA[id] = null; }
  }
}

function toolHasData(id){
  const d = DATA[id]; if(!d) return false;
  // Various data shapes signal non-empty
  if(Array.isArray(d.businesses) && d.businesses.length) return true;
  if(Array.isArray(d.citations) && d.citations.length) return true;
  if(Array.isArray(d.reviews) && d.reviews.length) return true;
  if(Array.isArray(d.posts) && d.posts.length) return true;
  if(Array.isArray(d.keywords) && d.keywords.length) return true;
  if(Array.isArray(d.questions) && d.questions.length) return true;
  if(Array.isArray(d.locations) && d.locations.length) return true;
  if(Array.isArray(d.backlinks) && d.backlinks.length) return true;
  if(Array.isArray(d.variants) && d.variants.length) return true;
  if(Array.isArray(d.imports) && d.imports.length) return true;
  if(d.results && Object.keys(d.results).length) return true;
  if(d.pages && Object.keys(d.pages).length) return true;
  if(d.submissions && Object.keys(d.submissions).length) return true;
  if(d.questions && Object.keys(d.questions).length) return true;
  if(d.name || d.url || d.biz?.name || d.brand?.name || d.you?.name || d.inputs?.name || d.inputs?.budget || d.strategy || d.brief) return true;
  if(d.schemas && d.schemas.length) return true;
  if(d.checks && d.checks.length) return true;
  return false;
}

/* ==========================================================================
 * PILLAR SCORES
 * ========================================================================== */
function pillarStats(){
  return {
    cit: pillarCit(),
    nap: pillarNap(),
    sch: pillarSch(),
    gbp: pillarGbp(),
    rev: pillarRev(),
    geo: pillarGeo(),
    gap: pillarGap(),
    bs:  pillarBs(),
    sr:  pillarSr(),
    agg: pillarAgg(),
  };
}

function pillarCit(){
  const d = DATA.cf; if(!d || !d.businesses?.length) return null;
  const b = d.businesses.find(x=>x.id===d.activeBizId) || d.businesses[0];
  const cits = Object.entries(b.citations||{});
  const found = cits.filter(([_,c])=>c.status==='found'||c.status==='partial').length;
  const miss = cits.filter(([_,c])=>c.status==='miss').length;
  const scanned = cits.filter(([_,c])=>c.status && c.status!=='running').length;
  const total = scanned || 1;
  const score = Math.round(found/total*100);
  return {score, found, miss, scanned, biz:b.name, sub:`${found} found / ${miss} missing`, link:'citation-finder.html'};
}

function pillarNap(){
  const d = DATA.nap; if(!d || !d.citations?.length) return null;
  const ref = d.ref||{};
  let ok=0, partial=0, bad=0;
  d.citations.forEach(c=>{
    let issues=0, hasFuzzy=false;
    const phoneR = (ref.phone||'').replace(/\D/g,'').slice(-10);
    const phoneC = (c.phone||'').replace(/\D/g,'').slice(-10);
    if(phoneR && phoneC){
      if(phoneR !== phoneC){ issues++; }
      else if(ref.phone && c.phone && ref.phone.trim() !== c.phone.trim()){ hasFuzzy=true; }
    }
    const nameR = (ref.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const nameC = (c.name||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(nameR && nameC && nameR !== nameC){
      if(Math.abs(nameR.length - nameC.length) > 2 || (!nameR.includes(nameC) && !nameC.includes(nameR))) issues++;
      else hasFuzzy=true;
    }
    if(issues>=1) bad++; else if(hasFuzzy) partial++; else ok++;
  });
  const total = d.citations.length;
  const score = total?Math.round((ok+partial*0.5)/total*100):0;
  return {score, ok, partial, bad, total, sub:`${ok}/${total} consistent`, link:'nap-checker.html'};
}

function pillarSch(){
  const d = DATA.sch; if(!d || !d.name) return null;
  let pts=0, max=0;
  ['name','phone','url','addr','city','postal'].forEach(f=>{ max+=2; if(d[f]) pts+=2; });
  ['desc','logo','email','region','country','lat','lng'].forEach(f=>{ max++; if(d[f]) pts++; });
  if((d.hours||[]).filter(h=>!h.closed&&h.opens).length>=5) pts+=2; max+=2;
  if((d.sameAs||[]).length>=2) pts+=2; max+=2;
  if(d.rating && d.reviews) pts+=2; max+=2;
  if((d.services||[]).length>=3) pts++; max++;
  const score = Math.round(pts/max*100);
  return {score, type:d.type, biz:d.name, sub:`${d.type||'LocalBusiness'} · ${score}% complete`, link:'schema-generator.html'};
}

function pillarGbp(){
  const d = DATA.gbp; if(!d || !d.biz?.name || !Object.keys(d.answers||{}).length) return null;
  const ans = d.answers||{};
  let pass=0, fail=0;
  Object.values(ans).forEach(v=>{ if(v==='pass') pass++; else if(v==='fail') fail++; });
  const total = pass+fail;
  const score = total?Math.round(pass/total*100):0;
  return {score, biz:d.biz.name, pass, fail, sub:`${pass}/${total} checks pass`, link:'gbp-audit.html'};
}

function pillarRev(){
  const d = DATA.rev; if(!d || !d.reviews?.length) return null;
  const total = d.reviews.length;
  const replied = d.reviews.filter(r=>r.reply).length;
  const sumStars = d.reviews.reduce((s,r)=>s+(r.stars||0),0);
  const avg = total?(sumStars/total):0;
  const ratingScore = Math.min(100, Math.round(avg/5*60));
  const replyScore = total?Math.round(replied/total*40):0;
  const score = ratingScore + replyScore;
  return {score, total, replied, avg:Math.round(avg*10)/10, sub:`${avg.toFixed(1)}★ · ${replied}/${total} replied`, link:'review-reply.html'};
}

function pillarGeo(){
  const d = DATA.gg; if(!d || !Object.keys(d.results||{}).length) return null;
  let totalSolv = 0, kwCount = 0, top3=0;
  Object.values(d.results).forEach(r=>{
    const done = r.points?.filter(p=>p.status==='done')||[];
    const solv = done.length ? Math.round(done.reduce((s,p)=>s + (p.rank?Math.max(0,(21-p.rank)/20):0), 0) / done.length * 100) : 0;
    totalSolv += solv;
    kwCount++;
    top3 += done.filter(p=>p.rank && p.rank<=3).length;
  });
  const avgSolv = kwCount?Math.round(totalSolv/kwCount):0;
  return {score:avgSolv, biz:d.biz?.name, keywords:kwCount, top3, sub:`${kwCount} kw · ${avgSolv}% SoLV`, link:'geo-grid-tracker.html'};
}

function pillarGap(){
  const d = DATA.cg; if(!d || !d.you?.name) return null;
  const youCits = d.you.citations||{};
  const compCits = (d.competitors||[]).map(c=>c.citations||{});
  const dirIds = new Set();
  compCits.forEach(c=>Object.keys(c).forEach(id=>{if(c[id].status==='found'||c[id].status==='partial')dirIds.add(id);}));
  const yourFound = Object.values(youCits).filter(c=>c.status==='found'||c.status==='partial').length;
  const gaps = Array.from(dirIds).filter(id=>!(youCits[id]?.status==='found'||youCits[id]?.status==='partial'));
  const score = (yourFound+gaps.length)?Math.round(yourFound/(yourFound+gaps.length)*100):0;
  return {score, biz:d.you.name, gaps:gaps.length, sub:`${gaps.length} gaps vs ${(d.competitors||[]).length} comps`, link:'competitor-gap.html'};
}

function pillarBs(){
  const d = DATA.bs; if(!d?.results?.audit) return null;
  const a = d.results.audit;
  return {score:a.score, brand:d.brand, sub:`${a.passed}/${a.total} checks pass`, link:'brand-serp.html'};
}

function pillarSr(){
  const d = DATA.sr; if(!d || !d.results?.length) return null;
  // Suspension risk is inverted — lower is better. Show inverse for score consistency.
  const risk = d.score||0;
  const score = Math.max(0, 100 - risk);
  return {score, risk, sub:`Risk ${risk}/100 (lower better)`, link:'suspension-risk.html'};
}

function pillarAgg(){
  const d = DATA.agg; if(!d?.submissions) return null;
  const subs = Object.entries(d.submissions);
  if(!subs.length) return null;
  const live = subs.filter(([,s])=>s.status==='live').length;
  const total = 7; // 7 aggregators in the tool
  const score = Math.round(live/total*100);
  return {score, live, total, sub:`${live}/${total} aggregators live`, link:'aggregator-tracker.html'};
}

const PILLAR_DEFS = [
  {id:'cit', name:'Citations', code:'CT', color:'#0d9488', weight:1.3},
  {id:'nap', name:'NAP Consistency', code:'NC', color:'#14b8a6', weight:1.2},
  {id:'gbp', name:'GBP Audit', code:'GB', color:'#4285f4', weight:1.3},
  {id:'sch', name:'Schema', code:'SC', color:'#0891b2', weight:0.8},
  {id:'rev', name:'Reviews', code:'RV', color:'#db2777', weight:1.0},
  {id:'geo', name:'Geo Rankings', code:'GO', color:'#7c3aed', weight:1.2},
  {id:'gap', name:'Competitor Gap', code:'CG', color:'#a78bfa', weight:1.0},
  {id:'bs',  name:'Brand SERP', code:'BS', color:'#ec4899', weight:1.0},
  {id:'sr',  name:'GBP Safety', code:'SR', color:'#f59e0b', weight:0.8},
  {id:'agg', name:'Aggregators', code:'AG', color:'#16a34a', weight:0.9},
];

function overallScore(stats){
  const vals = PILLAR_DEFS.filter(p=>stats[p.id]).map(p=>({score:stats[p.id].score, w:p.weight}));
  if(!vals.length) return null;
  let weighted=0, totalW=0;
  vals.forEach(({score, w})=>{ weighted += score*w; totalW += w; });
  return Math.round(weighted/totalW);
}

function getActions(stats){
  const acts = [];
  const p = stats;
  if(p.cit && p.cit.score < 60) acts.push({prio:1, title:'Build missing citations', desc:`Only ${p.cit.score}% citation coverage. <strong>${p.cit.miss} directories</strong> missing your business.`, link:'citation-finder.html'});

  if(p.gbp && p.gbp.fail >= 5) acts.push({prio:1, title:'Fix failed GBP checks', desc:`<strong>${p.gbp.fail} GBP audit items</strong> failed — directly impacts pack rank.`, link:'gbp-audit.html'});
  if(p.rev && p.rev.avg < 4.0 && p.rev.total >= 5) acts.push({prio:1, title:'Improve review average', desc:`<strong>${p.rev.avg}★ average</strong> is below the 4.0★ pack-friendly threshold.`, link:'review-reply.html'});
  if(p.rev && p.rev.replied/p.rev.total < 0.5) acts.push({prio:2, title:'Reply to more reviews', desc:`Only <strong>${p.rev.replied}/${p.rev.total}</strong> reviews have replies. Aim for 100%.`, link:'review-reply.html'});
  if(p.bs && p.bs.score < 60) acts.push({prio:2, title:'Strengthen brand SERP', desc:`Brand SERP score is <strong>${p.bs.score}/100</strong> — knowledge panel/sitelinks gaps.`, link:'brand-serp.html'});
  if(p.geo && p.geo.score < 50) acts.push({prio:2, title:'Improve local rankings', desc:`Share of Local Voice is only <strong>${p.geo.score}%</strong>. Focus on GBP + content.`, link:'geo-grid-tracker.html'});
  if(p.gap && p.gap.gaps >= 5) acts.push({prio:2, title:'Close competitor citation gaps', desc:`Competitors have <strong>${p.gap.gaps} citations</strong> you don't.`, link:'competitor-gap.html'});
  if(p.sch && p.sch.score < 70) acts.push({prio:3, title:'Complete schema markup', desc:`Schema is <strong>${p.sch.score}% complete</strong>. Add missing fields.`, link:'schema-generator.html'});
  if(p.sr && p.sr.risk >= 40) acts.push({prio:1, title:'Reduce suspension risk', desc:`GBP suspension risk score is <strong>${p.sr.risk}/100</strong> — review triggers immediately.`, link:'suspension-risk.html'});
  if(p.agg && p.agg.live < 4) acts.push({prio:2, title:'Submit to more aggregators', desc:`Only <strong>${p.agg.live}/${p.agg.total}</strong> aggregators are live. Data Axle + Foursquare are free.`, link:'aggregator-tracker.html'});
  if(!stats.bs && !DATA.bs) acts.push({prio:3, title:'Run a brand SERP audit', desc:`No brand SERP audit yet. Check your knowledge panel + sitelinks.`, link:'brand-serp.html'});
  if(!stats.agg && !DATA.agg) acts.push({prio:3, title:'Track aggregator submissions', desc:`Aggregator tracker isn't set up yet — feed Data Axle/Foursquare for downstream propagation.`, link:'aggregator-tracker.html'});
  if(!DATA.roi) acts.push({prio:3, title:'Calculate your ROI', desc:`Run the ROI Calculator to convert your GBP metrics into dollar projections.`, link:'roi-calculator.html'});
  return acts.sort((a,b)=>a.prio-b.prio);
}

/* ==========================================================================
 * SIDEBAR
 * ========================================================================== */
function renderSidebar(filter=''){
  const lower = filter.toLowerCase().trim();
  const body = document.getElementById('sb-body');
  let totalShown = 0;
  body.innerHTML = CATS.map(cat=>{
    const matchedTools = cat.tools.filter(tid=>{
      const t = TOOLS[tid]; if(!t) return false;
      if(!lower) return true;
      return (t.name+' '+t.desc+' '+cat.name).toLowerCase().includes(lower);
    });
    if(lower && !matchedTools.length) return '';
    totalShown += matchedTools.length;
    const collapsed = !lower && state.collapsedCats[cat.id];
    return `<div class="sb-cat ${collapsed?'collapsed':''}" data-cat="${cat.id}">
      <div class="sb-cat-hdr" onclick="toggleCat('${cat.id}')">
        <span class="ch-icon" style="background:${cat.color}">${cat.icon.replace('<svg','<svg style="width:9px;height:9px"')}</span>
        <span>${escapeHtml(cat.name)}</span>
        <span class="ch-count">${matchedTools.length}</span>
        <span class="ch-toggle">▼</span>
      </div>
      <div class="sb-items">
        ${matchedTools.map(tid=>{
          const t = TOOLS[tid];
          const hasData = toolHasData(tid);
          const isCurrent = location.pathname.endsWith(t.url) || (t.url==='dashboard.html' && (location.pathname.endsWith('dashboard.html')||location.pathname.endsWith('/')||location.pathname.endsWith('\\')));
          return `<a class="sb-item ${isCurrent?'active':''}" href="${t.url}" title="${escapeAttr(t.desc)}">
            <span class="sbi-icon" style="background:${t.color}">${escapeHtml(t.code)}</span>
            <span class="sbi-name">${escapeHtml(t.name)}</span>
            ${t.isNew?'<span class="sbi-new">NEW</span>':''}
            <span class="sbi-status ${hasData?'live':''}"></span>
          </a>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  if(lower && totalShown===0){
    body.innerHTML = `<div style="padding:40px 20px;text-align:center;color:var(--text3);font-size:12px"><div style="font-size:30px;margin-bottom:8px">🔍</div>No tools match "${escapeHtml(filter)}"</div>`;
  }
}

function toggleCat(catId){
  state.collapsedCats[catId] = !state.collapsedCats[catId];
  saveState();
  document.querySelector(`.sb-cat[data-cat="${catId}"]`)?.classList.toggle('collapsed');
}

function sidebarFilter(val){
  document.getElementById('sb-clear').classList.toggle('show', !!val);
  renderSidebar(val);
}

function clearSearch(){
  document.getElementById('sb-search-input').value='';
  sidebarFilter('');
}

function globalSearch(val){
  // Search both sidebar and main catalog
  document.getElementById('sb-search-input').value = val;
  sidebarFilter(val);
  if(state.view==='catalog') renderCatalog();
}

/* ==========================================================================
 * RENDER
 * ========================================================================== */
function setTab(t){
  state.view = t;
  saveState();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  render();
}

function render(){
  loadAllData();
  const stats = pillarStats();
  const dataCount = Object.keys(TOOLS).filter(id=>TOOLS[id].key && toolHasData(id)).length;
  const totalTools = Object.keys(TOOLS).filter(id=>TOOLS[id].key).length;
  const actions = getActions(stats);
  const overall = overallScore(stats);

  // Header stats
  document.getElementById('stat-score').textContent = overall===null?'—':overall+'/100';
  document.getElementById('stat-tools-data').textContent = dataCount;
  document.getElementById('stat-tools-total').textContent = totalTools;
  document.getElementById('stat-actions').textContent = actions.length;
  document.getElementById('last-updated').textContent = new Date().toLocaleTimeString().slice(0,5);

  renderSidebar(document.getElementById('sb-search-input').value);

  const c = document.getElementById('content');
  if(state.view==='overview') return renderOverview(c, stats, dataCount, totalTools, actions, overall);
  if(state.view==='catalog') return renderCatalog();
  if(state.view==='pillars') return renderPillars(c, stats);
  if(state.view==='actions') return renderActions(c, actions);
  if(state.view==='report') return renderReport(c, stats, actions, overall);
}

function renderOverview(c, stats, dataCount, totalTools, actions, overall){

function kpiCard(cls, label, stat, link, override){
  if(!stat) return `<a class="kpi" href="${link}"><div class="kl">${escapeHtml(label)}</div><div class="kv" style="color:var(--text3)">—</div><div class="ks">No data yet → set up</div></a>`;
  const cls2 = stat.score>=80?'s':stat.score>=60?'w':'d';
  return `<a class="kpi ${cls2}" href="${link}"><div class="kl">${escapeHtml(label)}</div><div class="kv">${override||stat.score+'%'}</div><div class="ks">${escapeHtml(stat.sub||'')}</div></a>`;
}

  document.getElementById('b-agency').value = state.brand.agency||'';

function onBrandInput(){
  state.brand.client = document.getElementById('b-client').value.trim();
  state.brand.period = document.getElementById('b-period').value.trim();

function exportClientReport(){
  loadAllData();
  const stats = pillarStats();
  const overall = overallScore(stats);
  const actions = getActions(stats);
  const accent = state.brand.color || '#2563eb';
  const css = `*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{padding:24px;background:#f3f6fb;color:#0f1a2e;font-size:13px;line-height:1.55}.wrap{max-width:920px;margin:0 auto;background:#fff;border-radius:14px;padding:36px;box-shadow:0 4px 16px rgba(15,26,46,.1)}.hdr{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:3px solid ${accent};margin-bottom:24px}.hdr img{width:54px;height:54px;border-radius:10px;object-fit:contain}.hdr h1{font-size:24px;font-weight:800}.hdr .sub{font-size:13px;color:#5b6b88}h2{font-size:18px;font-weight:700;margin:24px 0 12px;color:${accent}}.score{display:flex;align-items:center;gap:20px;margin:14px 0;padding:18px;background:#f3f6fb;border-radius:12px}.sc{font-size:60px;font-weight:900;color:${accent};font-family:'JetBrains Mono',monospace;line-height:1}.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.p{padding:14px;background:#f3f6fb;border-radius:10px;border-left:4px solid ${accent}}.p .pn{font-size:11px;color:#5b6b88;font-weight:700;text-transform:uppercase;font-family:monospace}.p .pv{font-size:24px;font-weight:900;font-family:'JetBrains Mono',monospace;margin:3px 0}.p .pd{font-size:11px;color:#5b6b88}.a{padding:11px 14px;background:#f3f6fb;border-radius:8px;margin-bottom:8px;display:grid;grid-template-columns:24px 1fr;gap:10px}.a.p1{background:rgba(220,38,38,.07);border-left:4px solid #dc2626}.a.p2{background:rgba(245,158,11,.07);border-left:4px solid #f59e0b}.a.p3{background:rgba(37,99,235,.07);border-left:4px solid #2563eb}.a .ai{font-size:16px;font-weight:900}.a.p1 .ai{color:#dc2626}.a.p2 .ai{color:#f59e0b}.a.p3 .ai{color:#2563eb}.a .at{font-weight:700;font-size:13px}.a .ad{font-size:11.5px;color:#5b6b88;margin-top:2px}.foot{margin-top:32px;padding-top:14px;border-top:1px solid #e9eef7;font-size:11px;color:#5b6b88;text-align:center}@media print{body{padding:0;background:#fff}.wrap{box-shadow:none;border-radius:0}}`;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Local SEO Report${state.brand.client?' — '+escapeHtml(state.brand.client):''}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700;900&display=swap" rel="stylesheet"><style>${css}</style></head><body><div class="wrap">
<div class="hdr">${state.brand.logo?`<img src="${escapeAttr(state.brand.logo)}">`:''}<div><h1>${escapeHtml(state.brand.client||'Local SEO Report')}</h1><div class="sub">${state.brand.period?escapeHtml(state.brand.period)+' · ':''}${escapeHtml(state.brand.agency||'')}</div></div></div>
<div class="score"><div class="sc">${overall===null?'—':overall}</div><div><div style="font-size:20px;font-weight:800">Overall Local SEO Score</div><div style="font-size:13px;color:#5b6b88">Weighted across ${PILLAR_DEFS.filter(p=>stats[p.id]).length} of ${PILLAR_DEFS.length} active pillars</div></div></div>
<h2>Pillar Scores</h2>
<div class="pillars">${PILLAR_DEFS.map(def=>{const s=stats[def.id];if(!s)return '';return `<div class="p"><div class="pn">${escapeHtml(def.name)}</div><div class="pv">${s.score}/100</div><div class="pd">${escapeHtml(s.sub)}</div></div>`;}).join('')}</div>
<h2>Action Items (${actions.length})</h2>
${actions.length?actions.map(a=>`<div class="a p${a.prio}"><div class="ai">${a.prio===1?'!':a.prio===2?'⚠':'i'}</div><div><div class="at">${escapeHtml(a.title)}</div><div class="ad">${a.desc.replace(/<[^>]+>/g,'')}</div></div></div>`).join(''):'<p style="color:#5b6b88">No action items — all systems green.</p>'}
${state.brand.footer?`<div style="margin-top:20px;padding:14px;background:#f3f6fb;border-radius:9px;font-size:11.5px;color:#5b6b88">${escapeHtml(state.brand.footer)}</div>`:''}
<div class="foot">Generated by Local SEO Command Center · ${new Date().toLocaleString()}</div>
</div><script src="global-nav.js"><\/script>
</body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url;
  a.download=`local-seo-report-${(state.brand.client||'client').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}-2026-05-29.html`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Report exported','success');
}

  loadAllData();
  render();
  toast('Refreshed','success');
}
