<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Pack Tracker - Time-Series 3-Pack Monitoring for Local SEO</title>
<meta name="description" content="Track Google Local Pack (3-pack) appearance for N keywords over time. Daily snapshots, position-change alerts, competitor presence detection, trend charts (Chart.js), ICS calendar export for re-check reminders. Time-series complement to Geo-Grid's spatial view.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root {
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#d97706; --accent-h:#b45309; --accent-soft:rgba(217,119,6,.08);
  --teal:#0d9488;
  --amber:#d97706;
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --gold:#fbbf24; --r1:#fbbf24; --r2:#10b981; --r3:#3b82f6;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#f59e0b; --accent-h:#fbbf24; --accent-soft:rgba(245,158,11,.14);
  --teal:#14b8a6;
  --amber:#f59e0b;
  --danger:#ef4444; --success:#22c55e;
  --purple:#a78bfa; --pink:#ec4899; --blue:#3b82f6;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--gold));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(217,119,6,.3)}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.kw strong{color:var(--accent)}
.hdr-stat.in strong{color:var(--success)}
.hdr-stat.out strong{color:var(--danger)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none;transition:all .15s}
.hdr-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hdr-link svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

#app{flex:1;display:flex;overflow:hidden}

/* LEFT — KW LIST */
#left{width:300px;min-width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:6px}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;flex:1}

.brand-card{padding:11px 14px;background:linear-gradient(135deg,var(--accent-soft),transparent);border-bottom:1px solid var(--border)}
.brand-card .bf{display:flex;flex-direction:column;gap:6px}
.brand-card input{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-size:11.5px;color:var(--text)}

.add-kw{padding:11px 14px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.add-kw .row{display:flex;gap:5px}
.add-kw input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:6px 9px;font-size:11.5px;color:var(--text)}
.add-kw button{padding:6px 11px;background:var(--accent);color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700}

#kw-list{flex:1;overflow-y:auto;padding:6px}
.kw-item{padding:9px 11px;border-radius:8px;margin-bottom:4px;cursor:pointer;border:1px solid transparent;transition:all .12s}
.kw-item:hover{background:var(--bg3)}
.kw-item.active{background:var(--accent-soft);border-color:var(--accent)}
.kw-item .kt{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.kw-item .badge{width:22px;height:22px;border-radius:5px;color:#fff;font-family:var(--mono);font-weight:800;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--text3)}
.kw-item .badge.r1{background:var(--r1)}
.kw-item .badge.r2{background:var(--r2)}
.kw-item .badge.r3{background:var(--r3)}
.kw-item .badge.un{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.kw-item .kname{flex:1;font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kw-item .km{font-size:9.5px;color:var(--text3);font-family:var(--mono);margin-left:29px;display:flex;gap:7px}
.kw-item .km strong{color:var(--text2)}
.kw-item .change{font-family:var(--mono);font-weight:700;font-size:11px}
.kw-item .change.up{color:var(--success)}
.kw-item .change.down{color:var(--danger)}
.kw-item .change.same{color:var(--text3)}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

/* CENTER */
#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab svg{width:13px;height:13px}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
.cb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 15px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.scard.ok::before{background:var(--success)}
.scard.warn::before{background:var(--amber)}
.scard.bad::before{background:var(--danger)}
.scard-label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.scard-val{font-size:24px;font-weight:800;color:var(--text);margin-top:4px;font-family:var(--mono);line-height:1.1}
.scard.ok .scard-val{color:var(--success)}
.scard.warn .scard-val{color:var(--amber)}
.scard.bad .scard-val{color:var(--danger)}
.scard-sub{font-size:10.5px;color:var(--text3);margin-top:3px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

.chart-wrap{position:relative;height:260px;padding:8px 14px 14px}

/* PACK SNAPSHOT */
.pack-snapshot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px}
.pack-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;position:relative}
.pack-card.us{border-color:var(--success);background:rgba(22,163,74,.05)}
.pack-card .pos{position:absolute;top:-8px;left:11px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--mono);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.pack-card.r1 .pos{background:var(--r1)}
.pack-card.r2 .pos{background:var(--r2)}
.pack-card.r3 .pos{background:var(--r3)}
.pack-card .pn{font-size:12.5px;font-weight:700;margin-top:6px;color:var(--text);line-height:1.3}
.pack-card .pa{font-family:var(--mono);font-size:10.5px;color:var(--text2);margin-top:3px;line-height:1.4}
.pack-card .pmeta{display:flex;gap:7px;font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:5px}
.pack-card .you-tag{position:absolute;top:-8px;right:8px;font-size:9px;font-family:var(--mono);font-weight:800;padding:1px 6px;background:var(--success);color:#fff;border-radius:3px;border:2px solid var(--bg)}

/* HISTORY TABLE */
table.htable{width:100%;border-collapse:collapse;font-size:11.5px}
table.htable thead{background:var(--bg);position:sticky;top:0;z-index:5}
table.htable th{padding:8px 10px;text-align:left;font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);white-space:nowrap}
table.htable th.center{text-align:center}
table.htable td{padding:8px 10px;border-bottom:1px solid var(--border)}
table.htable td.center{text-align:center}
table.htable tr:hover{background:var(--bg3)}
.pos-pill{display:inline-block;font-family:var(--mono);font-weight:800;font-size:11px;padding:2px 8px;border-radius:4px;color:#fff;min-width:34px;text-align:center}
.pos-pill.r1{background:var(--r1)}
.pos-pill.r2{background:var(--r2)}
.pos-pill.r3{background:var(--r3)}
.pos-pill.un{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}

/* COMPETITOR LIST */
.comp-row{padding:9px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.comp-row:last-child{border-bottom:none}
.comp-row .domain{flex:1;font-size:12.5px;font-weight:600;color:var(--text)}
.comp-row .meta{font-family:var(--mono);font-size:10.5px;color:var(--text2)}
.comp-row .meta strong{color:var(--text)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

.progress-line{height:3px;background:var(--bg3);overflow:hidden;flex-shrink:0}
.progress-line .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0;transition:width .3s}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-item{display:flex;align-items:center;gap:5px}
.ft-item svg{width:12px;height:12px}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
#toast.info{border-color:var(--accent);color:var(--accent)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:300px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .pack-snapshot{grid-template-columns:1fr}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </div>
    <div><div class="logo-name">Pack<span>Tracker</span></div></div>
    <span class="logo-tag">3-PACK</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat kw"><strong id="stat-kw">0</strong> keywords</div>
  <div class="hdr-stat in"><strong id="stat-in">0</strong> in pack</div>
  <div class="hdr-stat out"><strong id="stat-out">0</strong> out of pack</div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </a>
  <a href="geo-grid-tracker.html" class="hdr-link" style="border-color:rgba(5,150,105,.4);color:#059669">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Geo Grid
  </a>
  <a href="serp-ranker.html" class="hdr-link" style="border-color:rgba(5,150,105,.4);color:#059669">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
    SERP
  </a>
  <a href="ai-assistant.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
    AI
  </a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">

  <!-- LEFT -->
  <div id="left">
    <div class="lh-bar"><h3>Tracked Keywords</h3></div>
    <div class="brand-card">
      <div class="bf">
        <input id="b-name" placeholder="Your business name" oninput="saveBrand()">
        <input id="b-domain" placeholder="Your domain (e.g. acme.com)" oninput="saveBrand()">
        <input id="b-city" placeholder="City (Boston, MA)" oninput="saveBrand()">
      </div>
    </div>
    <div class="add-kw">
      <div class="row">
        <input id="new-kw" placeholder="plumber boston" onkeydown="if(event.key==='Enter')addKw()">
        <button onclick="addKw()">+ Add</button>
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn-sub" onclick="syncFromKwResearch()" style="flex:1">↻ From Keyword Research</button>
        <button class="btn-sub" onclick="bulkAddKws()" style="flex:1">Bulk paste</button>
      </div>
    </div>
    <div id="kw-list"></div>
    <div id="left-footer">
      <button class="btn-go" onclick="checkAll()" id="btn-checkall">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Check All Keywords Now
      </button>
      <div style="display:flex;gap:5px">
        <button class="btn-sub" onclick="openSettings()">⚙ SERP key</button>
        <button class="btn-sub" onclick="exportICS()">📅 ICS</button>
        <button class="btn-sub" onclick="exportCSV()">CSV</button>
      </div>
    </div>
  </div>

  <!-- CENTER -->
  <div id="center">
    <div id="cbar">
      <button class="tab active" data-tab="dashboard" onclick="setTab('dashboard')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </button>
      <button class="tab" data-tab="snapshot" onclick="setTab('snapshot')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Current Pack
      </button>
      <button class="tab" data-tab="history" onclick="setTab('history')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
        History
      </button>
      <button class="tab" data-tab="competitors" onclick="setTab('competitors')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 19a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2H3z"/></svg>
        Competitors
      </button>
      <div class="cb-sp"></div>
      <button class="cb-btn" onclick="checkActive()" id="btn-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Re-check this KW
      </button>
    </div>
    <div class="progress-line"><div class="fill" id="prog-fill"></div></div>
    <div id="cbody"></div>
  </div>

</div>

<div id="footer">
  <div class="ft-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span id="ft-status">Set business + add keywords, then click Check All</span>
  </div>
  <div class="ft-item"><span>SERP: <strong id="ft-prov">none</strong></span></div>
  <div class="ft-spacer"></div>
  <div class="ft-item"><span>Built by <strong>Local SEO Tools</strong></span></div>
  <a class="ft-link" href="mailto:">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    Email
  </a>
</div>

<div id="toast"></div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="set-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:500px;width:100%;max-height:90vh;overflow:hidden;box-shadow:var(--shadow-lg);display:flex;flex-direction:column">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)"><h2 style="font-size:14px;font-weight:700;flex:1">SERP Provider Settings</h2><button onclick="closeSettings()" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2)">&times;</button></div>
    <div style="padding:18px;overflow-y:auto;flex:1">
      <div class="f" style="margin-bottom:10px"><label>Provider</label><div id="prov-pills" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px"></div><div id="prov-cfg"></div></div>
      <div class="f"><label>Country</label><select id="set-country" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);width:100%"><option value="us">US</option><option value="ca">CA</option><option value="uk">UK</option><option value="au">AU</option><option value="in">IN</option></select></div>
    </div>
    <div style="padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg3)"><button onclick="closeSettings()" style="padding:8px 14px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--text)">Cancel</button><button onclick="saveSettings()" style="padding:8px 14px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:#fff">Save</button></div>
  </div>
</div>

<script>
/* ==========================================================================
 * LOCAL PACK TRACKER
 * Time-series 3-pack monitoring for N keywords
 * ========================================================================== */

const SERP_PROVIDERS = {
  serper: {label:'Serper', free:'2,500', fields:[{key:'key',label:'API Key',type:'password'}],
    async search({query,country,key}){
      const r = await fetch('https://google.serper.dev/search', {method:'POST', headers:{'X-API-KEY':key.key,'Content-Type':'application/json'}, body:JSON.stringify({q:query, gl:country||'us'})});
      if(!r.ok) throw new Error('Serper '+r.status); const j = await r.json();
      return {places: (j.places||[]).map((p,i)=>({pos:p.position||i+1, title:p.title, address:p.address, link:p.website, cid:p.cid, rating:p.rating, reviews:p.reviewsCount}))};
    }
  },
  serpapi: {label:'SerpAPI', free:'100/mo', fields:[{key:'key',label:'API Key',type:'password'}],
    async search({query,country,key}){
      const r = await fetch(`https://serpapi.com/search.json?engine=google&q=${encodeURIComponent(query)}&gl=${country||'us'}&api_key=${encodeURIComponent(key.key)}`);
      if(!r.ok) throw new Error('SerpAPI '+r.status); const j = await r.json();
      const places = j.local_results?.places || j.local_results || [];
      return {places: places.map((p,i)=>({pos:p.position||i+1, title:p.title, address:p.address, link:p.website, rating:p.rating, reviews:p.reviews}))};
    }
  },
  valueserp: {label:'ValueSERP', free:'100/mo', fields:[{key:'key',label:'API Key',type:'password'}],
    async search({query,country,key}){
      const r = await fetch(`https://api.valueserp.com/search?api_key=${encodeURIComponent(key.key)}&q=${encodeURIComponent(query)}&gl=${country||'us'}`);
      if(!r.ok) throw new Error('ValueSERP '+r.status); const j = await r.json();
      return {places: (j.local_results||[]).map((p,i)=>({pos:p.position||i+1, title:p.title, address:p.address, link:p.link, rating:p.rating, reviews:p.reviews}))};
    }
  },
};

/* ---------- STATE ---------- */
const STORE_KEY = 'pt_state_v1';
const defaultState = {
  brand: {name:'', domain:'', city:''},
  serp: {provider:'serper', keys:{}, country:'us'},
  keywords: [],  // [{id, kw, snapshots: [{date, places:[], position, found, place}], lastPos, prev1Pos}]
  activeId: null,
  view: 'dashboard',
};
let state = loadState();
function loadState(){ try { return Object.assign(clone(defaultState), JSON.parse(localStorage.getItem(STORE_KEY))||{}); } catch(e){ return clone(defaultState); } }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ toast('Storage full — export your data','err'); } }
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return Math.random().toString(36).slice(2,11)+Date.now().toString(36).slice(-4);}

// Inherit brand + SERP keys
(function inherit(){
  try {
    if(!state.brand.name){
      const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
      const b = cf?.businesses?.[0];
      if(b){ state.brand.name = b.name||''; state.brand.domain = (b.website||'').replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,''); state.brand.city = b.city||''; }
    }
    if(!Object.keys(state.serp.keys).length){
      const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
      if(cf?.settings?.keys){ state.serp.keys = clone(cf.settings.keys); state.serp.provider = cf.settings.provider || state.serp.provider; }
    }
  } catch(e){}
  saveState();
})();

/* ---------- THEME ---------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('seohub_theme_v1', next);
  document.getElementById('theme-label').textContent = next==='dark'?'Dark':'Light';
}
document.getElementById('theme-label').textContent = (document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

/* ---------- UTILS ---------- */
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(msg,type){const t=document.getElementById('toast');t.className='';t.classList.add('show');if(type)t.classList.add(type);t.innerHTML='<span>'+escapeHtml(msg)+'</span>';setTimeout(()=>t.classList.remove('show'),2500);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function domainOf(s){try{ if(!s) return ''; if(!/^https?:\/\//.test(s)) s='http://'+s; return new URL(s).hostname.replace(/^www\./,''); }catch(e){return s||'';}}
function pad(n){return String(n).padStart(2,'0');}

/* ---------- BRAND ---------- */
function saveBrand(){
  state.brand.name = document.getElementById('b-name').value.trim();
  state.brand.domain = document.getElementById('b-domain').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');
  state.brand.city = document.getElementById('b-city').value.trim();
  saveState();
}
function fillBrand(){
  document.getElementById('b-name').value = state.brand.name||'';
  document.getElementById('b-domain').value = state.brand.domain||'';
  document.getElementById('b-city').value = state.brand.city||'';
}

/* ---------- KEYWORD MGMT ---------- */
function addKw(){
  const kw = document.getElementById('new-kw').value.trim();
  if(!kw) return;
  state.keywords.push({id:uid(), kw, snapshots:[], lastPos:null, prev1Pos:null});
  saveState();
  document.getElementById('new-kw').value='';
  renderLeft(); renderHeader();
}
function bulkAddKws(){
  const text = prompt('Paste keywords, one per line:'); if(!text) return;
  text.split('\n').map(l=>l.trim()).filter(Boolean).forEach(kw=>{
    if(!state.keywords.some(k=>k.kw.toLowerCase()===kw.toLowerCase())) state.keywords.push({id:uid(), kw, snapshots:[], lastPos:null, prev1Pos:null});
  });
  saveState(); renderLeft(); renderHeader();
  toast('Added','success');
}
function delKw(id){
  if(!confirm('Delete this keyword and its history?')) return;
  state.keywords = state.keywords.filter(k=>k.id!==id);
  if(state.activeId===id) state.activeId = null;
  saveState(); renderLeft(); renderHeader(); renderCenter();
}
function selKw(id){state.activeId=id; saveState(); renderLeft(); renderCenter();}

function syncFromKwResearch(){
  try {
    const kw = JSON.parse(localStorage.getItem('kw_state_v1')||'null');
    const sel = kw?.keywords?.filter(k=>k.selected) || [];
    if(!sel.length){ toast('No selected keywords in Keyword Research','err'); return; }
    let added = 0;
    sel.forEach(k=>{
      if(!state.keywords.some(x=>x.kw.toLowerCase()===k.kw.toLowerCase())){
        state.keywords.push({id:uid(), kw:k.kw, snapshots:[], lastPos:null, prev1Pos:null});
        added++;
      }
    });
    saveState(); renderLeft(); renderHeader();
    toast(`Imported ${added}`,'success');
  } catch(e){ toast('Failed','err'); }
}

/* ---------- SETTINGS ---------- */
function openSettings(){
  document.getElementById('prov-pills').innerHTML = Object.entries(SERP_PROVIDERS).map(([id,p])=>`<button class="btn-sub ${state.serp.provider===id?'':''}" style="background:${state.serp.provider===id?'var(--accent)':'var(--bg2)'};color:${state.serp.provider===id?'#fff':'var(--text2)'};border:1px solid ${state.serp.provider===id?'var(--accent)':'var(--border)'};padding:5px 9px;font-size:10.5px" onclick="selProv('${id}')">${escapeHtml(p.label)} <span style="font-size:9px;background:rgba(255,255,255,.25);padding:1px 4px;border-radius:3px;margin-left:4px">${escapeHtml(p.free)}</span></button>`).join('');
  document.getElementById('set-country').value = state.serp.country||'us';
  renderProvCfg();
  document.getElementById('set-modal').style.display='flex';
}
function closeSettings(){document.getElementById('set-modal').style.display='none';}
function selProv(id){
  state.serp.provider = id;
  document.querySelectorAll('#prov-pills .btn-sub').forEach(b=>{const isActive = b.textContent.includes(SERP_PROVIDERS[id].label); b.style.background = isActive?'var(--accent)':'var(--bg2)'; b.style.color = isActive?'#fff':'var(--text2)'; b.style.borderColor = isActive?'var(--accent)':'var(--border)';});
  renderProvCfg();
}
function renderProvCfg(){
  const p = SERP_PROVIDERS[state.serp.provider]; const k = state.serp.keys[state.serp.provider]||{};
  document.getElementById('prov-cfg').innerHTML = p.fields.map(f=>`<div class="f" style="margin-top:8px"><label style="font-size:11px;font-weight:600">${escapeHtml(f.label)}</label><input type="${f.type}" id="prov-${f.key}" value="${escapeAttr(k[f.key]||'')}" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);width:100%"></div>`).join('');
}
function saveSettings(){
  const p = SERP_PROVIDERS[state.serp.provider];
  const keys = state.serp.keys[state.serp.provider]||{};
  p.fields.forEach(f=>{keys[f.key] = document.getElementById('prov-'+f.key).value.trim();});
  state.serp.keys[state.serp.provider] = keys;
  state.serp.country = document.getElementById('set-country').value;
  saveState(); closeSettings();
  document.getElementById('ft-prov').textContent = p.label;
  toast('Saved','success');
}

/* ---------- CHECK ---------- */
async function checkOne(k){
  const p = SERP_PROVIDERS[state.serp.provider]; const keys = state.serp.keys[state.serp.provider];
  if(!keys?.key) throw new Error('No SERP key');
  const r = await p.search({query: k.kw, country: state.serp.country, key: keys});
  const places = (r.places||[]).slice(0,3); // 3-pack
  const target = state.brand.name.toLowerCase();
  const targetDom = state.brand.domain.toLowerCase();
  let position = null;
  let matchedPlace = null;
  for(let i=0;i<places.length;i++){
    const pl = places[i];
    const title = (pl.title||'').toLowerCase();
    const linkDom = domainOf(pl.link||'').toLowerCase();
    const titleMatch = target && norm(title).includes(norm(target));
    const domMatch = targetDom && linkDom.includes(targetDom);
    if(titleMatch || domMatch){ position = pl.pos || i+1; matchedPlace = pl; break; }
  }
  const snap = {date: new Date().toISOString().slice(0,10), ts: Date.now(), places, position, found: !!position, place: matchedPlace};
  // Dedup same-day
  k.snapshots = k.snapshots.filter(s=>s.date !== snap.date);
  k.snapshots.push(snap);
  k.snapshots.sort((a,b)=>a.ts-b.ts);
  k.prev1Pos = k.snapshots.length>=2 ? k.snapshots[k.snapshots.length-2].position : null;
  k.lastPos = position;
  saveState();
  return snap;
}

let checkCancel = false;
async function checkAll(){
  if(!state.brand.name){ toast('Set business name first','err'); return; }
  if(!state.keywords.length){ toast('Add keywords first','err'); return; }
  const p = SERP_PROVIDERS[state.serp.provider]; const keys = state.serp.keys[state.serp.provider];
  if(!keys?.key){ toast('Set SERP key in Settings','err'); openSettings(); return; }
  checkCancel = false;
  document.getElementById('btn-checkall').disabled = true;
  let done = 0; const total = state.keywords.length;
  for(const k of state.keywords){
    if(checkCancel) break;
    document.getElementById('ft-status').textContent = `Checking ${done+1}/${total}: ${k.kw}`;
    try { await checkOne(k); }
    catch(e){ toast(`Failed for "${k.kw}": ${e.message}`,'err'); }
    done++;
    document.getElementById('prog-fill').style.width = (done/total*100)+'%';
    renderLeft(); renderHeader();
    if(state.view==='dashboard') renderCenter();
    await sleep(300);
  }
  document.getElementById('btn-checkall').disabled = false;
  document.getElementById('prog-fill').style.width = '0';
  document.getElementById('ft-status').textContent = `Checked ${done}/${total} keywords`;
  toast(`Checked ${done} keywords`,'success');
}
async function checkActive(){
  const k = state.keywords.find(x=>x.id===state.activeId);
  if(!k){ toast('Select a keyword first','err'); return; }
  const p = SERP_PROVIDERS[state.serp.provider]; const keys = state.serp.keys[state.serp.provider];
  if(!keys?.key){ toast('Set SERP key','err'); openSettings(); return; }
  document.getElementById('btn-check').disabled = true;
  try { await checkOne(k); renderLeft(); renderHeader(); renderCenter(); toast('Updated','success'); }
  catch(e){ toast('Failed: '+e.message,'err'); }
  document.getElementById('btn-check').disabled = false;
}

/* ---------- DERIVED ---------- */
function changeOf(k){
  if(!k.lastPos && !k.prev1Pos) return {dir:'same', n:0};
  if(!k.lastPos && k.prev1Pos) return {dir:'down', n:'lost'};
  if(k.lastPos && !k.prev1Pos) return {dir:'up', n:'new'};
  const d = k.prev1Pos - k.lastPos;
  if(d>0) return {dir:'up', n:'+'+d};
  if(d<0) return {dir:'down', n:String(d)};
  return {dir:'same', n:0};
}

/* ---------- RENDER ---------- */
function setTab(t){state.view=t; saveState(); document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t)); renderCenter();}

function renderHeader(){
  const inPack = state.keywords.filter(k=>k.lastPos).length;
  document.getElementById('stat-kw').textContent = state.keywords.length;
  document.getElementById('stat-in').textContent = inPack;
  document.getElementById('stat-out').textContent = state.keywords.length - inPack;
  document.getElementById('ft-prov').textContent = SERP_PROVIDERS[state.serp.provider]?.label || 'none';
}

function renderLeft(){
  const wrap = document.getElementById('kw-list');
  if(!state.keywords.length){
    wrap.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text3);font-size:11.5px;line-height:1.6">No keywords yet — add one above or import from <strong>Keyword Research</strong>.</div>`;
    return;
  }
  wrap.innerHTML = state.keywords.map(k=>{
    const ch = changeOf(k);
    const badgeClass = !k.lastPos?'un':'r'+k.lastPos;
    const arrow = ch.dir==='up'?'↑':ch.dir==='down'?'↓':'';
    return `<div class="kw-item ${state.activeId===k.id?'active':''}" onclick="selKw('${k.id}')">
      <div class="kt">
        <div class="badge ${badgeClass}">${k.lastPos||'—'}</div>
        <div class="kname">${escapeHtml(k.kw)}</div>
        <button onclick="event.stopPropagation();delKw('${k.id}')" style="background:none;border:none;color:var(--text3);font-size:14px">×</button>
      </div>
      <div class="km">${k.snapshots.length?`<span>${k.snapshots.length} checks</span>`:'<span>not checked</span>'}${ch.dir!=='same'?`<span class="change ${ch.dir}">${arrow}${ch.n}</span>`:''}</div>
    </div>`;
  }).join('');
}

let charts = [];
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}

function renderCenter(){
  destroyCharts();
  const body = document.getElementById('cbody');
  if(state.view==='dashboard') return renderDashboard(body);
  if(state.view==='snapshot') return renderSnapshot(body);
  if(state.view==='history') return renderHistory(body);
  if(state.view==='competitors') return renderCompetitors(body);
}

function renderDashboard(body){
  if(!state.keywords.length){
    body.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><div><div class="et">Local Pack Tracker</div><div class="ed">Track Google's Local Pack (3-pack) for N keywords over time. Daily snapshots, position-change alerts, competitor tracking, trend charts. Use alongside <a href="geo-grid-tracker.html" style="color:var(--accent)">Geo-Grid Tracker</a> (which shows where you rank across space) and <a href="serp-ranker.html" style="color:var(--accent)">SERP Ranker</a> (organic positions).</div></div></div>`;
    return;
  }
  const inPack = state.keywords.filter(k=>k.lastPos).length;
  const top1 = state.keywords.filter(k=>k.lastPos===1).length;
  const checked = state.keywords.filter(k=>k.snapshots.length).length;
  const improving = state.keywords.filter(k=>{const c=changeOf(k); return c.dir==='up' && c.n!=='new';}).length;
  const declining = state.keywords.filter(k=>{const c=changeOf(k); return c.dir==='down';}).length;

  body.innerHTML = `
    <div class="summary">
      <div class="scard"><div class="scard-label">Keywords Tracked</div><div class="scard-val">${state.keywords.length}</div><div class="scard-sub">${checked} checked</div></div>
      <div class="scard ${inPack/state.keywords.length>=.5?'ok':'warn'}"><div class="scard-label">In Pack</div><div class="scard-val">${inPack}</div><div class="scard-sub">${Math.round(inPack/state.keywords.length*100)}% of total</div></div>
      <div class="scard ${top1?'ok':'warn'}"><div class="scard-label">#1 Positions</div><div class="scard-val">${top1}</div></div>
      <div class="scard ok"><div class="scard-label">Improving</div><div class="scard-val">${improving}</div><div class="scard-sub">vs last check</div></div>
      <div class="scard bad"><div class="scard-label">Declining</div><div class="scard-val">${declining}</div><div class="scard-sub">need attention</div></div>
      <div class="scard"><div class="scard-label">Avg Position</div><div class="scard-val">${(()=>{const p = state.keywords.filter(k=>k.lastPos).map(k=>k.lastPos); return p.length?'#'+(p.reduce((a,b)=>a+b,0)/p.length).toFixed(1):'—';})()}</div></div>
    </div>
    <div class="section"><div class="section-hdr"><h3>Position Distribution Over Time</h3></div><div class="chart-wrap"><canvas id="ch-dist"></canvas></div></div>
    <div class="section"><div class="section-hdr"><h3>Recent Changes</h3></div><div style="padding:0">
      ${state.keywords.filter(k=>changeOf(k).dir!=='same').slice(0,15).map(k=>{const ch=changeOf(k); return `<div style="padding:9px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12px"><div style="flex:1"><strong>"${escapeHtml(k.kw)}"</strong></div><span class="pos-pill ${k.lastPos?('r'+k.lastPos):'un'}">${k.lastPos||'out'}</span><span class="kw-item change ${ch.dir}" style="font-family:var(--mono);font-weight:700">${ch.dir==='up'?'↑':'↓'}${ch.n}</span></div>`;}).join('') || '<div style="padding:20px;text-align:center;color:var(--text3)">No recent changes — first check or all stable.</div>'}
    </div></div>
  `;
  setTimeout(()=>buildDashCharts(),50);
}

function buildDashCharts(){
  const ctx = document.getElementById('ch-dist')?.getContext('2d');
  if(!ctx) return;
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  Chart.defaults.color = isDark?'#7e95b8':'#5b6b88';
  Chart.defaults.borderColor = isDark?'#1e2d44':'#d1d9e8';
  // Aggregate snapshots by date and bucket positions
  const allDates = new Set();
  state.keywords.forEach(k=>k.snapshots.forEach(s=>allDates.add(s.date)));
  const dates = Array.from(allDates).sort();
  if(!dates.length){ ctx.canvas.parentElement.innerHTML='<div style="padding:30px;text-align:center;color:var(--text3)">No history yet — run Check All to start tracking.</div>'; return; }
  const r1 = dates.map(d=>state.keywords.reduce((s,k)=>{const snap=k.snapshots.find(x=>x.date===d); return s+(snap?.position===1?1:0);},0));
  const r2 = dates.map(d=>state.keywords.reduce((s,k)=>{const snap=k.snapshots.find(x=>x.date===d); return s+(snap?.position===2?1:0);},0));
  const r3 = dates.map(d=>state.keywords.reduce((s,k)=>{const snap=k.snapshots.find(x=>x.date===d); return s+(snap?.position===3?1:0);},0));
  const out = dates.map(d=>state.keywords.reduce((s,k)=>{const snap=k.snapshots.find(x=>x.date===d); return s+(snap && !snap.position?1:0);},0));
  charts.push(new Chart(ctx, {type:'bar', data:{labels:dates, datasets:[
    {label:'#1', data:r1, backgroundColor:'#fbbf24'},
    {label:'#2', data:r2, backgroundColor:'#10b981'},
    {label:'#3', data:r3, backgroundColor:'#3b82f6'},
    {label:'Out', data:out, backgroundColor:'#94a3b8'},
  ]}, options:{plugins:{legend:{position:'bottom'}}, scales:{x:{stacked:true}, y:{stacked:true, beginAtZero:true}}}}));
}

function renderSnapshot(body){
  const k = state.keywords.find(x=>x.id===state.activeId);
  if(!k){ body.innerHTML = '<div class="empty"><div class="et">Select a keyword</div><div class="ed">Pick one from the list on the left.</div></div>'; return; }
  const latest = k.snapshots[k.snapshots.length-1];
  if(!latest){ body.innerHTML = `<div class="empty"><div class="et">No data for "${escapeHtml(k.kw)}"</div><div class="ed">Click "Re-check this KW" to get the latest 3-pack.</div></div>`; return; }
  body.innerHTML = `
    <div class="section"><div class="section-hdr"><h3>"${escapeHtml(k.kw)}" — Pack snapshot</h3><span class="badge">${latest.date}</span>${k.lastPos?`<span class="pos-pill r${k.lastPos}">You: #${k.lastPos}</span>`:'<span class="pos-pill un">You: out</span>'}</div>
      <div class="pack-snapshot">
        ${latest.places.length ? latest.places.map((p,i)=>{const isUs = (state.brand.name && norm(p.title||'').includes(norm(state.brand.name))) || (state.brand.domain && domainOf(p.link||'').includes(state.brand.domain)); return `<div class="pack-card r${i+1} ${isUs?'us':''}"><div class="pos">${i+1}</div>${isUs?'<div class="you-tag">YOU</div>':''}<div class="pn">${escapeHtml(p.title)}</div><div class="pa">${escapeHtml(p.address||'')}</div><div class="pmeta">${p.rating?`<span>★ ${p.rating}</span>`:''}${p.reviews?`<span>${p.reviews} reviews</span>`:''}${p.link?`<a href="${escapeAttr(p.link)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none">visit →</a>`:''}</div></div>`;}).join('') : '<div style="padding:30px;text-align:center;color:var(--text3);grid-column:1/-1">No local pack present for this query.</div>'}
      </div>
    </div>
    ${k.snapshots.length>=2?`<div class="section"><div class="section-hdr"><h3>Position History — "${escapeHtml(k.kw)}"</h3></div><div class="chart-wrap"><canvas id="ch-kw"></canvas></div></div>`:''}
  `;
  if(k.snapshots.length>=2) setTimeout(()=>{
    const ctx = document.getElementById('ch-kw')?.getContext('2d');
    if(!ctx) return;
    const data = k.snapshots.map(s=>({x:s.date, y: s.position || 11}));
    charts.push(new Chart(ctx, {type:'line', data:{labels:data.map(d=>d.x), datasets:[{label:'Position', data:data.map(d=>d.y), borderColor:'#d97706', backgroundColor:'rgba(217,119,6,.1)', tension:0.3, pointRadius:5, fill:true}]}, options:{scales:{y:{min:0, max:11, reverse:true, ticks:{stepSize:1, callback:v=>v===11?'Out':'#'+v}}}, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>'Position: '+(c.parsed.y===11?'Out of pack':'#'+c.parsed.y)}}}}}));
  }, 50);
}

function renderHistory(body){
  const k = state.keywords.find(x=>x.id===state.activeId);
  if(!k){ body.innerHTML = '<div class="empty"><div class="et">Select a keyword</div></div>'; return; }
  if(!k.snapshots.length){ body.innerHTML = '<div class="empty"><div class="et">No history yet</div></div>'; return; }
  body.innerHTML = `<div class="section"><div class="section-hdr"><h3>History — "${escapeHtml(k.kw)}"</h3><span class="badge">${k.snapshots.length} snapshots</span></div><div style="padding:0">
    <table class="htable"><thead><tr><th>Date</th><th class="center">Your Position</th><th class="center">Pack Size</th><th>Top 3 in Pack</th></tr></thead><tbody>
    ${k.snapshots.slice().reverse().map(s=>`<tr><td style="font-family:var(--mono)">${s.date}</td><td class="center"><span class="pos-pill ${s.position?('r'+s.position):'un'}">${s.position?'#'+s.position:'out'}</span></td><td class="center" style="font-family:var(--mono)">${s.places.length}</td><td style="font-size:11px;color:var(--text2)">${(s.places||[]).slice(0,3).map(p=>escapeHtml((p.title||'').slice(0,30))).join(' · ')}</td></tr>`).join('')}
    </tbody></table>
  </div></div>`;
}

function renderCompetitors(body){
  // Aggregate competitors across all keywords' latest snapshots
  const comps = {};
  state.keywords.forEach(k=>{
    const last = k.snapshots[k.snapshots.length-1];
    if(!last?.places) return;
    last.places.forEach((p,i)=>{
      const key = (p.title||p.link||'unknown').toLowerCase();
      if(!comps[key]) comps[key] = {title:p.title, link:p.link, address:p.address, count:0, positions:[], keywords:[]};
      comps[key].count++;
      comps[key].positions.push(i+1);
      comps[key].keywords.push(k.kw);
    });
  });
  const sorted = Object.values(comps).sort((a,b)=>b.count-a.count);
  // Mark "us"
  body.innerHTML = `<div class="section"><div class="section-hdr"><h3>Competitors Appearing in Your Tracked Pack Results</h3><span class="badge">${sorted.length}</span></div><div style="padding:0">${sorted.slice(0,50).map(c=>{const isUs = state.brand.name && norm(c.title).includes(norm(state.brand.name)); const avgPos = (c.positions.reduce((a,b)=>a+b,0)/c.positions.length).toFixed(1); return `<div class="comp-row" ${isUs?'style="background:rgba(22,163,74,.05)"':''}><div class="domain">${escapeHtml(c.title)}${isUs?'<span style="margin-left:6px;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:3px;background:var(--success);color:#fff;font-family:var(--mono)">YOU</span>':''}<div style="font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:2px">${escapeHtml(c.address||'')}</div></div><div class="meta">Appears in <strong>${c.count}</strong> kw · Avg #<strong>${avgPos}</strong></div></div>`;}).join('') || '<div style="padding:20px;text-align:center;color:var(--text3)">No data yet — check at least one keyword.</div>'}</div></div>`;
}

/* ---------- EXPORTS ---------- */
function exportCSV(){
  if(!state.keywords.length){ toast('No data','err'); return; }
  const rows = [['keyword','last_check','position','prev_position','change','snapshots']];
  state.keywords.forEach(k=>{
    const last = k.snapshots[k.snapshots.length-1];
    const ch = changeOf(k);
    rows.push([k.kw, last?.date||'', k.lastPos||'out', k.prev1Pos||'', ch.n, k.snapshots.length]);
  });
  const blob = new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`pack-tracker-${(state.brand.name||'export').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.csv`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Exported','success');
}

function exportICS(){
  if(!state.keywords.length){ toast('No keywords','err'); return; }
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pack Tracker//Local SEO//EN','CALSCALE:GREGORIAN'];
  // Weekly re-check reminders for 12 weeks
  const start = new Date(); start.setHours(9,0,0,0);
  for(let w=1; w<=12; w++){
    const d = new Date(start.getTime() + w*7*24*60*60*1000);
    const fmt = d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    lines.push('BEGIN:VEVENT');
    lines.push('UID:pack-check-week'+w+'@pack-tracker');
    lines.push('DTSTAMP:'+fmt(new Date()));
    lines.push('DTSTART:'+fmt(d));
    lines.push('DTEND:'+fmt(new Date(d.getTime()+30*60*1000)));
    lines.push('SUMMARY:Re-check Local Pack rankings ('+state.keywords.length+' keywords)');
    lines.push('DESCRIPTION:Open https://localhost/pack-tracker.html and click Check All. Track changes vs last week.');
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='pack-tracker-reminders.ics'; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('ICS exported — 12 weekly reminders','success');
}

/* ---------- BOOT ---------- */
fillBrand();
renderLeft();
renderHeader();
setTab(state.view||'dashboard');
window.addEventListener('beforeunload', saveState);
</script>
<script src="global-nav.js"></script>
</body>
