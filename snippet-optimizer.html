<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERP Snippet Optimizer - Title & Meta Description CTR Lab</title>
<meta name="description" content="Optimize your title tags and meta descriptions for Google SERP CTR. Live mobile + desktop preview, pixel-accurate character counting, emoji/special character testing, batch URL processing, AI-generated variations, and CTR prediction based on position + snippet quality.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Arial&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#ea580c; --accent-h:#c2410c; --accent-soft:rgba(234,88,12,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  /* Google SERP colors */
  --g-link:#1a0dab; --g-link-dark:#8ab4f8;
  --g-url:#006621; --g-url-dark:#9aa0a6;
  --g-desc:#545454; --g-desc-dark:#bdc1c6;
  --g-bg:#ffffff; --g-bg-dark:#202124;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#fb923c; --accent-h:#fdba74; --accent-soft:rgba(251,146,60,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--amber));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.score strong{color:var(--accent);font-size:14px}
.hdr-stat.ctr strong{color:var(--success)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:380px;min-width:340px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}

.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:10px}

.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.f label .pill{font-family:var(--mono);font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--text2);text-transform:none;letter-spacing:0}
.f label .pill.ok{background:rgba(22,163,74,.13);color:var(--success)}
.f label .pill.warn{background:rgba(245,158,11,.13);color:var(--warn)}
.f label .pill.bad{background:rgba(220,38,38,.13);color:var(--danger)}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);font-family:var(--font)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f textarea{resize:vertical;min-height:60px}
.f .meta{display:flex;align-items:center;gap:8px;font-size:10px;font-family:var(--mono);color:var(--text3);flex-wrap:wrap}
.f .meter{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;flex:1;min-width:80px}
.f .meter .bar{height:100%;transition:width .15s,background .15s}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab svg{width:13px;height:13px}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

/* SERP preview */
.serp-prev{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.serp-prev-hdr{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:8px}
.serp-prev-hdr h3{font-size:12px;font-weight:700;flex:1}
.serp-toggle{display:flex;gap:3px;background:var(--bg);border-radius:6px;padding:2px}
.serp-toggle button{padding:5px 11px;background:transparent;border:none;color:var(--text2);font-size:10.5px;font-weight:700;border-radius:4px;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px}
.serp-toggle button.active{background:var(--bg2);color:var(--accent);box-shadow:var(--shadow-sm)}

.gprev{padding:18px 22px;background:var(--g-bg);color:var(--g-desc);font-family:Arial,sans-serif;line-height:1.4;max-width:600px}
[data-theme="dark"] .gprev{background:var(--g-bg-dark);color:var(--g-desc-dark)}
.gprev.mobile{max-width:380px;font-size:14px;padding:14px 16px}
.gprev .favicon-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.gprev .favicon{width:26px;height:26px;border-radius:50%;background:#e4e4e4;display:flex;align-items:center;justify-content:center;color:#5f6368;font-weight:800;font-size:13px;font-family:Arial}
[data-theme="dark"] .gprev .favicon{background:#3c4043;color:#e8eaed}
.gprev .site-name{font-size:14px;color:#202124}
[data-theme="dark"] .gprev .site-name{color:#e8eaed}
.gprev .site-url{font-size:12px;color:var(--g-url)}
[data-theme="dark"] .gprev .site-url{color:var(--g-url-dark)}
.gprev .title{color:var(--g-link);font-size:20px;line-height:1.3;font-weight:400;margin-top:5px;cursor:pointer;font-family:Arial}
[data-theme="dark"] .gprev .title{color:var(--g-link-dark)}
.gprev .title:hover{text-decoration:underline}
.gprev.mobile .title{font-size:18px}
.gprev .desc{margin-top:5px;font-size:14px;color:var(--g-desc);line-height:1.45}
[data-theme="dark"] .gprev .desc{color:var(--g-desc-dark)}
.gprev .desc .date{color:#70757a}
.gprev .badges{display:flex;gap:8px;margin-top:5px;font-size:12px;color:#5f6368}
.gprev .badges .badge{padding:2px 7px;border:1px solid #e4e4e4;border-radius:11px}

.score-panel{display:grid;grid-template-columns:140px 1fr;gap:24px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.score-circle{position:relative;width:140px;height:140px}
.score-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-circle .bg{stroke:var(--bg3);stroke-width:11;fill:none}
.score-circle .fg{stroke:var(--accent);stroke-width:11;fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s}
.score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-text .v{font-size:36px;font-weight:900;font-family:var(--mono);color:var(--accent);line-height:1}
.score-text .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:700;text-transform:uppercase}
.score-info h2{font-size:18px;font-weight:800;margin-bottom:5px}
.score-info .sub{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.score-pills{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px;font-weight:700;font-family:var(--mono)}
.score-pills .sp{padding:3px 9px;border-radius:11px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.score-pills .sp.ok{background:rgba(22,163,74,.13);color:var(--success)}
.score-pills .sp.warn{background:rgba(245,158,11,.13);color:var(--warn)}
.score-pills .sp.bad{background:rgba(220,38,38,.13);color:var(--danger)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.check-list{display:flex;flex-direction:column}
.check{padding:9px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:12px}
.check:last-child{border-bottom:none}
.check .ico{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0;margin-top:1px}
.check.pass .ico{background:rgba(22,163,74,.15);color:var(--success)}
.check.warn .ico{background:rgba(245,158,11,.15);color:var(--warn)}
.check.fail .ico{background:rgba(220,38,38,.15);color:var(--danger)}
.check.info .ico{background:rgba(37,99,235,.15);color:var(--blue)}
.check .t{font-weight:700}
.check .d{font-size:11px;color:var(--text2);line-height:1.45;margin-top:2px}

/* Variants */
.var-row{padding:11px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center}
.var-row:last-child{border-bottom:none}
.var-row .vscore{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-family:var(--mono);font-size:13px}
.var-row .vinfo .vt{font-size:13px;font-weight:700}
.var-row .vinfo .vd{font-size:11.5px;color:var(--text2);margin-top:2px;line-height:1.4}
.var-row .vinfo .vm{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:3px}
.var-row .vacts{display:flex;flex-direction:column;gap:4px;text-align:right}
.var-row .vacts button{padding:4px 10px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:10.5px;font-weight:700;cursor:pointer}
.var-row .vacts button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.var-row .vacts button:hover{transform:translateY(-1px)}

/* Batch table */
.batch-row{padding:9px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:42px 1fr auto auto;gap:11px;align-items:center;font-size:12px;cursor:pointer}
.batch-row:hover{background:var(--bg)}
.batch-row .bs{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-family:var(--mono);font-size:13px}
.batch-row .binfo{min-width:0}
.batch-row .binfo .bt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.batch-row .binfo .bu{font-size:10.5px;font-family:var(--mono);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.batch-row .bm{font-family:var(--mono);font-size:11px;text-align:right}
.batch-row .bm .ml{font-size:9px;color:var(--text3);text-transform:uppercase}
.batch-row .bm .mv{font-weight:800}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}

.busy{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:5000}
.busy.show{display:flex}
.busy .card{background:var(--bg2);padding:24px 30px;border-radius:14px;border:1px solid var(--border);text-align:center;max-width:340px}
.busy .sp{width:42px;height:42px;border-radius:50%;border:3px solid var(--bg3);border-top-color:var(--accent);animation:spin .9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:340px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .score-panel{grid-template-columns:1fr}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
    <div><div class="logo-name">Snippet<span>Lab</span></div></div>
    <span class="logo-tag">CTR</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat score">Score: <strong id="stat-score">—</strong></div>
  <div class="hdr-stat ctr">Pred. CTR: <strong id="stat-ctr">—</strong></div>
  <div class="hdr-stat">Title px: <strong id="stat-tpx">0</strong>/580</div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">Dashboard</a>
  <a href="ctr-title-lab.html" class="hdr-link" style="border-color:rgba(124,58,237,.4);color:var(--purple)">CTR Lab</a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">
  <div id="left">
    <div class="lh-bar"><h3>Edit Snippet</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Page Source</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>URL</label><input id="i-url" placeholder="https://yoursite.com/page" oninput="liveUpdate()"></div>
          <div class="row2"><button class="btn-sub" onclick="fetchPage()">Fetch live</button><button class="btn-sub" onclick="syncFromAuditor()">From Page Auditor</button></div>
          <div class="f"><label>Target keyword</label><input id="i-kw" placeholder="emergency plumber denver" oninput="liveUpdate()"></div>
          <div class="f"><label>Brand name</label><input id="i-brand" placeholder="Acme Plumbing" oninput="liveUpdate()"></div>
          <div class="row2"><div class="f"><label>City</label><input id="i-city" oninput="liveUpdate()"></div><div class="f"><label>Position</label><input type="number" id="i-pos" min="1" max="20" value="5" oninput="liveUpdate()"></div></div>
        </div>
      </div>
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Title Tag</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f">

<script>
const STORE_KEY='snip_state_v1';
const defaultState={
  url:'',title:'',desc:'',kw:'',brand:'',city:'',position:5,
  provider:'gemini',apiKeys:{gemini:'',openai:'',claude:'',groq:''},
  variants:[],batchResults:[],view:'preview',device:'desktop',
};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){
  const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',n);
  localStorage.setItem('seohub_theme_v1',n);
  document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';
}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}
function setBusy(s,t,m){const b=document.getElementById('busy');if(t)document.getElementById('busy-title').textContent=t;if(m)document.getElementById('busy-msg').textContent=m;b.classList.toggle('show',s);}
function toggleSec(h){h.parentElement.classList.toggle('collapsed');}

/* Pixel width estimation (approximate Arial 16px-equivalent) */
const CHAR_WIDTHS={
  ' ':4,'!':4,'"':5,'#':9,'$':9,'%':14,'&':11,"'":3,'(':5,')':5,'*':6,'+':9,',':4,'-':5,'.':4,'/':4,
  '0':9,'1':9,'2':9,'3':9,'4':9,'5':9,'6':9,'7':9,'8':9,'9':9,':':4,';':4,'<':9,'=':9,'>':9,'?':9,'@':16,
  'A':11,'B':11,'C':12,'D':12,'E':11,'F':10,'G':13,'H':12,'I':4,'J':8,'K':11,'L':9,'M':14,'N':12,'O':13,
  'P':11,'Q':13,'R':12,'S':11,'T':10,'U':12,'V':11,'W':16,'X':11,'Y':11,'Z':10,'[':4,'\\':4,']':4,'^':7,'_':9,'`':5,
  'a':9,'b':9,'c':8,'d':9,'e':9,'f':4,'g':9,'h':9,'i':4,'j':4,'k':8,'l':4,'m':14,'n':9,'o':9,'p':9,'q':9,'r':5,
  's':8,'t':4,'u':9,'v':8,'w':12,'x':8,'y':8,'z':8,'{':5,'|':4,'}':5,'~':9,
};
function pxWidth(text, scale=1){
  let w=0;
  for(const c of (text||'')){
    if(c.charCodeAt(0)>127){w+=14;continue;} // emoji/unicode approximate
    w += (CHAR_WIDTHS[c]||9)*scale;
  }
  return Math.round(w);
}
const TITLE_MAX_PX=580; // Google desktop
const DESC_MAX_PX=920; // ~158 chars on desktop, mobile ~120

/* Inputs */
function getInputs(){
  state.url=document.getElementById('i-url').value.trim();
  state.title=document.getElementById('i-title').value;
  state.desc=document.getElementById('i-desc').value;
  state.kw=document.getElementById('i-kw').value.trim();
  state.brand=document.getElementById('i-brand').value.trim();
  state.city=document.getElementById('i-city').value.trim();
  state.position=parseInt(document.getElementById('i-pos').value)||5;
  state.provider=document.getElementById('prov-sel').value;
  saveState();
}
function fillInputs(){
  document.getElementById('i-url').value=state.url||'';
  document.getElementById('i-title').value=state.title||'';
  document.getElementById('i-desc').value=state.desc||'';
  document.getElementById('i-kw').value=state.kw||'';
  document.getElementById('i-brand').value=state.brand||'';
  document.getElementById('i-city').value=state.city||'';
  document.getElementById('i-pos').value=state.position;
  document.getElementById('prov-sel').value=state.provider;
  document.getElementById('i-key').value=state.apiKeys[state.provider]||'';
}
function onProvChange(){state.provider=document.getElementById('prov-sel').value;document.getElementById('i-key').value=state.apiKeys[state.provider]||'';saveState();}
function saveKey(){state.apiKeys[state.provider]=document.getElementById('i-key').value.trim();saveState();}

function liveUpdate(){
  getInputs();
  // Update pills + meters
  const t=state.title||'', d=state.desc||'';
  const tpx=pxWidth(t), dpx=pxWidth(d);
  const tlen=t.length, dlen=d.length;
  const tpill=document.getElementById('title-pill');tpill.textContent=`${tlen} / 60 chars`;
  tpill.className='pill '+(tlen>=30&&tlen<=60?'ok':tlen>0?'warn':'');
  const dpill=document.getElementById('desc-pill');dpill.textContent=`${dlen} / 160 chars`;
  dpill.className='pill '+(dlen>=120&&dlen<=160?'ok':dlen>0?'warn':'');
  document.getElementById('title-px').textContent=tpx+'px';
  document.getElementById('desc-px').textContent=dpx+'px';
  const tpct=Math.min(100,tpx/TITLE_MAX_PX*100);
  const dpct=Math.min(100,dpx/DESC_MAX_PX*100);
  const tbar=document.getElementById('title-bar');tbar.style.width=tpct+'%';tbar.style.background=tpx>TITLE_MAX_PX?'var(--danger)':tpx>500?'var(--warn)':'var(--success)';
  const dbar=document.getElementById('desc-bar');dbar.style.width=dpct+'%';dbar.style.background=dpx>DESC_MAX_PX?'var(--danger)':dpx>800?'var(--warn)':'var(--success)';
  document.getElementById('stat-tpx').textContent=tpx;
  const score=scoreSnippet(state);
  document.getElementById('stat-score').textContent=score.score+'/100';
  document.getElementById('stat-ctr').textContent=Math.round(score.predictedCTR*100*10)/10+'%';
  render();
}

/* Scoring */
function scoreSnippet(s){
  const title=s.title||'', desc=s.desc||'';
  const kw=(s.kw||'').toLowerCase();
  const city=(s.city||'').toLowerCase();
  const brand=(s.brand||'').toLowerCase();
  const tlow=title.toLowerCase(), dlow=desc.toLowerCase();
  const checks=[];
  let score=0, maxScore=0;

  // Title length
  const tpx=pxWidth(title);
  const tInRange=title.length>=30&&title.length<=60&&tpx<=TITLE_MAX_PX;
  checks.push({key:'title_length',status:tInRange?'pass':title.length===0?'fail':'warn',weight:12,t:`Title length: ${title.length} chars, ${tpx}px`,d:tInRange?'Optimal length for full display.':title.length>60?'Likely truncated.':title.length<30?'Too short — leaves CTR on the table.':'Borderline length.'});
  maxScore+=12;if(tInRange)score+=12;else if(title.length>0)score+=6;

  // Keyword in title
  const kwInTitle=kw && tlow.includes(kw);
  if(kw){checks.push({key:'kw_title',status:kwInTitle?'pass':'fail',weight:15,t:'Target keyword in title',d:kwInTitle?`"${kw}" found in title.`:`Add "${kw}" to title — biggest ranking + CTR signal.`});maxScore+=15;if(kwInTitle)score+=15;}
  // Keyword at start
  if(kw && kwInTitle){const idx=tlow.indexOf(kw);const earlyKw=idx<20;checks.push({key:'kw_early',status:earlyKw?'pass':'warn',weight:5,t:'Keyword near start of title',d:earlyKw?'Keyword in first 20 chars — strong signal.':`Keyword starts at char ${idx} — move earlier.`});maxScore+=5;if(earlyKw)score+=5;}
  // Brand suffix
  const brandInTitle=brand && tlow.includes(brand);
  if(brand){checks.push({key:'brand_title',status:brandInTitle?'pass':'info',weight:4,t:'Brand in title',d:brandInTitle?'Brand present — good for branded CTR.':'Consider adding "| Brand" suffix for trust.'});maxScore+=4;if(brandInTitle)score+=4;}
  // City
  const cityInTitle=city && tlow.includes(city);
  if(city){checks.push({key:'city_title',status:cityInTitle?'pass':'warn',weight:8,t:'City in title',d:cityInTitle?`"${city}" in title — strong local signal.`:`Add "${city}" to title — critical for local SERPs.`});maxScore+=8;if(cityInTitle)score+=8;}
  // Power words
  const powerWords=['best','top','free','expert','professional','licensed','certified','24/7','same day','emergency','near you','reviews','rated'];
  const hasPower=powerWords.some(w=>tlow.includes(w));
  checks.push({key:'power_title',status:hasPower?'pass':'info',weight:4,t:'Power word in title',d:hasPower?'CTR-boosting phrase found.':'Try: "Best", "Top-rated", "24/7", "Licensed" etc.'});maxScore+=4;if(hasPower)score+=4;
  // Year
  const hasYear=/(20\d{2})/.test(title);
  checks.push({key:'year_title',status:hasYear?'pass':'info',weight:3,t:'Current year in title',d:hasYear?'Year present — signals freshness.':'Consider adding current year (e.g. "2026") for freshness signal.'});maxScore+=3;if(hasYear)score+=3;

  // Description
  const dpx=pxWidth(desc);
  const dInRange=desc.length>=120&&desc.length<=160&&dpx<=DESC_MAX_PX;
  checks.push({key:'desc_length',status:dInRange?'pass':desc.length===0?'fail':'warn',weight:10,t:`Description length: ${desc.length} chars, ${dpx}px`,d:dInRange?'Optimal.':desc.length>160?'May truncate.':desc.length<120?'Too short — leaves CTR on the table.':'Borderline.'});maxScore+=10;if(dInRange)score+=10;else if(desc.length>0)score+=5;
  // Keyword in description
  const kwInDesc=kw && dlow.includes(kw);
  if(kw){checks.push({key:'kw_desc',status:kwInDesc?'pass':'warn',weight:8,t:'Target keyword in description',d:kwInDesc?`"${kw}" in description.`:'Add keyword to description — gets bolded in SERP.'});maxScore+=8;if(kwInDesc)score+=8;}
  // City in desc
  const cityInDesc=city && dlow.includes(city);
  if(city){checks.push({key:'city_desc',status:cityInDesc?'pass':'warn',weight:5,t:'City in description',d:cityInDesc?'Local signal in description.':`Mention "${city}" in description.`});maxScore+=5;if(cityInDesc)score+=5;}
  // CTA
  const ctaWords=['call','book','get','schedule','request','order','shop','learn','discover','find','contact','quote','visit'];
  const hasCTA=ctaWords.some(w=>new RegExp('\\b'+w,'i').test(desc));
  checks.push({key:'cta',status:hasCTA?'pass':'warn',weight:6,t:'Call-to-action in description',d:hasCTA?'CTA verb found.':'Add action verb: "Call", "Book", "Get a free quote"...'});maxScore+=6;if(hasCTA)score+=6;
  // Numbers
  const hasNumbers=/\d/.test(desc);
  checks.push({key:'numbers',status:hasNumbers?'pass':'info',weight:3,t:'Numbers in description',d:hasNumbers?'Numbers increase CTR.':'Try: "Over 500 reviews", "24/7", "Same-day service".'});maxScore+=3;if(hasNumbers)score+=3;
  // Duplicate phrasing (title === start of desc)
  const dupe=title && desc && dlow.startsWith(tlow.slice(0,20));
  if(dupe){checks.push({key:'dup',status:'warn',weight:3,t:'Description duplicates title',d:'Reword the description start.'});maxScore+=3;}
  else if(title&&desc){checks.push({key:'dup',status:'pass',weight:3,t:'Title and description differ',d:'Good — they complement each other.'});maxScore+=3;score+=3;}
  // Pipe / brand structure
  if(title.includes('|') || title.includes(' - ') || title.includes(' – ')){checks.push({key:'structure',status:'pass',weight:2,t:'Title uses separator',d:'Good structural separator found.'});maxScore+=2;score+=2;}

  const finalScore=maxScore?Math.round(score/maxScore*100):0;
  // CTR prediction (multiplier above position baseline)
  const posCTR=[0,0.282,0.157,0.111,0.080,0.060,0.046,0.036,0.029,0.024,0.020][Math.min(10,Math.max(1,s.position||5))]||0.04;
  const snippetMultiplier=0.4+(finalScore/100)*1.2; // 0.4x at score 0 → 1.6x at score 100
  const predictedCTR=posCTR*snippetMultiplier;
  return {score:finalScore, checks, predictedCTR, posCTR, snippetMultiplier};
}

/* Live fetch */
const PROXIES=[u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`];
async function fetchPage(){
  if(!state.url){toast('URL required','err');return;}
  setBusy(true,'Fetching page…',state.url);
  for(const p of PROXIES){
    try{
      const r=await fetch(p(state.url));
      if(r.ok){
        const html=await r.text();
        const doc=new DOMParser().parseFromString(html,'text/html');
        state.title=doc.querySelector('title')?.textContent?.trim()||'';
        state.desc=doc.querySelector('meta[name="description"]')?.content||doc.querySelector('meta[property="og:description"]')?.content||'';
        fillInputs();saveState();liveUpdate();
        setBusy(false);toast('Loaded title + meta','success');
        return;
      }
    }catch(e){}
  }
  setBusy(false);
  toast('Could not fetch (CORS)','err');
}

function syncFromAuditor(){
  try{const o=JSON.parse(localStorage.getItem('pa_state_v1')||'null');
    if(o?.url){
      state.url=o.url;
      if(o.target?.name)state.brand=o.target.name;
      if(o.target?.city)state.city=o.target.city;
      fillInputs();saveState();liveUpdate();
      toast('Imported','success');
    } else toast('No data','err');
  }catch(e){toast('Sync failed','err');}
}

/* AI variations */
async function generateVariants(){
  if(!state.kw){toast('Keyword required for AI generation','err');return;}
  const key=state.apiKeys[state.provider];
  if(!key){
    // Offline fallback
    state.variants=offlineVariants();
    saveState();setTab('variants');toast('Generated 6 offline variations','success');return;
  }
  setBusy(true,'Generating variations…',state.provider);
  const prompt=`Generate 6 high-CTR title + meta description variations for a local SEO landing page.

KEYWORD: ${state.kw}
${state.brand?`BRAND: ${state.brand}\n`:''}${state.city?`CITY: ${state.city}\n`:''}CURRENT TITLE: ${state.title||'(none)'}
CURRENT META: ${state.desc||'(none)'}

REQUIREMENTS:
- Title: 50-60 chars including brand suffix (e.g. "| Brand Name")
- Description: 140-160 chars with CTA verb (Call, Book, Get...)
- Mix: 2 keyword-led, 2 benefit-led, 1 urgency/scarcity, 1 social-proof (reviews/rating)
- Include city naturally in 4 of 6
- Include numbers in at least 3 (years, ratings, reviews count, response time)
- No clickbait, no false claims, no all caps

Return ONLY a JSON array. No prose. No code fences.
[{"title":"...","desc":"...","strategy":"..."}]`;
  try{
    let text=await askAI(prompt,key);
    text=text.replace(/```json\s*|\s*```/g,'').trim();
    const m=text.match(/\[[\s\S]*\]/);
    if(!m)throw new Error('No JSON found');
    const arr=JSON.parse(m[0]);
    state.variants=arr.map((v,i)=>{
      const sc=scoreSnippet({...state,title:v.title,desc:v.desc});
      return {title:v.title, desc:v.desc, strategy:v.strategy||'', score:sc.score, predictedCTR:sc.predictedCTR, id:'v_'+i};
    });
    saveState();setBusy(false);setTab('variants');
    toast(`Generated ${state.variants.length} variations`,'success');
  }catch(e){
    setBusy(false);
    state.variants=offlineVariants();
    saveState();setTab('variants');
    toast('AI failed — using offline templates','err');
  }
}
function offlineVariants(){
  const kw=state.kw||'service', city=state.city||'', brand=state.brand||'';
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const templates=[
    {title:`${cap(kw)} in ${city||'Your Area'}${brand?' | '+brand:''}`, desc:`Looking for ${kw} in ${city||'your area'}? ${brand||'We'} delivers expert service with same-day appointments. Call now for a free quote.`, strategy:'Keyword-led + brand'},
    {title:`Best ${cap(kw)} ${city?'in '+city:'Near You'} — 4.9★ Reviews${brand?' | '+brand:''}`, desc:`Top-rated ${kw} ${city?'in '+city:''}. ${brand||'Local experts'} with 500+ five-star reviews. Book online or call for fast service.`, strategy:'Social proof + benefit'},
    {title:`${cap(kw)} ${city?'in '+city:''} — Same-Day Service${brand?' | '+brand:''}`, desc:`Same-day ${kw} ${city?'in '+city:''}. ${brand||'Licensed pros'} with upfront pricing and 100% satisfaction guarantee. Schedule today.`, strategy:'Urgency + guarantee'},
    {title:`24/7 ${cap(kw)} ${city||'Service'}${brand?' | '+brand:''}`, desc:`24/7 ${kw} ${city?'in '+city:''}. ${brand||'Trusted local team'} responds in under 60 minutes. Call now — no extra fees, ever.`, strategy:'Availability + no surprises'},
    {title:`${city?city+' ':''}${cap(kw)} 2026 — Free Quote${brand?' | '+brand:''}`, desc:`Need ${kw} in ${city||'your area'}? Get a free quote from ${brand||'a licensed local expert'} in minutes. Same-day service available.`, strategy:'Current year + CTA'},
    {title:`Licensed ${cap(kw)} ${city||'Near You'} | ${brand||'Free Quote'}`, desc:`Licensed and insured ${kw} ${city?'in '+city:''}. ${brand||'Local pros'} with 15+ years experience. Get a free quote in under 2 minutes.`, strategy:'Trust signals'},
  ];
  return templates.map((t,i)=>{
    const sc=scoreSnippet({...state,title:t.title,desc:t.desc});
    return {...t, score:sc.score, predictedCTR:sc.predictedCTR, id:'v_'+i};
  });
}
async function askAI(prompt,key){
  if(state.provider==='gemini'){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.8}})});
    if(!r.ok) throw new Error('Gemini '+r.status);
    const j=await r.json();return j.candidates?.[0]?.content?.parts?.[0]?.text||'';
  }
  if(state.provider==='openai'){
    const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:prompt}],temperature:0.8})});
    if(!r.ok) throw new Error('OpenAI '+r.status);
    const j=await r.json();return j.choices?.[0]?.message?.content||'';
  }
  if(state.provider==='claude'){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1500,messages:[{role:'user',content:prompt}]})});
    if(!r.ok) throw new Error('Claude '+r.status);
    const j=await r.json();return j.content?.[0]?.text||'';
  }
  if(state.provider==='groq'){
    const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:prompt}],temperature:0.8})});
    if(!r.ok) throw new Error('Groq '+r.status);
    const j=await r.json();return j.choices?.[0]?.message?.content||'';
  }
}

/* Batch */
async function runBatch(){
  const urls=document.getElementById('i-batch').value.split('\n').map(u=>u.trim()).filter(Boolean);
  if(!urls.length){toast('No URLs','err');return;}
  setBusy(true,'Batch processing…',`0/${urls.length}`);
  const results=[];
  for(let i=0;i<urls.length;i++){
    const url=urls[i];
    setBusy(true,'Batch processing…',`${i+1}/${urls.length}: ${url.substring(0,40)}`);
    let title='', desc='';
    for(const p of PROXIES){
      try{const r=await fetch(p(url));if(r.ok){const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');title=doc.querySelector('title')?.textContent?.trim()||'';desc=doc.querySelector('meta[name="description"]')?.content||'';break;}}catch(e){}
    }
    const sc=scoreSnippet({...state, title, desc});
    results.push({url, title, desc, score:sc.score, predictedCTR:sc.predictedCTR, tlen:title.length, dlen:desc.length, tpx:pxWidth(title), dpx:pxWidth(desc)});
    await new Promise(r=>setTimeout(r,200));
  }
  state.batchResults=results;
  saveState();setBusy(false);setTab('batch');
  toast(`Processed ${results.length} URLs`,'success');
}

function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function render(){
  if(state.view==='preview') return renderPreview();
  if(state.view==='checks') return renderChecks();
  if(state.view==='variants') return renderVariants();
  if(state.view==='batch') return renderBatch();
  if(state.view==='guide') return renderGuide();
}

function renderPreview(){
  const s=scoreSnippet(state);
  const col=s.score>=80?'#16a34a':s.score>=60?'#d97706':'#dc2626';
  const dash=2*Math.PI*60, off=dash*(1-s.score/100);
  document.getElementById('cbody').innerHTML=`
    <div class="serp-prev">
      <div class="serp-prev-hdr"><h3>Google SERP Preview</h3><div class="serp-toggle"><button class="${state.device==='desktop'?'active':''}" onclick="setDevice('desktop')">Desktop</button><button class="${state.device==='mobile'?'active':''}" onclick="setDevice('mobile')">Mobile</button></div></div>
      <div class="gprev ${state.device==='mobile'?'mobile':''}" id="serp-prev">
        <div class="favicon-row">
          <div class="favicon">${(state.brand||state.url||'?').charAt(0).toUpperCase()}</div>
          <div>
            <div class="site-name">${escapeHtml(state.brand||domainOf(state.url)||'Your Site')}</div>
            <div class="site-url">${escapeHtml(formatUrlBreadcrumb(state.url))}</div>
          </div>
        </div>
        <div class="title">${renderTitleWithKw(state.title||'Your Page Title Goes Here', state.kw)}</div>
        <div class="desc"><span class="date">May 29, 2026 — </span>${renderDescWithKw(state.desc||'Your meta description appears here. Add a clear value prop, target keyword, location, and call-to-action.', state.kw)}</div>
        ${state.position<=3?'<div class="badges"><span class="badge">⭐ Reviews</span><span class="badge">📍 Map</span></div>':''}
      </div>
    </div>
    <div class="score-panel">
      <div class="score-circle">
        <svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" class="bg"/><circle cx="70" cy="70" r="60" class="fg" style="stroke:${col};stroke-dasharray:${dash};stroke-dashoffset:${off}"/></svg>
        <div class="score-text"><div class="v" style="color:${col}">${s.score}</div><div class="l">/ 100</div></div>
      </div>
      <div class="score-info">
        <h2>Snippet Optimization Score</h2>
        <div class="sub">Predicted CTR at position #${state.position}: <strong style="color:var(--success)">${(s.predictedCTR*100).toFixed(2)}%</strong> (${s.snippetMultiplier.toFixed(2)}× baseline of ${(s.posCTR*100).toFixed(2)}%)</div>
        <div class="score-pills">
          <span class="sp ok">✓ ${s.checks.filter(c=>c.status==='pass').length} pass</span>
          <span class="sp warn">⚠ ${s.checks.filter(c=>c.status==='warn').length} warn</span>
          <span class="sp bad">✗ ${s.checks.filter(c=>c.status==='fail').length} fail</span>
          <span class="sp">Title ${state.title.length}ch · ${pxWidth(state.title)}px</span>
          <span class="sp">Desc ${state.desc.length}ch · ${pxWidth(state.desc)}px</span>
        </div>
      </div>
    </div>
    <div class="section"><div class="section-hdr"><h3>Top Issues</h3></div><div class="check-list">
      ${s.checks.filter(c=>c.status!=='pass').slice(0,6).map(c=>`<div class="check ${c.status}"><div class="ico">${c.status==='warn'?'!':c.status==='fail'?'✗':'i'}</div><div><div class="t">${escapeHtml(c.t)}</div><div class="d">${escapeHtml(c.d)}</div></div></div>`).join('')||'<div style="padding:24px;text-align:center;color:var(--success);font-weight:700">✓ All checks pass — well optimized!</div>'}
    </div></div>
  `;
}

function setDevice(d){state.device=d;saveState();render();}
function domainOf(url){try{return new URL(url).hostname.replace(/^www\./,'');}catch(e){return '';}}
function formatUrlBreadcrumb(url){try{const u=new URL(url);const parts=u.pathname.split('/').filter(Boolean);return u.hostname.replace(/^www\./,'') + (parts.length?' › '+parts.join(' › '):'');}catch(e){return url||'yoursite.com';}}
function renderTitleWithKw(t,kw){if(!kw)return escapeHtml(t);const re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return escapeHtml(t).replace(re,'<b>$1</b>');}
function renderDescWithKw(d,kw){if(!kw)return escapeHtml(d);const re=new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return escapeHtml(d).replace(re,'<b>$1</b>');}

function renderChecks(){
  const s=scoreSnippet(state);
  document.getElementById('cbody').innerHTML=`
    <div class="section"><div class="section-hdr"><h3>All Optimization Checks (${s.checks.length})</h3></div><div class="check-list">
      ${s.checks.map(c=>`<div class="check ${c.status}"><div class="ico">${c.status==='pass'?'✓':c.status==='warn'?'!':c.status==='fail'?'✗':'i'}</div><div><div class="t">${escapeHtml(c.t)}</div><div class="d">${escapeHtml(c.d)}</div></div></div>`).join('')}
    </div></div>
  `;
}

function renderVariants(){
  const variants=state.variants||[];
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>AI Variations (${variants.length})</h3></div><div>
    ${variants.length?variants.map(v=>{
      const cls=v.score>=80?'var(--success)':v.score>=60?'var(--warn)':'var(--danger)';
      return `<div class="var-row">
        <div class="vscore" style="background:${cls}">${v.score}</div>
        <div class="vinfo"><div class="vt">${escapeHtml(v.title)}</div><div class="vd">${escapeHtml(v.desc)}</div><div class="vm">${v.title.length}ch title · ${v.desc.length}ch desc · ${(v.predictedCTR*100).toFixed(2)}% CTR · ${escapeHtml(v.strategy||'')}</div></div>
        <div class="vacts"><button class="primary" onclick="useVariant('${v.id}')">Use this</button><button onclick="copyVariant('${v.id}')">Copy</button></div>
      </div>`;
    }).join(''):'<div style="padding:40px;text-align:center;color:var(--text3)">Click ✨ Generate Variations in left panel</div>'}
  </div></div>`;
}
function useVariant(id){const v=state.variants.find(x=>x.id===id);if(!v)return;state.title=v.title;state.desc=v.desc;saveState();fillInputs();liveUpdate();setTab('preview');toast('Applied','success');}
function copyVariant(id){const v=state.variants.find(x=>x.id===id);if(!v)return;navigator.clipboard.writeText(`Title: ${v.title}\n\nMeta: ${v.desc}`);toast('Copied','success');}

function renderBatch(){
  const rows=state.batchResults||[];
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Batch Results (${rows.length})</h3></div><div>
    ${rows.length?rows.sort((a,b)=>a.score-b.score).map(r=>{
      const cls=r.score>=80?'var(--success)':r.score>=60?'var(--warn)':'var(--danger)';
      return `<div class="batch-row" onclick="loadFromBatch('${escapeAttr(r.url)}')">
        <div class="bs" style="background:${cls}">${r.score}</div>
        <div class="binfo"><div class="bt">${escapeHtml(r.title||'(no title)')}</div><div class="bu">${escapeHtml(r.url)}</div></div>
        <div class="bm"><div class="ml">Title</div><div class="mv">${r.tlen}ch / ${r.tpx}px</div></div>
        <div class="bm"><div class="ml">Desc</div><div class="mv">${r.dlen}ch / ${r.dpx}px</div></div>
      </div>`;
    }).join(''):'<div style="padding:40px;text-align:center;color:var(--text3)">Paste URLs in left panel → Process Batch</div>'}
  </div></div>`;
}
function loadFromBatch(url){
  const r=state.batchResults.find(x=>x.url===url);if(!r)return;
  state.url=r.url;state.title=r.title;state.desc=r.desc;
  saveState();fillInputs();liveUpdate();setTab('preview');
  toast('Loaded — edit and re-score','success');
}

function renderGuide(){
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>SERP Snippet CTR Playbook</h3></div><div style="padding:18px;font-size:13px;line-height:1.7;color:var(--text2)">
    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700">Title Tag Rules</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li><strong>50-60 chars</strong> (~580px) — Google truncates with "..." beyond this</li>
      <li><strong>Target keyword near start</strong> — first 20 chars carry the most ranking weight</li>

      <li><strong>City for local</strong> — non-negotiable for local SEO ranking + CTR</li>
      <li><strong>Power words</strong> — Best, Top, Free, Expert, 24/7, Same-Day all boost CTR 5-15%</li>
      <li><strong>Avoid all-caps</strong> — looks spammy, hurts CTR</li>
    </ul>
    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Meta Description Rules</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li><strong>120-160 chars</strong> (~920px desktop, ~600px mobile)</li>
      <li><strong>Keyword in description</strong> — gets bolded by Google, ~30% CTR boost</li>
      <li><strong>Action verb / CTA</strong> — Call, Book, Get, Schedule, Request</li>
      <li><strong>Numbers</strong> — "500+ reviews", "24/7", "Free quote in 2 minutes"</li>
      <li><strong>Trust signals</strong> — "Licensed", "Insured", "Family-owned since 1985"</li>
      <li><strong>Don't duplicate title</strong> — complement, don't repeat</li>
    </ul>
    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Position-Based CTR Baseline (2026 averages)</h4>
    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;font-family:var(--mono)"><thead><tr><th style="text-align:left;padding:6px;border-bottom:1px solid var(--border);color:var(--text2)">Position</th><th style="text-align:right;padding:6px;border-bottom:1px solid var(--border);color:var(--text2)">Avg CTR</th></tr></thead><tbody>
      <tr><td style="padding:5px 6px">#1</td><td style="text-align:right;padding:5px 6px;font-weight:700">28.2%</td></tr>
      <tr><td style="padding:5px 6px">#2</td><td style="text-align:right;padding:5px 6px;font-weight:700">15.7%</td></tr>
      <tr><td style="padding:5px 6px">#3</td><td style="text-align:right;padding:5px 6px;font-weight:700">11.1%</td></tr>
      <tr><td style="padding:5px 6px">#4</td><td style="text-align:right;padding:5px 6px;font-weight:700">8.0%</td></tr>
      <tr><td style="padding:5px 6px">#5</td><td style="text-align:right;padding:5px 6px;font-weight:700">6.0%</td></tr>
      <tr><td style="padding:5px 6px">#6-10</td><td style="text-align:right;padding:5px 6px">2-4.6%</td></tr>
    </tbody></table>
    <p style="margin-top:8px;color:var(--text3);font-size:12px">A great snippet can lift CTR 1.4-1.6x baseline. A poor snippet drops it 30-50%.</p>
    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Local SEO Specifics</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li>City + service is the single biggest local CTR driver</li>
      <li>"Near you" / "Near me" matches voice search intent</li>
      <li>Specific service area mentions ("Serving Denver + 50mi radius")</li>
      <li>If you have a 4+ star rating, include it: "★4.9 — 500+ reviews"</li>
      <li>Phone in description for click-to-call mobile boost</li>
    </ul>
  </div></div>`;
}

function exportCSV(){
  const rows=[['type','value']];
  rows.push(['url',state.url]);
  rows.push(['title',state.title]);
  rows.push(['desc',state.desc]);
  rows.push(['score',scoreSnippet(state).score]);
  (state.variants||[]).forEach((v,i)=>{
    rows.push([`variant_${i+1}_title`,v.title]);
    rows.push([`variant_${i+1}_desc`,v.desc]);
    rows.push([`variant_${i+1}_score`,v.score]);
  });
  (state.batchResults||[]).forEach(r=>{
    rows.push(['batch_'+r.url,`${r.score} - "${r.title}" - "${r.desc}"`]);
  });
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='snippet-optimizer.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('CSV exported','success');
}
function reset(){if(!confirm('Reset all?'))return;state=clone(defaultState);saveState();fillInputs();liveUpdate();toast('Reset','success');}

/* Inherit */
(function(){
  try{
    if(!state.brand||!state.city){const cf=JSON.parse(localStorage.getItem('cf_state_v1')||'null');const b=cf?.businesses?.[0];if(b){if(!state.brand)state.brand=b.name||'';if(!state.city)state.city=b.city||'';if(!state.url&&b.website)state.url=b.website;}}
    if(!state.kw){const kw=JSON.parse(localStorage.getItem('kw_state_v1')||'null');if(kw?.keywords?.length){const sel=kw.keywords.find(k=>k.selected);if(sel)state.kw=sel.kw;else if(kw.keywords[0])state.kw=kw.keywords[0].kw;}}
    ['ai_state_v1','geo_state_v1','sg_state_v1','aiw_state_v1','cc_state_v1'].forEach(k=>{
      const o=JSON.parse(localStorage.getItem(k)||'null');
      if(o?.apiKeys)Object.entries(o.apiKeys).forEach(([id,v])=>{if(v&&!state.apiKeys[id])state.apiKeys[id]=v;});
      if(o?.ai?.keys)Object.entries(o.ai.keys).forEach(([id,k2])=>{if(k2?.key&&!state.apiKeys[id])state.apiKeys[id]=k2.key;});
    });
  }catch(e){}
  saveState();
})();

fillInputs();
liveUpdate();
window.addEventListener('beforeunload',saveState);
</script>
<script src="global-nav.js"></script>
