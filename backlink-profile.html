<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Backlink Profile - Local-Relevance Backlink Analysis</title>
<meta name="description" content="Analyze your domain's backlink profile with local SEO lens. Bing Webmaster Tools API + Moz Free + manual CSV import. Anchor text distribution, local-relevance scoring (anchors with city/service terms), toxic link detection, competitor comparison. 100% client-side.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root {
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#7c3aed; --accent-h:#6d28d9; --accent-soft:rgba(124,58,237,.08);
  --teal:#0d9488;
  --amber:#d97706;
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#a78bfa; --accent-h:#c4b5fd; --accent-soft:rgba(167,139,250,.14);
  --teal:#14b8a6;
  --amber:#f59e0b;
  --danger:#ef4444; --success:#22c55e;
  --purple:#a78bfa; --pink:#ec4899; --blue:#3b82f6;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(124,58,237,.3)}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--pink);border:1px solid var(--pink);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.total strong{color:var(--accent)}
.hdr-stat.local strong{color:var(--success)}
.hdr-stat.toxic strong{color:var(--danger)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none;transition:all .15s}
.hdr-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hdr-link svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

#app{flex:1;display:flex;overflow:hidden}

/* LEFT */
#left{width:300px;min-width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:6px}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;flex:1}

#left-body{flex:1;overflow-y:auto;padding:14px}

.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}

.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}
.f .hint a{color:var(--accent)}

.pp-row{display:flex;flex-wrap:wrap;gap:4px}
.pp{padding:5px 9px;border-radius:5px;font-size:10px;font-family:var(--mono);font-weight:700;background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer}
.pp:hover{border-color:var(--accent);color:var(--accent)}
.pp.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pp .free{font-size:9px;background:rgba(255,255,255,.25);padding:1px 4px;border-radius:3px;margin-left:4px}
.pp:not(.active) .free{background:rgba(22,163,74,.13);color:var(--success)}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

/* CENTER */
#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab svg{width:13px;height:13px}
.tab .count{font-family:var(--mono);background:rgba(255,255,255,.25);border-radius:3px;padding:0 5px;font-size:10px}
.tab:not(.active) .count{background:var(--bg);color:var(--text2)}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
.cb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

#cbody{flex:1;overflow-y:auto;background:var(--bg);padding:14px}

.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 15px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.scard.ok::before{background:var(--success)}
.scard.warn::before{background:var(--amber)}
.scard.bad::before{background:var(--danger)}
.scard-label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.scard-val{font-size:26px;font-weight:800;color:var(--text);margin-top:4px;font-family:var(--mono);line-height:1.1}
.scard.ok .scard-val{color:var(--success)}
.scard.warn .scard-val{color:var(--amber)}
.scard.bad .scard-val{color:var(--danger)}
.scard-sub{font-size:10.5px;color:var(--text3);margin-top:3px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

table.btable{width:100%;border-collapse:collapse;font-size:11.5px}
table.btable thead{background:var(--bg);position:sticky;top:0;z-index:5}
table.btable th{padding:8px 10px;text-align:left;font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
table.btable th.center{text-align:center}
table.btable th:hover{color:var(--accent)}
table.btable td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
table.btable td.center{text-align:center}
table.btable tr:last-child td{border-bottom:none}
table.btable tr:hover{background:var(--bg3)}
.domain{font-weight:600;color:var(--text);font-size:12px}
.domain a{color:inherit;text-decoration:none}
.domain a:hover{color:var(--accent);text-decoration:underline}
.url{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:1px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url a{color:inherit;text-decoration:none}
.anchor{font-family:var(--mono);font-size:11px;color:var(--text);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.relevance{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-weight:700;font-size:11px}
.relevance.high{color:var(--success)}
.relevance.med{color:var(--blue)}
.relevance.low{color:var(--text3)}
.toxic-pill{display:inline-block;font-family:var(--mono);font-weight:700;font-size:10px;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px}
.toxic-pill.high{background:rgba(220,38,38,.13);color:var(--danger)}
.toxic-pill.med{background:rgba(217,119,6,.13);color:var(--amber)}
.toxic-pill.low{background:rgba(22,163,74,.13);color:var(--success)}
.da-pill{display:inline-block;font-family:var(--mono);font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:4px;color:#fff;min-width:32px;text-align:center}
.da-pill.da90{background:#059669}.da-pill.da70{background:#10b981}.da-pill.da50{background:#3b82f6}.da-pill.da30{background:#8b5cf6}.da-pill.da10{background:#94a3b8}.da-pill.un{background:var(--bg3);color:var(--text3)}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--bg3);color:var(--text2);margin-right:3px}

.chart-wrap{position:relative;height:280px}

/* FILTERS */
#fbar{padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap}
#fsearch{flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:7px 11px;font-size:12px;color:var(--text)}
.fpill{padding:5px 10px;border-radius:5px;font-size:10.5px;font-family:var(--mono);font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer}
.fpill:hover{border-color:var(--accent);color:var(--accent)}
.fpill.active{background:var(--accent);border-color:var(--accent);color:#fff}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

.progress-line{height:3px;background:var(--bg3);overflow:hidden;flex-shrink:0}
.progress-line .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--pink));width:0;transition:width .3s}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-item{display:flex;align-items:center;gap:5px}
.ft-item svg{width:12px;height:12px}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
#toast.info{border-color:var(--accent);color:var(--accent)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:300px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </div>
    <div><div class="logo-name">Backlink<span>Profile</span></div></div>
    <span class="logo-tag">LOCAL</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat total"><strong id="stat-total">0</strong> backlinks</div>
  <div class="hdr-stat local"><strong id="stat-local">0</strong> local-relevant</div>
  <div class="hdr-stat toxic"><strong id="stat-toxic">0</strong> toxic</div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </a>
  <a href="competitor-gap.html" class="hdr-link" style="border-color:rgba(124,58,237,.4);color:var(--purple)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="7" r="4"/><path d="M3 19a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2H3z"/></svg>
    Comp Gap
  </a>
  <a href="ai-assistant.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
    AI
  </a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">

  <!-- LEFT -->
  <div id="left">
    <div class="lh-bar"><h3>Target & Sources</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Target Business</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Target domain *</label><input id="t-domain" placeholder="acmeplumbing.com" oninput="saveInputs()"></div>
          <div class="f"><label>Brand name</label><input id="t-name" placeholder="Acme Plumbing" oninput="saveInputs()"></div>
          <div class="f"><label>Target city (for relevance scoring)</label><input id="t-city" placeholder="Boston" oninput="saveInputs()"></div>
          <div class="f"><label>Primary service</label><input id="t-service" placeholder="plumber" oninput="saveInputs()"></div>
          <button class="btn-sub" onclick="syncFromCitations()">↻ Sync from Citation Finder</button>
        </div>
      </div>
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Data Source</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="pp-row" id="src-pills">
            <button class="pp active" data-src="csv">CSV Upload<span class="free">free</span></button>
            <button class="pp" data-src="moz">Moz API<span class="free">100/mo</span></button>
            <button class="pp" data-src="bing">Bing Webmaster<span class="free">need verify</span></button>
            <button class="pp" data-src="serp">SERP scrape (link:)<span class="free">limited</span></button>
          </div>
          <div id="src-cfg"></div>
        </div>
      </div>
      <div class="fsec collapsed">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Toxic Signals</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <label style="display:flex;align-items:center;gap:6px;font-size:11px"><input type="checkbox" id="tx-pbn" checked> Detect PBN patterns</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:11px"><input type="checkbox" id="tx-spammy-tlds" checked> Flag spammy TLDs</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:11px"><input type="checkbox" id="tx-low-da" checked> Flag DA &lt; 10</label>
          <label style="display:flex;align-items:center;gap:6px;font-size:11px"><input type="checkbox" id="tx-overuse" checked> Flag anchor over-optimization</label>

<script>
/* ==========================================================================
 * LOCAL BACKLINK PROFILE
 * Multi-source backlink analysis with local relevance + toxic detection
 * ========================================================================== */

/* ---------- DATA SOURCES ---------- */
const SOURCES = {
  csv: {label:'CSV Upload', fields:[], note:'Upload a CSV from any tool (Ahrefs, Semrush, Moz, Google Search Console, etc.). Columns auto-detected from common header names.'},
  moz: {
    label:'Moz API',
    fields:[{key:'token', label:'Moz Access Token', type:'password'}],
    note:'Sign up at <a href="https://moz.com/api" target="_blank" rel="noopener">moz.com/api</a> (Free tier: 1k queries/mo). Uses Links API.',
    async load(domain, keys){
      // Moz Links API v3 endpoint
      const res = await fetch('https://lsapi.seomoz.com/v2/links', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${keys.token}`},
        body: JSON.stringify({target: domain, target_scope:'page', limit:50, sort:'page_authority'})
      });
      if(!res.ok) throw new Error('Moz '+res.status+': '+(await res.text()).slice(0,150));
      const j = await res.json();
      return (j.results||[]).map(r=>({
        sourceDomain: r.source?.root_domain || r.source?.page||'',
        sourceUrl: r.source?.page||'',
        targetUrl: r.target?.page||'',
        anchor: r.anchor_text || '(no anchor)',
        da: r.source?.domain_authority || null,
        pa: r.source?.page_authority || null,
        nofollow: r.nofollow || false,
        firstSeen: r.first_seen||'',
      }));
    }
  },
  bing: {
    label:'Bing Webmaster',
    fields:[{key:'key', label:'API Key', type:'password'}, {key:'siteUrl', label:'Verified Site URL', type:'text', placeholder:'https://yoursite.com'}],
    note:'Requires <a href="https://www.bing.com/webmasters" target="_blank" rel="noopener">Bing Webmaster</a> account with verified ownership. Get API key in Settings > API access.',
    async load(domain, keys){
      const url = `https://ssl.bing.com/webmaster/api.svc/json/GetLinkCounts?siteUrl=${encodeURIComponent(keys.siteUrl)}&apikey=${encodeURIComponent(keys.key)}&page=0`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('Bing '+res.status);
      const j = await res.json();
      // Bing returns aggregated link counts; for individual links, use GetUrlLinks
      const linksUrl = `https://ssl.bing.com/webmaster/api.svc/json/GetUrlLinks?siteUrl=${encodeURIComponent(keys.siteUrl)}&apikey=${encodeURIComponent(keys.key)}&link=&page=0`;
      const linksRes = await fetch(linksUrl);
      if(!linksRes.ok) return [];
      const linksJ = await linksRes.json();
      return (linksJ.d||[]).map(r=>({
        sourceDomain: r.Url ? new URL(r.Url).hostname.replace(/^www\./,'') : '',
        sourceUrl: r.Url||'',
        targetUrl: keys.siteUrl,
        anchor: r.AnchorText||'(no anchor)',
        da: null, pa: null, nofollow: false,
      }));
    }
  },
  serp: {
    label:'SERP scrape',
    fields:[{key:'provider', label:'SERP Provider', type:'select', options:[{value:'serper',label:'Serper'},{value:'serpapi',label:'SerpAPI'}]}, {key:'key', label:'API Key', type:'password'}],
    note:'Uses Google\'s deprecated <code>link:</code> operator (limited results). For better data, use Moz API or CSV import.',
    async load(domain, keys){
      const q = `link:${domain} -site:${domain}`;
      let results = [];
      if(keys.provider==='serper'){
        const res = await fetch('https://google.serper.dev/search', {method:'POST', headers:{'X-API-KEY':keys.key,'Content-Type':'application/json'}, body:JSON.stringify({q, num:30})});
        const j = await res.json();
        results = j.organic||[];
      } else {
        const res = await fetch(`https://serpapi.com/search.json?engine=google&q=${encodeURIComponent(q)}&num=30&api_key=${encodeURIComponent(keys.key)}`);
        const j = await res.json();
        results = j.organic_results||[];
      }
      return results.map(r=>{
        let host = ''; try { host = new URL(r.link).hostname.replace(/^www\./,''); } catch(e){}
        return {
          sourceDomain: host, sourceUrl: r.link||'',
          targetUrl: '', anchor: r.title || '(unknown)',
          da: null, pa: null, nofollow: false,
        };
      });
    }
  },
};

/* ---------- STATE ---------- */
const STORE_KEY = 'bl_state_v1';
const defaultState = {
  target: {domain:'', name:'', city:'', service:''},
  source: 'csv',
  keys: {},
  toxicCfg: {pbn:true, spammyTlds:true, lowDa:true, overuse:true, foreign:true},
  backlinks: [], // {sourceDomain, sourceUrl, targetUrl, anchor, da, pa, nofollow, relevance, toxic, toxicReasons}
  view: 'dashboard',
  filter: {rel:'all'},
};
let state = loadState();
function loadState(){ try { return Object.assign(clone(defaultState), JSON.parse(localStorage.getItem(STORE_KEY))||{}); } catch(e){ return clone(defaultState); } }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ toast('Storage full — export your data','err'); } }
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- THEME ---------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('seohub_theme_v1', next);
  document.getElementById('theme-label').textContent = next==='dark'?'Dark':'Light';
}
document.getElementById('theme-label').textContent = (document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

/* ---------- UTILS ---------- */
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(msg,type){const t=document.getElementById('toast');t.className='';t.classList.add('show');if(type)t.classList.add(type);t.innerHTML='<span>'+escapeHtml(msg)+'</span>';setTimeout(()=>t.classList.remove('show'),2500);}
function toggleSec(hdr){hdr.parentElement.classList.toggle('collapsed');}
function domainOf(s){try{ if(!s) return ''; if(!/^https?:\/\//.test(s)) s='http://'+s; return new URL(s).hostname.replace(/^www\./,''); }catch(e){return s||'';}}
function daClass(da){if(da===null||da===undefined) return 'un'; return da>=90?'da90':da>=70?'da70':da>=50?'da50':da>=30?'da30':'da10';}

/* ---------- INPUTS ---------- */
function saveInputs(){
  state.target.domain = document.getElementById('t-domain').value.trim();
  state.target.name = document.getElementById('t-name').value.trim();
  state.target.city = document.getElementById('t-city').value.trim();
  state.target.service = document.getElementById('t-service').value.trim();
  saveState();
}
function fillInputs(){
  document.getElementById('t-domain').value = state.target.domain||'';
  document.getElementById('t-name').value = state.target.name||'';
  document.getElementById('t-city').value = state.target.city||'';
  document.getElementById('t-service').value = state.target.service||'';
  // toxic config
  document.getElementById('tx-pbn').checked = state.toxicCfg.pbn;
  document.getElementById('tx-spammy-tlds').checked = state.toxicCfg.spammyTlds;
  document.getElementById('tx-low-da').checked = state.toxicCfg.lowDa;
  document.getElementById('tx-overuse').checked = state.toxicCfg.overuse;
  document.getElementById('tx-foreign').checked = state.toxicCfg.foreign;
  // src pills
  document.querySelectorAll('#src-pills .pp').forEach(b=>{
    b.classList.toggle('active', b.dataset.src===state.source);
    b.onclick = ()=>{state.source = b.dataset.src; document.querySelectorAll('#src-pills .pp').forEach(x=>x.classList.toggle('active', x===b)); renderSrcCfg(); saveState();};
  });
  renderSrcCfg();
}

function renderSrcCfg(){
  const src = SOURCES[state.source]; if(!src) return;
  const wrap = document.getElementById('src-cfg');
  const keys = state.keys[state.source]||{};
  wrap.innerHTML = src.fields.map(f=>{
    if(f.type==='select'){
      return `<div class="f"><label>${escapeHtml(f.label)}</label><select id="src-${f.key}" onchange="saveKey()">${f.options.map(o=>`<option value="${o.value}" ${keys[f.key]===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select></div>`;
    }
    return `<div class="f"><label>${escapeHtml(f.label)}</label><input type="${f.type}" id="src-${f.key}" value="${escapeAttr(keys[f.key]||'')}" placeholder="${escapeAttr(f.placeholder||'')}" oninput="saveKey()"></div>`;
  }).join('') + `<div class="f"><div class="hint">${src.note}</div></div>`;
  if(state.source==='csv'){
    wrap.innerHTML += `<button class="btn-sub" onclick="uploadCSV()">📄 Upload CSV file</button>`;
  }
}
function saveKey(){
  const src = SOURCES[state.source];
  const keys = state.keys[state.source]||{};
  src.fields.forEach(f=>{keys[f.key] = document.getElementById('src-'+f.key).value.trim();});
  state.keys[state.source] = keys; saveState();
}

function syncFromCitations(){
  try {
    const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
    const b = cf?.businesses?.[0];
    if(!b){ toast('No business in Citation Finder','err'); return; }
    state.target.name = b.name||state.target.name;
    state.target.city = b.city||state.target.city;
    state.target.domain = domainOf(b.website)||state.target.domain;
    state.target.service = b.category||state.target.service;
    saveState(); fillInputs();
    toast(`Loaded "${b.name}"`,'success');
  } catch(e){ toast('Failed','err'); }
}

/* ---------- LOAD DATA ---------- */
async function loadData(){
  saveInputs();
  if(!state.target.domain){ toast('Set target domain first','err'); return; }
  if(state.source==='csv'){
    uploadCSV();
    return;
  }
  const src = SOURCES[state.source]; const keys = state.keys[state.source]||{};
  if(!src.fields.every(f=>keys[f.key])){ toast('Fill in required API fields','err'); return; }
  document.getElementById('ft-status').textContent = `Loading from ${src.label}...`;
  document.getElementById('prog-fill').style.width = '20%';
  try {
    const links = await src.load(state.target.domain, keys);
    state.backlinks = links;
    document.getElementById('prog-fill').style.width = '70%';
    analyzeAll();
    document.getElementById('prog-fill').style.width = '100%';
    setTimeout(()=>document.getElementById('prog-fill').style.width = '0', 600);
    toast(`Loaded ${links.length} backlinks`,'success');
  } catch(e){
    toast('Load failed: '+e.message,'err');
    document.getElementById('ft-status').textContent = 'Failed';
  }
}

function uploadCSV(){
  const input = document.createElement('input'); input.type='file'; input.accept='.csv';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try {
        const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){ toast('CSV needs header + rows','err'); return; }
        const header = parseCSVLine(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,'_'));
        const idx = (...names)=>{for(const n of names){const i=header.indexOf(n); if(i>=0) return i;} return -1;};
        const i_url = idx('source_url','referring_page','source_page','url_from','source','url');
        const i_dom = idx('source_domain','referring_domain','domain','ref_domain','root_domain');
        const i_anc = idx('anchor','anchor_text','anchortext');
        const i_da = idx('da','domain_authority','dr','domain_rating','ud');
        const i_pa = idx('pa','page_authority','ur','url_rating');
        const i_nf = idx('nofollow','no_follow','rel');
        const i_target = idx('target_url','destination','target','url_to');
        const i_first = idx('first_seen','firstseen','first_indexed','date');
        let added=0;
        for(let i=1;i<lines.length;i++){
          const c = parseCSVLine(lines[i]);
          const url = i_url>=0?c[i_url]:'';
          let dom = i_dom>=0?c[i_dom]:'';
          if(!dom && url){ try { dom = new URL(url.startsWith('http')?url:'http://'+url).hostname.replace(/^www\./,''); } catch(e){} }
          if(!dom && !url) continue;
          const nf = i_nf>=0 ? /nofollow|true|yes/i.test(c[i_nf]||'') : false;
          state.backlinks.push({
            sourceDomain: dom||'',
            sourceUrl: url||'',
            targetUrl: i_target>=0?c[i_target]||'':'',
            anchor: i_anc>=0?c[i_anc]||'(no anchor)':'(no anchor)',
            da: i_da>=0 && c[i_da]?parseFloat(c[i_da]):null,
            pa: i_pa>=0 && c[i_pa]?parseFloat(c[i_pa]):null,
            nofollow: nf,
            firstSeen: i_first>=0?c[i_first]||'':'',
          });
          added++;
        }
        analyzeAll();
        toast(`Imported ${added} backlinks`,'success');
      } catch(err){ toast('Bad CSV: '+err.message,'err'); }
    };
    r.readAsText(f);
  };
  input.click();
}
function parseCSVLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){ if(c==='"' && line[i+1]==='"'){cur+='"';i++;} else if(c==='"'){inQ=false;} else cur+=c; }
    else { if(c===','){out.push(cur);cur='';} else if(c==='"' && !cur){inQ=true;} else cur+=c; }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}

/* ---------- ANALYSIS ---------- */
function analyzeAll(){
  const t = state.target;
  const tName = norm(t.name);
  const tCity = norm(t.city);
  const tService = norm(t.service);
  const tDom = (t.domain||'').toLowerCase();

  // Count anchor frequencies for over-optimization detection
  const anchorCounts = {};
  state.backlinks.forEach(b=>{const a = norm(b.anchor); anchorCounts[a] = (anchorCounts[a]||0)+1;});
  const total = state.backlinks.length;
  const exactMatch = `${tService} ${tCity}`.trim();

  state.backlinks.forEach(b=>{
    const anchor = norm(b.anchor);
    const dom = (b.sourceDomain||'').toLowerCase();

    // ----- Relevance scoring -----
    let relScore = 0;
    let relCategory = 'generic';
    let relTags = [];
    if(tName && anchor.includes(tName)){ relScore += 30; relTags.push('branded'); relCategory='branded'; }
    if(tCity && anchor.includes(tCity)){ relScore += 35; relTags.push('city'); }
    if(tService && anchor.includes(tService)){ relScore += 25; relTags.push('service'); }
    if(tDom && dom.includes(tCity)){ relScore += 15; relTags.push('local-domain'); }
    // local TLDs / signals
    const localTlds = ['.local','.boston.','.nyc.','.london.','.ca','.co.uk'];
    if(localTlds.some(t=>dom.endsWith(t))){ relScore += 10; relTags.push('local-tld'); }
    // Directory sources are local-relevant
    const localDirs = ['yelp.com','yellowpages.com','bbb.org','foursquare.com','citysearch.com','manta.com','superpages.com','tripadvisor.com','angi.com','thumbtack.com','homeadvisor.com','houzz.com','justdial.com','sulekha.com','yell.com','truelocal.com.au'];
    if(localDirs.some(d=>dom.includes(d))){ relScore += 20; relTags.push('directory'); }
    if(tCity && anchor.length>5 && (anchor.includes(tCity) || anchor.includes(`${tService} ${tCity}`))) relCategory = 'local';
    else if(relTags.includes('branded')) relCategory = 'branded';
    else relCategory = 'generic';
    b.relevance = Math.min(100, relScore);
    b.relevanceLevel = relScore>=50?'high':relScore>=20?'med':'low';
    b.relCategory = relCategory;
    b.relTags = relTags;

    // ----- Toxic scoring -----
    let toxicScore = 0;
    let toxicReasons = [];
    const cfg = state.toxicCfg;
    // 1. Spammy TLDs
    if(cfg.spammyTlds){
      const spammyTlds = ['.xyz','.top','.click','.bid','.win','.review','.download','.party','.gdn','.icu','.work','.loan','.science','.cricket','.racing','.faith','.date','.trade'];
      if(spammyTlds.some(t=>dom.endsWith(t))){ toxicScore += 25; toxicReasons.push('spammy TLD'); }
    }
    // 2. Low DA
    if(cfg.lowDa && b.da!==null && b.da<10){ toxicScore += 20; toxicReasons.push(`DA ${b.da} < 10`); }
    // 3. PBN patterns
    if(cfg.pbn){
      if(/^[a-z0-9]{10,}\./.test(dom) || dom.split('.')[0].length > 25){ toxicScore += 15; toxicReasons.push('random subdomain'); }
      if(/-\d+$/.test(dom.split('.')[0]) || /\d{4,}/.test(dom.split('.')[0])){ toxicScore += 12; toxicReasons.push('numeric domain'); }
      if(/free|cheap|gambling|casino|payday|loan|pharma|viagra|crypto|forex|bitcoin/.test(dom)){ toxicScore += 30; toxicReasons.push('spammy keywords in domain'); }
    }
    // 4. Anchor over-optimization
    if(cfg.overuse){
      const exactCount = anchorCounts[anchor] || 0;
      if(tName && anchor === norm(tName) && exactCount/total < 0.3){ /* branded ok */ }
      else if(exactCount/total > 0.15 && total > 10){ toxicScore += 18; toxicReasons.push(`exact-match anchor used ${exactCount}× (${Math.round(exactCount/total*100)}% of total)`); }
      if(anchor === norm(exactMatch) && exactCount > 3){ toxicScore += 15; toxicReasons.push('exact-match commercial anchor pattern'); }
    }
    // 5. Foreign-language irrelevance
    if(cfg.foreign){
      // very rough: anchor mostly non-ASCII chars
      const nonAscii = (b.anchor||'').match(/[^\x00-\x7F]/g)||[];
      if(nonAscii.length / Math.max(1,(b.anchor||'').length) > 0.5){ toxicScore += 10; toxicReasons.push('foreign-language anchor'); }
    }
    b.toxic = Math.min(100, toxicScore);
    b.toxicLevel = toxicScore>=40?'high':toxicScore>=20?'med':'low';
    b.toxicReasons = toxicReasons;
  });
  saveState(); renderAll();
}

function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim();}

function clearAll(){
  if(!confirm('Clear all backlinks?')) return;
  state.backlinks = []; saveState(); renderAll();
  toast('Cleared','success');
}

/* ---------- TABS / FILTERS ---------- */
function setTab(t){state.view=t; saveState(); document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t)); document.getElementById('fbar').style.display = t==='all'?'':'none'; renderCenter();}
function setF(k,v){state.filter[k]=v; saveState(); document.querySelectorAll(`[data-${k}]`).forEach(b=>b.classList.toggle('active', b.dataset[k]===v)); renderAllTab();}

/* ---------- RENDER ---------- */
function renderAll(){
  const total = state.backlinks.length;
  const local = state.backlinks.filter(b=>b.relevanceLevel==='high' || b.relCategory==='local').length;
  const toxic = state.backlinks.filter(b=>b.toxicLevel==='high').length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-local').textContent = local;
  document.getElementById('stat-toxic').textContent = toxic;
  document.getElementById('tc-all').textContent = total;
  document.getElementById('tc-local').textContent = local;
  document.getElementById('tc-toxic').textContent = toxic;
  document.getElementById('ft-status').textContent = total?`Loaded ${total} backlinks`:'Ready';
  renderCenter();
}

let charts = [];
function destroyCharts(){charts.forEach(c=>c.destroy());charts=[];}

function renderCenter(){
  destroyCharts();
  if(!state.backlinks.length){
    document.getElementById('cbody').innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><div><div class="et">Local Backlink Profile</div><div class="ed">Analyze your backlinks with a local-SEO lens. Identifies which links carry city/service relevance, flags PBN/spam patterns, and scores anchor distribution. Import from any backlink tool's CSV export, or connect Moz/Bing Webmaster API.</div></div></div>`;
    return;
  }
  if(state.view==='dashboard') return renderDashboard();
  if(state.view==='all') return renderAllTab();
  if(state.view==='anchors') return renderAnchors();
  if(state.view==='local') return renderLocal();
  if(state.view==='toxic') return renderToxic();
}

function renderDashboard(){
  const bl = state.backlinks;
  const total = bl.length;
  const uniqueDomains = new Set(bl.map(b=>b.sourceDomain)).size;
  const nofollow = bl.filter(b=>b.nofollow).length;
  const localScore = total?Math.round(bl.filter(b=>b.relevanceLevel==='high'||b.relCategory==='local').length / total * 100):0;
  const toxicCount = bl.filter(b=>b.toxicLevel==='high').length;
  const avgDa = (()=>{const arr=bl.filter(b=>b.da!==null).map(b=>b.da); return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):null;})();
  document.getElementById('cbody').innerHTML = `
    <div class="summary">
      <div class="scard"><div class="scard-label">Total Backlinks</div><div class="scard-val">${total}</div><div class="scard-sub">${uniqueDomains} unique domains</div></div>
      <div class="scard ${localScore>=40?'ok':localScore>=20?'warn':'bad'}"><div class="scard-label">Local Relevance</div><div class="scard-val">${localScore}%</div><div class="scard-sub">${bl.filter(b=>b.relCategory==='local').length} local-flagged</div></div>
      <div class="scard ${toxicCount===0?'ok':toxicCount<=3?'warn':'bad'}"><div class="scard-label">Toxic Links</div><div class="scard-val">${toxicCount}</div><div class="scard-sub">${total?Math.round(toxicCount/total*100):0}% of total</div></div>
      <div class="scard"><div class="scard-label">Avg DA</div><div class="scard-val">${avgDa===null?'—':avgDa}</div><div class="scard-sub">${bl.filter(b=>b.da!==null).length} with DA data</div></div>
      <div class="scard"><div class="scard-label">Nofollow</div><div class="scard-val">${nofollow}</div><div class="scard-sub">${total?Math.round(nofollow/total*100):0}%</div></div>
      <div class="scard ${bl.filter(b=>b.relCategory==='branded').length/total>=.4?'ok':'warn'}"><div class="scard-label">Branded Anchors</div><div class="scard-val">${bl.filter(b=>b.relCategory==='branded').length}</div><div class="scard-sub">healthy: 40-60%</div></div>
    </div>
    <div class="section"><div class="section-hdr"><h3>Anchor Distribution</h3></div><div style="padding:14px"><div class="chart-wrap"><canvas id="ch-anchor"></canvas></div></div></div>
    <div class="section"><div class="section-hdr"><h3>DA Distribution</h3></div><div style="padding:14px"><div class="chart-wrap"><canvas id="ch-da"></canvas></div></div></div>
    <div class="section"><div class="section-hdr"><h3>Top Local-Relevant Backlinks</h3><span class="badge">${bl.filter(b=>b.relevanceLevel==='high').length}</span></div><div style="padding:0">
      <table class="btable"><thead><tr><th>Domain</th><th>Anchor</th><th class="center">Relevance</th><th class="center">DA</th></tr></thead><tbody>
      ${bl.filter(b=>b.relevanceLevel==='high').sort((a,b)=>b.relevance-a.relevance).slice(0,10).map(b=>`<tr><td><div class="domain"><a href="${escapeAttr(b.sourceUrl||'#')}" target="_blank" rel="noopener">${escapeHtml(b.sourceDomain)}</a></div></td><td><div class="anchor">${escapeHtml(b.anchor)}</div></td><td class="center"><span class="relevance high">${b.relevance}</span></td><td class="center"><span class="da-pill ${daClass(b.da)}">${b.da!==null?b.da:'—'}</span></td></tr>`).join('') || '<tr><td colspan="4" style="padding:30px;text-align:center;color:var(--text3)">No high-relevance links found yet.</td></tr>'}
      </tbody></table>
    </div></div>
  `;
  setTimeout(()=>buildDashCharts(), 50);
}

function buildDashCharts(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  Chart.defaults.color = isDark?'#7e95b8':'#5b6b88';
  Chart.defaults.borderColor = isDark?'#1e2d44':'#d1d9e8';
  Chart.defaults.font.family = 'Inter, sans-serif';
  const cats = {branded:0, local:0, generic:0};
  state.backlinks.forEach(b=>{cats[b.relCategory] = (cats[b.relCategory]||0)+1;});
  const ctx = document.getElementById('ch-anchor')?.getContext('2d');
  if(ctx) charts.push(new Chart(ctx, {type:'doughnut', data:{labels:['Branded','Local-relevant','Generic'], datasets:[{data:[cats.branded, cats.local, cats.generic], backgroundColor:['#2563eb','#16a34a','#94a3b8']}]}, options:{plugins:{legend:{position:'bottom'}}}}));
  // DA dist
  const buckets = {'0-9':0,'10-29':0,'30-49':0,'50-69':0,'70-89':0,'90-100':0,'unknown':0};
  state.backlinks.forEach(b=>{ if(b.da===null) buckets.unknown++; else if(b.da<10) buckets['0-9']++; else if(b.da<30) buckets['10-29']++; else if(b.da<50) buckets['30-49']++; else if(b.da<70) buckets['50-69']++; else if(b.da<90) buckets['70-89']++; else buckets['90-100']++; });
  const ctx2 = document.getElementById('ch-da')?.getContext('2d');
  if(ctx2) charts.push(new Chart(ctx2, {type:'bar', data:{labels:Object.keys(buckets), datasets:[{data:Object.values(buckets), backgroundColor:['#dc2626','#94a3b8','#8b5cf6','#3b82f6','#10b981','#059669','#e2e8f0']}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}}}}));
}

function renderAllTab(){
  let bl = state.backlinks.slice();
  const q = (document.getElementById('fsearch')?.value || '').toLowerCase().trim();
  if(q) bl = bl.filter(b=>(b.sourceDomain+' '+b.anchor+' '+b.sourceUrl).toLowerCase().includes(q));
  if(state.filter.rel!=='all') bl = bl.filter(b=>b.relCategory===state.filter.rel);
  bl.sort((a,b)=>(b.da||0)-(a.da||0));
  document.getElementById('cbody').innerHTML = `
    <div class="section"><div class="section-hdr"><h3>All Backlinks</h3><span class="badge">${bl.length}</span></div><div style="padding:0;overflow-x:auto">
      <table class="btable"><thead><tr><th>Domain</th><th>Anchor</th><th class="center">Category</th><th class="center">Relevance</th><th class="center">DA</th><th class="center">Toxic</th><th>Tags</th></tr></thead><tbody>
      ${bl.map(b=>`<tr>
        <td><div class="domain"><a href="${escapeAttr(b.sourceUrl||'#')}" target="_blank" rel="noopener">${escapeHtml(b.sourceDomain||'(no domain)')}</a></div><div class="url">${escapeHtml((b.sourceUrl||'').slice(0,60))}</div></td>
        <td><div class="anchor" title="${escapeAttr(b.anchor)}">${escapeHtml(b.anchor)}</div></td>
        <td class="center"><span class="tag">${b.relCategory}</span></td>
        <td class="center"><span class="relevance ${b.relevanceLevel}">${b.relevance}</span></td>
        <td class="center"><span class="da-pill ${daClass(b.da)}">${b.da!==null?b.da:'—'}</span></td>
        <td class="center"><span class="toxic-pill ${b.toxicLevel}">${b.toxic}</span></td>
        <td>${b.relTags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}${b.nofollow?'<span class="tag">nofollow</span>':''}</td>
      </tr>`).join('') || '<tr><td colspan="7" style="padding:30px;text-align:center;color:var(--text3)">No backlinks match filter.</td></tr>'}
      </tbody></table>
    </div></div>
  `;
}

function renderAnchors(){
  const counts = {};
  state.backlinks.forEach(b=>{const a = b.anchor||'(empty)'; counts[a] = (counts[a]||0)+1;});
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,50);
  const total = state.backlinks.length;
  document.getElementById('cbody').innerHTML = `
    <div class="section"><div class="section-hdr"><h3>Top 50 Anchors</h3><span class="badge">${Object.keys(counts).length} unique</span></div><div style="padding:0">
      <table class="btable"><thead><tr><th>Anchor</th><th class="center">Count</th><th class="center">% of total</th><th class="center">Risk</th></tr></thead><tbody>
      ${sorted.map(([anchor, count])=>{
        const pct = Math.round(count/total*100);
        const risk = pct>15?'high':pct>5?'med':'low';
        return `<tr><td><div class="anchor" style="max-width:400px">${escapeHtml(anchor)}</div></td><td class="center" style="font-family:var(--mono);font-weight:700">${count}</td><td class="center" style="font-family:var(--mono)">${pct}%</td><td class="center"><span class="toxic-pill ${risk}">${risk.toUpperCase()}</span></td></tr>`;
      }).join('')}
      </tbody></table>
    </div></div>
  `;
}

function renderLocal(){
  const local = state.backlinks.filter(b=>b.relevanceLevel==='high'||b.relCategory==='local').sort((a,b)=>b.relevance-a.relevance);
  document.getElementById('cbody').innerHTML = `
    <div class="section"><div class="section-hdr"><h3>Local-Relevant Backlinks</h3><span class="badge">${local.length}</span></div><div style="padding:0">
      ${local.length ? `<table class="btable"><thead><tr><th>Domain</th><th>Anchor</th><th>Tags</th><th class="center">Relevance</th><th class="center">DA</th></tr></thead><tbody>${local.map(b=>`<tr><td><div class="domain"><a href="${escapeAttr(b.sourceUrl||'#')}" target="_blank" rel="noopener">${escapeHtml(b.sourceDomain)}</a></div><div class="url">${escapeHtml((b.sourceUrl||'').slice(0,60))}</div></td><td><div class="anchor">${escapeHtml(b.anchor)}</div></td><td>${b.relTags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</td><td class="center"><span class="relevance high">${b.relevance}</span></td><td class="center"><span class="da-pill ${daClass(b.da)}">${b.da!==null?b.da:'—'}</span></td></tr>`).join('')}</tbody></table>`:'<div style="padding:30px;text-align:center;color:var(--text3)">No high-relevance backlinks detected. Set target city + service to enable scoring.</div>'}
    </div></div>
  `;
}

function renderToxic(){
  const toxic = state.backlinks.filter(b=>b.toxicLevel==='high'||b.toxicLevel==='med').sort((a,b)=>b.toxic-a.toxic);
  document.getElementById('cbody').innerHTML = `
    <div class="section"><div class="section-hdr"><h3>Suspected Toxic Backlinks</h3><span class="badge">${toxic.length}</span></div><div style="padding:0">
      ${toxic.length?`<table class="btable"><thead><tr><th>Domain</th><th>Anchor</th><th>Reasons</th><th class="center">Toxic Score</th><th class="center">DA</th></tr></thead><tbody>${toxic.map(b=>`<tr><td><div class="domain">${escapeHtml(b.sourceDomain)}</div></td><td><div class="anchor">${escapeHtml(b.anchor)}</div></td><td style="font-size:11px;color:var(--text2)">${b.toxicReasons.map(r=>`<span class="tag" style="background:rgba(220,38,38,.13);color:var(--danger)">${escapeHtml(r)}</span>`).join('')}</td><td class="center"><span class="toxic-pill ${b.toxicLevel}">${b.toxic}</span></td><td class="center"><span class="da-pill ${daClass(b.da)}">${b.da!==null?b.da:'—'}</span></td></tr>`).join('')}</tbody></table>`:'<div style="padding:30px;text-align:center;color:var(--success)">🛡 No suspected toxic backlinks.</div>'}
    </div></div>
    <div class="section"><div class="section-hdr"><h3>Disavow File Preview</h3></div><div style="padding:14px"><pre style="background:var(--bg);color:var(--text);padding:12px;border-radius:6px;font-family:var(--mono);font-size:11.5px;line-height:1.55;max-height:300px;overflow:auto">${escapeHtml(buildDisavow())}</pre><div style="margin-top:8px;font-size:11px;color:var(--text2);line-height:1.55"><strong>How to use:</strong> Download via the button on the left. Upload to <a href="https://search.google.com/search-console/disavow-links" target="_blank" rel="noopener" style="color:var(--accent)">Google Search Console Disavow Tool</a>. Use cautiously — only disavow links you're confident are toxic. Google penalties for over-disavowing are rare but possible.</div></div></div>
  `;
}

function buildDisavow(){
  const toxic = state.backlinks.filter(b=>b.toxicLevel==='high');
  const domains = new Set(toxic.map(b=>b.sourceDomain).filter(Boolean));
  let out = `# Disavow file for ${state.target.domain||'your domain'}\n# Generated by Local Backlink Profile on ${new Date().toLocaleDateString()}\n# Review carefully before submitting\n\n`;
  domains.forEach(d=>{ out += `domain:${d}\n`; });
  return out;
}

/* ---------- EXPORTS ---------- */
function exportCSV(){
  if(!state.backlinks.length){ toast('No data','err'); return; }
  const rows = [['source_domain','source_url','target_url','anchor','da','pa','nofollow','rel_category','rel_score','toxic_score','toxic_reasons']];
  state.backlinks.forEach(b=>rows.push([b.sourceDomain, b.sourceUrl, b.targetUrl, b.anchor, b.da||'', b.pa||'', b.nofollow?'yes':'no', b.relCategory, b.relevance, b.toxic, (b.toxicReasons||[]).join('|')]));
  const blob = new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`backlinks-${(state.target.domain||'analysis').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.csv`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Exported','success');
}

function exportDisavow(){
  const text = buildDisavow();
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`disavow-${(state.target.domain||'domain').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.txt`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Disavow exported','success');
}

/* ---------- BOOT ---------- */
fillInputs();
renderAll();
window.addEventListener('beforeunload', saveState);
</script>
<script src="global-nav.js"></script>
</body>
