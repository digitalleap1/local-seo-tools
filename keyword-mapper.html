<html lang="en">
<head>

<meta name="description" content="Map your keywords to specific URLs across your site. Detect keyword cannibalization (multiple URLs ranking for same query), identify orphan keywords (no page targeting), and visualize keyword-to-URL relationships at scale.">

<script>

  const saved = localStorage.getItem('seohub_theme_v1');

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#ea580c; --accent-h:#c2410c; --accent-soft:rgba(234,88,12,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#fb923c; --accent-h:#fdba74; --accent-soft:rgba(251,146,60,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--amber));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.kws strong{color:var(--accent)}
.hdr-stat.mapped strong{color:var(--success)}
.hdr-stat.cann strong{color:var(--danger);font-size:14px}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:340px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}
.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f textarea{resize:vertical;min-height:60px;font-family:var(--font)}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.s::before{background:var(--success)}.kpi.w::before{background:var(--warn)}.kpi.d::before{background:var(--danger)}
.kpi .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:900;font-family:var(--mono);color:var(--text);line-height:1.05}
.kpi.s .v{color:var(--success)}.kpi.w .v{color:var(--warn)}.kpi.d .v{color:var(--danger)}
.kpi .s{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

.km-row{padding:11px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 2fr auto auto;gap:12px;align-items:center;font-size:12px}
.km-row:last-child{border-bottom:none}
.km-row .kw{font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:8px}
.km-row .kw .intent{font-size:9px;font-family:var(--mono);font-weight:800;padding:2px 6px;border-radius:3px;background:var(--bg3);color:var(--text2);text-transform:uppercase}
.km-row .kw .intent.commercial{background:rgba(22,163,74,.13);color:var(--success)}
.km-row .kw .intent.transactional{background:rgba(220,38,38,.13);color:var(--danger)}
.km-row .kw .intent.informational{background:rgba(37,99,235,.13);color:var(--blue)}
.km-row .kw .intent.local{background:rgba(234,88,12,.13);color:var(--accent)}
.km-row .url-sel{display:flex;align-items:center;gap:6px}
.km-row .url-sel input{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:11px;color:var(--text);font-family:var(--mono);width:100%;min-width:0}
.km-row .url-sel input:focus{border-color:var(--accent);outline:none}
.km-row .url-sel .cann{color:var(--danger);font-weight:900;font-size:14px}
.km-row .meta{font-family:var(--mono);font-size:10.5px;color:var(--text3);text-align:right;min-width:60px}
.km-row .meta strong{display:block;color:var(--text);font-size:11.5px;font-weight:800}
.km-row.cann{background:rgba(220,38,38,.04);border-left:3px solid var(--danger)}
.km-row.unmapped{background:rgba(245,158,11,.04);border-left:3px solid var(--warn)}

.cann-group{padding:14px;border-bottom:1px solid var(--border)}
.cann-group:last-child{border-bottom:none}
.cann-group .kw-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cann-group .kw-title .badge-cann{padding:3px 9px;background:rgba(220,38,38,.13);color:var(--danger);border-radius:11px;font-size:10px;font-family:var(--mono);font-weight:800}
.cann-group .urls{display:flex;flex-direction:column;gap:5px}
.cann-group .url-item{padding:7px 11px;background:var(--bg);border-radius:6px;display:grid;grid-template-columns:1fr auto;gap:8px;font-size:11.5px;align-items:center;font-family:var(--mono)}
.cann-group .url-item .target{padding:2px 8px;background:var(--accent);color:#fff;border-radius:3px;font-size:9px;font-weight:800;text-transform:uppercase}
.cann-group .url-item.competing{border-left:3px solid var(--danger)}
.cann-group .resolve{margin-top:9px;padding:10px 12px;background:rgba(22,163,74,.05);border-left:3px solid var(--success);border-radius:5px;font-size:11.5px;color:var(--text2);line-height:1.5}

.cluster-card{padding:14px;border-bottom:1px solid var(--border)}
.cluster-card:last-child{border-bottom:none}
.cluster-card .header{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.cluster-card .pillar{font-size:13.5px;font-weight:800;flex:1}
.cluster-card .cluster-count{font-size:10.5px;font-family:var(--mono);color:var(--text3);font-weight:700}
.cluster-card .kws{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cluster-card .kw-pill{font-size:10.5px;font-family:var(--mono);padding:3px 9px;background:var(--bg);border:1px solid var(--border);border-radius:11px;color:var(--text2)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:340px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .km-row{grid-template-columns:1fr}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>

<script>
const STORE_KEY='km_state_v1';
const defaultState={
  keywords:'', urls:'', city:'',
  map:{}, // kw -> {primary:url, secondary:[url], volume, intent, difficulty}
  view:'overview'
};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}
function toggleSec(h){h.parentElement.classList.toggle('collapsed');}

function fillInputs(){
  document.getElementById('i-kws').value=state.keywords||'';
  document.getElementById('i-urls').value=state.urls||'';
  document.getElementById('i-city').value=state.city||'';
}

function getKeywordList(){return (state.keywords||'').split('\n').map(k=>k.trim()).filter(Boolean);}
function getUrlList(){return (state.urls||'').split('\n').map(u=>u.trim()).filter(Boolean);}

function classifyIntent(kw){
  const k=kw.toLowerCase();
  if(/^(buy|purchase|order|hire|book|appoint|schedule|call|find|contact)/.test(k) || /\bnear me\b|\bnear you\b/.test(k)) return 'local';
  if(/\b(buy|price|cost|discount|deal|cheap|best)\b/.test(k)) return 'commercial';
  if(/\b(how to|what is|why|when|where|guide|tips|tutorial)\b/.test(k)) return 'informational';
  if(/\b(hire|contact|call|appointment|book)\b/.test(k)) return 'transactional';
  return 'commercial';
}

function syncFromKwResearch(){
  try{const kw=JSON.parse(localStorage.getItem('kw_state_v1')||'null');
    if(!kw?.keywords?.length){toast('No keyword data','err');return;}
    state.keywords=kw.keywords.slice(0,100).map(k=>k.kw).join('\n');
    fillInputs();saveState();toast(`Loaded ${kw.keywords.length} keywords`,'success');
  }catch(e){toast('Failed','err');}
}
function syncFromCrawler(){
  try{const sc=JSON.parse(localStorage.getItem('sc_state_v1')||'null');
    if(!sc?.pages||!Object.keys(sc.pages).length){toast('No crawl data','err');return;}

/* AUTO-MAPPING */
function autoMap(){
  state.keywords=document.getElementById('i-kws').value;
  state.urls=document.getElementById('i-urls').value;
  state.city=document.getElementById('i-city').value.trim();
  saveState();
  const kws=getKeywordList();
  const urls=getUrlList();
  if(!kws.length||!urls.length){toast('Need both keywords and URLs','err');return;}
  const map={};
  kws.forEach(kw=>{
    const existing=state.map[kw];
    // Score each URL for relevance
    const scored=urls.map(u=>({url:u, score:scoreMatch(kw, u, state.city)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    const primary=scored[0]?.url || '';
    const secondary=scored.slice(1, 3).filter(x=>x.score>=scored[0].score*0.7).map(x=>x.url);
    map[kw]={primary, secondary, intent:classifyIntent(kw), volume:existing?.volume||0, difficulty:existing?.difficulty||0, manualOverride:existing?.manualOverride};
    // Preserve manual overrides
    if(existing?.manualOverride && existing?.primary) map[kw].primary=existing.primary;
  });
  state.map=map;
  saveState();render();
  toast(`Mapped ${kws.length} keywords`,'success');
}

function scoreMatch(kw, url, city){
  const kwLow=kw.toLowerCase();
  const urlLow=url.toLowerCase();
  // Path tokenization
  let path='';try{path=new URL(url).pathname;}catch(e){path=url;}
  const slug=path.replace(/[\-_/]/g,' ').toLowerCase();
  const tokens=kwLow.split(/\s+/).filter(t=>t.length>2);
  let score=0;
  tokens.forEach(t=>{
    if(slug.includes(t)) score+=20;
    else if(urlLow.includes(t)) score+=10;
  });
  // City match bonus
  if(city && slug.includes(city.toLowerCase())) score+=15;
  // Exact phrase
  if(slug.includes(kwLow.replace(/\s+/g,'-'))) score+=30;
  if(slug.includes(kwLow.replace(/\s+/g,''))) score+=20;
  // Home page penalty
  if(path==='/' || path==='') score-=10;
  return score;
}

function setMapping(kw, primary){
  if(!state.map[kw]) state.map[kw]={intent:classifyIntent(kw), secondary:[]};
  state.map[kw].primary=primary;
  state.map[kw].manualOverride=true;
  saveState();render();
}

function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function render(){
  const kws=getKeywordList();
  const mapped=Object.values(state.map).filter(m=>m.primary).length;
  const cannGroups=getCannibalGroups();
  document.getElementById('stat-kws').textContent=kws.length;
  document.getElementById('stat-mapped').textContent=mapped;
  document.getElementById('stat-cann').textContent=cannGroups.length;
  if(state.view==='overview') return renderOverview(kws, mapped, cannGroups);
  if(state.view==='mapping') return renderMapping(kws);
  if(state.view==='cannibal') return renderCannibal(cannGroups);
  if(state.view==='orphans') return renderOrphans(kws);
  if(state.view==='clusters') return renderClusters(kws);
  if(state.view==='guide') return renderGuide();
}

function getCannibalGroups(){
  // Group keywords by primary URL
  const byUrl={};
  Object.entries(state.map).forEach(([kw,m])=>{
    if(!m.primary)return;
    if(!byUrl[m.primary])byUrl[m.primary]=[];
    byUrl[m.primary].push({kw, intent:m.intent});
  });
  // A URL with multiple distinct keywords isn't cannibalization — that's targeting
  // Real cannibalization = ONE keyword has MULTIPLE pages (primary + secondary)
  const cann=[];
  Object.entries(state.map).forEach(([kw,m])=>{
    if(m.primary && m.secondary?.length){
      cann.push({kw, primary:m.primary, competing:m.secondary});
    }
  });
  return cann;
}

function getOrphanKeywords(){
  const kws=getKeywordList();
  return kws.filter(k=>!state.map[k]?.primary);
}

  Object.values(state.map).forEach(m=>{if(m.intent)byIntent[m.intent]=(byIntent[m.intent]||0)+1;});
  document.getElementById('cbody').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="l">Keywords</div><div class="v">${kws.length}</div><div class="s">in scope</div></div>
      <div class="kpi s"><div class="l">Mapped</div><div class="v">${mapped}</div><div class="s">${kws.length?Math.round(mapped/kws.length*100):0}% coverage</div></div>

      <div class="kpi w"><div class="l">Orphan KWs</div><div class="v">${orphans.length}</div><div class="s">no URL targets</div></div>

    </div>
    <div class="section"><div class="section-hdr"><h3>Intent Distribution</h3></div><div style="padding:14px">
      ${Object.entries(byIntent).filter(([_,n])=>n>0).map(([k,n])=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><span style="padding:3px 9px;border-radius:4px;font-size:10px;font-family:var(--mono);font-weight:800;background:${k==='local'?'rgba(234,88,12,.13)':k==='commercial'?'rgba(22,163,74,.13)':k==='informational'?'rgba(37,99,235,.13)':'rgba(220,38,38,.13)'};color:${k==='local'?'var(--accent)':k==='commercial'?'var(--success)':k==='informational'?'var(--blue)':'var(--danger)'};text-transform:uppercase">${k}</span><div style="flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden"><div style="height:100%;background:${k==='local'?'var(--accent)':k==='commercial'?'var(--success)':k==='informational'?'var(--blue)':'var(--danger)'};width:${kws.length?n/kws.length*100:0}%"></div></div><span style="font-family:var(--mono);font-weight:700;color:var(--text2);min-width:30px;text-align:right">${n}</span></div>`).join('')||'<div style="color:var(--text3);text-align:center;padding:20px">Run auto-map to classify intent</div>'}
    </div></div>
    ${cannGroups.length?`<div class="section"><div class="section-hdr"><h3>🚨 Cannibalization Detected</h3><button class="cb-btn" onclick="setTab('cannibal')">See all →</button></div><div>${cannGroups.slice(0,5).map(c=>`<div class="cann-group"><div class="kw-title">"${escapeHtml(c.kw)}" <span class="badge-cann">${1+c.competing.length} URLs</span></div></div>`).join('')}</div></div>`:''}
  `;
}

function renderMapping(kws){
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Keyword → URL Mapping</h3><span class="badge">${kws.length} keywords</span></div><div>
    ${kws.map(kw=>{
      const m=state.map[kw]||{intent:classifyIntent(kw)};
      const hasCann=m.secondary?.length>0;
      const isOrphan=!m.primary;
      return `<div class="km-row ${hasCann?'cann':''} ${isOrphan?'unmapped':''}">
        <div class="kw">${escapeHtml(kw)}<span class="intent ${m.intent}">${m.intent}</span></div>
        <div class="url-sel"><input value="${escapeAttr(m.primary||'')}" placeholder="No URL targeting this — set a primary URL" onchange="setMapping('${escapeAttr(kw)}', this.value)">${hasCann?`<span class="cann" title="Cannibalization: ${m.secondary.length} other URL${m.secondary.length>1?'s':''}">⚠</span>`:''}</div>
        <div class="meta"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">Status</div><strong style="color:${isOrphan?'var(--warn)':hasCann?'var(--danger)':'var(--success)'}">${isOrphan?'Orphan':hasCann?'Cann':'OK'}</strong></div>
        <div class="meta"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">Match</div><strong>${m.manualOverride?'Manual':'Auto'}</strong></div>
      </div>`;

  </div></div>`;
}

function renderCannibal(cannGroups){
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Cannibalizing Keywords (${cannGroups.length})</h3></div><div>
    ${cannGroups.length?cannGroups.map(c=>`<div class="cann-group">
      <div class="kw-title">"${escapeHtml(c.kw)}" <span class="badge-cann">${1+c.competing.length} URLs competing</span></div>
      <div class="urls">
        <div class="url-item"><span>${escapeHtml(c.primary)}</span><span class="target">TARGET</span></div>
        ${c.competing.map(u=>`<div class="url-item competing"><span>${escapeHtml(u)}</span><span style="font-size:9px;color:var(--danger);font-family:var(--mono);font-weight:800">COMPETING</span></div>`).join('')}
      </div>
      <div class="resolve"><strong>Resolution:</strong> Keep "${escapeHtml(c.primary)}" as the canonical target for "${escapeHtml(c.kw)}". For the competing pages, either: (1) merge content into the target page and 301-redirect them, (2) re-optimize them around different keywords, or (3) add canonical tags pointing to the target.</div>
    </div>`).join(''):'<div style="padding:40px;text-align:center;color:var(--success);font-weight:700">✓ No cannibalization detected</div>'}
  </div></div>`;
}

function renderOrphans(kws){
  const orphans=getOrphanKeywords();
  const urls=getUrlList();
  const urlsTargeted=new Set(Object.values(state.map).filter(m=>m.primary).map(m=>m.primary));
  const urlsUntargeted=urls.filter(u=>!urlsTargeted.has(u));
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Orphan Keywords (${orphans.length})</h3><span class="badge">No page targeting</span></div><div>
    ${orphans.length?orphans.map(kw=>{const intent=classifyIntent(kw);return `<div class="km-row unmapped">
      <div class="kw">${escapeHtml(kw)}<span class="intent ${intent}">${intent}</span></div>
      <div class="url-sel"><input placeholder="Suggest URL or create new page" onchange="setMapping('${escapeAttr(kw)}', this.value)"></div>
      <div></div>
      <div></div>
    </div>`;}).join(''):'<div style="padding:40px;text-align:center;color:var(--success);font-weight:700">✓ All keywords mapped</div>'}
  </div></div>
  ${urlsUntargeted.length?`<div class="section"><div class="section-hdr"><h3>URLs Without Target Keywords (${urlsUntargeted.length})</h3></div><div>
    ${urlsUntargeted.map(u=>`<div style="padding:10px 14px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(u)}</div>`).join('')}
  </div></div>`:''}`;
}

function renderClusters(kws){
  // Simple clustering by shared words (3+ chars)
  const seedMap={};
  kws.forEach(kw=>{
    const words=kw.toLowerCase().split(/\s+/).filter(w=>w.length>3 && !['near','best','top','your','services','service'].includes(w));
    words.forEach(w=>{if(!seedMap[w])seedMap[w]=[];seedMap[w].push(kw);});
  });
  // Pillars = words shared by 3+ keywords
  const pillars=Object.entries(seedMap).filter(([w,arr])=>arr.length>=3).sort((a,b)=>b[1].length-a[1].length);
  const clustered=new Set();
  const clusters=[];
  pillars.forEach(([w, kws])=>{
    const fresh=kws.filter(k=>!clustered.has(k));
    if(fresh.length<2)return;
    fresh.forEach(k=>clustered.add(k));
    clusters.push({pillar:w, keywords:fresh});
  });
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Topic Clusters (${clusters.length})</h3><span class="badge">Auto-detected</span></div><div>
    ${clusters.length?clusters.map(c=>`<div class="cluster-card">
      <div class="header"><div class="pillar">${escapeHtml(c.pillar)}</div><div class="cluster-count">${c.keywords.length} keywords</div></div>
      <div class="kws">${c.keywords.map(k=>`<span class="kw-pill">${escapeHtml(k)}</span>`).join('')}</div>
    </div>`).join(''):'<div style="padding:40px;text-align:center;color:var(--text3)">No clear clusters detected — keyword list may need to be larger or more focused</div>'}
  </div></div>`;
}

function renderGuide(){
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Keyword Mapping Best Practices</h3></div><div style="padding:18px;font-size:13px;line-height:1.7;color:var(--text2)">
    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700">The One Keyword Per Page Rule</h4>
    <p>Every page should have exactly <strong>one primary target keyword</strong>. The page can rank for variations and related terms, but Google needs a clear signal about which page is "the answer" for that keyword.</p>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">What Cannibalization Means</h4>
    <p>Cannibalization happens when <strong>multiple pages target the same keyword</strong>. Google can't decide which to rank, so neither ranks as well as one focused page would.</p>
    <p>Common causes:</p>
    <ul style="padding-left:22px;margin-top:6px">
      <li>Created a new page without checking if existing content covers the topic</li>
      <li>Multiple location/service pages with similar slugs (e.g. /plumbing vs /plumbing-services)</li>
      <li>Old blog posts and new ones covering the same angle</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">How to Resolve Cannibalization</h4>
    <ol style="padding-left:22px;margin-top:6px">
      <li><strong>Merge</strong> — Combine content into the best-performing URL, 301-redirect the others</li>
      <li><strong>Differentiate</strong> — Re-optimize the secondary pages around different keywords</li>
      <li><strong>Canonical</strong> — Add canonical tags pointing to the primary URL</li>
      <li><strong>Internal linking</strong> — Link competing pages to the primary to signal subordination</li>
    </ol>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Orphan Keywords</h4>
    <p>Keywords with no page targeting them are opportunities. Three responses:</p>
    <ol style="padding-left:22px;margin-top:6px">
      <li><strong>Create</strong> — Build a dedicated page if commercial value is high</li>
      <li><strong>Expand</strong> — Add a section/FAQ to an existing related page</li>
      <li><strong>Drop</strong> — Some keywords just don't fit your site — that's OK</li>
    </ol>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Local Mapping Specifics</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li>City + service keywords go to dedicated location/city pages</li>
      <li>Generic service keywords go to service hub pages</li>
      <li>"Near me" keywords usually target homepage or main service page</li>
      <li>Branded queries (your name) target homepage</li>
      <li>Avoid having both /plumbing-denver AND /denver-plumbing</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Search Intent Matters</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li><strong>Local</strong> — "near me", "in [city]" — service/location pages</li>
      <li><strong>Commercial</strong> — "best", "cheap", "price" — comparison/service pages</li>
      <li><strong>Informational</strong> — "how to", "what is" — blog/guide pages</li>
      <li><strong>Transactional</strong> — "buy", "hire", "book" — landing/conversion pages</li>
    </ul>
    <p>Matching intent to page type is more important than perfect keyword density.</p>
  </div></div>`;
}

function exportCSV(){
  const kws=getKeywordList();
  const rows=[['keyword','intent','primary_url','secondary_urls','status','manual_override']];
  kws.forEach(kw=>{
    const m=state.map[kw]||{};
    const status=m.primary?(m.secondary?.length?'cannibalizing':'mapped'):'orphan';
    rows.push([kw, m.intent||classifyIntent(kw), m.primary||'', (m.secondary||[]).join('; '), status, m.manualOverride?'yes':'auto']);
  });
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='keyword-mapping.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('CSV exported','success');
}
function clearAll(){if(!confirm('Clear all mappings?'))return;state.map={};saveState();render();toast('Cleared','success');}

  if(!state.urls){try{const sc=JSON.parse(localStorage.getItem('sc_state_v1')||'null');if(sc?.pages)state.urls=Object.keys(sc.pages).slice(0,30).join('\n');else{const cf=JSON.parse(localStorage.getItem('cf_state_v1')||'null');const b=cf?.businesses?.[0];if(b?.website)state.urls=b.website;}}catch(e){}}

})();

fillInputs();
render();
