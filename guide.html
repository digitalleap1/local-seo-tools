<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --primary:#2563eb; --primary-h:#1d4ed8; --primary-soft:rgba(37,99,235,.08);
  --green:#16a34a; --amber:#d97706; --red:#dc2626;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:10px; --font:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --primary:#3b82f6; --primary-h:#60a5fa; --primary-soft:rgba(59,130,246,.14);
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 4px 14px rgba(0,0,0,.5); --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:14px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

#wrap{flex:1;min-height:0;display:flex;flex-direction:column}
/* hero */
.hero{background:linear-gradient(135deg,rgba(37,99,235,.10),rgba(124,58,237,.08));border-bottom:1px solid var(--border);padding:34px 24px 26px}
.hero-in{max-width:1180px;margin:0 auto}
.hero h1{font-size:30px;font-weight:900;letter-spacing:-.6px;display:flex;align-items:center;gap:12px}
.hero h1 .hi{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#7c3aed);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.hero h1 .hi svg{width:23px;height:23px;color:#fff}
.hero p{color:var(--text2);font-size:14.5px;margin-top:9px;max-width:680px;line-height:1.55}
.hero-search{margin-top:18px;position:relative;max-width:520px}
.hero-search input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:13px 14px 13px 42px;font-size:14px;color:var(--text);font-family:var(--font);box-shadow:var(--shadow-sm);outline:none}
.hero-search input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.hero-search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text3)}
.hero-stats{margin-top:16px;display:flex;gap:22px;flex-wrap:wrap}
.hero-stat{font-size:12px;color:var(--text2)}
.hero-stat strong{display:block;font-size:21px;font-weight:800;color:var(--text);font-family:var(--mono)}

#layout{flex:1;min-height:0;max-width:1180px;width:100%;margin:0 auto;display:flex;gap:26px;padding:24px}
/* TOC */
#toc{width:220px;flex-shrink:0;position:sticky;top:14px;align-self:flex-start;max-height:calc(100vh - 90px);overflow-y:auto}
#toc .toc-h{font-size:10px;font-family:var(--mono);font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:6px 10px}
#toc a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--text2);font-size:12.5px;font-weight:600;cursor:pointer}
#toc a:hover{background:var(--bg3);color:var(--text)}
#toc a.active{background:var(--primary-soft);color:var(--primary)}
#toc a .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#toc a .n{margin-left:auto;font-size:10px;color:var(--text3);font-family:var(--mono)}
/* content */
#content{flex:1;min-width:0}
.cat-block{margin-bottom:30px;scroll-margin-top:14px}
.cat-hd{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding-bottom:11px;border-bottom:2px solid var(--border)}
.cat-hd .ci{width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-family:var(--mono);flex-shrink:0}
.cat-hd .ct{font-size:18px;font-weight:800;letter-spacing:-.3px}
.cat-hd .cs{font-size:12px;color:var(--text3);margin-top:1px;font-family:var(--mono)}
.tool-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow-sm);scroll-margin-top:14px;transition:box-shadow .2s,border-color .2s}
.tool-card:target,.tool-card.flash{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.tc-hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tc-code{width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-family:var(--mono);flex-shrink:0}
.tc-name{font-size:16px;font-weight:800;letter-spacing:-.2px}
.tc-live{font-size:9px;font-family:var(--mono);font-weight:800;color:var(--green);border:1px solid var(--green);border-radius:5px;padding:1px 6px;letter-spacing:.4px;display:none}
.tc-live.on{display:inline-block}
.tc-open{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;background:var(--primary);color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.tc-open:hover{background:var(--primary-h)}
.tc-open svg{width:13px;height:13px}
.tc-over{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.tc-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media(max-width:720px){.tc-cols{grid-template-columns:1fr;gap:14px}}
.tc-sec-h{font-size:10.5px;font-family:var(--mono);font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tc-steps{list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:8px}
.tc-steps li{counter-increment:step;position:relative;padding-left:30px;font-size:13px;line-height:1.5;color:var(--text)}
.tc-steps li::before{content:counter(step);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:6px;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:800;font-family:var(--mono);display:flex;align-items:center;justify-content:center}
.tc-tips{list-style:none;display:flex;flex-direction:column;gap:7px}
.tc-tips li{position:relative;padding-left:20px;font-size:12.5px;line-height:1.5;color:var(--text2)}
.tc-tips li::before{content:'';position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:2px;background:var(--amber)}
.empty{padding:60px 20px;text-align:center;color:var(--text3)}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.5}
@media(max-width:920px){#toc{display:none}#layout{padding:16px}}
</style>
</head>

<script>
/* ============================================================
 * GUIDE CONTENT — keyed by the tool id used in global-nav.js.
 * Names / urls / colors / categories all come from GlobalNav,
 * so this file only stores the how-to body for each tool.
 * ============================================================ */
const GUIDES = {
  /* ---- Citations & Listings ---- */
  cf:{over:"Find where your business is listed across 100+ local directories and spot missing or duplicate citations that dilute your local authority.",
    steps:["Enter your business name, address and phone (NAP) at the top.","Run the scan to check each directory tier (core, niche, data aggregators).","Review the status column — Found, Missing, or Needs-Fix.","Work the Missing list first: those are quick authority wins.","Export the report to track submissions over time."],
    tips:["Use the exact same NAP format everywhere — punctuation included.","Prioritise high-authority directories (Google, Apple, Bing, Yelp, Facebook) before niche ones."]},
  nap:{over:"Audit Name / Address / Phone consistency across all your listings. Inconsistent NAP is one of the most common local-ranking killers.",
    steps:["Set your canonical (correct) NAP as the reference.","Paste or add each listing's NAP as it currently appears.","The fuzzy matcher flags mismatches — even subtle ones like 'St' vs 'Street'.","Fix the flagged listings at the source.","Re-run to confirm everything is consistent."],
    tips:["Pick ONE canonical format and never deviate (suite numbers, abbreviations, phone formatting).","Closed or duplicate listings hurt too — flag them for removal."]},
  cg:{over:"Discover citations your competitors have that you don't — a ready-made list of directories to get listed on.",
    steps:["Enter your site plus 2–3 competitor sites.","Run the gap analysis.","Review directories where competitors appear but you don't.","Sort by authority and relevance, then submit to the best ones."],
    tips:["Focus on gaps shared by multiple competitors — those are category-defining directories.","Combine with Niche Citation Finder for industry-specific wins."]},
  ml:{over:"Manage NAP and listing data across many locations from one place — built for multi-location brands and franchises.",
    steps:["Add each location with its full NAP and identifiers.","Use the table to scan for inconsistencies across locations.","Bulk-edit shared fields (brand name, hours patterns).","Export a per-location sheet for your listings team."],
    tips:["Keep store codes consistent — they tie your locations together across platforms.","Audit one location fully, then clone its structure to the rest."]},
  agg:{over:"Track your data across the four big US data aggregators (Data Axle, Foursquare, Neustar/Localeze, Acxiom) that feed hundreds of downstream directories.",
    steps:["Enter your NAP and any known aggregator IDs.","Mark current submission status for each aggregator.","Schedule re-checks — aggregator data propagates slowly.","Export to keep a paper trail of submissions and dates."],
    tips:["Fix data at the aggregator level and dozens of downstream sites self-correct.","Allow 4–8 weeks for changes to propagate before re-auditing."]},
  sam:{over:"Plan and visualise your Google Business Profile service areas so they match where you actually operate.",
    steps:["Set your base location.","Add the cities / regions / ZIP codes you serve.","Visualise coverage on the map and trim overreach.","Export the finalised list to enter into GBP."],
    tips:["GBP allows up to 20 service areas — choose the highest-value ones.","Don't claim areas you can't service; it dilutes relevance and risks trust issues."]},
  nc:{over:"Find industry-specific (niche) directories — medical, legal, home-services, hospitality and more — that generic citation tools miss.",
    steps:["Pick your industry vertical.","Review the curated niche directory list.","Check which you're already listed on.","Submit to the relevant high-authority niche sites."],
    tips:["Niche citations often carry more topical relevance than generic ones.","Pair with Citation Finder for full coverage."]},

  /* ---- Google Business Profile ---- */
  gbp:{over:"Audit a Google Business Profile across 50+ weighted checks. Run it automatically: enter your details and click Auto-Audit — it fetches your website, detects on-site/NAP/schema signals, then uses AI deep research to score every check and find errors across NAP, citations, listings, backlinks and reviews. Or work the checklist manually.",
    steps:["Fill the Business Profile (name, website, GBP URL, phone, city, category).","Best & 100% free: open a terminal in the tools folder and run <code>python gbp_auditor.py --serve</code> — the tool auto-detects this local engine (deep website crawl, schema, NAP across real listings, citation discovery, keyword visibility — no API key, no CORS). Tick 'Read live GBP panel' to also read the real profile (category, rating, reviews, hours) via a headless browser; the first deep run auto-installs it.","No engine? Configure a free AI provider (Gemini/Groq) under Configure AI Provider instead — it falls back to in-browser proxy + AI (and still produces a rule-based report with no key).","Click Run Deep-Research Auto-Audit and watch the steps complete.","Open the Deep Research tab for the executive summary + 6-area breakdown; review auto-filled pass/fail (SITE = verified from your site/search, AI = AI-assessed), fix the fails, and export the report."],
    tips:["The local Python engine needs only Python 3 — no pip installs (pure standard library).","Items needing a logged-in GBP check (exact review counts, hours, posts) are flagged — confirm those manually.","Use the per-area 'Open tool' links to jump to NAP Checker, Citation Finder, or Backlink Profile for deeper work."]},
  gbpcat:{over:"Choose the right primary and secondary GBP categories from a 200+ category database — category choice is one of the strongest local-ranking levers.",
    steps:["Search the category database for your business type.","Set ONE primary category that best matches your core service.","Add secondary categories for additional services you offer.","Compare against competitor category choices."],
    tips:["Primary category has by far the most ranking weight — choose precisely.","More specific usually beats more general (e.g. 'Mexican Restaurant' over 'Restaurant')."]},
  gbpsv:{over:"Build the structured Services list for your GBP — services map to category-specific menus that improve relevance and conversions.",
    steps:["Select your category to load suggested services.","Add your services with clear names, descriptions and prices.","Order them by importance.","Export and paste into your GBP Services section."],
    tips:["Use the wording customers search for in service names.","Descriptions are a place to naturally include service-area + keyword phrases."]},
  ps:{over:"Draft and schedule Google Business Profile posts with AI assistance to keep your listing active and engaging.",
    steps:["Pick a post type (update, offer, event).","Generate or write the copy and add a CTA.","Set the publish date on the calendar.","Export your schedule and post on cadence."],
    tips:["Post at least weekly — fresh activity signals an active business.","Always include a clear call-to-action and a relevant image."]},
  qa:{over:"Draft answers to common questions in bulk and seed your GBP Q&A with helpful, keyword-rich responses.",
    steps:["List the real questions customers ask.","Generate or write clear answers.","Post the most important Q&As to your profile yourself.","Monitor for new public questions and answer fast."],
    tips:["Seed your own Q&A so competitors or trolls don't fill the vacuum.","Answer with the searcher's wording for relevance."]},
  gp:{over:"Import your GBP Insights / Performance CSV exports and analyse calls, direction requests, clicks and discovery over time.",
    steps:["Export performance data from your GBP dashboard.","Import the CSV here.","Review trends across actions and time.","Spot dips/spikes and correlate with changes you made."],
    tips:["Track month-over-month, not day-to-day — local data is noisy.","Pair with GBP Insights Analyzer for richer visuals."]},
  gpi:{over:"Turn raw GBP Performance data into visual analytics — charts and trends that make patterns obvious.",
    steps:["Load your imported performance data.","Explore the charts by metric and period.","Identify your strongest discovery and action channels.","Export visuals for client reporting."],
    tips:["Calls + direction requests are your truest 'intent' signals.","Annotate spikes with what you changed to learn what works."]},
  sr:{over:"Score your GBP suspension risk against the factors Google penalises, so you can de-risk before you get suspended.",
    steps:["Answer the risk questionnaire honestly.","Review your computed risk score and flagged factors.","Remediate high-risk items (keyword-stuffed name, fake address, etc.).","Re-score to confirm you're in the safe zone."],
    tips:["A keyword-stuffed business name is the #1 suspension trigger — use your real name.","Virtual offices and address mismatches are high-risk; document legitimacy."]},
  ssen:{over:"Detect competitor GBP spam and listing hijacks — fake reviews, keyword-stuffed names, lead-gen fakes — so you can report them.",
    steps:["Enter your market / keyword and location.","Scan the local results for spam signals.","Flag listings with stuffed names, fake addresses or review spikes.","Use the export to file Google redressal / Business Redressal Complaints."],
    tips:["Reporting spam competitors can lift you in the pack as fakes get removed.","Screenshot evidence before reporting — listings change."]},
  gbpp:{over:"Plan and AI-grade your GBP photos by category so your visual content is complete and conversion-focused.",
    steps:["Review the recommended photo categories (exterior, interior, team, product…).","Check off what you have and spot gaps.","Grade existing photos for quality.","Plan a shot list for the missing categories."],
    tips:["Profiles with more category-complete photos get more views and actions.","Geo-tagged, well-lit, authentic photos beat stock every time."]},
  hol:{over:"Manage GBP holiday hours and seasonal campaigns so you never show wrong hours on a high-traffic day.",
    steps:["Review upcoming holidays for your region.","Set special hours (open/closed/modified) for each.","Plan a seasonal post/offer around key dates.","Export the schedule for your team."],
    tips:["Set holiday hours in advance — Google prompts searchers about them.","Wrong holiday hours generate bad experiences and reviews."]},

  /* ---- Reviews & Reputation ---- */
  rev:{over:"Draft professional, on-brand responses to customer reviews — positive and negative — with AI assistance.",
    steps:["Paste the review text and star rating.","Generate a response draft in your chosen tone.","Edit for specifics and brand voice.","Post the reply and mark it handled."],
    tips:["Respond to negative reviews calmly and offline-where-possible; future customers read your replies.","Reply to positive reviews too — it signals engagement to Google and customers."]},
  sm:{over:"Monitor review sentiment over time and flag suspicious / fake reviews across your locations.",
    steps:["Import or add your reviews.","Review the sentiment breakdown and trend.","Inspect flagged reviews for fake patterns.","Act: respond, dispute, or report as appropriate."],
    tips:["A sudden cluster of 5-star or 1-star reviews is a fake-review red flag.","Track sentiment trend, not just average rating."]},
  bs:{over:"Audit your brand SERP — knowledge panel, sitelinks, reviews and what shows when someone Googles your name.",
    steps:["Enter your brand name.","Review each brand-SERP element's status.","Fix gaps (claim panel, add schema, control narrative).","Re-check periodically as the SERP evolves."],
    tips:["Your brand SERP is your real homepage for high-intent searchers — own it.","Wikidata/Wikipedia and consistent entity data strengthen knowledge panels."]},
  bm:{over:"Find unlinked mentions of your brand across the web and turn them into backlinks through outreach.",
    steps:["Enter brand terms to search for.","Collect mentions that don't link to you.","Prioritise high-authority, relevant pages.","Reach out and request a link to the mention."],
    tips:["Unlinked mentions are the warmest link-building targets you have.","A friendly, specific ask converts far better than a template blast."]},
  kp:{over:"Strengthen the entity signals that earn and optimise a Google Knowledge Panel for your brand or person.",
    steps:["Audit your current entity signals (site schema, Wikidata, profiles).","Fill gaps in structured 'about' data.","Build consistent entity references across the web.","Monitor the panel for accuracy and suggest edits."],
    tips:["Organisation/Person schema + sameAs links to official profiles anchor your entity.","Consistency of name, logo and descriptors across the web is what builds the panel."]},
  press:{over:"Generate press releases and journalist pitches to earn high-authority local and industry coverage.",
    steps:["Describe your news angle / announcement.","Generate a press release draft.","Generate tailored pitches for specific journalists/outlets.","Track outreach and follow up."],
    tips:["Lead with the local angle — local outlets care about local impact.","Personalise the first line of every pitch; generic pitches get ignored."]},

  /* ---- Rankings & SERP ---- */
  gg:{over:"A Local Falcon-style geo-grid rank tracker. Drop a grid of points on a real map around the business, check your Google local-pack rank at each point, and get a color heatmap plus Average Rank Position (ARP), Share of Local Voice (SoLV), coverage, competitor share, and saved scan history. Works in demo mode instantly; switch to live data with a key + the local engine.",
    steps:["Enter the business name + keyword (e.g. 'auto repair shop').","Set the center: type an address and click Locate, type 'lat,lng', or just click the map.","Pick grid size (3×3 to 13×13) and radius (how far from center to the edge).","Click Run Geo-Grid Scan — points fill in as a heatmap (green=top 3 … red=not in top 20).","Read ARP/SoLV/coverage, the competitor Share-of-Local-Voice table, and rank distribution. Scans save to history so you can track movement over time; export JSON/CSV."],
    tips:["Rankings vary block-by-block — a grid reveals truth a single check hides; re-scan the same grid weekly/monthly to prove movement.","Demo mode uses realistic simulated rankings. For REAL data, choose 'Live via local engine', paste a Google Places API key, and run python gbp_auditor.py --serve — the engine queries Google Places at each point.","Tighten the radius for dense urban areas; widen it for service-area businesses."]},
  pt:{over:"Monitor your position in the Google local pack (the 3-pack) for your priority keywords over time.",
    steps:["Add your target keywords and location.","Log pack positions on a regular cadence.","Watch the trend per keyword.","Prioritise keywords sitting at positions 4–6 (closest to breaking in)."],
    tips:["The 3-pack drives the majority of local clicks — focus there.","Pair with the Geo-Grid Tracker for spatial context."]},
  sr2:{over:"Analyse SERP features and rankings for your keywords — who ranks, what features appear, and why.",
    steps:["Enter keywords to analyse.","Review the ranking results and SERP features present.","Identify features you could win (FAQ, images, local pack).","Plan content/optimisations to capture them."],
    tips:["SERP features are extra real estate — target the ones your content can earn.","Study the top results' format, not just their links."]},
  ctr:{over:"Generate and test title / meta description variants and predict their click-through rate to win more clicks at the same rank.",
    steps:["Enter your page's current title and meta.","Generate variants with different hooks (numbers, brackets, benefits).","Compare predicted CTR scores.","Ship the strongest variant and measure in GSC."],
    tips:["Power words, numbers and brackets reliably lift CTR.","Match the search intent in the first 60 characters."]},
  snip:{over:"Optimise your SERP snippet — title + meta — for maximum CTR with live pixel-width and best-practice checks.",
    steps:["Paste your title and meta description.","Watch the pixel-width preview to avoid truncation.","Apply the suggested improvements.","Export the final snippet to implement."],
    tips:["Keep titles ~60 chars / 580px and metas ~155 chars to avoid truncation.","Front-load the keyword and the benefit."]},
  fc:{over:"Forecast 90-day position and revenue outcomes under different effort scenarios to set expectations and justify spend.",
    steps:["Enter current positions, volumes and conversion assumptions.","Set best/expected/conservative scenarios.","Review the projected traffic and revenue curves.","Export the forecast for proposals and planning."],
    tips:["Anchor forecasts in real CTR-by-position curves, not wishful thinking.","Present a range, not a single number — it builds trust."]},
  gsc:{over:"Mine your Google Search Console export to find striking-distance keywords, low-CTR pages and local-intent opportunities.",
    steps:["Export your GSC Performance data (queries + pages).","Import the CSV here.","Review striking-distance (positions 5–20) queries to push.","Fix low-CTR/high-impression pages with better snippets."],
    tips:["Positions 8–15 with decent impressions are your fastest wins.","High impressions + low CTR = a snippet problem, not a ranking problem."]},

  /* ---- Content & Keywords ---- */
  kw:{over:"Discover and cluster local keywords — service + city combinations, modifiers and questions — for your market.",
    steps:["Enter seed terms and your locations.","Generate keyword ideas and local variants.","Cluster them by topic / page intent.","Export clusters to map onto pages."],
    tips:["'Service + city' and 'near me' variants are local gold.","Group by intent so one page targets one cluster — avoid cannibalisation."]},
  cb:{over:"Build SERP-driven content briefs that tell writers exactly what to cover to rank for a target keyword.",
    steps:["Enter your target keyword.","Pull in the themes/headings top results cover.","Assemble the brief: sections, entities, questions, word-count target.","Hand the brief to your writer or AI."],

(function(){
  const GN = window.GlobalNav;
  const cats = GN.listCategories();
  const tools = GN.listTools();
  const content = document.getElementById('content');
  const toc = document.getElementById('toc');

  // Build category blocks (only categories that have documented tools)
  let liveCount = 0, toolCount = 0, catCount = 0;
  let html = '', tocHtml = '<div class="toc-h">Categories</div>';
  cats.forEach(cat=>{
    const list = cat.tools.map(id=>({id, t:tools[id]})).filter(x=>x.t && GUIDES[x.id]);
    if(!list.length) return;
    catCount++;
    tocHtml += `<a data-jump="cat-${cat.id}"><span class="dot" style="background:${cat.color}"></span>${esc(cat.name)}<span class="n">${list.length}</span></a>`;
    html += `<section class="cat-block" id="cat-${cat.id}" data-cat="${cat.id}">
      <div class="cat-hd"><div class="ci" style="background:${cat.color}">${esc(cat.name.charAt(0))}</div>
        <div><div class="ct">${esc(cat.name)}</div><div class="cs">${esc(cat.sub||'')}</div></div></div>`;
    list.forEach(({id,t})=>{
      toolCount++;
      const g = GUIDES[id];
      const live = hasData(t);
      if(live) liveCount++;
      html += `<article class="tool-card" id="guide-${id}" data-search="${esc((t.name+' '+(t.desc||'')+' '+(g.over||'')+' '+(t.code||'')).toLowerCase())}">
        <div class="tc-hd">
          <div class="tc-code" style="background:${t.color||'#64748b'}">${esc(t.code||'?')}</div>
          <div class="tc-name">${esc(t.name)}</div>
          <span class="tc-live ${live?'on':''}">● HAS DATA</span>
          <a class="tc-open" href="${t.url}">Open tool <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
        </div>
        <div class="tc-over">${esc(g.over)}</div>
        <div class="tc-cols">
          <div><div class="tc-sec-h">How to use</div><ol class="tc-steps">${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
          <div><div class="tc-sec-h">Pro tips</div><ul class="tc-tips">${g.tips.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
        </div>
      </article>`;
    });
    html += `</section>`;
  });
  content.innerHTML = html + `<div class="empty" id="empty" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><div>No guides match your search.</div></div>`;
  toc.innerHTML = tocHtml;
  document.getElementById('st-tools').textContent = toolCount;
  document.getElementById('st-cats').textContent = catCount;
  document.getElementById('st-live').textContent = liveCount;

  // TOC jump
  toc.addEventListener('click', e=>{
    const a = e.target.closest('[data-jump]'); if(!a) return;
    document.getElementById(a.getAttribute('data-jump'))?.scrollIntoView({behavior:'smooth',block:'start'});
  });

  // Scroll-spy
  const blocks = [...document.querySelectorAll('.cat-block')];
  const tocLinks = [...toc.querySelectorAll('[data-jump]')];
  const spy = ()=>{
    let cur = blocks[0]?.id;
    blocks.forEach(b=>{ if(b.getBoundingClientRect().top < 140) cur = b.id; });
    tocLinks.forEach(a=>a.classList.toggle('active', a.getAttribute('data-jump')===cur));
  };
  window.addEventListener('scroll', spy, {passive:true}); spy();

  // Search filter
  const search = document.getElementById('search');
  const cards = [...document.querySelectorAll('.tool-card')];
  search.addEventListener('input', ()=>{
    const q = search.value.toLowerCase().trim();
    let any = false;
    cards.forEach(c=>{ const m = !q || c.dataset.search.includes(q); c.style.display = m?'':'none'; if(m) any=true; });
    blocks.forEach(b=>{ const vis = [...b.querySelectorAll('.tool-card')].some(c=>c.style.display!=='none'); b.style.display = vis?'':'none'; });
    document.getElementById('empty').style.display = any?'none':'';
  });

  // Deep-link highlight (#guide-xx)
  function flashTarget(){
    const id = location.hash.slice(1);
    if(!id) return;
    const el = document.getElementById(id);
    if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),2200); }
  }
  window.addEventListener('hashchange', flashTarget);
  setTimeout(flashTarget, 200);

  function hasData(t){
    if(!t || !t.key) return false;
    try{ const d = JSON.parse(localStorage.getItem(t.key)||'null'); return !!(d && Object.keys(d).length); }catch(e){ return false; }
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
})();
</script>
