<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heading Hierarchy Auditor - H1-H6 Structure Analysis for SEO & A11y</title>

<script>

  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#0891b2; --accent-h:#0e7490; --accent-soft:rgba(8,145,178,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --h1:#0891b2; --h2:#7c3aed; --h3:#db2777; --h4:#ea580c; --h5:#16a34a; --h6:#5b6b88;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#22d3ee; --accent-h:#67e8f9; --accent-soft:rgba(34,211,238,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
  --h1:#22d3ee; --h2:#a78bfa; --h3:#ec4899; --h4:#fb923c; --h5:#22c55e; --h6:#7e95b8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--purple);border:1px solid var(--purple);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.score strong{color:var(--accent);font-size:14px}
.hdr-stat.h1 strong{color:var(--h1)}
.hdr-stat.issues strong{color:var(--danger)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:340px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}
.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f textarea{resize:vertical;min-height:60px;font-family:var(--font)}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.score-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:14px;display:grid;grid-template-columns:140px 1fr;gap:24px;align-items:center;box-shadow:var(--shadow-sm)}
.score-circle{position:relative;width:140px;height:140px}
.score-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-circle .bg{stroke:var(--bg3);stroke-width:11;fill:none}
.score-circle .fg{stroke:var(--accent);stroke-width:11;fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s}
.score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-text .v{font-size:36px;font-weight:900;font-family:var(--mono);color:var(--accent);line-height:1}
.score-text .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:700;text-transform:uppercase}
.score-info h2{font-size:18px;font-weight:800;margin-bottom:4px;word-break:break-all}
.score-info .sub{font-size:12.5px;color:var(--text2);line-height:1.55;margin-bottom:10px}
.score-pills{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px;font-weight:700;font-family:var(--mono)}
.score-pills .sp{padding:3px 9px;border-radius:11px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.score-pills .sp.ok{background:rgba(22,163,74,.13);color:var(--success)}
.score-pills .sp.warn{background:rgba(245,158,11,.13);color:var(--warn)}
.score-pills .sp.bad{background:rgba(220,38,38,.13);color:var(--danger)}

.h-counts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
.h-count{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;text-align:center;box-shadow:var(--shadow-sm)}
.h-count .l{font-size:11px;font-family:var(--mono);font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.h-count .v{font-size:24px;font-weight:900;font-family:var(--mono);line-height:1.1;margin-top:2px}
.h-count.h1 .v{color:var(--h1)} .h-count.h2 .v{color:var(--h2)} .h-count.h3 .v{color:var(--h3)} .h-count.h4 .v{color:var(--h4)} .h-count.h5 .v{color:var(--h5)} .h-count.h6 .v{color:var(--h6)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

/* Outline tree */
.outline{padding:14px}
.outline-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:7px 10px;border-radius:6px;align-items:start;margin-bottom:3px;font-size:12.5px;line-height:1.4;transition:background .12s;border-left:3px solid transparent}
.outline-row:hover{background:var(--bg)}
.outline-row.issue{border-left-color:var(--danger);background:rgba(220,38,38,.03)}
.outline-row.warn{border-left-color:var(--warn);background:rgba(245,158,11,.03)}
.outline-row .htag{font-family:var(--mono);font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px;color:#fff;text-align:center;align-self:start}
.outline-row .htag.h1{background:var(--h1)} .outline-row .htag.h2{background:var(--h2)} .outline-row .htag.h3{background:var(--h3)} .outline-row .htag.h4{background:var(--h4)} .outline-row .htag.h5{background:var(--h5)} .outline-row .htag.h6{background:var(--h6)}
.outline-row .text{min-width:0;word-break:break-word}
.outline-row.indent-1{margin-left:0}
.outline-row.indent-2{margin-left:24px}
.outline-row.indent-3{margin-left:48px}
.outline-row.indent-4{margin-left:72px}
.outline-row.indent-5{margin-left:96px}
.outline-row.indent-6{margin-left:120px}
.outline-row .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.outline-row .badge-mini{font-size:9.5px;font-family:var(--mono);font-weight:700;padding:1px 6px;border-radius:3px;background:rgba(245,158,11,.13);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.outline-row .badge-mini.bad{background:rgba(220,38,38,.13);color:var(--danger);border-color:rgba(220,38,38,.3)}
.outline-row .badge-mini.good{background:rgba(22,163,74,.13);color:var(--success);border-color:rgba(22,163,74,.3)}
.outline-row .meta{font-size:10px;color:var(--text3);font-family:var(--mono);text-align:right;align-self:start;white-space:nowrap}

.check-list{display:flex;flex-direction:column}
.check{padding:10px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:24px 1fr auto;gap:11px;align-items:start}
.check:last-child{border-bottom:none}
.check .icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;margin-top:1px}
.check.pass .icon{background:rgba(22,163,74,.15);color:var(--success)}
.check.warn .icon{background:rgba(245,158,11,.15);color:var(--warn)}
.check.fail .icon{background:rgba(220,38,38,.15);color:var(--danger)}
.check.info .icon{background:rgba(37,99,235,.15);color:var(--blue)}
.check .body .title{font-size:12.5px;font-weight:700}
.check .body .desc{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:2px}
.check .meta{font-size:10.5px;font-family:var(--mono);color:var(--text3)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}

.busy{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:5000}
.busy.show{display:flex}
.busy .card{background:var(--bg2);padding:24px 30px;border-radius:14px;border:1px solid var(--border);text-align:center;max-width:340px}
.busy .sp{width:42px;height:42px;border-radius:50%;border:3px solid var(--bg3);border-top-color:var(--accent);animation:spin .9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:340px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .h-counts{grid-template-columns:repeat(3,1fr)}
  .score-panel{grid-template-columns:1fr}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 4l3 0"/><path d="M3 8l3 0"/><path d="M3 12l3 0"/><path d="M3 16l3 0"/><path d="M3 20l3 0"/><path d="M10 4l11 0"/><path d="M14 8l7 0"/><path d="M11 12l10 0"/><path d="M13 16l8 0"/><path d="M10 20l11 0"/></svg></div>
    <div><div class="logo-name">Heading<span>Audit</span></div></div>

  <a href="page-auditor.html" class="hdr-link" style="border-color:rgba(8,145,178,.4);color:var(--accent)">Page Auditor</a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>

  </button>
</div>

<div id="app">
  <div id="left">
    <div class="lh-bar"><h3>Audit Setup</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Target Page</h4><span class="toggle">▼</span></div>

        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Batch Mode</h4><span class="toggle">▼</span></div>

          <div class="f"><label>One URL per line (up to 20)</label><textarea id="i-batch" rows="6" placeholder="https://yoursite.com/services
https://yoursite.com/about"></textarea></div>
          <button class="btn-sub" onclick="runBatch()">Audit Batch</button>
        </div>
      </div>
    </div>
    <div id="left-footer">
      <button class="btn-go" onclick="runAudit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Audit Headings

        <button class="btn-sub" onclick="exportCSV()">CSV</button>
        <button class="btn-sub" onclick="exportReport()">Report</button>

  <div id="center">

<script>
const STORE_KEY='ha_state_v1';
const defaultState={url:'',kw:'',city:'',results:null,batchResults:[],view:'overview'};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}
function setBusy(s,t,m){const b=document.getElementById('busy');if(t)document.getElementById('busy-title').textContent=t;if(m)document.getElementById('busy-msg').textContent=m;b.classList.toggle('show',s);}
function toggleSec(h){h.parentElement.classList.toggle('collapsed');}

function fillInputs(){
  document.getElementById('i-url').value=state.url||'';
  document.getElementById('i-kw').value=state.kw||'';
  document.getElementById('i-city').value=state.city||'';
}
function getInputs(){
  state.url=document.getElementById('i-url').value.trim();
  state.kw=document.getElementById('i-kw').value.trim();
  state.city=document.getElementById('i-city').value.trim();
  saveState();
}
function syncFromCitation(){try{const cf=JSON.parse(localStorage.getItem('cf_state_v1')||'null');const b=cf?.businesses?.[0];if(b){if(b.website)state.url=b.website;if(b.city)state.city=b.city;fillInputs();saveState();toast('Synced','success');}}catch(e){}}

const PROXIES=[u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`];
async function fetchPage(u){for(const p of PROXIES){try{const r=await fetch(p(u));if(r.ok){const t=await r.text();if(t&&t.length>100)return t;}}catch(e){}}throw new Error('CORS failed');}

async function runAudit(){
  getInputs();
  if(!state.url){toast('URL required','err');return;}
  setBusy(true,'Auditing headings…',state.url);
  let html;
  try{html=await fetchPage(state.url);}catch(e){setBusy(false);toast('Could not fetch','err');return;}
  const result=analyzeHeadings(html, state);
  state.results=result;
  saveState();setBusy(false);render();
  toast(`Score ${result.score}/100 · ${result.issues.length} issues`,'success');
}

async function runBatch(){
  const urls=document.getElementById('i-batch').value.split('\n').map(u=>u.trim()).filter(Boolean).slice(0,20);
  if(!urls.length){toast('No URLs','err');return;}
  setBusy(true,'Batch audit…',`0/${urls.length}`);
  const results=[];
  for(let i=0;i<urls.length;i++){
    setBusy(true,'Batch audit…',`${i+1}/${urls.length}: ${urls[i].substring(0,40)}`);
    try{const html=await fetchPage(urls[i]);results.push({url:urls[i], ...analyzeHeadings(html, state)});}
    catch(e){results.push({url:urls[i], error:e.message, score:0, headings:[], counts:{}, issues:[]});}
    await new Promise(r=>setTimeout(r,200));
  }
  state.batchResults=results;
  saveState();setBusy(false);setTab('batch');
  toast(`Audited ${results.length} pages`,'success');
}

function analyzeHeadings(html, st){
  const doc=new DOMParser().parseFromString(html,'text/html');
  // Title
  const title=doc.querySelector('title')?.textContent?.trim()||'';
  // Get all headings in document order, with their levels
  const all=[...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')];
  const headings=all.map((el,i)=>{
    const level=parseInt(el.tagName.charAt(1));
    const text=(el.textContent||'').trim();
    const charCount=text.length;
    const inMain=!!el.closest('main, [role=main], article');
    const inNav=!!el.closest('nav, header, footer, [role=navigation]');
    return {idx:i, level, text, charCount, inMain, inNav};
  });
  const counts={h1:0,h2:0,h3:0,h4:0,h5:0,h6:0};
  headings.forEach(h=>{counts['h'+h.level]++;});
  // Tag for issue detection
  const issues=[];
  headings.forEach(h=>h.issues=[]);
  // 1) Multiple H1s
  if(counts.h1===0){issues.push({sev:'fail',title:'Missing H1',desc:'Every page should have exactly one H1 as the primary topic.',weight:20,key:'no_h1'});}
  else if(counts.h1>1){
    issues.push({sev:'fail',title:`${counts.h1} H1 tags (should be exactly 1)`,desc:'Multiple H1s confuse search engines about the primary topic. Demote secondary H1s to H2.',weight:15,key:'multi_h1'});
    headings.filter(h=>h.level===1).slice(1).forEach(h=>h.issues.push('Duplicate H1'));
  }
  // 2) H2 missing
  if(counts.h2===0 && headings.length>1){issues.push({sev:'warn',title:'No H2 tags',desc:'H2 sections create scannable structure for both readers and AI.',weight:6,key:'no_h2'});}
  // 3) Skipped levels (H1 → H3 without H2)
  for(let i=1;i<headings.length;i++){
    const prev=headings[i-1];const curr=headings[i];
    if(curr.level>prev.level+1){
      curr.issues.push(`Skipped from H${prev.level} to H${curr.level}`);
      issues.push({sev:'warn',title:`Level skip: H${prev.level} → H${curr.level}`,desc:`"${curr.text.substring(0,60)}" skips a level. Use H${prev.level+1} or restructure.`,weight:4,key:'skip_'+i});
    }
  }
  // 4) Heading-less first paragraph (page should start with H1 in main)
  const firstHeading=headings.find(h=>h.inMain || (!h.inNav && h.level<=2));
  if(firstHeading && firstHeading.level!==1){
    issues.push({sev:'warn',title:'First main heading is not H1',desc:'First H-tag in main content should be H1.',weight:5,key:'first_not_h1'});
  }
  // 5) Empty headings
  const empty=headings.filter(h=>!h.text);
  if(empty.length){
    empty.forEach(h=>h.issues.push('Empty'));
    issues.push({sev:'fail',title:`${empty.length} empty heading(s)`,desc:'Empty headings break document outline for screen readers and SEO.',weight:8*empty.length,key:'empty'});
  }
  // 6) Length checks
  const tooLong=headings.filter(h=>h.charCount>70);
  tooLong.forEach(h=>h.issues.push(`Too long (${h.charCount}ch)`));
  if(tooLong.length){issues.push({sev:'warn',title:`${tooLong.length} long heading(s) (>70ch)`,desc:'Long headings are harder to scan and may indicate poor structure.',weight:2*tooLong.length,key:'too_long'});}
  // 7) Keyword in H1
  if(counts.h1>0 && st.kw){
    const h1=headings.find(h=>h.level===1);
    const hasKw=h1.text.toLowerCase().includes(st.kw.toLowerCase());
    if(!hasKw){
      h1.issues.push('Missing target keyword');
      issues.push({sev:'warn',title:'Target keyword not in H1',desc:`Add "${st.kw}" to H1 — strongest on-page ranking signal.`,weight:10,key:'no_kw_h1'});
    }
  }
  // 8) City in H1 (local relevance)
  if(counts.h1>0 && st.city){
    const h1=headings.find(h=>h.level===1);
    const hasCity=h1.text.toLowerCase().includes(st.city.toLowerCase());
    if(!hasCity){issues.push({sev:'warn',title:'City not in H1',desc:`Adding "${st.city}" to H1 strengthens local relevance signals.`,weight:7,key:'no_city_h1'});}
  }
  // 9) Duplicate heading text
  const seen={};
  headings.forEach(h=>{const k=h.text.toLowerCase();if(!seen[k])seen[k]=[];seen[k].push(h);});
  const dupes=Object.entries(seen).filter(([k,arr])=>k && arr.length>1);
  if(dupes.length){
    dupes.forEach(([_,arr])=>arr.forEach(h=>h.issues.push('Duplicate text')));
    issues.push({sev:'warn',title:`${dupes.length} duplicate heading text`,desc:`Same text used multiple times: "${dupes[0][0].substring(0,40)}…"`,weight:3*dupes.length,key:'dup_text'});
  }
  // 10) All-caps headings
  const caps=headings.filter(h=>h.text && h.text===h.text.toUpperCase() && h.text.length>6);
  if(caps.length){caps.forEach(h=>h.issues.push('All caps'));issues.push({sev:'warn',title:`${caps.length} all-caps heading(s)`,desc:'Use CSS text-transform, not literal caps — caps reduce scan-ability.',weight:2*caps.length,key:'caps'});}
  // 11) Total heading density
  if(headings.length<3){issues.push({sev:'warn',title:`Only ${headings.length} heading(s)`,desc:'Sparse heading structure. Add subheadings to break up long content.',weight:4,key:'too_few'});}
  // 12) Generic headings
  const generic=headings.filter(h=>/^(welcome|about us|services|home|contact|click here|read more)$/i.test(h.text.trim()));
  if(generic.length){generic.forEach(h=>h.issues.push('Generic'));issues.push({sev:'warn',title:`${generic.length} generic heading(s)`,desc:'Make headings descriptive ("About Our Plumbing Service in Denver" not "About Us").',weight:2*generic.length,key:'generic'});}

  // Score
  const totalWeight=100;
  const lost=issues.reduce((s,i)=>s+(i.sev==='fail'?i.weight:i.weight*0.5),0);
  const score=Math.max(0, Math.min(100, totalWeight-lost));

  // Build checks for "checks" tab
  const checks=[];
  const cKeys=new Set(issues.map(i=>i.key));
  const allPossibleChecks=[
    {key:'no_h1',t:'Exactly one H1',d:'Critical for SEO + accessibility.',weight:20},
    {key:'multi_h1',t:'Only one H1',d:'',weight:15},
    {key:'no_h2',t:'Has H2 sections',d:'',weight:6},
    {key:'skip',t:'No skipped levels',d:'H1→H2→H3 sequence respected.',weight:4},
    {key:'first_not_h1',t:'First main heading is H1',d:'',weight:5},
    {key:'empty',t:'No empty headings',d:'',weight:8},
    {key:'too_long',t:'No overly-long headings',d:'',weight:2},
    {key:'no_kw_h1',t:'Target keyword in H1',d:'',weight:10},
    {key:'no_city_h1',t:'City in H1',d:'',weight:7},
    {key:'dup_text',t:'Unique heading text',d:'',weight:3},
    {key:'caps',t:'No all-caps headings',d:'',weight:2},
    {key:'too_few',t:'Sufficient heading density',d:'',weight:4},
    {key:'generic',t:'Descriptive headings',d:'',weight:2},
  ];
  allPossibleChecks.forEach(c=>{
    const matched=issues.find(i=>i.key===c.key || (c.key==='skip' && i.key.startsWith('skip_')));
    if(matched){checks.push({status:matched.sev==='fail'?'fail':'warn', t:c.t, d:matched.desc, weight:c.weight});}
    else{checks.push({status:'pass', t:c.t, d:c.d||'OK', weight:c.weight});}
  });

  return {ts:'2026-05-29', url:state.url, title, headings, counts, issues, checks, score};
}

function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function render(){
  const r=state.results;
  if(!r){
    document.getElementById('cbody').innerHTML=`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="6" y1="3" x2="6" y2="21"/><line x1="6" y1="6" x2="14" y2="6"/><line x1="6" y1="12" x2="11" y2="12"/><line x1="6" y1="18" x2="9" y2="18"/></svg>
      <div class="et">Heading Hierarchy Auditor</div>
      <div class="ed">Audit your page's H1–H6 structure for SEO and accessibility. Detects duplicate H1s, skipped levels, missing landmarks, generic headings, empty tags, and local keyword placement. Visualizes your document outline like a screen reader experiences it.</div>
    </div>`;
    document.getElementById('stat-score').textContent='—';
    document.getElementById('stat-h1').textContent='0';
    document.getElementById('stat-issues').textContent='0';
    return;
  }
  document.getElementById('stat-score').textContent=r.score+'/100';
  document.getElementById('stat-h1').textContent=r.counts.h1||0;
  document.getElementById('stat-issues').textContent=r.issues.length;
  if(state.view==='overview') return renderOverview();
  if(state.view==='outline') return renderOutline();
  if(state.view==='checks') return renderChecks();
  if(state.view==='batch') return renderBatch();
  if(state.view==='guide') return renderGuide();
}

function renderOverview(){
  const r=state.results;
  const col=r.score>=80?'#16a34a':r.score>=60?'#d97706':'#dc2626';
  const dash=2*Math.PI*60, off=dash*(1-r.score/100);
  const fails=r.issues.filter(i=>i.sev==='fail').length;
  const warns=r.issues.filter(i=>i.sev==='warn').length;
  document.getElementById('cbody').innerHTML=`
    <div class="score-panel">
      <div class="score-circle">
        <svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" class="bg"/><circle cx="70" cy="70" r="60" class="fg" style="stroke:${col};stroke-dasharray:${dash};stroke-dashoffset:${off}"/></svg>
        <div class="score-text"><div class="v" style="color:${col}">${r.score}</div><div class="l">/ 100</div></div>
      </div>
      <div class="score-info">
        <h2>${escapeHtml(r.url)}</h2>
        <div class="sub">Page title: "${escapeHtml(r.title)}"<br>${r.headings.length} headings in document outline · ${r.score>=80?'Strong structure':r.score>=60?'Workable, fix warnings':'Significant issues'}</div>
        <div class="score-pills">
          <div class="sp bad">✗ ${fails} fail</div>
          <div class="sp warn">⚠ ${warns} warn</div>
          <div class="sp">${r.headings.length} headings</div>
        </div>
      </div>
    </div>
    <div class="h-counts">
      ${['h1','h2','h3','h4','h5','h6'].map(h=>`<div class="h-count ${h}"><div class="l">${h.toUpperCase()}</div><div class="v">${r.counts[h]||0}</div></div>`).join('')}
    </div>
    <div class="section"><div class="section-hdr"><h3>Top Issues</h3><span class="badge">${r.issues.length}</span></div><div class="check-list">
      ${r.issues.length?r.issues.map(i=>`<div class="check ${i.sev}"><div class="icon">${i.sev==='fail'?'✗':'!'}</div><div class="body"><div class="title">${escapeHtml(i.title)}</div><div class="desc">${escapeHtml(i.desc)}</div></div><div class="meta">${i.weight}pt</div></div>`).join(''):'<div style="padding:30px;text-align:center;color:var(--success);font-weight:700">✓ No issues detected</div>'}
    </div></div>
  `;
}

function renderOutline(){
  const r=state.results;
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Document Outline (${r.headings.length})</h3><span class="badge">As a screen reader sees it</span></div><div class="outline">
    ${r.headings.length?r.headings.map(h=>{
      const issueClass=h.issues.length?(h.issues.some(i=>i.includes('Duplicate H1')||i.includes('Empty'))?'issue':'warn'):'';
      return `<div class="outline-row ${issueClass} indent-${h.level}"><span class="htag h${h.level}">H${h.level}</span><div class="text">${escapeHtml(h.text||'(empty)')}${h.issues.length?`<div class="badges">${h.issues.map(i=>`<span class="badge-mini bad">${escapeHtml(i)}</span>`).join('')}</div>`:''}</div><div class="meta">${h.charCount}ch${h.inMain?' · in main':h.inNav?' · in nav':''}</div></div>`;
    }).join(''):'<div style="padding:30px;text-align:center;color:var(--text3)">No headings found</div>'}
  </div></div>`;
}

function renderChecks(){
  const r=state.results;
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>All Checks (${r.checks.length})</h3></div><div class="check-list">
    ${r.checks.map(c=>`<div class="check ${c.status}"><div class="icon">${c.status==='pass'?'✓':c.status==='warn'?'!':c.status==='fail'?'✗':'i'}</div><div class="body"><div class="title">${escapeHtml(c.t)}</div><div class="desc">${escapeHtml(c.d)}</div></div><div class="meta">${c.weight}pt</div></div>`).join('')}
  </div></div>`;
}

function renderBatch(){
  const rs=state.batchResults||[];
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Batch Audit (${rs.length})</h3></div><div>
    ${rs.length?rs.sort((a,b)=>a.score-b.score).map(r=>`<div style="padding:12px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:50px 1fr auto auto;gap:11px;align-items:center;cursor:pointer" onclick="loadBatchItem('${escapeAttr(r.url)}')">
      <div style="width:44px;height:44px;border-radius:9px;background:${r.score>=80?'var(--success)':r.score>=60?'var(--warn)':'var(--danger)'};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:var(--mono);font-size:14px">${r.score}</div>
      <div style="min-width:0"><div style="font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.title||r.url)}</div><div style="font-size:10.5px;color:var(--text3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.url)}</div></div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--text2);text-align:center">H1: <strong>${r.counts?.h1||0}</strong></div>
      <div style="font-family:var(--mono);font-size:11px;color:var(--text2);text-align:right">${r.issues?.length||0} issues</div>
    </div>`).join(''):'<div style="padding:40px;text-align:center;color:var(--text3)">Paste URLs in Batch Mode (left) and run</div>'}
  </div></div>`;
}
function loadBatchItem(url){const r=state.batchResults.find(x=>x.url===url);if(!r)return;state.url=r.url;state.results=r;fillInputs();saveState();setTab('overview');}

function renderGuide(){
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Heading Hierarchy Best Practices</h3></div><div style="padding:18px;font-size:13px;line-height:1.7;color:var(--text2)">
    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700">The 4 Rules</h4>
    <ol style="padding-left:22px;margin-top:6px">
      <li><strong>Exactly one H1 per page</strong> — describes the page's primary topic</li>
      <li><strong>No skipped levels</strong> — H1 → H2 → H3, never H1 → H3</li>
      <li><strong>Sequential, not just stylistic</strong> — pick the heading level by document structure, not visual size</li>
      <li><strong>Use CSS for styling</strong> — change appearance via <code>font-size</code>, not by jumping to a different H tag</li>
    </ol>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">For Local SEO Specifically</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li>Include <strong>target keyword + city in H1</strong>: "Emergency Plumber in Denver — 24/7 Service"</li>
      <li>Use <strong>H2s for service areas / cities</strong> on location pages</li>
      <li>Use <strong>H2/H3 for FAQ questions</strong> (helps with featured snippets)</li>
      <li>Don't stuff keywords into every heading — variation looks more natural</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Common Mistakes</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li>Multiple H1s (logo + page title both wrapped in H1)</li>
      <li>Generic headings ("About Us", "Services", "Contact")</li>
      <li>Empty H tags used as decorative dividers</li>
      <li>Hidden H tags (display:none) — Google still reads them</li>
      <li>Putting heading text inside <strong>&lt;img alt=""&gt;</strong> instead of real H tags</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Accessibility Tie-in</h4>
    <p>Screen reader users navigate by heading. A logical H1 → H2 → H3 outline lets them skim quickly. Skipped levels confuse them and signal a poorly-structured page to Google.</p>
  </div></div>`;
}

function exportCSV(){
  if(!state.results){toast('Nothing to export','err');return;}
  const r=state.results;
  const rows=[['level','text','char_count','issues','in_main','in_nav']];
  r.headings.forEach(h=>rows.push(['H'+h.level, h.text, h.charCount, h.issues.join('; '), h.inMain, h.inNav]));
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='heading-audit.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('CSV exported','success');
}
function exportReport(){
  if(!state.results){toast('Nothing to export','err');return;}
  const r=state.results;
  const css=`*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{padding:24px;background:#f3f6fb;color:#0f1a2e;font-size:13px;line-height:1.55}.wrap{max-width:920px;margin:0 auto;background:#fff;border-radius:14px;padding:36px}h1{font-size:24px;font-weight:800;border-bottom:3px solid #0891b2;padding-bottom:12px}h2{font-size:17px;font-weight:700;margin:22px 0 10px;color:#0891b2}.sc{display:flex;align-items:center;gap:18px;margin:16px 0;padding:16px;background:#f3f6fb;border-radius:10px}.sv{font-size:54px;font-weight:900;color:#0891b2;font-family:'JetBrains Mono',monospace}.h{padding:8px 11px;background:#f3f6fb;border-radius:6px;margin-bottom:4px;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}.htag{font-family:monospace;font-weight:800;font-size:10px;padding:3px 5px;border-radius:4px;color:#fff;text-align:center}.h1 .htag{background:#0891b2}.h2 .htag{background:#7c3aed}.h3 .htag{background:#db2777}.h4 .htag{background:#ea580c}.h5 .htag{background:#16a34a}.h6 .htag{background:#5b6b88}.iss{font-size:10px;color:#dc2626;font-weight:700}`;
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Heading Audit</title><style>${css}</style></head><body><div class="wrap">
<h1>Heading Hierarchy Audit</h1>
<p style="color:#5b6b88">${state.url} · ${r.ts}</p>

/* Inherit */
(function(){
  if(!state.url){try{const cf=JSON.parse(localStorage.getItem('cf_state_v1')||'null');const b=cf?.businesses?.[0];if(b){if(b.website)state.url=b.website;if(b.city)state.city=b.city;if(b.category)state.kw=b.category;}}catch(e){}}
  if(!state.kw){try{const kw=JSON.parse(localStorage.getItem('kw_state_v1')||'null');if(kw?.keywords?.length){const sel=kw.keywords.find(k=>k.selected)||kw.keywords[0];if(sel)state.kw=sel.kw;}}catch(e){}}
})();

fillInputs();
render();
window.addEventListener('beforeunload',saveState);
</script>
