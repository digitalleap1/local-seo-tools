<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260">
  <!-- 3 dots -->
  <circle cx="18" cy="148" r="5" fill="#1a2d6e"/>
  <circle cx="32" cy="133" r="5" fill="#1a2d6e"/>
  <circle cx="46" cy="118" r="5" fill="#1a2d6e"/>

  <!-- Map pin shadow -->
  <ellipse cx="102" cy="210" rx="42" ry="13" fill="#1a2d6e"/>

  <!-- Map pin body -->
  <path d="M102 22 C76 22 55 43 55 70 C55 108 102 205 102 205 C102 205 149 108 149 70 C149 43 128 22 102 22Z" fill="#4caf50"/>

  <!-- Map pin inner circle -->
  <circle cx="102" cy="70" r="22" fill="#1a2d6e"/>

  <!-- Stick figure person (jumping/leaping over pin) -->
  <!-- Head -->
  <circle cx="120" cy="10" r="13" fill="#e91e8c"/>
  <!-- Body -->
  <line x1="120" y1="23" x2="108" y2="48" stroke="#e91e8c" stroke-width="7" stroke-linecap="round"/>
  <!-- Left arm up-right -->
  <line x1="115" y1="33" x2="145" y2="16" stroke="#e91e8c" stroke-width="7" stroke-linecap="round"/>
  <!-- Right arm left -->
  <line x1="115" y1="33" x2="88" y2="22" stroke="#e91e8c" stroke-width="7" stroke-linecap="round"/>
  <!-- Right leg bent back-right -->
  <line x1="108" y1="48" x2="128" y2="62" stroke="#e91e8c" stroke-width="7" stroke-linecap="round"/>
  <!-- Left leg extended left -->
  <line x1="108" y1="48" x2="84" y2="38" stroke="#e91e8c" stroke-width="7" stroke-linecap="round"/>

  <!-- "GE" text -->
  <text x="170" y="120" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="90" fill="#1a2d6e" letter-spacing="-2">GE</text>

  <!-- Globe circle (replacing the O in GEO) -->
  <circle cx="380" cy="73" r="44" fill="#1565c0"/>
  <!-- Globe continent shapes (simplified) -->
  <ellipse cx="370" cy="65" rx="18" ry="14" fill="#4caf50" transform="rotate(-15 370 65)"/>
  <ellipse cx="392" cy="80" rx="10" ry="8" fill="#4caf50" transform="rotate(10 392 80)"/>
  <ellipse cx="362" cy="85" rx="7" ry="10" fill="#4caf50" transform="rotate(-5 362 85)"/>
  <!-- Globe outline -->
  <circle cx="380" cy="73" r="44" fill="none" stroke="#1a2d6e" stroke-width="3"/>
  <!-- Globe latitude lines -->
  <ellipse cx="380" cy="73" rx="44" ry="22" fill="none" stroke="#1a2d6e" stroke-width="1.5" opacity=".4"/>
  <!-- Globe vertical line -->
  <line x1="380" y1="29" x2="380" y2="117" stroke="#1a2d6e" stroke-width="1.5" opacity=".4"/>

  <!-- "tag" text -->
  <text x="170" y="178" font-family="Arial Black,Impact,sans-serif" font-weight="900" font-size="58" fill="#4caf50">tag</text>

  <!-- "tool" text -->
  <text x="310" y="178" font-family="Arial,sans-serif" font-weight="400" font-size="58" fill="#1a2d6e">tool</text>
</svg>
