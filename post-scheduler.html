<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBP Post Scheduler - AI-Generated Google Business Profile Posts with Calendar</title>
<meta name="description" content="Bulk generate Google Business Profile posts (Updates, Offers, Events) tuned to your brand voice. Visual calendar, ICS export, copy-paste ready output. AI-powered (5 providers) with offline template fallback. 100% client-side, integrates with Citation Finder and GBP Audit.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#d97706; --accent-h:#b45309; --accent-soft:rgba(217,119,6,.08);
  --teal:#0d9488;
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#f59e0b; --accent-h:#fbbf24; --accent-soft:rgba(245,158,11,.14);
  --teal:#14b8a6;
  --danger:#ef4444; --success:#22c55e;
  --purple:#a78bfa; --pink:#ec4899; --blue:#3b82f6;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(217,119,6,.3)}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--purple);border:1px solid var(--purple);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.posts strong{color:var(--accent)}
.hdr-stat.sched strong{color:var(--blue)}
.hdr-stat.draft strong{color:var(--text3)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none;transition:all .15s}
.hdr-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hdr-link svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

#app{flex:1;display:flex;overflow:hidden}

/* LEFT */
#left{width:300px;min-width:280px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:6px}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;flex:1}

#left-body{flex:1;overflow-y:auto;padding:12px}

.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;color:var(--text);flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}

.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f textarea{font-family:var(--font);min-height:48px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.tpills{display:flex;flex-wrap:wrap;gap:4px}
.tpill{padding:5px 10px;border-radius:5px;font-size:10.5px;font-family:var(--mono);font-weight:700;background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s}
.tpill:hover{border-color:var(--accent);color:var(--accent)}
.tpill.active{background:var(--accent);border-color:var(--accent);color:#fff}

.pp-row{display:flex;flex-wrap:wrap;gap:4px}
.pp{padding:5px 9px;border-radius:5px;font-size:10px;font-family:var(--mono);font-weight:700;background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer}
.pp:hover{border-color:var(--accent);color:var(--accent)}
.pp.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pp .free{font-size:9px;background:rgba(255,255,255,.25);padding:1px 4px;border-radius:3px;margin-left:4px}
.pp:not(.active) .free{background:rgba(22,163,74,.13);color:var(--success)}

.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

/* CENTER */
#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab svg{width:13px;height:13px}
.tab .count{font-family:var(--mono);background:rgba(255,255,255,.25);border-radius:3px;padding:0 5px;font-size:10px}
.tab:not(.active) .count{background:var(--bg);color:var(--text2)}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
.cb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-btn svg{width:13px;height:13px}

#cbody{flex:1;overflow-y:auto;background:var(--bg);padding:14px}

/* CALENDAR */
.cal-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal-hdr h2{font-size:18px;font-weight:800;flex:1}
.cal-nav{display:flex;gap:5px}
.cal-nav button{width:32px;height:32px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-weight:700}
.cal-nav button:hover{border-color:var(--accent);color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.cal-dh{background:var(--bg3);padding:7px;text-align:center;font-size:10.5px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.cal-cell{background:var(--bg2);min-height:110px;padding:6px;cursor:pointer;transition:background .12s;position:relative;display:flex;flex-direction:column;gap:3px}
.cal-cell:hover{background:var(--bg3)}
.cal-cell.other{opacity:.4}
.cal-cell.today{background:rgba(217,119,6,.05)}
.cal-cell.today .cd{color:var(--accent)}
.cal-cell.weekend .cd{color:var(--text3)}
.cal-cell .cd{font-size:11.5px;font-weight:700;color:var(--text);font-family:var(--mono)}
.cal-pp{font-size:10px;padding:3px 5px;border-radius:3px;background:var(--bg3);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600;line-height:1.3;border-left:3px solid var(--text3)}
.cal-pp:hover{background:var(--accent-soft);color:var(--accent)}
.cal-pp.t-update{border-left-color:var(--blue)}
.cal-pp.t-offer{border-left-color:var(--success)}
.cal-pp.t-event{border-left-color:var(--purple)}
.cal-pp.t-news{border-left-color:var(--amber)}
.cal-pp.draft{opacity:.55;font-style:italic}
.cal-pp .icon{font-size:10px;margin-right:2px}

/* LIST VIEW */
.post-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.post-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--text3)}
.post-card.t-update::before{background:var(--blue)}
.post-card.t-offer::before{background:var(--success)}
.post-card.t-event::before{background:var(--purple)}
.post-card.t-news::before{background:var(--amber)}
.post-card .pc-hdr{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.post-card .pc-type{display:flex;align-items:center;gap:5px;font-size:10.5px;font-family:var(--mono);font-weight:700;padding:3px 9px;border-radius:5px;background:var(--bg3);text-transform:uppercase;letter-spacing:.4px;color:var(--text)}
.post-card .pc-date{font-size:11px;font-family:var(--mono);color:var(--text2)}
.post-card .pc-status{margin-left:auto;font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.post-card .pc-status.draft{background:var(--bg3);color:var(--text3)}
.post-card .pc-status.scheduled{background:rgba(37,99,235,.13);color:var(--blue)}
.post-card .pc-status.posted{background:rgba(22,163,74,.13);color:var(--success)}
.post-card .pc-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px}
.post-card .pc-body{font-size:12.5px;color:var(--text);line-height:1.6;white-space:pre-wrap;background:var(--bg);padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-family:var(--font)}
.post-card .pc-meta{font-size:10.5px;color:var(--text3);font-family:var(--mono);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.post-card .pc-meta strong{color:var(--text2)}
.post-card .pc-actions{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.post-card .pc-actions button, .post-card .pc-actions a{padding:6px 11px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:4px;text-decoration:none;transition:all .15s}
.post-card .pc-actions button:hover, .post-card .pc-actions a:hover{border-color:var(--accent);color:var(--accent)}
.post-card .pc-actions svg{width:11px;height:11px}
.post-card .pc-actions .copy{margin-left:auto;background:var(--accent);border-color:var(--accent);color:#fff}
.post-card .pc-actions .copy:hover{background:var(--accent-h);color:#fff}

/* EDIT MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:hidden;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.modal-hdr h2{font-size:14px;font-weight:700;flex:1}
.modal-hdr .close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-hdr .close:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg3)}
.modal-foot button{padding:8px 14px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.modal-foot button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;font-weight:600}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text)}
.field textarea{font-family:var(--font);line-height:1.5;min-height:120px;resize:vertical}
.field .hint{font-size:10.5px;color:var(--text3);font-family:var(--mono);line-height:1.5}
.field .hint a{color:var(--accent)}
.field .char-count{font-size:10px;color:var(--text3);font-family:var(--mono);text-align:right;margin-top:2px}
.field .char-count.warn{color:var(--amber)}
.field .char-count.over{color:var(--danger);font-weight:700}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:560px}

.progress-line{height:3px;background:var(--bg3);overflow:hidden;flex-shrink:0}
.progress-line .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));width:0;transition:width .3s}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-item{display:flex;align-items:center;gap:5px}
.ft-item svg{width:12px;height:12px}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
#toast.info{border-color:var(--accent);color:var(--accent)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:300px}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </div>
    <div><div class="logo-name">Post<span>Scheduler</span></div></div>
    <span class="logo-tag">GBP</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat posts"><strong id="stat-posts">0</strong> posts</div>

  <div class="hdr-spacer"></div>

    GBP Audit
  </a>
  <a href="review-reply.html" class="hdr-link" title="Review Reply Generator" style="border-color:rgba(219,39,119,.4);color:var(--pink)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    Reply
  </a>
  <a href="dashboard.html" class="hdr-link" title="Unified Dashboard & Report" style="border-color:rgba(37,99,235,.4);color:#2563eb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </a>
  <a href="ai-assistant.html" class="hdr-link" title="AI Assistant" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
    AI

<script>
/* ==========================================================================
 * GBP POST SCHEDULER & AI GENERATOR
 * Visual calendar, AI-generated posts, ICS export, bulk generation
 * ========================================================================== */

/* ---------- POST TEMPLATES (OFFLINE FALLBACK) ---------- */
const TEMPLATE_HOOKS = {
  update: ['Quick update from our team', 'New this week', 'A note from {biz}', 'Did you know?', 'Behind the scenes', 'Project spotlight', 'Customer story'],
  offer:  ['Limited-time offer', 'This week only', 'Save on {service}', 'Welcome offer for new customers', 'Refer a friend & save', 'End of season special'],
  event:  ['You\'re invited', 'Join us on {date}', 'Free workshop coming up', 'Open house at our shop', 'Community day at {biz}'],
  news:   ['Pro tip from {biz}', 'How to {topic}', 'Common mistake to avoid', '5 questions to ask before hiring a {industry}', 'Maintenance checklist for this season'],
};

const TIPS_BY_INDUSTRY = {
  plumber: ['check for slow drains before they turn into clogs', 'inspect your water heater for sediment buildup yearly', 'know where your main shutoff valve is in case of emergency', 'flush water heaters annually for longer life', 'never put coffee grounds down the disposal'],
  electrician: ['never overload an outlet with too many extension cords', 'replace flickering light fixtures before they fail', 'install AFCI breakers in bedrooms for fire safety', 'test GFCI outlets monthly with the test button'],
  restaurant: ['seasonal menu items change every Tuesday', 'reservations book up two weeks in advance for weekends', 'private events welcome — ask about our chef\'s table'],
  dentist: ['floss before brushing for better plaque removal', 'replace your toothbrush every 3 months', 'don\'t skip your 6-month cleaning', 'use a soft-bristled brush — medium and hard cause recession'],
  lawyer: ['document everything in writing — texts count', 'know your statute of limitations', 'never sign anything you don\'t understand'],
  realtor: ['get pre-approved before house hunting', 'spring listings sell 9% faster than fall', 'curb appeal returns 7× its cost'],
  salon: ['conditioner first, then shampoo — try it on color-treated hair', 'silk pillowcases prevent breakage', 'book your next appointment before you leave'],
  gym: ['progressive overload beats workout variety', 'sleep is the most underrated recovery tool', 'compound lifts give the best bang for your time'],
  auto: ['check your tire pressure monthly', 'change oil every 5,000 miles for synthetic', 'rotate tires every 6,000 miles', 'cabin air filters affect HVAC efficiency'],
  contractor: ['always pull a permit for structural work', 'get three quotes before signing', 'check licensing and insurance before hiring'],
};

function offlineGenerate(type, brand, opts){
  const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
  const sub = s => String(s||'').replace('{biz}', brand.name||'us').replace('{industry}', brand.industry||'pro').replace('{service}', pick((brand.services||'').split(',').map(s=>s.trim()).filter(Boolean))||'our service').replace('{topic}', opts?.topic||'fix a common problem').replace('{date}', opts?.date?new Date(opts.date).toLocaleDateString():'');
  const hook = sub(pick(TEMPLATE_HOOKS[type]||TEMPLATE_HOOKS.update));
  const services = (brand.services||'').split(',').map(s=>s.trim()).filter(Boolean);
  const city = brand.city || 'your area';
  let body = '';
  if(type==='update'){
    body = `${hook}.\n\nThe ${brand.name||'team'} ${city?`in ${city}`:''} has been hard at work helping ${city||'customers'} with ${services.slice(0,3).join(', ')||'their needs'}. ${brand.tone==='warm'?'We genuinely love what we do, and we\'re grateful for every customer that walks through the door.':brand.tone==='urgent'?'We respond fast — emergencies don\'t wait.':'Quality, transparency, and trust drive everything we do.'}\n\nWant to learn more or get started? Get in touch.`;
  } else if(type==='offer'){
    const offers = ['$50 off your first service', '15% off this week', 'Free inspection with any service over $200', 'Refer a friend — both save $25', 'Welcome offer: complimentary consultation'];
    body = `${pick(offers)} — ${hook.toLowerCase()}.\n\nFor a limited time, ${brand.name||'we'} ${city?`in ${city}`:''} is offering this special on ${services[0]||'our most-requested service'}. ${opts?.terms?`Terms: ${opts.terms}.`:''}\n\nCall or book online to claim. Offer ends ${opts?.endDate?new Date(opts.endDate).toLocaleDateString():'this Sunday'}.`;
  } else if(type==='event'){
    body = `${hook}!\n\n${brand.name||'We'} ${city?`in ${city}`:''} is hosting ${opts?.eventName||'an open house'}${opts?.eventStart?` on ${new Date(opts.eventStart).toLocaleDateString()} at ${new Date(opts.eventStart).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`:''}. Come meet the team, see what we do, and ${brand.tone==='playful'?'enjoy some refreshments on us':'ask anything you\'ve been wondering about'}.\n\n${opts?.eventEnd?`We\'ll wrap up by ${new Date(opts.eventEnd).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`:'Stop by anytime'}. RSVP not required, but appreciated.`;
  } else if(type==='news'){
    const tip = (TIPS_BY_INDUSTRY[brand.industry||'']||['most issues can be prevented with regular maintenance'])[Math.floor(Math.random()*1000)%((TIPS_BY_INDUSTRY[brand.industry||'']||['x']).length||1)];
    body = `${hook}: ${tip}.\n\nMany ${city||''} customers ask us about this. The reality? Small habits make a big difference — and most problems are far cheaper to prevent than fix.\n\nQuestions? We're happy to walk you through it. No pressure, just honest advice.`;
  }
  return {title: hook, body: body.trim()};
}

/* ---------- AI PROVIDERS ---------- */
const AI_PROVIDERS = {
  gemini: {label:'Gemini', free:'free', fields:[{key:'key',label:'API Key',type:'password'}],
    note:'<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>',
    async ask(prompt, keys){
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(keys.key)}`;
      const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({contents:[{parts:[{text:prompt}]}], generationConfig:{temperature:0.85}})});
      if(!res.ok) throw new Error('Gemini '+res.status);
      const j = await res.json(); return j.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }
  },
  openai: {label:'OpenAI', free:'paid', fields:[{key:'key',label:'API Key',type:'password'}],
    async ask(prompt, keys){
      const res = await fetch('https://api.openai.com/v1/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${keys.key}`}, body:JSON.stringify({model:'gpt-4o-mini', messages:[{role:'user',content:prompt}], temperature:0.85})});
      if(!res.ok) throw new Error('OpenAI '+res.status);
      const j = await res.json(); return j.choices?.[0]?.message?.content || '';
    }
  },
  claude: {label:'Claude', free:'paid', fields:[{key:'key',label:'API Key',type:'password'}],
    async ask(prompt, keys){
      const res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', headers:{'Content-Type':'application/json','x-api-key':keys.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}, body:JSON.stringify({model:'claude-haiku-4-5-20251001', max_tokens:600, messages:[{role:'user',content:prompt}]})});
      if(!res.ok) throw new Error('Claude '+res.status);
      const j = await res.json(); return j.content?.[0]?.text || '';
    }
  },
  groq: {label:'Groq', free:'free', fields:[{key:'key',label:'API Key',type:'password'}],
    async ask(prompt, keys){
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${keys.key}`}, body:JSON.stringify({model:'llama-3.3-70b-versatile', messages:[{role:'user',content:prompt}], temperature:0.85})});
      if(!res.ok) throw new Error('Groq '+res.status);
      const j = await res.json(); return j.choices?.[0]?.message?.content || '';
    }
  },
  openrouter: {label:'OpenRouter', free:'free', fields:[{key:'key',label:'API Key',type:'password'},{key:'model',label:'Model',type:'text',placeholder:'meta-llama/llama-3.3-70b-instruct:free'}],
    async ask(prompt, keys){
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${keys.key}`,'HTTP-Referer':'https://post-scheduler.local','X-Title':'PostScheduler'}, body:JSON.stringify({model:keys.model||'meta-llama/llama-3.3-70b-instruct:free', messages:[{role:'user',content:prompt}], temperature:0.85})});
      if(!res.ok) throw new Error('OpenRouter '+res.status);
      const j = await res.json(); return j.choices?.[0]?.message?.content || '';
    }
  },
};

/* ---------- STATE ---------- */
const STORE_KEY = 'ps_state_v1';
const defaultState = {
  brand: {name:'', industry:'', city:'', services:'', tone:'professional', cta:'call', url:'', phone:''},
  ai: {provider:'gemini', keys:{}},
  gen: {types:['update','offer'], cadence:'twice', start:'', weeks:4, days:[1,3,5], time:'09:00'},
  posts: [],   // [{id, type, title, body, status, date, time, cta, ctaUrl, image, code, terms, eventStart, eventEnd, offerStart, offerEnd, createdAt}]
  view: {month: null, tab:'cal'},
};
let state = loadState();
function loadState(){ try { return Object.assign(clone(defaultState), JSON.parse(localStorage.getItem(STORE_KEY))||{}); } catch(e){ return clone(defaultState); } }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return Math.random().toString(36).slice(2,11)+Date.now().toString(36).slice(-4);}

// Auto-inherit AI keys + brand from other tools
(function inherit(){
  try {
    // Brand from review-reply
    if(!state.brand.name){
      const rr = JSON.parse(localStorage.getItem('rr_state_v1')||'null');
      if(rr?.brand){
        state.brand.name = rr.brand.name||state.brand.name;
        state.brand.industry = rr.brand.industry||state.brand.industry;
        state.brand.tone = rr.brand.tone||state.brand.tone;
        state.brand.phone = rr.brand.phone||state.brand.phone;
      }
    }
    // Brand from citation finder
    if(!state.brand.name){
      const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
      const b = cf?.businesses?.[0];
      if(b){ state.brand.name = b.name; state.brand.city = b.city; state.brand.url = b.website; state.brand.phone = b.phone; }
    }
    // AI keys
    if(!Object.keys(state.ai.keys).length){
      ['gbp_state_v1','rr_state_v1','ai_state_v1','kw_state_v1'].forEach(k=>{
        const o = JSON.parse(localStorage.getItem(k)||'null');
        if(o?.ai?.keys){ Object.entries(o.ai.keys).forEach(([id, keys])=>{if(keys.key && !state.ai.keys[id]?.key) state.ai.keys[id] = clone(keys);}); }
      });
    }
  } catch(e){}
  if(!state.view.month){ state.view.month = new Date().toISOString().slice(0,7); }
  if(!state.gen.start){ state.gen.start = new Date().toISOString().slice(0,10); }
  saveState();
})();

/* ---------- THEME ---------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);

/* ---------- BATCH GENERATION ---------- */
async function generateBatch(){
  if(!state.brand.name){ toast('Set business name first','err'); return; }
  if(!state.gen.types.length){ toast('Select at least one post type','err'); return; }
  if(!state.gen.days.length){ toast('Select at least one day','err'); return; }
  saveBrand();
  // Compute schedule dates
  const startDate = new Date(state.gen.start);
  const endDate = new Date(startDate); endDate.setDate(endDate.getDate() + state.gen.weeks*7);
  const cadence = ({weekly:1, twice:2, thrice:3, daily:7})[state.gen.cadence] || 2;
  const dates = [];
  const cur = new Date(startDate);
  while(cur < endDate){
    if(state.gen.days.includes(cur.getDay())){
      dates.push(new Date(cur));
    }
    cur.setDate(cur.getDate()+1);
  }
  // Limit to cadence per week
  const perWeek = cadence;
  const filtered = [];
  let lastWeek = -1, weekCount = 0;
  dates.forEach(d=>{
    const week = Math.floor((d - startDate)/(7*24*3600*1000));
    if(week!==lastWeek){ weekCount=0; lastWeek=week; }
    if(weekCount<perWeek){ filtered.push(d); weekCount++; }
  });
  if(!filtered.length){ toast('No valid dates — check days/start/weeks','err'); return; }

  document.getElementById('prog-fill').style.width = '5%';
  document.getElementById('ft-status').textContent = `Generating ${filtered.length} posts...`;
  const aiReady = state.ai.keys[state.ai.provider]?.key;

  let i = 0;
  for(const date of filtered){
    const type = state.gen.types[i % state.gen.types.length];
    let post;
    if(aiReady){
      try { post = await aiGenerate(type, state.brand, {date: date.toISOString()}); }
      catch(e){ post = offlineGenerate(type, state.brand, {date: date.toISOString()}); }
    } else {
      post = offlineGenerate(type, state.brand, {date: date.toISOString()});
    }
    state.posts.push({
      id: uid(), type, title: post.title, body: post.body, status:'draft',
      date: date.toISOString().slice(0,10), time: state.gen.time,
      cta: state.brand.cta, ctaUrl: state.brand.url, image:'',
      createdAt: Date.now(),
    });
    i++;
    document.getElementById('prog-fill').style.width = (i/filtered.length*100)+'%';
    document.getElementById('ft-status').textContent = `Generated ${i}/${filtered.length}`;
    renderAll();
    if(aiReady) await sleep(500);
  }
  document.getElementById('prog-fill').style.width = '0';
  saveState();
  toast(`Generated ${filtered.length} posts (${aiReady?'AI':'offline'})`, 'success');
}

async function aiGenerate(type, brand, opts){
  const p = AI_PROVIDERS[state.ai.provider]; const keys = state.ai.keys[state.ai.provider];
  const typeLabel = ({update:'Update post (general business news, no offer)', offer:'Offer post (specific time-limited discount or promotion)', event:'Event post (specific date + time for an in-person event)', news:'News/Tip post (educational, helpful tip for customers)'})[type];
  const prompt = `Generate ONE Google Business Profile post for ${brand.name||'a local business'} (${brand.industry||'general'}${brand.city?', '+brand.city:''}).

POST TYPE: ${typeLabel}
TONE: ${brand.tone}
BRAND SERVICES: ${brand.services||'(unspecified)'}
TARGET DATE: ${opts?.date?new Date(opts.date).toLocaleDateString():'this week'}

Requirements:
- Title: max 60 characters, captures attention without being clickbaity
- Body: 150-400 characters, conversational, ends with a soft CTA
- ${type==='offer'?'Mention a SPECIFIC, plausible discount or promo — not vague.':type==='event'?'Treat as a real event with a date and venue.':type==='news'?'Give a specific actionable tip — never generic platitudes.':'Sound like a real human posting, not corporate marketing.'}
- Use ${brand.city?`"${brand.city}"`:'the city'} naturally if relevant.
- No emojis.
- No hashtags.
- No "we are excited to announce" or other corporate clichés.

Output as plain text in this EXACT format:
TITLE: [title here]
BODY:
[body here, multiple lines OK]

Nothing else.`;
  const ans = await p.ask(prompt, keys);
  const titleM = ans.match(/TITLE:\s*(.+?)\n/i);
  const bodyM = ans.match(/BODY:\s*([\s\S]+)/i);
  return {
    title: titleM ? titleM[1].trim() : (ans.split('\n')[0]||'').slice(0,60),
    body: bodyM ? bodyM[1].trim() : ans.trim(),
  };
}

function renderCalendar(){
  const [yr, mo] = (state.view.month||new Date().toISOString().slice(0,7)).split('-').map(Number);
  const first = new Date(yr, mo-1, 1);
  const last = new Date(yr, mo, 0);
  const monthName = first.toLocaleString('en', {month:'long', year:'numeric'});
  const startDay = first.getDay();
  const days = last.getDate();
  const cells = [];
  // Prev month tail
  const prevDays = new Date(yr, mo-1, 0).getDate();
  for(let i=startDay-1;i>=0;i--) cells.push({d:prevDays-i, other:true, dateStr:`${yr}-${pad(mo-1||12)}-${pad(prevDays-i)}`});
  // This month
  for(let d=1;d<=days;d++) cells.push({d, dateStr:`${yr}-${pad(mo)}-${pad(d)}`});
  // Next month head
  while(cells.length%7) cells.push({d:cells.length-startDay-days+1, other:true, dateStr:''});

  const today = new Date().toISOString().slice(0,10);
  const dayHdrs = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('cbody').innerHTML = `
    <div class="cal-hdr">
      <h2>${monthName}</h2>
      <div class="cal-nav">
        <button onclick="prevMonth()">‹</button>
        <button onclick="thisMonth()">Today</button>
        <button onclick="nextMonth()">›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${dayHdrs.map(d=>`<div class="cal-dh">${d}</div>`).join('')}
      ${cells.map(c=>{
        const isToday = c.dateStr===today;
        const isWeekend = c.dateStr && [0,6].includes(new Date(c.dateStr).getDay());
        const posts = state.posts.filter(p=>p.date===c.dateStr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
        return `<div class="cal-cell ${c.other?'other':''} ${isToday?'today':''} ${isWeekend?'weekend':''}" onclick="openDayPosts('${c.dateStr}')">
          <div class="cd">${c.d}</div>
          ${posts.slice(0,3).map(p=>`<div class="cal-pp t-${p.type} ${p.status==='draft'?'draft':''}" onclick="event.stopPropagation();openEdit('${p.id}')"><span class="icon">${({update:'📢',offer:'🎟',event:'🗓',news:'💡'})[p.type]||'•'}</span>${escapeHtml((p.title||p.body).slice(0,28))}</div>`).join('')}
          ${posts.length>3?`<div style="font-size:9.5px;color:var(--text3);font-family:var(--mono);text-align:center">+${posts.length-3} more</div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:14px;font-size:11px;color:var(--text2);display:flex;gap:14px;flex-wrap:wrap">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:2px;margin-right:5px"></span>Update</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--success);border-radius:2px;margin-right:5px"></span>Offer</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--purple);border-radius:2px;margin-right:5px"></span>Event</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--amber);border-radius:2px;margin-right:5px"></span>News/Tip</span>
      <span style="margin-left:auto;color:var(--text3)">Click a post to edit, click a day to add</span>
    </div>
  `;
}

    {type:'update', icon:'📢', title:'New service launch', body:`Big news from ${state.brand.name||'our team'} — we just rolled out [new service]. It's something customers have been asking about for a while, and we're excited to finally offer it.\n\nLearn more on our site or just give us a call.`},
    {type:'update', icon:'📢', title:'Team behind the work', body:`Behind every job is a team that cares. Our ${state.brand.industry||'staff'} brings [X years] of experience and the kind of attention to detail that turns one-time customers into repeat ones.\n\nMeet the team next time you're in.`},
    {type:'offer',  icon:'🎟', title:'New customer discount', body:`Welcome to ${state.brand.city||'our area'}? Get $XX off your first ${(state.brand.services||'').split(',')[0]||'service'} with ${state.brand.name||'us'}.\n\nMention this post when you call. Valid through [date].`},
    {type:'offer',  icon:'🎟', title:'Seasonal special', body:`Spring tune-up special: $XX off any ${(state.brand.services||'').split(',')[0]||'service'} through [date].\n\nLimited slots — book now to lock in your time.`},
    {type:'event',  icon:'🗓', title:'Open house', body:`Stop by our ${state.brand.city||''} location on [date] from [time] for an open house. Meet the team, tour the shop, and ${state.brand.industry==='restaurant'?'try some samples':'see how we work'}.\n\nNo RSVP needed — just come.`},
    {type:'news',   icon:'💡', title:'Common mistake to avoid', body:`Pro tip from ${state.brand.name||'us'}: [specific tip]. We see this all the time, and the fix is usually simple if you catch it early.\n\nQuestions? Happy to walk you through it.`},
    {type:'news',   icon:'💡', title:'Seasonal checklist', body:`Heading into ${['spring','summer','fall','winter'][Math.floor((new Date().getMonth())/3)]}? Here's a quick checklist for ${state.brand.industry||'your home'}:\n\n• [item 1]\n• [item 2]\n• [item 3]\n\nCall if you need help on any of these.`},
  ];
  document.getElementById('cbody').innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">${lib.map(t=>`<div class="post-card t-${t.type}"><div class="pc-hdr"><span class="pc-type">${t.icon} ${t.type}</span><span style="margin-left:auto"><button class="cb-btn" onclick="useTemplate(${JSON.stringify(t).replace(/"/g,'&quot;')})">Use →</button></span></div><div class="pc-title">${escapeHtml(t.title)}</div><div class="pc-body">${escapeHtml(t.body)}</div></div>`).join('')}</div>`;
}
function useTemplate(t){
  openEdit();
  document.getElementById('e-type').value = t.type;
  document.getElementById('e-title').value = t.title;
  document.getElementById('e-body').value = t.body;
  updateEditTitle(); updateChars('e-title-c','e-title',60); updateChars('e-body-c','e-body',1500);
}

/* ---------- EXPORTS ---------- */
function exportCSV(){
  if(!state.posts.length){ toast('No posts','err'); return; }
  const rows = [['date','time','type','status','title','body','cta','cta_url','code','offer_start','offer_end','event_start','event_end','image']];
  state.posts.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(p=>{
    rows.push([p.date,p.time,p.type,p.status,p.title||'',p.body||'',p.cta||'',p.ctaUrl||'',p.code||'',p.offerStart||'',p.offerEnd||'',p.eventStart||'',p.eventEnd||'',p.image||'']);
  });
  const blob = new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=`gbp-posts-${(state.brand.name||'biz').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.csv`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('CSV exported','success');
}

function exportICS(){
  if(!state.posts.length){ toast('No posts','err'); return; }
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Post Scheduler//Local SEO//EN','CALSCALE:GREGORIAN'];
  state.posts.forEach(p=>{
    const dt = new Date(p.date+'T'+(p.time||'09:00'));
    const dtEnd = new Date(dt.getTime()+30*60*1000);
    const fmt = d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+p.id+'@gbp-scheduler');
    lines.push('DTSTAMP:'+fmt(new Date(p.createdAt||Date.now())));
    lines.push('DTSTART:'+fmt(dt));
    lines.push('DTEND:'+fmt(dtEnd));
    lines.push('SUMMARY:GBP '+p.type.toUpperCase()+': '+(p.title||p.body.slice(0,40)).replace(/[\r\n]+/g,' '));
    lines.push('DESCRIPTION:'+(p.body||'').replace(/[\r\n]+/g,'\\n')+(p.ctaUrl?'\\n\\nCTA: '+p.ctaUrl:''));
    lines.push('CATEGORIES:'+p.type);
    if(p.ctaUrl) lines.push('URL:'+p.ctaUrl);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download=`gbp-posts-${(state.brand.name||'biz').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.ics`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('ICS exported — import to Google/Outlook calendar','success');
}

renderAll();
window.addEventListener('beforeunload', saveState);
