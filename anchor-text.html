<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anchor Text Distribution Analyzer - Backlink Anchor Profile Audit</title>
<meta name="description" content="Audit your backlink anchor text profile for natural distribution. Classifies anchors as branded, exact-match, partial-match, generic, naked URL, or image. Flags over-optimization risks and Penguin-trigger patterns.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#9333ea; --accent-h:#7e22ce; --accent-soft:rgba(147,51,234,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --c-brand:#16a34a; --c-exact:#dc2626; --c-partial:#ea580c; --c-generic:#5b6b88; --c-naked:#2563eb; --c-image:#9333ea; --c-other:#8a9ab5;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#c084fc; --accent-h:#d8b4fe; --accent-soft:rgba(192,132,252,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--pink);border:1px solid var(--pink);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.score strong{color:var(--accent);font-size:14px}
.hdr-stat.total strong{color:var(--blue)}
.hdr-stat.risk strong{color:var(--danger)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:340px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}
.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f textarea{resize:vertical;min-height:80px;font-family:var(--mono);font-size:11px}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.score-banner{display:grid;grid-template-columns:auto 1fr;gap:24px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);margin-bottom:14px;align-items:center}
.score-circle{position:relative;width:140px;height:140px}
.score-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-circle .bg{stroke:var(--bg3);stroke-width:11;fill:none}
.score-circle .fg{stroke:var(--accent);stroke-width:11;fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s}
.score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-text .v{font-size:36px;font-weight:900;font-family:var(--mono);color:var(--accent);line-height:1}
.score-text .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:700;text-transform:uppercase}
.banner-info h2{font-size:20px;font-weight:800;margin-bottom:5px}
.banner-info .sub{font-size:12.5px;color:var(--text2);line-height:1.55;margin-bottom:10px}
.banner-info .pills{display:flex;gap:6px;flex-wrap:wrap}
.banner-info .pill{padding:3px 9px;border-radius:11px;font-size:10.5px;font-weight:700;font-family:var(--mono)}
.banner-info .pill.ok{background:rgba(22,163,74,.13);color:var(--success)}
.banner-info .pill.warn{background:rgba(245,158,11,.13);color:var(--warn)}
.banner-info .pill.bad{background:rgba(220,38,38,.13);color:var(--danger)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.brand::before{background:var(--c-brand)}
.kpi.exact::before{background:var(--c-exact)}
.kpi.partial::before{background:var(--c-partial)}
.kpi.generic::before{background:var(--c-generic)}
.kpi.naked::before{background:var(--c-naked)}
.kpi.image::before{background:var(--c-image)}
.kpi .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:900;font-family:var(--mono);color:var(--text);line-height:1.05}
.kpi.brand .v{color:var(--c-brand)}
.kpi.exact .v{color:var(--c-exact)}
.kpi.partial .v{color:var(--c-partial)}
.kpi.generic .v{color:var(--c-generic)}
.kpi.naked .v{color:var(--c-naked)}
.kpi.image .v{color:var(--c-image)}
.kpi .s{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.chart-wrap{position:relative;height:300px;padding:14px}

.anchor-row{padding:9px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:90px 1fr auto auto;gap:11px;align-items:center;font-size:12px}
.anchor-row:last-child{border-bottom:none}
.anchor-row .cat-pill{padding:3px 9px;border-radius:11px;font-size:9.5px;font-family:var(--mono);font-weight:800;text-align:center;color:#fff;text-transform:uppercase}
.anchor-row .cat-pill.brand{background:var(--c-brand)}
.anchor-row .cat-pill.exact{background:var(--c-exact)}
.anchor-row .cat-pill.partial{background:var(--c-partial)}
.anchor-row .cat-pill.generic{background:var(--c-generic)}
.anchor-row .cat-pill.naked{background:var(--c-naked)}
.anchor-row .cat-pill.image{background:var(--c-image)}
.anchor-row .cat-pill.other{background:var(--c-other)}
.anchor-row .anchor{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anchor-row .count{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--text)}
.anchor-row .pct{font-family:var(--mono);font-size:11px;color:var(--text2);text-align:right;min-width:42px}

.check-row{padding:11px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:24px 1fr auto;gap:11px;align-items:start;font-size:12px}
.check-row:last-child{border-bottom:none}
.check-row .icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;margin-top:1px}
.check-row.pass .icon{background:rgba(22,163,74,.15);color:var(--success)}
.check-row.warn .icon{background:rgba(245,158,11,.15);color:var(--warn)}
.check-row.fail .icon{background:rgba(220,38,38,.15);color:var(--danger)}
.check-row .body .title{font-size:12.5px;font-weight:700}
.check-row .body .desc{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:2px}
.check-row .meta{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--text2);text-align:right}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:340px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .score-banner{grid-template-columns:1fr}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>
    <div><div class="logo-name">Anchor<span>Text</span></div></div>
    <span class="logo-tag">PROFILE</span>
  </div>
  <div class="hdr-sep"></div>

    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Your Brand</h4><span class="toggle">▼</span></div>

<script>
const STORE_KEY='at_state_v1';
const defaultState={brand:'',variants:'',domain:'',kws:'',pasted:'',anchors:[],results:null,view:'overview'};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}
function toggleSec(h){h.parentElement.classList.toggle('collapsed');}

function fillInputs(){
  document.getElementById('i-brand').value=state.brand||'';
  document.getElementById('i-variants').value=state.variants||'';
  document.getElementById('i-domain').value=state.domain||'';
  document.getElementById('i-kws').value=state.kws||'';
  document.getElementById('i-paste').value=state.pasted||'';
}
function onChange(){
  state.brand=document.getElementById('i-brand').value;
  state.variants=document.getElementById('i-variants').value;
  state.domain=document.getElementById('i-domain').value.trim().replace(/^https?:\/\//,'').replace(/\/$/,'');
  state.kws=document.getElementById('i-kws').value;

}

function syncFromCitation(){try{const cf=JSON.parse(localStorage.getItem('cf_state_v1')||'null');const b=cf?.businesses?.[0];if(b){state.brand=b.name||state.brand;if(b.website)state.domain=b.website.replace(/^https?:\/\//,'').replace(/\/$/,'');saveState();fillInputs();toast('Synced','success');}}catch(e){}}
function syncFromKw(){try{const kw=JSON.parse(localStorage.getItem('kw_state_v1')||'null');if(kw?.keywords?.length){state.kws=kw.keywords.slice(0,15).map(k=>k.kw).join('\n');saveState();fillInputs();toast('Loaded','success');}}catch(e){}}
function syncFromBacklinks(){try{const bl=JSON.parse(localStorage.getItem('bl_state_v1')||'null');if(!bl?.backlinks?.length){toast('No backlinks','err');return;}const anchors=bl.backlinks.map(b=>({anchor:b.anchor||'', sourceDomain:b.sourceDomain||'', da:b.da||b.domainAuthority||0, url:b.sourceUrl||b.url||''}));state.anchors=anchors;saveState();render();toast(`Imported ${anchors.length} anchors`,'success');}catch(e){toast('Failed','err');}}

function classifyAnchor(anchor, ctx){
  if(!anchor || !anchor.trim()) return 'image';
  const a=anchor.toLowerCase().trim();
  // Naked URL
  if(/^https?:\/\//.test(a) || (ctx.domain && a.includes(ctx.domain))) return 'naked';
  // Brand variants
  const brandTerms=[ctx.brand, ...ctx.variants.split('\n').map(v=>v.trim()).filter(Boolean)].filter(Boolean).map(b=>b.toLowerCase());
  if(brandTerms.some(b=>a.includes(b))) return 'brand';
  // Exact match (keyword)
  const kws=ctx.kws.split('\n').map(k=>k.trim().toLowerCase()).filter(Boolean);
  if(kws.some(k=>a===k)) return 'exact';
  // Partial match (keyword inside anchor)
  if(kws.some(k=>{const kw=k.split(/\s+/);return kw.length>=2 && kw.every(w=>a.includes(w));})) return 'partial';
  // Generic
  const generic=['click here','here','this','read more','learn more','more info','website','visit','link','this link','this article','more','read'];
  if(generic.includes(a)) return 'generic';
  return 'other';
}

function runAnalysis(){
  onChange();
  // Combine sources: backlinks-imported + pasted
  let anchors=[];
  if(state.anchors.length) anchors=state.anchors.slice();
  const pasted=(document.getElementById('i-paste').value||'').split('\n').map(a=>a.trim()).filter(Boolean);
  state.pasted=document.getElementById('i-paste').value;
  if(pasted.length) anchors=anchors.concat(pasted.map(a=>({anchor:a, sourceDomain:'(pasted)', da:0, url:''})));
  if(!anchors.length){toast('No anchors. Import from Backlinks or paste.','err');return;}
  const ctx={brand:state.brand, variants:state.variants, domain:state.domain, kws:state.kws};
  // Classify each
  anchors.forEach(a=>{a.category=classifyAnchor(a.anchor, ctx);});
  // Aggregate
  const byCategory={brand:0,exact:0,partial:0,generic:0,naked:0,image:0,other:0};
  const counts={};
  anchors.forEach(a=>{byCategory[a.category]++;const k=a.anchor.toLowerCase().trim();if(k){counts[k]=(counts[k]||0)+1;}});
  const total=anchors.length;
  const distribution=Object.fromEntries(Object.entries(byCategory).map(([k,v])=>[k,{count:v,pct:total?v/total*100:0}]));
  // Score
  const checks=runChecks(distribution, counts, total);
  const passed=checks.filter(c=>c.status==='pass').length;
  const warns=checks.filter(c=>c.status==='warn').length;
  const fails=checks.filter(c=>c.status==='fail').length;
  const score=Math.max(0,Math.min(100, 100 - (fails*15 + warns*5)));
  state.results={anchors, distribution, counts, checks, score, total};
  saveState();render();
  toast(`${anchors.length} anchors analyzed`,'success');
}

function runChecks(dist, counts, total){
  const checks=[];
  // Branded share (target: 30-60%)
  const brandPct=dist.brand.pct;
  if(brandPct>=30 && brandPct<=60) checks.push({status:'pass', title:'Branded anchors are in healthy range', desc:`${brandPct.toFixed(1)}% branded (target 30-60%)`});
  else if(brandPct<30) checks.push({status:'warn', title:'Low branded share', desc:`Only ${brandPct.toFixed(1)}% branded — natural profiles usually have 30-60%`});
  else if(brandPct>80) checks.push({status:'warn', title:'Over-reliant on branded', desc:`${brandPct.toFixed(1)}% branded is unusually high — slight diversification helps`});

  // Exact-match (Penguin trigger if >5-8%)
  const exactPct=dist.exact.pct;
  if(exactPct<=5) checks.push({status:'pass', title:'Exact-match anchors safe', desc:`${exactPct.toFixed(1)}% exact-match (safe under 5-8%)`});
  else if(exactPct<=8) checks.push({status:'warn', title:'Exact-match borderline', desc:`${exactPct.toFixed(1)}% — getting close to Penguin trigger threshold (8%)`});
  else checks.push({status:'fail', title:'High exact-match anchor risk', desc:`${exactPct.toFixed(1)}% exact-match — Penguin filter risk above 8%`});

  // Money keywords (commercial/exact combined)
  const moneyPct=dist.exact.pct + dist.partial.pct;
  if(moneyPct>30) checks.push({status:'warn', title:'High commercial anchor density', desc:`${moneyPct.toFixed(1)}% commercial/keyword-rich — consider more diverse anchors`});
  else if(moneyPct<8 && exactPct<2) checks.push({status:'warn', title:'Very few keyword anchors', desc:`Only ${moneyPct.toFixed(1)}% commercial — may be missing ranking signal opportunities`});
  else checks.push({status:'pass', title:'Keyword anchor density looks natural', desc:`${moneyPct.toFixed(1)}% commercial mix`});

  // Generic ("click here") share - natural profiles 10-20%
  const genericPct=dist.generic.pct;
  if(genericPct>=8 && genericPct<=25) checks.push({status:'pass', title:'Generic anchor share is natural', desc:`${genericPct.toFixed(1)}% generic ("click here", "more info") — typical of natural profiles`});
  else if(genericPct<5) checks.push({status:'warn', title:'Suspiciously few generic anchors', desc:`${genericPct.toFixed(1)}% generic — natural profiles usually have 8-25%`});
  else if(genericPct>40) checks.push({status:'warn', title:'Heavy on generic anchors', desc:`${genericPct.toFixed(1)}% generic — may indicate spam`});

  // Naked URLs (natural at 10-25%)
  const nakedPct=dist.naked.pct;
  if(nakedPct>=10 && nakedPct<=25) checks.push({status:'pass', title:'Naked URL share is natural', desc:`${nakedPct.toFixed(1)}% naked URLs — typical of natural profiles`});
  else if(nakedPct<5) checks.push({status:'warn', title:'Suspiciously few naked URLs', desc:`${nakedPct.toFixed(1)}% — natural profiles usually have 10-25%`});

  // Single anchor dominance
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if(sorted.length && total){
    const topPct=sorted[0][1]/total*100;
    if(topPct>30) checks.push({status:'fail', title:'Single anchor dominates', desc:`"${sorted[0][0]}" represents ${topPct.toFixed(1)}% of all anchors — diversify urgently`});
    else if(topPct>20) checks.push({status:'warn', title:'Single anchor heavy', desc:`"${sorted[0][0]}" represents ${topPct.toFixed(1)}% — diversify`});
  }

  // Unique anchors ratio
  const uniquePct=Object.keys(counts).length/total*100;
  if(uniquePct>70) checks.push({status:'pass', title:'High anchor diversity', desc:`${uniquePct.toFixed(0)}% unique anchors`});
  else if(uniquePct<30) checks.push({status:'warn', title:'Low anchor diversity', desc:`Only ${uniquePct.toFixed(0)}% unique — likely automated/templated`});

  // Image anchors (alt text)
  const imagePct=dist.image.pct;
  if(imagePct>40) checks.push({status:'warn', title:'High image anchor share', desc:`${imagePct.toFixed(1)}% image anchors (no text). Could indicate widget/footer link sprawl`});

  return checks;
}
