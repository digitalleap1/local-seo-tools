<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAP Consistency Checker - Detect Name/Address/Phone Inconsistencies Across Citations</title>
<meta name="description" content="Audit Name, Address, Phone consistency across all your business citations. Fuzzy matching, duplicate detection, format normalization, and prioritized fix list. 100% client-side. Paste citations, upload CSV, or import from Citation Finder Pro.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#7c3aed; --accent-h:#6d28d9; --accent-soft:rgba(124,58,237,.08);
  --teal:#0d9488; --teal-h:#0f766e;
  --amber:#d97706; --amber-soft:rgba(217,119,6,.1);
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#a78bfa; --accent-h:#c4b5fd; --accent-soft:rgba(167,139,250,.14);
  --teal:#14b8a6; --teal-h:#2dd4bf;
  --amber:#f59e0b; --amber-soft:rgba(245,158,11,.12);
  --danger:#ef4444; --success:#22c55e;
  --purple:#a78bfa; --pink:#ec4899; --blue:#3b82f6;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* HEADER */
#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(124,58,237,.3)}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--pink);border:1px solid var(--pink);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.cit strong{color:var(--accent)}
.hdr-stat.ok strong{color:var(--success)}
.hdr-stat.bad strong{color:var(--danger)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none;transition:all .15s}
.hdr-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hdr-link svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600;transition:all .2s}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

#app{flex:1;display:flex;overflow:hidden;height:calc(100vh - 56px - 32px)}

/* LEFT — REFERENCE NAP */
#ref-panel{width:300px;min-width:270px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.rp-section{padding:11px 12px;border-bottom:1px solid var(--border)}
.rp-section h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text2);font-family:var(--mono);margin-bottom:8px}
.rp-section .ff{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.rp-section label{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.rp-section input,.rp-section select,.rp-section textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:11.5px;color:var(--text);transition:border-color .15s,box-shadow .15s}
.rp-section input:focus,.rp-section select:focus,.rp-section textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rp-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.rp-row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-clear{width:100%;padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:600;margin-top:4px}
.btn-clear:hover{border-color:var(--danger);color:var(--danger)}

/* CENTER */
#center-area{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;overflow:hidden}
#center-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.cb-tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.cb-tab:hover{border-color:var(--accent);color:var(--accent)}
.cb-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-tab svg{width:13px;height:13px}
.cb-tab .count{font-family:var(--mono);background:rgba(255,255,255,.25);border-radius:3px;padding:0 5px;font-size:10px;font-weight:700}
.cb-tab:not(.active) .count{background:var(--bg);color:var(--text2)}
.cb-spacer{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
.cb-btn svg{width:13px;height:13px}
.cb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-btn.primary:hover{background:var(--accent-h)}
.cb-btn.warn{border-color:var(--amber);color:var(--amber)}
.cb-btn.warn:hover{background:var(--amber);color:#fff}

#center-body{flex:1;overflow-y:auto;padding:12px;background:var(--bg)}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty-state svg{width:64px;height:64px;opacity:.22}
.empty-state .es-t{font-size:16px;font-weight:700;color:var(--text);opacity:.7}
.empty-state .es-d{font-size:12.5px;line-height:1.6;max-width:540px;color:var(--text2)}
.empty-state .es-tips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.empty-state .es-tips span{font-size:10.5px;background:var(--bg3);border:1px solid var(--border);padding:4px 10px;border-radius:5px;color:var(--text2);font-family:var(--mono)}

/* SUMMARY CARDS */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.scard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow-sm);transition:all .15s;position:relative;overflow:hidden}
.scard:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.scard.ok::before{background:var(--success)}
.scard.bad::before{background:var(--danger)}
.scard.partial::before{background:var(--amber)}
.scard.dup::before{background:var(--purple)}
.scard-label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.scard-val{font-size:26px;font-weight:800;color:var(--text);margin-top:4px;font-family:var(--mono);line-height:1.1}
.scard-sub{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}
.scard.ok .scard-val{color:var(--success)}
.scard.bad .scard-val{color:var(--danger)}
.scard.partial .scard-val{color:var(--amber)}
.scard.dup .scard-val{color:var(--purple)}

/* SCORE RING */
.score-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;display:flex;align-items:center;gap:18px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.score-ring{width:88px;height:88px;flex-shrink:0;position:relative}
.score-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.score-ring .ring-bg{stroke:var(--bg3)}
.score-ring .ring-fg{stroke:var(--accent);transition:stroke-dashoffset .6s}
.score-ring.s90 .ring-fg{stroke:var(--success)}
.score-ring.s70 .ring-fg{stroke:var(--blue)}
.score-ring.s50 .ring-fg{stroke:var(--amber)}
.score-ring.s0  .ring-fg{stroke:var(--danger)}
.score-ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:22px}
.score-info{flex:1}
.score-info h3{font-size:14px;font-weight:800;margin-bottom:3px}
.score-info p{font-size:11.5px;color:var(--text2);line-height:1.55}
.score-grade{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10.5px;font-family:var(--mono);font-weight:700;background:var(--bg3);color:var(--text2);margin-top:6px}
.score-grade.a{background:rgba(22,163,74,.13);color:var(--success)}
.score-grade.b{background:rgba(37,99,235,.13);color:var(--blue)}
.score-grade.c{background:rgba(217,119,6,.13);color:var(--amber)}
.score-grade.f{background:rgba(220,38,38,.13);color:var(--danger)}

/* SECTION */
.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;color:var(--text);flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.section-hdr .badge.ok{background:rgba(22,163,74,.12);color:var(--success);border-color:rgba(22,163,74,.3)}
.section-hdr .badge.bad{background:rgba(220,38,38,.12);color:var(--danger);border-color:rgba(220,38,38,.3)}
.section-hdr .badge.partial{background:rgba(217,119,6,.12);color:var(--amber);border-color:rgba(217,119,6,.3)}

/* CITATION TABLE */
.ctable{width:100%;border-collapse:collapse;font-size:11.5px}
.ctable thead{background:var(--bg);position:sticky;top:0;z-index:5}
.ctable th{padding:8px 10px;text-align:left;font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border);white-space:nowrap}
.ctable td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.ctable tr:hover{background:var(--bg3)}
.ctable tr:last-child td{border-bottom:none}
.ctable .src-name{font-weight:600;color:var(--text)}
.ctable .src-url{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:1px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctable .field-val{font-family:var(--mono);font-size:11px;line-height:1.4;color:var(--text)}
.ctable .field-val .diff-tok{background:rgba(220,38,38,.18);color:var(--danger);padding:0 2px;border-radius:2px}
.ctable .field-val .ok-tok{color:var(--success)}
.ctable .status-pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-family:var(--mono);font-weight:700;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px;line-height:1}
.ctable .status-pill.ok{background:rgba(22,163,74,.13);color:var(--success);border:1px solid rgba(22,163,74,.3)}
.ctable .status-pill.bad{background:rgba(220,38,38,.10);color:var(--danger);border:1px solid rgba(220,38,38,.28)}
.ctable .status-pill.partial{background:rgba(217,119,6,.13);color:var(--amber);border:1px solid rgba(217,119,6,.3)}
.ctable .status-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.ctable .row-actions{display:flex;gap:4px;flex-wrap:nowrap}
.ctable .row-actions a,.ctable .row-actions button{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);transition:all .12s;text-decoration:none;font-size:11px}
.ctable .row-actions a:hover,.ctable .row-actions button:hover{border-color:var(--accent);color:var(--accent)}
.ctable .row-actions svg{width:12px;height:12px}

/* INPUT TABS */
.input-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px}
.itab{padding:9px 14px;font-size:11.5px;font-weight:700;color:var(--text2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.itab:hover{color:var(--accent)}
.itab.active{color:var(--accent);border-bottom-color:var(--accent)}
.itab svg{width:13px;height:13px}

/* PASTE AREA */
.paste-area{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.paste-area h3{font-size:12.5px;font-weight:700;margin-bottom:6px}
.paste-area .hint{font-size:11px;color:var(--text2);margin-bottom:10px;line-height:1.55}
.paste-area textarea{width:100%;min-height:160px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:var(--mono);font-size:11.5px;color:var(--text);resize:vertical;line-height:1.5}
.paste-area textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.paste-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.paste-tips{background:var(--bg);border:1px dashed var(--border2);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:11px;color:var(--text2);line-height:1.6}
.paste-tips strong{color:var(--text)}
.paste-tips code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:10.5px;font-family:var(--mono);color:var(--accent)}

/* ADD ROW MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:hidden;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.modal-hdr h2{font-size:14px;font-weight:700;flex:1}
.modal-hdr .close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-hdr .close:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg3)}
.modal-foot button{padding:8px 14px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--text);transition:all .15s}
.modal-foot button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.modal-foot button.primary:hover{background:var(--accent-h)}
.modal-foot button:hover{border-color:var(--accent)}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;font-weight:600;color:var(--text)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text);transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:10.5px;color:var(--text3);font-family:var(--mono);line-height:1.5}

/* FOOTER */
#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-item{display:flex;align-items:center;gap:5px}
.ft-item svg{width:12px;height:12px}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px}
.ft-link:hover{text-decoration:underline}
.ft-link svg{width:11px;height:11px}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}

@media (max-width:920px){
  #ref-panel{position:absolute;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .3s;width:80%;max-width:300px}
  #ref-panel.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}

</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div>
      <div class="logo-name">NAP<span>Checker</span></div>
    </div>
    <span class="logo-tag">CONSISTENCY</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat cit"><strong id="stat-cit">0</strong> citations</div>
  <div class="hdr-stat ok"><strong id="stat-ok">0</strong> consistent</div>
  <div class="hdr-stat bad"><strong id="stat-bad">0</strong> issues</div>
  <button class="mobile-toggle" onclick="document.getElementById('ref-panel').classList.toggle('open')">Menu</button>

<script>
/* ==========================================================================
 * NAP CONSISTENCY CHECKER
 * 100% client-side. Compares N citations against one reference NAP.
 * ========================================================================== */

const STORE_KEY = 'nap_state_v1';
const defaultState = {
  ref: {name:'', phone:'', website:'', addr:'', city:'', state:'', zip:'', country:'US', phoneFmt:'us'},
  citations: [],   // {id, source, url, name, phone, addr, city, state, zip, website, raw}
  cmp: {name:true, phone:true, addr:true, website:true},
  tolerance: 'moderate',
  tab: 'dashboard',
};

let state = loadState();
function loadState(){ try { return Object.assign(clone(defaultState), JSON.parse(localStorage.getItem(STORE_KEY))||{}); } catch(e){ return clone(defaultState); } }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ toast('Storage full','err'); } }
function clone(o){return JSON.parse(JSON.stringify(o));}
function uid(){return Math.random().toString(36).slice(2,11)+Date.now().toString(36).slice(-4);}

/* ---------- THEME ---------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('seohub_theme_v1', next);
  document.getElementById('theme-label').textContent = next==='dark'?'Dark':'Light';
}
document.getElementById('theme-label').textContent = (document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

/* ---------- UTILS ---------- */
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(msg, type){
  const t=document.getElementById('toast'); t.className=''; t.classList.add('show'); if(type)t.classList.add(type);
  t.innerHTML='<span>'+escapeHtml(msg)+'</span>';
  setTimeout(()=>t.classList.remove('show'),2800);
}
function normalize(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function phoneDigits(s){return String(s||'').replace(/\D/g,'')}
function levenshtein(a,b){a=String(a||'');b=String(b||'');if(!a)return b.length;if(!b)return a.length;const m=a.length,n=b.length;let p=Array(n+1).fill(0).map((_,i)=>i),c=new Array(n+1);for(let i=1;i<=m;i++){c[0]=i;for(let j=1;j<=n;j++){c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}[p,c]=[c,p]}return p[n];}
function tolValue(){return state.tolerance==='strict'?0:state.tolerance==='moderate'?2:4;}

// Common name suffix variations to normalize
const NAME_NOISE = ['inc','llc','ltd','co','corp','company','plc','pty','pvt','limited','corporation','incorporated','llp','gmbh','sa','sas','ag'];
function nameKey(s){
  let t = normalize(s);
  // strip common business suffix noise
  NAME_NOISE.forEach(w=>{ t = t.replace(new RegExp(w+'$'),'') });
  return t;
}
function addrKey(c){
  return normalize([c.addr,c.city,c.state,c.zip].filter(Boolean).join(''));
}
function websiteKey(s){
  let t = String(s||'').toLowerCase().trim();
  t = t.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'').replace(/\/.*$/,'');
  return t;
}

/* ---------- REFERENCE NAP ---------- */
function onRefChange(){
  state.ref = {
    name: document.getElementById('ref-name').value,
    phone: document.getElementById('ref-phone').value,
    website: document.getElementById('ref-website').value,
    addr: document.getElementById('ref-addr').value,
    city: document.getElementById('ref-city').value,
    state: document.getElementById('ref-state').value,
    zip: document.getElementById('ref-zip').value,
    country: document.getElementById('ref-country').value,
    phoneFmt: document.getElementById('ref-phone-fmt').value,
  };
  state.tolerance = document.getElementById('ref-tolerance').value;
  state.cmp = {
    name: document.getElementById('cmp-name').checked,
    phone: document.getElementById('cmp-phone').checked,
    addr: document.getElementById('cmp-addr').checked,
    website: document.getElementById('cmp-website').checked,
  };
  saveState(); renderAll();
}
function fillRefInputs(){
  document.getElementById('ref-name').value = state.ref.name||'';
  document.getElementById('ref-phone').value = state.ref.phone||'';
  document.getElementById('ref-website').value = state.ref.website||'';
  document.getElementById('ref-addr').value = state.ref.addr||'';
  document.getElementById('ref-city').value = state.ref.city||'';
  document.getElementById('ref-state').value = state.ref.state||'';
  document.getElementById('ref-zip').value = state.ref.zip||'';
  document.getElementById('ref-country').value = state.ref.country||'US';
  document.getElementById('ref-phone-fmt').value = state.ref.phoneFmt||'us';
  document.getElementById('ref-tolerance').value = state.tolerance||'moderate';
  document.getElementById('cmp-name').checked = !!state.cmp.name;
  document.getElementById('cmp-phone').checked = !!state.cmp.phone;
  document.getElementById('cmp-addr').checked = !!state.cmp.addr;
  document.getElementById('cmp-website').checked = !!state.cmp.website;
}

/* ---------- MATCHING ENGINE ---------- */
function analyze(c){
  const ref = state.ref;
  const tol = tolValue();
  const out = {field:{}, status:'ok', issueCount:0};

  // NAME
  if(state.cmp.name){
    const refK = nameKey(ref.name);
    const citK = nameKey(c.name);
    if(!refK || !citK) out.field.name = {status:'un', note: !refK?'No reference name set':'No name in citation'};
    else if(refK === citK) out.field.name = {status:'ok'};
    else {
      const d = levenshtein(refK, citK);
      if(d <= tol) out.field.name = {status:'fuzzy', diff: d, note:`Fuzzy match (dist ${d})`};
      else out.field.name = {status:'bad', diff: d, note:`Names differ — "${ref.name}" vs "${c.name}"`};
    }
  } else out.field.name = {status:'skip'};

  // PHONE
  if(state.cmp.phone){
    const refP = phoneDigits(ref.phone);
    const citP = phoneDigits(c.phone);
    if(!refP || !citP) out.field.phone = {status:'un', note: !refP?'No reference phone':'No phone in citation'};
    else {
      // compare last 10 digits (country code agnostic)
      const r10 = refP.slice(-10), c10 = citP.slice(-10);
      if(r10 === c10) {
        // format check (only if both have data)
        const refFmt = ref.phone.trim(), citFmt = c.phone.trim();
        if(refFmt && citFmt && refFmt !== citFmt) out.field.phone = {status:'fuzzy', note:`Same digits, different format — "${refFmt}" vs "${citFmt}"`};
        else out.field.phone = {status:'ok'};
      } else out.field.phone = {status:'bad', note:`Phone differs — "${ref.phone}" vs "${c.phone}"`};
    }
  } else out.field.phone = {status:'skip'};

  // ADDRESS
  if(state.cmp.addr){
    const ra = addrKey(ref);
    // citation can have a single freeform address, or split city/state/zip
    const citCombo = c.addr ? normalize(c.addr) : addrKey(c);
    if(!ra || !citCombo) out.field.addr = {status:'un', note: !ra?'No reference address':'No address in citation'};
    else {
      // exact normalized?
      if(ra === citCombo) out.field.addr = {status:'ok'};
      else {
        // check critical parts present in citation: city + zip + street number
        const cityN = normalize(ref.city);
        const zipN = ref.zip || '';
        const cityIn = cityN && citCombo.includes(cityN);
        const zipIn  = zipN  && (c.addr||'').includes(zipN);
        const streetNum = (ref.addr.match(/^\d+/)||[''])[0];
        const numIn = streetNum && (c.addr||'').includes(streetNum);
        const score = (cityIn?1:0)+(zipIn?1:0)+(numIn?1:0);
        if(score >= 3) out.field.addr = {status:'fuzzy', note:'Same address, different formatting'};
        else if(score === 2) out.field.addr = {status:'fuzzy', note:'Partial match — verify formatting'};
        else if(score === 1) out.field.addr = {status:'bad', note:'Address mismatch — one piece matches'};
        else out.field.addr = {status:'bad', note:'Address mismatch'};
      }
    }
  } else out.field.addr = {status:'skip'};

  // WEBSITE
  if(state.cmp.website){
    const rw = websiteKey(ref.website);
    const cw = websiteKey(c.website);
    if(!rw || !cw) out.field.website = {status:'un', note: !rw?'No reference website':'No website in citation'};
    else if(rw === cw) out.field.website = {status:'ok'};
    else {
      // tld vs www diff
      if(rw.replace(/\.[a-z]+$/,'') === cw.replace(/\.[a-z]+$/,'')) out.field.website = {status:'fuzzy', note:`Different TLD — "${rw}" vs "${cw}"`};
      else out.field.website = {status:'bad', note:`Different website — "${rw}" vs "${cw}"`};
    }
  } else out.field.website = {status:'skip'};

  // Overall status
  const fields = ['name','phone','addr','website'].filter(f=>state.cmp[f]);
  const bad = fields.filter(f=>out.field[f].status==='bad').length;
  const fuzzy = fields.filter(f=>out.field[f].status==='fuzzy').length;
  out.issueCount = bad + fuzzy;
  if(bad >= 1) out.status = 'bad';
  else if(fuzzy >= 1) out.status = 'partial';
  else out.status = 'ok';
  return out;
}

function detectDuplicates(){
  // Group by domain (extracted from URL) and by phone last-10 — flag if more than one citation per group
  const byDomain = {}, byPhone = {};
  state.citations.forEach(c=>{
    try { const u = new URL(c.url||'http://x'); const d = u.hostname.replace(/^www\./,''); (byDomain[d]=byDomain[d]||[]).push(c); } catch(e){}
    const p = phoneDigits(c.phone).slice(-10); if(p) (byPhone[p]=byPhone[p]||[]).push(c);
  });
  const dupes = [];
  Object.entries(byDomain).forEach(([k,arr])=>{ if(arr.length>1) dupes.push({type:'domain', key:k, citations:arr}); });
  Object.entries(byPhone).forEach(([k,arr])=>{
    // only flag phone dupes if they're across different domains (otherwise same as domain dupe)
    const domains = new Set(arr.map(c=>{try{return new URL(c.url||'http://x').hostname.replace(/^www\./,'')}catch(e){return ''}}));
    if(arr.length>1 && domains.size > 1) dupes.push({type:'phone', key:k, citations:arr});
  });
  return dupes;
}

function importCitationFinder(){
  const input = document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try {
        const data = JSON.parse(ev.target.result);
        // expected: {business: {...}, directories: [{..., _citation: {url,title,snippet,napCheck,status}}]}
        if(data.business){
          if(!state.ref.name){
            state.ref.name = data.business.name||'';
            state.ref.phone = data.business.phone||'';
            state.ref.website = data.business.website||'';
            state.ref.addr = data.business.addr||'';
            state.ref.city = data.business.city||'';
            state.ref.state = data.business.state||'';
            state.ref.zip = data.business.zip||'';
            state.ref.country = (data.business.country||'us').toUpperCase();
          }
        }
        if(Array.isArray(data.directories)){
          let added=0;
          data.directories.forEach(d=>{
            const c = d._citation;
            if(!c || !c.url) return;
            state.citations.push({
              id: uid(), source: d.name, url: c.url,
              name: c.title ? c.title.split('|')[0].split(' - ')[0].trim() : '',
              phone: '', addr: '',
              website: data.business.website||'',
              addedAt: Date.now(),
              raw: c.snippet||''
            });
            added++;
          });
          toast(`Imported ${added} citations from Citation Finder`,'success');
        } else if(Array.isArray(data.citations)){
          state.citations = state.citations.concat(data.citations.map(c=>({...c, id: uid()})));
          toast(`Imported ${data.citations.length} citations`,'success');
        } else {
          toast('Unrecognized JSON format','err');
        }
        saveState(); fillRefInputs(); renderAll();
      } catch(err){ toast('Bad JSON','err'); }
    };
    r.readAsText(f);
  };
  input.click();
}

function importCSV(){
  const input = document.createElement('input');
  input.type='file'; input.accept='.csv';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try {
        const lines = ev.target.result.split(/\r?\n/).filter(l=>l.trim());
        if(lines.length<2){ toast('CSV needs header + rows','err'); return; }
        const header = lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/['"]/g,''));
        const idx = (k)=>header.indexOf(k);
        const fields = ['source','url','name','phone','address','website'];
        if(!fields.some(f=>idx(f)>=0)){ toast('CSV needs at least one of: source, url, name, phone, address, website','err'); return; }
        let added = 0;
        for(let i=1;i<lines.length;i++){
          const cells = parseCSVLine(lines[i]);
          const c = {
            id: uid(),
            source: idx('source')>=0?cells[idx('source')]||'':'',
            url: idx('url')>=0?cells[idx('url')]||'':'',
            name: idx('name')>=0?cells[idx('name')]||'':'',
            phone: idx('phone')>=0?cells[idx('phone')]||'':'',
            addr: idx('address')>=0?cells[idx('address')]||'':'',
            website: idx('website')>=0?cells[idx('website')]||'':'',
            addedAt: Date.now(),
          };
          if(!c.source && !c.url && !c.name) continue;
          if(!c.source && c.url){ try{c.source = new URL(c.url).hostname.replace(/^www\./,'')}catch(e){} }
          state.citations.push(c); added++;
        }
        saveState(); renderAll();
        toast(`Imported ${added} citation(s)`,'success');
      } catch(err){ toast('Bad CSV','err'); }
    };
    r.readAsText(f);
  };
  input.click();
}
function parseCSVLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){ if(c==='"' && line[i+1]==='"'){cur+='"';i++;} else if(c==='"'){inQ=false;} else cur+=c; }
    else { if(c===','){out.push(cur);cur='';} else if(c==='"' && !cur){inQ=true;} else cur+=c; }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}

function parsePasted(text){
  // Heuristic parser for pasted-from-directory blocks
  // Each citation block separated by blank line
  const blocks = text.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const cits = [];
  blocks.forEach(block=>{
    const lines = block.split(/\n/).map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return;
    const c = {id: uid(), source:'', url:'', name:'', phone:'', addr:'', website:'', addedAt: Date.now()};
    lines.forEach(line=>{
      // url
      const urlM = line.match(/https?:\/\/\S+/);
      if(urlM && !c.url){ c.url = urlM[0]; if(!c.source){ try{c.source = new URL(c.url).hostname.replace(/^www\./,'')}catch(e){} } return; }
      // phone
      const phoneM = line.replace(/[^\d+()\-.\s]/g,'').match(/[\+\(]?\d[\d\s.()\-]{8,}\d/);
      if(phoneM && !c.phone && phoneDigits(phoneM[0]).length>=7){ c.phone = phoneM[0].trim(); return; }
      // labelled fields
      const labM = line.match(/^(name|biz|business|address|addr|phone|tel|website|url|source|directory)\s*[:=]\s*(.+)$/i);
      if(labM){
        const k = labM[1].toLowerCase(); const v = labM[2].trim();
        if(/^(name|biz|business)/.test(k)) c.name=v;
        else if(/^(address|addr)/.test(k)) c.addr=v;
        else if(/^(phone|tel)/.test(k)) c.phone=v;
        else if(/^(website|url)/.test(k)){ if(!c.url) c.url=v; else if(!c.website) c.website=v; }
        else if(/^(source|directory)/.test(k)) c.source=v;
        return;
      }
      // first unmatched line = name; later unmatched = address
      if(!c.name) c.name = line;
      else if(!c.addr) c.addr = line;
    });
    if(c.name || c.url || c.phone || c.source) cits.push(c);
  });
  return cits;
}

function doParsePasted(){
  const ta = document.getElementById('paste-area-ta');
  const text = ta.value.trim();
  if(!text){ toast('Paste citation blocks first','err'); return; }
  const parsed = parsePasted(text);
  if(!parsed.length){ toast('No citations found in paste','err'); return; }
  state.citations = state.citations.concat(parsed);
  saveState(); ta.value=''; setTab('citations');
  toast(`Parsed ${parsed.length} citation(s)`,'success');
}

/* ---------- EXPORT ---------- */
function exportData(format){
  if(!state.citations.length){ toast('Add citations first','err'); return; }
  let blob, filename;
  if(format==='csv'){
    const rows = [['source','url','name_listed','phone_listed','address_listed','website_listed','name_match','phone_match','addr_match','website_match','overall']];
    state.citations.forEach(c=>{
      const a = analyze(c);
      rows.push([c.source||'',c.url||'',c.name||'',c.phone||'',c.addr||'',c.website||'',a.field.name?.status||'',a.field.phone?.status||'',a.field.addr?.status||'',a.field.website?.status||'',a.status]);
    });
    blob = new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')], {type:'text/csv'});
    filename = `nap-audit-${normalize(state.ref.name||'business').slice(0,30)||'audit'}.csv`;
  } else if(format==='json'){
    blob = new Blob([JSON.stringify({reference:state.ref, citations:state.citations, analyzed:state.citations.map(c=>({id:c.id, ...analyze(c)})), exportedAt: new Date().toISOString()}, null, 2)], {type:'application/json'});
    filename = `nap-audit-${normalize(state.ref.name||'business').slice(0,30)||'audit'}.json`;
  } else if(format==='report'){
    blob = new Blob([buildReportHTML()], {type:'text/html'});
    filename = `nap-report-${normalize(state.ref.name||'business').slice(0,30)||'audit'}.html`;
  } else return;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Exported','success');
}

  const gradeC = score>=90?'a':score>=70?'b':score>=50?'c':'f';
  // field-level breakdown

  analyzed.forEach(({a})=>{

      <div class="score-info">
        <h3>NAP Consistency Score</h3>
        <p>${escapeHtml(state.ref.name||'Your business')} has <strong>${ok}/${total}</strong> citations with no NAP issues, ${partial} partial mismatches, and <strong>${bad}</strong> critical mismatches.${dupes.length?` Detected <strong>${dupes.length}</strong> duplicate listing(s).`:''}</p>
        <div class="score-grade ${gradeC}">${grade}</div>
      </div>
    </div>

    <div class="summary-grid">
      <div class="scard"><div class="scard-label">Citations</div><div class="scard-val">${total}</div><div class="scard-sub">tracked</div></div>
      <div class="scard ok"><div class="scard-label">Fully Consistent</div><div class="scard-val">${ok}</div><div class="scard-sub">${total?Math.round(ok/total*100):0}% of total</div></div>
      <div class="scard partial"><div class="scard-label">Minor Issues</div><div class="scard-val">${partial}</div><div class="scard-sub">format / fuzzy</div></div>
      <div class="scard bad"><div class="scard-label">Critical Issues</div><div class="scard-val">${bad}</div><div class="scard-sub">action needed</div></div>
      <div class="scard dup"><div class="scard-label">Duplicates</div><div class="scard-val">${dupes.length}</div><div class="scard-sub">${dupes.length?'merge/remove':'none found'}</div></div>
    </div>

    <div class="section">
      <div class="section-hdr"><h3>Field-Level Health</h3></div>
      <div class="section-body">
        <table class="ctable">
          <thead><tr><th>Field</th><th>Consistent</th><th>Fuzzy / format</th><th>Mismatched</th><th>Unknown</th><th>Health</th></tr></thead>
          <tbody>
            ${['name','phone','addr','website'].map(f=>{

function renderFieldCell(value, fa){
  if(!fa || fa.status==='skip') return `<td style="opacity:.4">—</td>`;
  const cls = fa.status==='ok'?'ok-tok':fa.status==='bad'?'diff-tok':fa.status==='fuzzy'?'diff-tok':'';
  const note = fa.note ? `<div style="font-size:9.5px;color:var(--text3);margin-top:1px;font-family:var(--mono)">${escapeHtml(fa.note.slice(0,80))}</div>`:'';
  const v = value || '<span style="color:var(--text3);font-style:italic">empty</span>';
  return `<td><div class="field-val"><span class="${cls}">${typeof v === 'string' ? escapeHtml(v) : v}</span></div>${note}</td>`;
}

function renderCitations(body, filter){

    </div>`;
    return;
  }
  let analyzed = state.citations.map(c=>({c, a:analyze(c)}));
  if(filter==='issues') analyzed = analyzed.filter(x=>x.a.status!=='ok');
  // sort: bad first then partial then ok
  const order = {bad:0, partial:1, ok:2};
  analyzed.sort((a,b)=>{const da=order[a.a.status]||0, db=order[b.a.status]||0; if(da!==db) return da-db; return b.a.issueCount-a.a.issueCount;});
  body.innerHTML = `
    <div class="section">
      <div class="section-hdr">
        <h3>${filter==='issues'?'Citations with NAP Issues':'All Citations'}</h3>
        <span class="badge">${analyzed.length}</span>

      <div class="section-body">${renderIssueTable(analyzed)}</div>
    </div>`;
}

            <div style="font-size:11.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px">
              <span class="status-pill bad"><span class="dot"></span> ${d.type==='domain'?'Same domain':'Same phone'}</span>
              <span style="font-family:var(--mono);color:var(--text2)">${escapeHtml(d.key)}</span>
              <span style="font-family:var(--mono);color:var(--text3);font-size:10px">${d.citations.length} listings</span>
            </div>
            <table class="ctable" style="background:var(--bg2);border-radius:6px;overflow:hidden">
              <thead><tr><th>Source</th><th>URL</th><th>Name</th><th>Phone</th><th>Action</th></tr></thead>
              <tbody>${d.citations.map(c=>`
                <tr>
                  <td><strong>${escapeHtml(c.source||'—')}</strong></td>
                  <td style="max-width:260px;font-size:10.5px;font-family:var(--mono)"><a href="${escapeAttr(c.url||'#')}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(c.url||'—')}</a></td>
                  <td>${escapeHtml(c.name||'')}</td>
                  <td style="font-family:var(--mono);font-size:11px">${escapeHtml(c.phone||'')}</td>
                  <td><div class="row-actions"><button onclick="editCitation('${c.id}')" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4z"/></svg></button><button onclick="deleteCitation('${c.id}')" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg></button></div></td>
                </tr>`).join('')}</tbody>
            </table>
            <div style="margin-top:8px;font-size:10.5px;color:var(--text2);line-height:1.5"><strong>Action:</strong> ${d.type==='domain'?'Multiple listings on the same directory — claim the primary, request removal of duplicates from the directory support team.':'Different directories listing the same phone number — verify these are all your business (and not a phone-number takeover or scraper error). If they are yours, merge any duplicates within each directory.'}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function buildReportHTML(){
  const analyzed = state.citations.map(c=>({c, a:analyze(c)}));
  const total = analyzed.length;
  const ok = analyzed.filter(x=>x.a.status==='ok').length;
  const partial = analyzed.filter(x=>x.a.status==='partial').length;
  const bad = analyzed.filter(x=>x.a.status==='bad').length;
  const score = total?Math.round((ok+partial*0.5)/total*100):0;
  const dupes = detectDuplicates();
  const css = `*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}

h2{font-size:16px;font-weight:700;margin:24px 0 10px;color:#0f1a2e}
.sub{font-size:12px;color:#5b6b88}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.card{background:#f3f6fb;border:1px solid #e9eef7;border-radius:10px;padding:14px 16px}
.card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#5b6b88;font-weight:700}
.card .val{font-size:24px;font-weight:800;color:#0f1a2e;margin-top:4px;font-family:'JetBrains Mono',monospace}
.card.green .val{color:#16a34a}.card.red .val{color:#dc2626}.card.amber .val{color:#d97706}
.score{display:flex;align-items:center;gap:18px;margin:18px 0;padding:18px;background:#f3f6fb;border-radius:10px}
.score-val{font-size:42px;font-weight:800;font-family:'JetBrains Mono',monospace;color:${score>=90?'#16a34a':score>=70?'#2563eb':score>=50?'#d97706':'#dc2626'}}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px}
th{background:#f3f6fb;text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#5b6b88;border-bottom:1px solid #d1d9e8}
td{padding:8px 10px;border-bottom:1px solid #e9eef7;vertical-align:top}
.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}
.pill.ok{background:#dcfce7;color:#16a34a}.pill.bad{background:#fee2e2;color:#dc2626}.pill.partial{background:#fef3c7;color:#d97706}
a{color:#7c3aed;text-decoration:none}
.foot{margin-top:32px;padding-top:14px;border-top:1px solid #e9eef7;font-size:11px;color:#5b6b88;text-align:center}
@media print{body{padding:0;background:#fff}.wrap{box-shadow:none;border-radius:0;padding:20px}}`;
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>NAP Audit Report — ${escapeHtml(state.ref.name||'Business')}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><style>${css}</style></head><body>
<div class="wrap">

    <div class="logo">✓</div>

      <h1>NAP Consistency Audit — ${escapeHtml(state.ref.name||'Your Business')}</h1>
      <div class="sub">Reference: ${escapeHtml(state.ref.phone||'')} · ${escapeHtml([state.ref.addr,state.ref.city,state.ref.state,state.ref.zip].filter(Boolean).join(', '))} · ${new Date().toLocaleDateString()}</div>

      <h2 style="margin:0">Consistency Score</h2>

  ${dupes.length?`<h2>Duplicate Listings</h2><table><thead><tr><th>Type</th><th>Key</th><th>Listings</th></tr></thead><tbody>
