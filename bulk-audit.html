<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Page On-Page Audit - Bulk On-Page SEO Checks at Scale</title>
<meta name="description" content="Run on-page SEO audits across many URLs at once. Title/meta/H1 length, schema presence, keyword optimization, internal/external links, image alt coverage, and per-page scoring. Useful for content audits, migration QA, and multi-location sites.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#0891b2; --accent-h:#0e7490; --accent-soft:rgba(8,145,178,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#22d3ee; --accent-h:#67e8f9; --accent-soft:rgba(34,211,238,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--purple);border:1px solid var(--purple);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.pages strong{color:var(--accent)}
.hdr-stat.avg strong{color:var(--success);font-size:14px}
.hdr-stat.fails strong{color:var(--danger)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:340px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}
.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f textarea{resize:vertical;min-height:200px;font-family:var(--mono);font-size:11px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.s::before{background:var(--success)}.kpi.w::before{background:var(--warn)}.kpi.d::before{background:var(--danger)}
.kpi .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:900;font-family:var(--mono);color:var(--text);line-height:1.05}
.kpi.s .v{color:var(--success)}.kpi.w .v{color:var(--warn)}.kpi.d .v{color:var(--danger)}
.kpi .s{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

.matrix-wrap{overflow-x:auto}
.matrix-table{width:100%;border-collapse:collapse;font-size:11.5px;font-family:var(--mono)}
.matrix-table thead{background:var(--bg);position:sticky;top:0;z-index:5}
.matrix-table th{padding:8px 10px;text-align:left;font-size:9.5px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap}
.matrix-table th.center{text-align:center}
.matrix-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:11px}
.matrix-table td.url{font-family:var(--mono);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.matrix-table td.url a{color:var(--accent);text-decoration:none}
.matrix-table td.center{text-align:center;font-weight:700}
.matrix-table td .cell{display:inline-block;width:22px;height:22px;border-radius:5px;line-height:22px;text-align:center;font-weight:900;font-size:11px;color:#fff;font-family:var(--mono)}
.matrix-table td .cell.pass{background:var(--success)}
.matrix-table td .cell.warn{background:var(--warn)}
.matrix-table td .cell.fail{background:var(--danger)}
.matrix-table td .cell.na{background:var(--bg3);color:var(--text3)}
.matrix-table tr.score-row td{font-weight:800}
.matrix-table .score-cell{padding:5px 9px;border-radius:5px;color:#fff;font-weight:900;font-family:var(--mono);font-size:11px;text-align:center;display:inline-block;min-width:40px}
.matrix-table .score-cell.s{background:var(--success)}
.matrix-table .score-cell.w{background:var(--warn)}
.matrix-table .score-cell.d{background:var(--danger)}

.page-detail{padding:14px 18px;border-bottom:1px solid var(--border)}
.page-detail:last-child{border-bottom:none}
.page-detail .hdr{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;margin-bottom:11px}
.page-detail .score-box{width:46px;height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-family:var(--mono);font-size:14px}
.page-detail .score-box.s{background:var(--success)}
.page-detail .score-box.w{background:var(--warn)}
.page-detail .score-box.d{background:var(--danger)}
.page-detail .info .title{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-detail .info .url{font-size:10.5px;font-family:var(--mono);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.page-detail .stats{font-family:var(--mono);font-size:10.5px;color:var(--text2);text-align:right}
.page-detail .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:7px}
.page-detail .check-pill{padding:6px 10px;background:var(--bg);border-radius:6px;display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;font-size:11.5px;border:1px solid var(--border)}
.page-detail .check-pill.pass{border-color:rgba(22,163,74,.3)}
.page-detail .check-pill.warn{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.04)}
.page-detail .check-pill.fail{border-color:rgba(220,38,38,.3);background:rgba(220,38,38,.04)}
.page-detail .check-pill .icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px}
.page-detail .check-pill.pass .icon{background:var(--success)}
.page-detail .check-pill.warn .icon{background:var(--warn)}
.page-detail .check-pill.fail .icon{background:var(--danger)}
.page-detail .check-pill .label{font-weight:700;color:var(--text)}
.page-detail .check-pill .val{font-family:var(--mono);font-size:10.5px;color:var(--text3)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}

.busy{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:5000}
.busy.show{display:flex}
.busy .card{background:var(--bg2);padding:24px 30px;border-radius:14px;border:1px solid var(--border);text-align:center;max-width:380px}
.busy .sp{width:42px;height:42px;border-radius:50%;border:3px solid var(--bg3);border-top-color:var(--accent);animation:spin .9s linear infinite;margin:0 auto 12px}
.busy .progress{width:100%;height:6px;background:var(--bg3);border-radius:3px;margin-top:10px;overflow:hidden}
.busy .progress .bar{height:100%;background:var(--accent);transition:width .25s}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:340px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg></div>
    <div><div class="logo-name">Bulk<span>Audit</span></div></div>
    <span class="logo-tag">MULTI-PAGE</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat pages">Pages: <strong id="stat-pages">0</strong></div>
  <div class="hdr-stat avg">Avg score: <strong id="stat-avg">—</strong></div>
  <div class="hdr-stat fails">Critical: <strong id="stat-fails">0</strong></div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">Dashboard</a>
  <a href="page-auditor.html" class="hdr-link" style="border-color:rgba(8,145,178,.4);color:var(--accent)">Single Page</a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">
  <div id="left">
    <div class="lh-bar"><h3>Setup</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>URLs to Audit</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>One URL per line (up to 50)</label><textarea id="i-urls" placeholder="https://yoursite.com/
https://yoursite.com/services
https://yoursite.com/about"></textarea></div>
          <button class="btn-sub" onclick="syncFromCrawler()">↻ From Site Crawler</button>
          <button class="btn-sub" onclick="syncFromKwMapper()">↻ From Keyword Mapper</button>
        </div>
      </div>
      <div class="fsec collapsed">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Context</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Brand name</label><input id="i-brand" placeholder="Acme Plumbing"></div>
          <div class="f"><label>City</label><input id="i-city" placeholder="Denver"></div>
          <div class="f"><label>Primary keyword</label><input id="i-kw" placeholder="emergency plumber denver"></div>
          <button class="btn-sub" onclick="syncFromCitation()">↻ From Citation Finder</button>
        </div>
      </div>
    </div>
    <div id="left-footer">
      <button class="btn-go" id="btn-run" onclick="runAudit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Run Bulk Audit
      </button>
      <div style="display:flex;gap:5px">
        <button class="btn-sub" onclick="exportCSV()">CSV</button>
        <button class="btn-sub" onclick="exportReport()">Report</button>
      </div>
    </div>
  </div>

  <div id="center">
    <div id="cbar">
      <button class="tab active" data-tab="overview" onclick="setTab('overview')">Overview</button>
      <button class="tab" data-tab="matrix" onclick="setTab('matrix')">Matrix View</button>
      <button class="tab" data-tab="details" onclick="setTab('details')">Per-Page Details</button>
      <button class="tab" data-tab="failures" onclick="setTab('failures')">Common Failures</button>
      <div class="cb-sp"></div>
    </div>
    <div id="cbody"></div>
  </div>
</div>

<div id="footer">
  <div style="display:flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="ft-status">Paste URLs and run bulk on-page audit</span></div>
  <div class="ft-spacer"></div>
  <div>Built by <strong>Local SEO Tools</strong></div>
  <a class="ft-link" href="mailto:">Email</a>
</div>

<div id="toast"></div>
<div class="busy" id="busy"><div class="card"><div class="sp"></div><h3 id="busy-title">Auditing…</h3><p id="busy-msg" style="font-size:11.5px;color:var(--text2);font-family:var(--mono)">…</p><div class="progress"><div class="bar" id="bar"></div></div></div></div>

<script>
const STORE_KEY='ba_state_v1';
const defaultState={urls:'', brand:'', city:'', kw:'', results:[], view:'overview'};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}
function setBusy(s,t,m,pct){const b=document.getElementById('busy');if(t)document.getElementById('busy-title').textContent=t;if(m)document.getElementById('busy-msg').textContent=m;if(pct!=null)document.getElementById('bar').style.width=pct+'%';b.classList.toggle('show',s);}
function toggleSec(h){h.parentElement.classList.toggle('collapsed');}

function fillInputs(){
  document.getElementById('i-urls').value=state.urls||'';
  document.getElementById('i-brand').value=state.brand||'';
  document.getElementById('i-city').value=state.city||'';
  document.getElementById('i-kw').value=state.kw||'';
}
function getInputs(){
  state.urls=document.getElementById('i-urls').value;
  state.brand=document.getElementById('i-brand').value.trim();
  state.city=document.getElementById('i-city').value.trim();
  state.kw=document.getElementById('i-kw').value.trim();

function syncFromCrawler(){try{const o=JSON.parse(localStorage.getItem('sc_state_v1')||'null');if(o?.pages){state.urls=Object.keys(o.pages).slice(0,50).join('\n');fillInputs();saveState();toast(`Loaded ${Object.keys(o.pages).length} URLs`,'success');}else toast('No crawler data','err');}catch(e){toast('Failed','err');}}
function syncFromKwMapper(){try{const o=JSON.parse(localStorage.getItem('km_state_v1')||'null');if(o?.urls){state.urls=o.urls;fillInputs();saveState();toast('Loaded URLs','success');}else toast('No data','err');}catch(e){}}
function syncFromCitation(){try{const cf=JSON.parse(localStorage.getItem('cf_state_v1')||'null');const b=cf?.businesses?.[0];if(b){state.brand=b.name||state.brand;state.city=b.city||state.city;state.kw=b.category||state.kw;fillInputs();saveState();toast('Synced','success');}}catch(e){}}

const PROXIES=[u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`];
async function fetchPage(u){for(const p of PROXIES){try{const r=await fetch(p(u));if(r.ok){const t=await r.text();if(t&&t.length>100)return t;}}catch(e){}}return null;}

async function runAudit(){
  getInputs();
  const urls=state.urls.split('\n').map(u=>u.trim()).filter(Boolean).slice(0,50);
  if(!urls.length){toast('No URLs','err');return;}
  setBusy(true,'Bulk auditing…',`0/${urls.length}`,0);
  const results=[];
  for(let i=0;i<urls.length;i++){
    setBusy(true,'Bulk auditing…',`${i+1}/${urls.length}: ${urls[i].substring(0,40)}`,Math.round((i+1)/urls.length*100));
    const html=await fetchPage(urls[i]);
    if(!html){results.push({url:urls[i], error:'CORS failed', score:0, checks:[]});continue;}
    results.push(auditPage(urls[i], html, state));
    await new Promise(r=>setTimeout(r,150));
  }
  state.results=results;
  saveState();setBusy(false);render();
  toast(`Audited ${results.length} pages`,'success');
}

function auditPage(url, html, ctx){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const checks=[];
  // Title
  const title=doc.querySelector('title')?.textContent?.trim()||'';
  const tlen=title.length;
  checks.push({key:'title', status: tlen>=30&&tlen<=60?'pass':tlen>0?'warn':'fail', label:'Title length', val:`${tlen}ch`, weight:10});
  // Keyword in title
  if(ctx.kw){const has=title.toLowerCase().includes(ctx.kw.toLowerCase());checks.push({key:'kw_title', status:has?'pass':'fail', label:'Keyword in title', val:has?'✓':'missing', weight:12});}
  // City in title
  if(ctx.city){const has=title.toLowerCase().includes(ctx.city.toLowerCase());checks.push({key:'city_title', status:has?'pass':'warn', label:'City in title', val:has?'✓':'missing', weight:6});}
  // Meta description
  const meta=doc.querySelector('meta[name="description"]')?.content||'';
  const mlen=meta.length;
  checks.push({key:'meta', status: mlen>=120&&mlen<=160?'pass':mlen>0?'warn':'fail', label:'Meta description', val:`${mlen}ch`, weight:8});
  // Keyword in meta
  if(ctx.kw){const has=meta.toLowerCase().includes(ctx.kw.toLowerCase());checks.push({key:'kw_meta', status:has?'pass':'warn', label:'Keyword in meta', val:has?'✓':'missing', weight:5});}
  // H1
  const h1Count=doc.querySelectorAll('h1').length;
  const h1=doc.querySelector('h1')?.textContent?.trim()||'';
  checks.push({key:'h1_count', status: h1Count===1?'pass':h1Count===0?'fail':'warn', label:'H1 tag', val:`${h1Count} H1${h1Count===1?'':'s'}`, weight:10});
  if(ctx.kw && h1){const has=h1.toLowerCase().includes(ctx.kw.toLowerCase());checks.push({key:'kw_h1', status:has?'pass':'warn', label:'Keyword in H1', val:has?'✓':'missing', weight:8});}
  // H2 count
  const h2Count=doc.querySelectorAll('h2').length;
  checks.push({key:'h2', status: h2Count>=2?'pass':h2Count>=1?'warn':'fail', label:'H2 structure', val:`${h2Count} H2s`, weight:5});
  // Schema
  const jsonLd=[...doc.querySelectorAll('script[type="application/ld+json"]')];
  const hasSchema=jsonLd.length>0;
  let hasLocal=false;
  jsonLd.forEach(s=>{try{const j=JSON.parse(s.textContent);const flat=Array.isArray(j)?j:(j['@graph']||[j]);if(flat.some(x=>(x['@type']||'').toString().includes('LocalBusiness')||(x['@type']||'').toString().includes('Organization')))hasLocal=true;}catch(e){}});
  checks.push({key:'schema', status:hasSchema?'pass':'fail', label:'Schema markup', val:hasSchema?`${jsonLd.length} block(s)`:'missing', weight:8});
  checks.push({key:'local_schema', status:hasLocal?'pass':'warn', label:'LocalBusiness/Org schema', val:hasLocal?'✓':'missing', weight:6});
  // Canonical
  const canon=doc.querySelector('link[rel="canonical"]')?.href||'';
  checks.push({key:'canonical', status:canon?'pass':'warn', label:'Canonical tag', val:canon?'set':'missing', weight:4});
  // OG image
  const ogImg=doc.querySelector('meta[property="og:image"]')?.content||'';
  checks.push({key:'og_image', status:ogImg?'pass':'warn', label:'OG image', val:ogImg?'set':'missing', weight:3});
  // Word count
  const text=(doc.body?.textContent||'').replace(/\s+/g,' ').trim();
  const words=text.split(/\s+/).length;
  checks.push({key:'words', status:words>=600?'pass':words>=300?'warn':'fail', label:'Word count', val:words, weight:6});
  // Images
  const imgs=[...doc.querySelectorAll('img')];
  const withAlt=imgs.filter(i=>i.alt&&i.alt.trim()).length;
  const altCov=imgs.length?Math.round(withAlt/imgs.length*100):100;
  checks.push({key:'img_alt', status:imgs.length===0?'pass':altCov>=90?'pass':altCov>=60?'warn':'fail', label:'Image alt coverage', val:imgs.length?`${altCov}%`:'no imgs', weight:5});
  // Internal links
  let ownDomain='';try{ownDomain=new URL(url).hostname;}catch(e){}
  const allLinks=[...doc.querySelectorAll('a[href^="http"]')];
  const internal=allLinks.filter(a=>{try{return new URL(a.href).hostname===ownDomain;}catch(e){return false;}});
  const external=allLinks.filter(a=>{try{return new URL(a.href).hostname!==ownDomain;}catch(e){return false;}});
  checks.push({key:'internal_links', status:internal.length>=3?'pass':internal.length>=1?'warn':'fail', label:'Internal links', val:internal.length, weight:4});
  checks.push({key:'external_links', status:external.length>=2?'pass':external.length>=1?'warn':'info', label:'External links', val:external.length, weight:2});
  // Viewport
  const viewport=doc.querySelector('meta[name="viewport"]')?.content||'';
  checks.push({key:'viewport', status:viewport?'pass':'fail', label:'Mobile viewport', val:viewport?'set':'missing', weight:4});
  // Tel link
  const telLinks=doc.querySelectorAll('a[href^="tel:"]').length;
  checks.push({key:'tel', status:telLinks>0?'pass':'warn', label:'Click-to-call', val:telLinks?`${telLinks} link${telLinks>1?'s':''}`:'missing', weight:5});

  // Score
  let total=0, earned=0;
  checks.forEach(c=>{if(c.status==='info')return;total+=c.weight;if(c.status==='pass')earned+=c.weight;else if(c.status==='warn')earned+=c.weight*0.5;});
  const score=total?Math.round(earned/total*100):0;
  return {url, title, score, checks, words, h1, mlen, tlen};
}

function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function render(){
  const results=state.results;
  const validResults=results.filter(r=>!r.error);
  document.getElementById('stat-pages').textContent=results.length;
  document.getElementById('stat-avg').textContent=validResults.length?Math.round(validResults.reduce((s,r)=>s+r.score,0)/validResults.length)+'/100':'—';
  const criticalFails=validResults.reduce((s,r)=>s+r.checks.filter(c=>c.status==='fail'&&c.weight>=8).length,0);
  document.getElementById('stat-fails').textContent=criticalFails;
  if(state.view==='overview') return renderOverview(results, validResults);
  if(state.view==='matrix') return renderMatrix(results);
  if(state.view==='details') return renderDetails(results);
  if(state.view==='failures') return renderFailures(validResults);
}

function renderOverview(results, valid){
  if(!results.length){
    document.getElementById('cbody').innerHTML=`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <div class="et">Multi-Page On-Page Audit</div>
      <div class="ed">Paste up to 50 URLs in the left panel, set your brand/city/keyword context, and run a bulk audit. Each page gets scored on title, meta, H1, schema, content depth, images, internal links, mobile viewport, and click-to-call — all at once for fast content audits or multi-location quality checks.</div>
    </div>`;
    return;
  }
  const avgScore=valid.length?Math.round(valid.reduce((s,r)=>s+r.score,0)/valid.length):0;
  const passing=valid.filter(r=>r.score>=80).length;
  const failing=valid.filter(r=>r.score<60).length;
  const errors=results.filter(r=>r.error).length;
  // Aggregate failures
  const failCount={};
  valid.forEach(r=>r.checks.forEach(c=>{if(c.status==='fail'){failCount[c.label]=(failCount[c.label]||0)+1;}}));
  const topFails=Object.entries(failCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  // Sorted pages
  const sortedByScore=valid.slice().sort((a,b)=>a.score-b.score);
  document.getElementById('cbody').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="l">Pages audited</div><div class="v">${results.length}</div><div class="s">${errors?errors+' errors':''}</div></div>
      <div class="kpi s"><div class="l">Avg score</div><div class="v">${avgScore}/100</div><div class="s">across all pages</div></div>
      <div class="kpi s"><div class="l">Passing (≥80)</div><div class="v">${passing}</div><div class="s">${valid.length?Math.round(passing/valid.length*100):0}% of audited</div></div>
      <div class="kpi d"><div class="l">Failing (<60)</div><div class="v">${failing}</div><div class="s">need work</div></div>
    </div>
    <div class="section"><div class="section-hdr"><h3>Lowest-Scoring Pages (Fix First)</h3></div><div>
      ${sortedByScore.slice(0,8).map(r=>{const cls=r.score>=80?'s':r.score>=60?'w':'d';return `<div style="padding:11px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;cursor:pointer" onclick="state.activeUrl='${escapeAttr(r.url)}';state.view='details';saveState();render();"><div class="score-cell ${cls}" style="padding:8px;border-radius:8px">${r.score}</div><div style="min-width:0"><div style="font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.title||r.url)}</div><div style="font-size:10.5px;color:var(--text3);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(r.url)}</div></div><div style="font-family:var(--mono);font-size:11px;color:var(--text2)">${r.checks.filter(c=>c.status==='fail').length} fails</div></div>`;}).join('')}
    </div></div>
    ${topFails.length?`<div class="section"><div class="section-hdr"><h3>Most Common Failures</h3></div><div>
      ${topFails.map(([label, count])=>`<div style="padding:11px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center"><div style="font-weight:700;font-size:12.5px">${escapeHtml(label)}</div><div style="font-family:var(--mono);font-size:11.5px;color:var(--danger);font-weight:800">${count} page${count>1?'s':''}</div></div>`).join('')}
    </div></div>`:''}
  `;
}

function renderMatrix(results){
  const valid=results.filter(r=>!r.error);
  if(!valid.length){document.getElementById('cbody').innerHTML='<div class="empty"><div class="et">No data</div></div>';return;}
  // Get all unique check keys from results
  const allKeys=new Map();
  valid.forEach(r=>r.checks.forEach(c=>{if(!allKeys.has(c.key))allKeys.set(c.key,c.label);}));
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Audit Matrix (${valid.length} pages × ${allKeys.size} checks)</h3></div><div class="matrix-wrap">
    <table class="matrix-table">
      <thead><tr><th>URL</th><th class="center">Score</th>${Array.from(allKeys.entries()).map(([key,label])=>`<th class="center" title="${escapeAttr(label)}">${escapeHtml(label.split(' ').map(w=>w[0]).join('').slice(0,4))}</th>`).join('')}</tr></thead>
      <tbody>
        ${valid.slice().sort((a,b)=>a.score-b.score).map(r=>{
          const cls=r.score>=80?'s':r.score>=60?'w':'d';
          const checkMap={};r.checks.forEach(c=>{checkMap[c.key]=c;});
          return `<tr><td class="url"><a href="${escapeAttr(r.url)}" target="_blank">${escapeHtml(r.title||r.url.split('/').pop()||r.url)}</a></td><td class="center"><span class="score-cell ${cls}">${r.score}</span></td>${Array.from(allKeys.keys()).map(k=>{const c=checkMap[k];if(!c)return '<td class="center"><span class="cell na">—</span></td>';return `<td class="center" title="${escapeAttr(c.label+': '+c.val)}"><span class="cell ${c.status}">${c.status==='pass'?'✓':c.status==='warn'?'!':c.status==='fail'?'✗':'i'}</span></td>`;}).join('')}</tr>`;
        }).join('')}
      </tbody>
    </table>
  </div></div>`;
}

function renderDetails(results){
  const valid=results.filter(r=>!r.error);
  if(!valid.length){document.getElementById('cbody').innerHTML='<div class="empty"><div class="et">No data</div></div>';return;}
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Per-Page Details</h3><span class="badge">${valid.length}</span></div><div>
    ${valid.slice().sort((a,b)=>a.score-b.score).map(r=>{const cls=r.score>=80?'s':r.score>=60?'w':'d';return `<div class="page-detail">
      <div class="hdr">
        <div class="score-box ${cls}">${r.score}</div>
        <div class="info"><div class="title">${escapeHtml(r.title||'(no title)')}</div><div class="url">${escapeHtml(r.url)}</div></div>
        <div class="stats">${r.words}w · T:${r.tlen} M:${r.mlen}</div>
      </div>
      <div class="checks">
        ${r.checks.map(c=>`<div class="check-pill ${c.status}"><div class="icon">${c.status==='pass'?'✓':c.status==='warn'?'!':c.status==='fail'?'✗':'i'}</div><div class="label">${escapeHtml(c.label)}</div><div class="val">${escapeHtml(String(c.val))}</div></div>`).join('')}
      </div>
    </div>`;}).join('')}
  </div></div>`;
}

function renderFailures(valid){
  // Aggregate by check key
  const failsByKey={};
  valid.forEach(r=>r.checks.forEach(c=>{
    if(c.status==='fail'||c.status==='warn'){
      if(!failsByKey[c.label]){failsByKey[c.label]={fail:0,warn:0,examples:[]};}
      if(c.status==='fail')failsByKey[c.label].fail++;else failsByKey[c.label].warn++;
      if(failsByKey[c.label].examples.length<5)failsByKey[c.label].examples.push({url:r.url, val:c.val});
    }
  }));
  const sorted=Object.entries(failsByKey).sort((a,b)=>(b[1].fail*2+b[1].warn)-(a[1].fail*2+a[1].warn));
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Common Failure Patterns</h3><span class="badge">${sorted.length}</span></div><div>
    ${sorted.length?sorted.map(([label, info])=>`<div style="padding:12px 16px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">
        <div style="font-size:13px;font-weight:700;flex:1">${escapeHtml(label)}</div>
        ${info.fail?`<div style="font-family:var(--mono);font-size:10.5px;font-weight:800;padding:2px 7px;background:rgba(220,38,38,.13);color:var(--danger);border-radius:11px">${info.fail} FAIL</div>`:''}
        ${info.warn?`<div style="font-family:var(--mono);font-size:10.5px;font-weight:800;padding:2px 7px;background:rgba(245,158,11,.13);color:var(--amber);border-radius:11px">${info.warn} WARN</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">
        ${info.examples.map(ex=>`<div style="padding:6px 11px;background:var(--bg);border-radius:5px;font-family:var(--mono);font-size:10.5px;color:var(--text2);display:flex;gap:10px;align-items:center"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(ex.url)}</span><span style="color:var(--text3)">${escapeHtml(String(ex.val))}</span></div>`).join('')}
      </div>
    </div>`).join(''):'<div style="padding:30px;text-align:center;color:var(--success);font-weight:700">✓ No failures detected</div>'}
  </div></div>`;
}

function exportCSV(){
  const valid=state.results.filter(r=>!r.error);
  if(!valid.length){toast('Nothing to export','err');return;}
  const allKeys=new Set();valid.forEach(r=>r.checks.forEach(c=>allKeys.add(c.key)));
  const keys=Array.from(allKeys);
  const rows=[['url','title','score','word_count',...keys]];
  valid.forEach(r=>{const map={};r.checks.forEach(c=>{map[c.key]=c.status+':'+c.val;});rows.push([r.url, r.title, r.score, r.words, ...keys.map(k=>map[k]||'')]);});
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='bulk-audit.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('CSV exported','success');
}
