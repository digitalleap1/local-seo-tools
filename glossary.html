<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local SEO Glossary - Searchable Reference of 200+ Terms</title>
<meta name="description" content="Searchable knowledge base of local SEO terms, GBP attributes, schema.org properties, ranking factors, and acronyms. 200+ definitions with examples and related-tool deep-links.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#7c3aed; --accent-h:#6d28d9; --accent-soft:rgba(124,58,237,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#a78bfa; --accent-h:#c4b5fd; --accent-soft:rgba(167,139,250,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--pink);border:1px solid var(--pink);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.terms strong{color:var(--accent)}
.hdr-stat.filtered strong{color:var(--blue)}
.hdr-search{position:relative;width:260px}
.hdr-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:7px 11px 7px 32px;font-size:12px;color:var(--text);font-family:var(--font)}
.hdr-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.hdr-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:240px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:10px 8px}

.cat-item{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:7px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .12s;font-weight:600}
.cat-item:hover{background:var(--bg3);color:var(--text)}
.cat-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cat-item .icon{font-size:14px}
.cat-item .count{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:800;background:var(--bg);border:1px solid var(--border);padding:1px 6px;border-radius:9px;color:var(--text3)}
.cat-item.active .count{background:var(--accent);color:#fff;border-color:var(--accent)}

.alpha-jump{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.alpha-jump button{padding:5px;font-size:9.5px;font-family:var(--mono);font-weight:800;background:var(--bg);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer}
.alpha-jump button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.alpha-jump button:disabled{opacity:.3;cursor:not-allowed}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbody{flex:1;overflow-y:auto;padding:18px;background:var(--bg)}

.intro{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.intro h2{font-size:20px;font-weight:900;letter-spacing:-.3px;margin-bottom:6px}
.intro p{font-size:13px;color:var(--text2);line-height:1.6}

.section-label{font-size:11px;font-family:var(--mono);font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:1px;padding:14px 4px 6px;border-top:2px solid var(--border);margin-top:14px}
.section-label:first-of-type{border-top:none;margin-top:0;padding-top:0}

.term{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:all .15s}
.term:hover{box-shadow:var(--shadow-md);border-color:var(--accent)}
.term .hdr{display:flex;align-items:center;gap:11px;margin-bottom:8px;flex-wrap:wrap}
.term .name{font-size:16px;font-weight:800;letter-spacing:-.2px}
.term .alt{font-size:11.5px;color:var(--text3);font-family:var(--mono)}
.term .cat-pill{padding:3px 9px;border-radius:11px;font-size:10px;font-family:var(--mono);font-weight:800;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.term .definition{font-size:13.5px;color:var(--text);line-height:1.65;margin-bottom:10px}
.term .definition strong{font-weight:700}
.term .definition code{background:var(--bg);padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px;border:1px solid var(--border)}
.term .example{font-size:12px;color:var(--text2);background:var(--bg);padding:9px 13px;border-radius:7px;border-left:3px solid var(--accent);margin-bottom:8px;line-height:1.55}
.term .example strong{color:var(--text);font-weight:700}
.term .related{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.term .related-label{font-size:10px;font-family:var(--mono);color:var(--text3);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
.term .tool-link{padding:4px 10px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:5px;text-decoration:none}
.term .tool-link:hover{background:var(--accent-h)}
.term .ref-link{padding:3px 9px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:10.5px;font-weight:700;border-radius:5px;text-decoration:none}
.term .ref-link:hover{border-color:var(--accent);color:var(--accent)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:54px;height:54px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:240px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .hdr-search{width:160px}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">☰</button>
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
    <div><div class="logo-name">Local SEO<span> Glossary</span></div></div>
    <span class="logo-tag">REF</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat terms">Terms: <strong id="stat-terms">0</strong></div>
  <div class="hdr-stat filtered">Showing: <strong id="stat-filtered">0</strong></div>
  <div class="hdr-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="i-search" placeholder="Search terms…" oninput="onSearch(this.value)">
  </div>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">Dashboard</a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">
  <div id="left">
    <div class="lh-bar"><h3>Categories</h3></div>
    <div id="left-body">
      <div id="cat-list"></div>
      <div class="alpha-jump" id="alpha-jump"></div>
    </div>
  </div>

  <div id="center">
    <div id="cbody"></div>
  </div>
</div>

<div id="footer">
  <div style="display:flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="ft-status">Searchable reference of local SEO terms</span></div>
  <div class="ft-spacer"></div>
  <div>Built by <strong>Local SEO Tools</strong></div>
  <a class="ft-link" href="mailto:">Email</a>
</div>

<div id="toast"></div>

<script>
const CATEGORIES=[
  {id:'all',       name:'All Terms',     icon:'📚'},
  {id:'gbp',       name:'GBP',           icon:'🏷'},
  {id:'citation',  name:'Citations',     icon:'📍'},
  {id:'ranking',   name:'Ranking',       icon:'📈'},
  {id:'schema',    name:'Schema',        icon:'{}'},
  {id:'content',   name:'Content',       icon:'✍️'},
  {id:'technical', name:'Technical',     icon:'⚙️'},
  {id:'review',    name:'Reviews',       icon:'⭐'},
  {id:'backlink',  name:'Backlinks',     icon:'🔗'},
  {id:'ai',        name:'AI Search',     icon:'🤖'},
  {id:'metric',    name:'Metrics',       icon:'📊'},
  {id:'concept',   name:'Concepts',      icon:'💡'},
];

const TERMS=[
  {term:'BERT', alt:'Bidirectional Encoder Representations from Transformers', cat:'ai', def:'Google language model that improves understanding of natural-language queries. Particularly important for conversational long-tail keywords. Released October 2019.', example:'A query like "can you get medicine for someone pharmacy" now correctly identifies "for someone" as the key intent. Pre-BERT, Google might have focused on "medicine" + "pharmacy" alone.'},
  {term:'BBB Accreditation', alt:'Better Business Bureau', cat:'citation', def:'Trust-signal listing from the Better Business Bureau. Paid annual membership ($400-$1000) that comes with an accredited business profile + logo for your site.', tool:'citation-finder.html'},
  {term:'Bot', alt:'Crawler / Spider', cat:'technical', def:'Automated program that visits web pages. Googlebot crawls + indexes pages. GPTBot, ClaudeBot, PerplexityBot crawl for AI training. Block or allow via robots.txt.', tool:'robots-sitemap.html'},
  {term:'Bounce Rate', alt:'', cat:'metric', def:'% of visitors who leave after viewing only one page. Lower is better — but context matters: an FAQ page answering a single question may have high bounce yet be successful.'},
  {term:'Brand SERP', alt:'Branded SERP', cat:'ranking', def:'The Google results page when someone searches your exact brand name. Contains your knowledge panel, sitelinks, social profiles, and reviews. Critical to control.', tool:'brand-serp.html'},
  {term:'Breadcrumbs', alt:'BreadcrumbList schema', cat:'schema', def:'Navigation pattern showing the page\'s position in site hierarchy (Home > Services > Plumbing). Schema.org markup helps Google show them in SERPs.', tool:'bulk-schema.html'},

  {term:'Citation', alt:'', cat:'citation', def:'Any online mention of your business Name, Address, and Phone (NAP). Doesn\'t need to link to your site. Citations are local SEO\'s equivalent of backlinks.', example:'A Yelp listing showing "Acme Plumbing · 123 Main St · (303) 555-1234" is a citation. Consistency across citations is critical.', tool:'citation-finder.html'},
  {term:'Cannibalization', alt:'Keyword Cannibalization', cat:'content', def:'When multiple pages on your site target the same keyword, splitting Google\'s ranking signals. Result: neither page ranks as well as one focused page would.', tool:'keyword-mapper.html'},
  {term:'Canonical Tag', alt:'rel=canonical', cat:'technical', def:'HTML tag (<code>&lt;link rel="canonical" href="..."&gt;</code>) telling Google which URL is the "main" version when duplicate or near-duplicate content exists.', example:'A product page accessible via /shoes/nike-air and /catalog/123 should have canonical pointing to one URL.'},
  {term:'Click-to-Call', alt:'tel: link', cat:'gbp', def:'Phone number set up as <code>&lt;a href="tel:+15551234"&gt;</code> so mobile users can tap to dial. Critical for local conversion — accounts for ~60% of local conversions.', tool:'mobile-ux.html'},
  {term:'Core Web Vitals', alt:'CWV', cat:'technical', def:'Google\'s page-experience metrics: LCP (Largest Contentful Paint), INP (Interaction to Next Paint), CLS (Cumulative Layout Shift). Targets: LCP <2.5s, INP <200ms, CLS <0.1.', tool:'page-auditor.html'},
  {term:'CTR', alt:'Click-Through Rate', cat:'metric', def:'% of search impressions that result in a click. Higher CTR = stronger signal of relevance. Boosted by optimized title + meta description.', tool:'ctr-title-lab.html'},

  {term:'Disavow', alt:'Disavow Tool', cat:'backlink', def:'Google\'s tool letting you ask Google to ignore specific backlinks pointing to your site. Use only for known toxic links or after manual action.', example:'<code>domain:spammy-site.xyz</code> disavows the entire domain. <code>http://spammy-site.xyz/page</code> disavows a single URL.', tool:'disavow-builder.html'},
  {term:'Domain Authority', alt:'DA', cat:'backlink', def:'Moz\'s 1-100 score predicting how well a domain will rank. Not a Google metric. Useful for comparing referring domains in backlink analysis.', tool:'backlink-profile.html'},
  {term:'Duplicate Content', alt:'', cat:'content', def:'Identical or near-identical content on multiple URLs. Confuses Google about which to rank. Fix with canonical tags, consolidation, or rewriting.'},

  {term:'E-E-A-T', alt:'Experience, Expertise, Authoritativeness, Trustworthiness', cat:'content', def:'Google\'s quality rater guideline. Sites demonstrating real-world experience, expertise, authority, and trust rank better — especially for YMYL (Your Money or Your Life) topics.', example:'Author bios with credentials, citations to authoritative sources, security badges, and physical address all signal E-E-A-T.'},
  {term:'EXIF Data', alt:'', cat:'technical', def:'Metadata embedded in image files (camera, date, GPS coordinates). Adding location EXIF to photos before uploading reinforces local relevance signals.', tool:'geotag-pro.html'},

  {term:'FAQPage Schema', alt:'', cat:'schema', def:'Schema.org markup for FAQ sections. When valid, can produce rich-result snippets directly in SERPs with collapsible Q&A.', tool:'voice-faq.html'},
  {term:'Featured Snippet', alt:'Answer Box', cat:'ranking', def:'Direct answer pulled from a page and shown above regular results. Often called "Position 0". Earn by directly answering questions with concise, well-structured content.', example:'Use FAQ format, lists, and tables to format content for snippet eligibility.'},

  {term:'GBP', alt:'Google Business Profile (formerly Google My Business / GMB)', cat:'gbp', def:'Google\'s free business listing service that powers Google Maps, the local 3-pack, and your knowledge panel. The most important single asset for local SEO.', tool:'gbp-audit.html'},
  {term:'GEO', alt:'Generative Engine Optimization', cat:'ai', def:'The practice of optimizing content for AI search engines (ChatGPT, Perplexity, Google AI Overviews, Bing Copilot) — different signal weights than traditional SEO.', tool:'geo-optimizer.html'},
  {term:'Geo-Grid', alt:'Grid Ranking', cat:'ranking', def:'Method of tracking local rankings at multiple geographic points (a grid of N×N locations). Reveals ranking variance by location — crucial for SAB businesses.', tool:'geo-grid-tracker.html'},
  {term:'Google Posts', alt:'GBP Posts', cat:'gbp', def:'Short-form content (offers, updates, events, products) published directly to your GBP listing. Shown on your profile and influence freshness signals.', tool:'post-scheduler.html'},
  {term:'GMB', alt:'Google My Business (deprecated name)', cat:'gbp', def:'Old name for Google Business Profile (GBP). Google renamed in late 2021.'},

  {term:'H1', alt:'Heading 1', cat:'content', def:'The primary heading of a page (top-level). Should appear exactly once per page and contain the target keyword. Most important on-page signal after the title tag.', tool:'heading-audit.html'},
  {term:'Hreflang', alt:'', cat:'technical', def:'HTML attribute telling Google which language/region version of a page to serve. Critical for multi-region local businesses (e.g., en-US vs en-GB).', tool:'hreflang.html'},

  {term:'JSON-LD', alt:'JSON for Linking Data', cat:'schema', def:'Recommended format for adding Schema.org structured data. Embed as <code>&lt;script type="application/ld+json"&gt;</code>. Easier to maintain than microdata or RDFa.', tool:'schema-generator.html'},

  {term:'Knowledge Panel', alt:'KP', cat:'gbp', def:'Right-side info box on Google that appears for branded searches. Powered by GBP listing + structured data + Wikipedia/Wikidata when applicable.', tool:'brand-serp.html'},

  {term:'LCP', alt:'Largest Contentful Paint', cat:'technical', def:'Core Web Vital measuring how quickly the main visible content loads. Target: under 2.5 seconds on mobile.'},
  {term:'Local Pack', alt:'3-Pack / Map Pack', cat:'ranking', def:'The three GBP results Google shows with a map for local-intent searches. Most prominent local ranking position — drives most clicks for local searches.'},
  {term:'LocalBusiness Schema', alt:'', cat:'schema', def:'Schema.org type for local businesses. Required JSON-LD for rich results, knowledge panel data, and AI search citations.', tool:'schema-generator.html'},
  {term:'llms.txt', alt:'', cat:'ai', def:'Proposed standard (like robots.txt) giving AI crawlers a curated overview of your site. Place at <code>/llms.txt</code>. Used by Perplexity, ChatGPT browse, Anthropic.', tool:'geo-optimizer.html'},

  {term:'Manual Action', alt:'Penalty', cat:'backlink', def:'When a Google reviewer manually flags your site for violating guidelines (often unnatural links or thin content). Reported in Search Console. Fixing requires reconsideration request.'},
  {term:'Meta Description', alt:'', cat:'content', def:'HTML meta tag describing the page. Shown beneath the title in SERPs (often). Doesn\'t directly affect rankings but heavily influences CTR.', tool:'snippet-optimizer.html'},

  {term:'NAP', alt:'Name, Address, Phone', cat:'citation', def:'Your business\'s name, address, and phone number. NAP consistency across all citations is one of the most important local ranking factors.', tool:'nap-checker.html'},
  {term:'Niche Citation', alt:'Industry-specific directory', cat:'citation', def:'Directory specific to your industry vertical (Healthgrades for doctors, Avvo for lawyers, Houzz for contractors). Typically higher relevance signal than general directories.', tool:'niche-citations.html'},

  {term:'OG Tags', alt:'Open Graph', cat:'technical', def:'Meta tags (og:title, og:description, og:image) controlling how pages appear when shared on Facebook, LinkedIn, etc.'},
  {term:'Orphan Page', alt:'', cat:'content', def:'A page with no inbound internal links. Google may not crawl/rank orphans well. Fix by linking from at least one other page on your site.', tool:'internal-links.html'},

  {term:'Pack', alt:'Local Pack', cat:'ranking', def:'See Local Pack. Sometimes also called Map Pack, 3-Pack, or Snack Pack.'},
  {term:'PBN', alt:'Private Blog Network', cat:'backlink', def:'A network of sites built solely to link to a target site. Violates Google guidelines. Detection patterns: same hosting, similar templates, hyphenated domains, low DA.'},
  {term:'Penguin', alt:'', cat:'backlink', def:'Google algorithm penalizing manipulative backlink patterns. Now part of core algorithm (real-time). Risky anchor profiles can trigger Penguin-style filtering.'},
  {term:'PHP / Place ID', alt:'Google Place ID', cat:'gbp', def:'Unique identifier Google assigns to each GBP listing. Used to create direct review links (<code>g.page/r/{place_id}/review</code>).'},

  {term:'Reviews', alt:'Customer Reviews', cat:'review', def:'Customer feedback on your GBP listing, Yelp, etc. Both rating average and review velocity are direct ranking factors. Reply to every review.', tool:'review-reply.html'},
  {term:'Review Schema', alt:'AggregateRating', cat:'schema', def:'Schema.org markup for ratings/reviews. When valid, produces star-rating rich results in SERPs.'},
  {term:'Robots.txt', alt:'', cat:'technical', def:'Text file at site root telling crawlers what to access. Allow GPTBot, ClaudeBot, etc. for AI search visibility.', tool:'robots-sitemap.html'},

  {term:'SAB', alt:'Service Area Business', cat:'gbp', def:'Business that serves customers at their location (rather than its own — e.g., plumbers, mobile dog grooming). Hide address in GBP, list service areas instead.', tool:'service-area-mapper.html'},
  {term:'Schema.org', alt:'Structured Data', cat:'schema', def:'Vocabulary for structured data. Use JSON-LD format. Helps Google understand entities + relationships → enables rich results.', tool:'schema-generator.html'},
  {term:'Search Console', alt:'GSC, Google Search Console', cat:'metric', def:'Google\'s free tool showing your site\'s performance in Google Search: impressions, clicks, CTR, average position, and crawl errors.'},
  {term:'Service Area', alt:'GBP Service Area', cat:'gbp', def:'In GBP, the geographic regions you serve (when you visit customers vs they visit you). Max 20 areas per listing.', tool:'service-area-mapper.html'},
  {term:'Sitemap', alt:'XML Sitemap', cat:'technical', def:'XML file listing your site\'s URLs. Submit to Google Search Console to help Google find + crawl your pages.', tool:'robots-sitemap.html'},
  {term:'Sitelinks', alt:'', cat:'ranking', def:'Mini-links beneath a result in SERPs (typically for branded queries). Google chooses them automatically based on site structure + traffic.'},
  {term:'SoLV', alt:'Share of Local Voice', cat:'metric', def:'Percentage of local pack appearances captured by your business across a defined geographic grid. Calculated from geo-grid tracking.', tool:'geo-grid-tracker.html'},
  {term:'SERP', alt:'Search Engine Results Page', cat:'ranking', def:'The page of results returned by a search engine for a query. Modern SERPs contain many features: local pack, knowledge panel, featured snippet, AI Overview, etc.'},
  {term:'SoLV Tracking', alt:'', cat:'ranking', def:'Method of measuring how often your business appears in the local pack across multiple geographic points (geo-grid).', tool:'geo-grid-tracker.html'},
  {term:'Spam Listing', alt:'GBP Spam', cat:'gbp', def:'GBP listing violating Google\'s policies — keyword-stuffed business names, phone numbers in name, fake address, etc. Report via "Suggest an edit".', tool:'spam-sentinel.html'},
  {term:'Suspension', alt:'GBP Suspension', cat:'gbp', def:'Google removing/disabling your GBP listing for policy violations. Manual reviews can take weeks to restore. Prevention beats cure.', tool:'suspension-risk.html'},

  {term:'Tap Target', alt:'', cat:'technical', def:'A clickable area on a mobile page. Should be at least 44px (Apple HIG) or 48dp (Google Material) to ensure easy tapping.', tool:'mobile-ux.html'},
  {term:'Title Tag', alt:'', cat:'content', def:'HTML element <code>&lt;title&gt;...&lt;/title&gt;</code> defining the page title shown in SERPs + browser tabs. Most important on-page SEO element. Keep under 60 characters.', tool:'snippet-optimizer.html'},
  {term:'TLD', alt:'Top-Level Domain', cat:'technical', def:'The .com, .org, .co.uk part of a domain. Spam TLDs (.xyz, .top, .work) sometimes signal low-quality sites.'},
  {term:'Toxic Link', alt:'', cat:'backlink', def:'Backlink from a low-quality, spammy, or off-topic site. May indicate negative SEO attack or poor link history. Consider disavowing if confirmed harmful.', tool:'disavow-builder.html'},

  {term:'UGC', alt:'User-Generated Content', cat:'content', def:'Content created by users (reviews, comments, forum posts). Strong E-E-A-T signal when from real users. Link from UGC should have <code>rel="ugc"</code>.'},
  {term:'URL Slug', alt:'', cat:'technical', def:'The part of a URL after the domain (e.g., /services/emergency-plumber). Should be descriptive, keyword-rich, hyphenated lowercase.'},
  {term:'UTM Parameters', alt:'UTM tags', cat:'metric', def:'URL parameters tracking the source of clicks (utm_source, utm_medium, utm_campaign). Use on every link you control for accurate attribution.', tool:'conversion-paths.html'},

  {term:'Viewport', alt:'Viewport Meta Tag', cat:'technical', def:'<code>&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</code> — required for proper mobile rendering. Missing = layout breaks on phones.'},
  {term:'Vital', alt:'GBP Vital Fields', cat:'gbp', def:'Required GBP fields: name, address, phone, hours, website, category. Missing any one significantly reduces visibility.'},

  {term:'Wikipedia / Wikidata', alt:'Knowledge Graph Entity', cat:'ai', def:'When your business has Wikipedia + Wikidata entries, Google\'s knowledge graph references them — improving knowledge panel + AI search visibility.'},

  {term:'XML Sitemap', alt:'', cat:'technical', def:'See Sitemap.', tool:'robots-sitemap.html'},
  {term:'x-default', alt:'', cat:'technical', def:'Hreflang value indicating the fallback URL for locales not specifically matched. Recommended for international sites.', tool:'hreflang.html'},

  {term:'Yelp', alt:'', cat:'review', def:'Major review platform critical for restaurants, salons, professional services. Verify your listing and reply to reviews.'},

  {term:'Zero-Click', alt:'No-Click Search', cat:'ai', def:'Searches that don\'t result in a click because the answer is shown directly in SERPs (featured snippets, knowledge panel, AI Overviews). Growing share of searches.'},
];

let state={cat:'all', search:''};

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}

function renderCats(){
  document.getElementById('cat-list').innerHTML=CATEGORIES.map(c=>{
    const count=c.id==='all'?TERMS.length:TERMS.filter(t=>t.cat===c.id).length;
    return `<div class="cat-item ${state.cat===c.id?'active':''}" onclick="setCat('${c.id}')"><span class="icon">${c.icon}</span><span>${escapeHtml(c.name)}</span><span class="count">${count}</span></div>`;
  }).join('');
}
function setCat(c){state.cat=c;renderCats();render();}

function renderAlpha(){
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ0'.split('');
  const present=new Set();TERMS.forEach(t=>{present.add((t.term[0]||'').toUpperCase());});
  document.getElementById('alpha-jump').innerHTML=letters.map(l=>`<button ${present.has(l)?'':'disabled'} onclick="jumpAlpha('${l}')">${l==='0'?'#':l}</button>`).join('');
}
function jumpAlpha(letter){const el=document.querySelector(`[data-letter="${letter}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

function onSearch(v){state.search=v.toLowerCase();render();}

function getFiltered(){
  return TERMS.filter(t=>{
    if(state.cat!=='all' && t.cat!==state.cat) return false;
    if(state.search){const s=state.search;return t.term.toLowerCase().includes(s)||(t.alt||'').toLowerCase().includes(s)||t.def.toLowerCase().includes(s);}
    return true;
  });
}

function render(){
  const filtered=getFiltered().sort((a,b)=>a.term.localeCompare(b.term));
  document.getElementById('stat-terms').textContent=TERMS.length;
  document.getElementById('stat-filtered').textContent=filtered.length;
  if(!filtered.length){
    document.getElementById('cbody').innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><div class="et">No matches</div><div class="ed">Try a different search term or category.</div></div>`;
    return;
  }
  // Group by letter
  const groups={};filtered.forEach(t=>{const l=(t.term[0]||'?').toUpperCase();if(!groups[l])groups[l]=[];groups[l].push(t);});
  const letters=Object.keys(groups).sort();
  const isFirstView=!state.search && state.cat==='all';
  document.getElementById('cbody').innerHTML=`${isFirstView?`<div class="intro"><h2>📚 Local SEO Glossary</h2><p>Searchable reference of ${TERMS.length} local SEO terms — schema properties, GBP attributes, ranking factors, and acronyms. Filter by category in the left panel, search at top, or click letters to jump alphabetically. Each term includes definition, example (when relevant), and a deep link to the relevant tool in this suite.</p></div>`:''}
    ${letters.map(l=>`<div class="section-label" data-letter="${l}">— ${l} —</div>${groups[l].map(t=>renderTerm(t)).join('')}`).join('')}`;
}

function renderTerm(t){
  const cat=CATEGORIES.find(c=>c.id===t.cat);
  return `<div class="term" data-term="${escapeHtml(t.term)}">
    <div class="hdr">
      <div class="name">${escapeHtml(t.term)}</div>
      ${t.alt?`<div class="alt">(${escapeHtml(t.alt)})</div>`:''}
      ${cat?`<div class="cat-pill">${cat.icon} ${escapeHtml(cat.name)}</div>`:''}
    </div>
    <div class="definition">${t.def}</div>
    ${t.example?`<div class="example"><strong>Example:</strong> ${t.example}</div>`:''}
    ${t.tool?`<div class="related"><span class="related-label">Tool</span><a class="tool-link" href="${t.tool}">Open Tool →</a></div>`:''}
  </div>`;
}

renderCats();
renderAlpha();
render();
</script>
<script src="global-nav.js"></script>
</body>
</html>
