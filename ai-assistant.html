<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Local SEO Assistant - Chat With Your Citation, NAP, GBP, & Ranking Data</title>
<meta name="description" content="AI chat assistant that reads data from ALL your Local SEO Tools (Citation Finder, NAP Checker, GBP Audit, Geo-Grid Tracker, Competitor Gap, Schema, Reviews) and gives personalized strategy, fixes, and next-step recommendations. 5-provider AI, streaming, conversation history, quick-prompt library.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#2563eb; --accent-h:#1d4ed8; --accent-soft:rgba(37,99,235,.08);
  --teal:#0d9488;
  --amber:#d97706;
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#3b82f6; --accent-h:#60a5fa; --accent-soft:rgba(59,130,246,.14);
  --teal:#14b8a6;
  --amber:#f59e0b;
  --danger:#ef4444; --success:#22c55e;
  --purple:#a78bfa; --pink:#ec4899; --blue:#3b82f6;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* HEADER */
#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(37,99,235,.3);position:relative}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-icon::after{content:'';position:absolute;width:7px;height:7px;background:var(--success);border-radius:50%;bottom:-1px;right:-1px;border:2px solid var(--bg2)}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--purple);border:1px solid var(--purple);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.ctx strong{color:var(--accent)}
.hdr-stat.msg strong{color:var(--purple)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none;transition:all .15s}
.hdr-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hdr-link svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

#app{flex:1;display:flex;overflow:hidden;height:calc(100vh - 56px - 32px)}

/* LEFT — CONTEXT */
#left{width:280px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:6px}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;flex:1}
.btn-refresh{padding:5px 9px;font-size:10.5px;font-weight:700;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:5px;transition:all .15s}
.btn-refresh:hover{border-color:var(--accent);color:var(--accent)}

#left-body{flex:1;overflow-y:auto;padding:12px}

.ctx-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:6px;display:flex;align-items:flex-start;gap:9px;transition:all .15s;cursor:pointer}
.ctx-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.ctx-card.active{border-color:var(--accent);background:var(--accent-soft)}
.ctx-card .icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:#fff}
.ctx-card.cf .icon{background:var(--blue)}
.ctx-card.nap .icon{background:var(--purple)}
.ctx-card.sch .icon{background:var(--teal)}
.ctx-card.gbp .icon{background:var(--amber)}
.ctx-card.rev .icon{background:var(--pink)}
.ctx-card.gg .icon{background:var(--accent)}
.ctx-card.cg .icon{background:#9333ea}
.ctx-card.sa .icon{background:#0891b2}
.ctx-card .info{flex:1;min-width:0}
.ctx-card .tname{font-size:11.5px;font-weight:700;color:var(--text);line-height:1.3}
.ctx-card .tmeta{font-size:9.5px;color:var(--text3);margin-top:2px;font-family:var(--mono);line-height:1.3}
.ctx-card .tcheck{font-size:13px;color:var(--success);flex-shrink:0}
.ctx-card.empty .tcheck{color:var(--text3);font-weight:400}
.ctx-card.empty{opacity:.6}

.scope-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.scope-section h4{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.scope-toggle{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:11px;color:var(--text);cursor:pointer}
.scope-toggle input{margin:0}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg)}
.btn-conf{width:100%;padding:9px;border-radius:7px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;border:none;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-conf:hover{background:var(--accent-h)}
.btn-conf svg{width:13px;height:13px}

/* CENTER — CHAT */
#center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);overflow:hidden}

#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}

.msg{display:flex;gap:10px;max-width:90%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;font-family:var(--mono)}
.msg.user .avatar{background:linear-gradient(135deg,var(--accent),var(--blue))}
.msg.bot .avatar{background:linear-gradient(135deg,var(--purple),var(--pink))}
.msg .bubble{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.65;color:var(--text);box-shadow:var(--shadow-sm);position:relative}
.msg.user .bubble{background:var(--accent);color:#fff;border-color:var(--accent)}
.msg.user .bubble a{color:#fff;text-decoration:underline}
.msg .bubble h1,.msg .bubble h2,.msg .bubble h3{font-size:14px;font-weight:700;margin:10px 0 6px}
.msg .bubble h1:first-child,.msg .bubble h2:first-child,.msg .bubble h3:first-child{margin-top:0}
.msg .bubble ul,.msg .bubble ol{margin:6px 0;padding-left:22px}
.msg .bubble li{margin-bottom:3px;line-height:1.6}
.msg .bubble p{margin:6px 0}
.msg .bubble p:first-child{margin-top:0}
.msg .bubble p:last-child{margin-bottom:0}
.msg .bubble code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:11.5px}
.msg.user .bubble code{background:rgba(255,255,255,.2)}
.msg .bubble pre{background:var(--bg3);padding:10px;border-radius:6px;overflow-x:auto;margin:6px 0;font-size:11.5px}
.msg.user .bubble pre{background:rgba(255,255,255,.15)}
.msg .bubble pre code{background:transparent;padding:0}
.msg .bubble strong{font-weight:700}
.msg .bubble em{font-style:italic}
.msg .meta{font-size:9.5px;color:var(--text3);font-family:var(--mono);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.msg.user .meta{justify-content:flex-end;color:rgba(255,255,255,.7)}
.msg .actions{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
.msg .actions button{padding:3px 8px;font-size:10px;font-family:var(--mono);background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:4px;font-weight:700}
.msg .actions button:hover{border-color:var(--accent);color:var(--accent)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;color:var(--text3);padding:40px;gap:14px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:540px}
.empty .qp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;width:100%;max-width:720px;margin-top:8px}
.empty .qp{text-align:left;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:all .15s;font-size:12px;color:var(--text);line-height:1.5}
.empty .qp:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.empty .qp .qi{font-size:18px;margin-bottom:4px;display:block}
.empty .qp .qt{font-weight:700;display:block;margin-bottom:2px}
.empty .qp .qd{font-size:11px;color:var(--text2);line-height:1.5}

/* INPUT */
#input-bar{padding:12px 14px;border-top:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;gap:8px}
.qchips{display:flex;flex-wrap:wrap;gap:5px}
.qchip{padding:5px 10px;border-radius:5px;font-size:10.5px;font-family:var(--mono);font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s}
.qchip:hover{border-color:var(--accent);color:var(--accent)}
.input-row{display:flex;gap:8px;align-items:flex-end}
#input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-family:var(--font);font-size:13px;color:var(--text);resize:none;min-height:40px;max-height:180px;line-height:1.5;transition:border-color .15s,box-shadow .15s}
#input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn-send{padding:11px 16px;border-radius:10px;background:var(--accent);color:#fff;border:none;font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px;transition:all .15s;flex-shrink:0}
.btn-send:hover{background:var(--accent-h)}
.btn-send:disabled{opacity:.4;cursor:not-allowed}
.btn-send svg{width:14px;height:14px}
.input-meta{font-size:10px;color:var(--text3);font-family:var(--mono);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.input-meta .tok{margin-left:auto}

.typing{display:flex;gap:3px;padding:8px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:typ 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typ{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;max-width:580px;width:100%;max-height:90vh;overflow:hidden;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.modal-hdr h2{font-size:14px;font-weight:700;flex:1}
.modal-hdr .close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-hdr .close:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:var(--bg3)}
.modal-foot button{padding:8px 14px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.modal-foot button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;font-weight:600}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--text)}
.field .hint{font-size:10.5px;color:var(--text3);font-family:var(--mono);line-height:1.5}
.field .hint a{color:var(--accent)}
.pp-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.pp{padding:5px 9px;border-radius:5px;font-size:10px;font-family:var(--mono);font-weight:700;background:var(--bg);border:1px solid var(--border);color:var(--text2);cursor:pointer}
.pp:hover{border-color:var(--accent);color:var(--accent)}
.pp.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pp .free{font-size:9px;background:rgba(255,255,255,.25);padding:1px 4px;border-radius:3px;margin-left:4px}
.pp:not(.active) .free{background:rgba(22,163,74,.13);color:var(--success)}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-item{display:flex;align-items:center;gap:5px}
.ft-item svg{width:12px;height:12px}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
#toast.info{border-color:var(--accent);color:var(--accent)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:280px}
  #left.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    </div>
    <div><div class="logo-name">SEO<span>AI</span></div></div>
    <span class="logo-tag">ASSISTANT</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat ctx"><strong id="stat-ctx">0</strong> data sources</div>
  <div class="hdr-stat msg"><strong id="stat-msg">0</strong> messages</div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="citation-finder.html" class="hdr-link" title="Citation Finder" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
    Citations
  </a>
  <a href="gbp-audit.html" class="hdr-link" title="GBP Audit" style="border-color:rgba(217,119,6,.4);color:var(--amber)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    GBP
  </a>
  <a href="geo-grid-tracker.html" class="hdr-link" title="Geo Grid" style="border-color:rgba(5,150,105,.4);color:#059669">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Geo Grid
  </a>
  <a href="competitor-gap.html" class="hdr-link" title="Competitor Gap" style="border-color:rgba(124,58,237,.4);color:var(--purple)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="7" r="4"/><path d="M3 19a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2H3z"/></svg>
    Gap
  </a>
  <a href="dashboard.html" class="hdr-link" title="Unified Dashboard & Report" style="border-color:rgba(37,99,235,.4);color:#2563eb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">

  <!-- LEFT: CONTEXT SOURCES -->
  <div id="left">
    <div class="lh-bar">
      <h3>Data Sources</h3>
      <button class="btn-refresh" onclick="reloadContext()">↻</button>
    </div>
    <div id="left-body">
      <div id="ctx-list"></div>

// Generic OpenAI-format SSE reader
async function readSSE(res, onToken){
  const reader = res.body.getReader(); const dec = new TextDecoder();
  let acc='', buffer='';
  while(true){
    const {done,value} = await reader.read(); if(done) break;
    buffer += dec.decode(value, {stream:true});
    const lines = buffer.split('\n'); buffer = lines.pop()||'';
    for(const line of lines){
      if(!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if(!data || data==='[DONE]') continue;
      try { const j = JSON.parse(data); const tok = j.choices?.[0]?.delta?.content||''; if(tok){ acc+=tok; onToken?.(tok, acc); } } catch(e){}
    }
  }
  return acc;
}

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}

/* ---------- MARKDOWN (light) ---------- */
function md(s){
  if(!s) return '';
  let html = escapeHtml(s);
  // code blocks
  html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (m,lang,code)=>`<pre><code>${code.trim()}</code></pre>`);
  // inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // headers
  html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  // bold + italic
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, '<em>$1</em>');
  // links
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // lists — group consecutive lines starting with - or *
  const lines = html.split('\n');
  const out = [];
  let inUl=false, inOl=false;
  lines.forEach(line=>{
    const ulM = line.match(/^[-*]\s+(.+)$/);
    const olM = line.match(/^\d+\.\s+(.+)$/);
    if(ulM){ if(!inUl){ out.push('<ul>'); inUl=true; } if(inOl){ out.push('</ol>'); inOl=false; } out.push(`<li>${ulM[1]}</li>`); }
    else if(olM){ if(!inOl){ out.push('<ol>'); inOl=true; } if(inUl){ out.push('</ul>'); inUl=false; } out.push(`<li>${olM[1]}</li>`); }
    else { if(inUl){ out.push('</ul>'); inUl=false; } if(inOl){ out.push('</ol>'); inOl=false; } out.push(line); }
  });
  if(inUl) out.push('</ul>'); if(inOl) out.push('</ol>');
  html = out.join('\n');
  // paragraphs (double newline)
  html = html.split(/\n\n+/).map(b=>b.trim()).filter(Boolean).map(b=>{
    if(b.startsWith('<h')||b.startsWith('<ul')||b.startsWith('<ol')||b.startsWith('<pre')) return b;
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  }).join('\n');
  return html;
}

/* ---------- BUILD CONTEXT FOR AI ---------- */
function buildContext(){
  const sources = loadSourceData();
  const parts = [];
  sources.forEach(src=>{
    if(state.scopes[src.id]===false) return;
    if(!src.data) return;
    // Build a structured summary, not the raw blob (which would be huge).
    parts.push(summarizeSource(src));
  });
  return parts.join('\n\n---\n\n');
}

function summarizeSource(src){
  const d = src.data;
  let out = `## ${src.label}\n`;
  if(src.id==='cf'){
    out += `Businesses (${d.businesses?.length||0}):\n`;
    (d.businesses||[]).slice(0,3).forEach(b=>{
      const cits = Object.entries(b.citations||{});
      const found = cits.filter(([_,c])=>c.status==='found'||c.status==='partial');
      const miss = cits.filter(([_,c])=>c.status==='miss');
      out += `- ${b.name} (${b.city||''}, ${(b.country||'').toUpperCase()}) — ${b.category}, phone ${b.phone}, web ${b.website||'—'}\n`;
      out += `  Citations: ${found.length} found, ${miss.length} missing, ${cits.length} scanned out of available directories.\n`;
      if(found.length){
        out += `  Found in: ${found.slice(0,8).map(([id])=>id).join(', ')}${found.length>8?` +${found.length-8} more`:''}\n`;
      }
      if(miss.length){
        out += `  Missing from: ${miss.slice(0,8).map(([id])=>id).join(', ')}${miss.length>8?` +${miss.length-8} more`:''}\n`;
      }
    });
  } else if(src.id==='nap'){
    out += `Reference NAP: ${d.ref?.name||'—'}, ${d.ref?.phone||'—'}, ${[d.ref?.addr,d.ref?.city,d.ref?.state,d.ref?.zip].filter(Boolean).join(', ')||'—'}, web ${d.ref?.website||'—'}\n`;
    out += `Citations audited: ${d.citations?.length||0}\n`;
    out += `Tolerance: ${d.tolerance}\n`;
    if(d.citations?.length){
      // sample issues
      const sample = d.citations.slice(0,10).map(c=>`- ${c.source||'?'}: name="${c.name||''}" phone="${c.phone||''}" addr="${c.addr||''}" web="${c.website||''}"`).join('\n');
      out += `Sample citations:\n${sample}\n`;
    }
  } else if(src.id==='sch'){
    out += `Schema for ${d.name||'—'} (type: ${d.type||'LocalBusiness'})\n`;
    out += `Address: ${[d.addr,d.city,d.region,d.postal,d.country].filter(Boolean).join(', ')||'—'}\n`;
    out += `Phone: ${d.phone||'—'} · Email: ${d.email||'—'} · Website: ${d.url||'—'}\n`;
    out += `Hours configured: ${(d.hours||[]).filter(h=>!h.closed && h.opens).length}/7 days\n`;
    out += `Services: ${d.services?.length||0} · Same As: ${d.sameAs?.length||0}\n`;
    if(d.rating && d.reviews) out += `Rating: ${d.rating}★ (${d.reviews} reviews)\n`;
  } else if(src.id==='gbp'){
    const ans = d.answers||{};
    const pass = Object.values(ans).filter(v=>v==='pass').length;
    const fail = Object.values(ans).filter(v=>v==='fail').length;
    const skip = Object.values(ans).filter(v=>v==='skip').length;
    out += `Business: ${d.biz?.name||'—'} · ${d.biz?.city||''} ${d.biz?.country||''} · ${d.biz?.cat||''} · ${d.biz?.type||''}\n`;
    out += `Answered: ${pass} passed, ${fail} failed, ${skip} N/A out of total checks.\n`;
    // Failed checks (the most important)
    const failedIds = Object.entries(ans).filter(([_,v])=>v==='fail').map(([id])=>id);
    if(failedIds.length){ out += `Failed check IDs: ${failedIds.join(', ')}\n`; }
    // AI fixes already generated
    if(d.aiFixes && Object.keys(d.aiFixes).length){ out += `AI fix suggestions already generated for: ${Object.keys(d.aiFixes).join(', ')}\n`; }
  } else if(src.id==='rev'){
    out += `Brand: ${d.brand?.name||'—'} · Industry: ${d.brand?.industry||'—'} · Tone: ${d.brand?.tone||'—'}\n`;
    out += `Reviews tracked: ${d.reviews?.length||0}\n`;
    if(d.reviews?.length){
      const byStar = [0,0,0,0,0,0];
      d.reviews.forEach(r=>byStar[r.stars]++);
      out += `Distribution: 5★ ${byStar[5]} | 4★ ${byStar[4]} | 3★ ${byStar[3]} | 2★ ${byStar[2]} | 1★ ${byStar[1]}\n`;
      out += `Recent: ${d.reviews.slice(0,3).map(r=>`(${r.stars}★ from ${r.author}) ${r.text.slice(0,80)}...`).join(' | ')}\n`;
    }
  } else if(src.id==='gg'){
    out += `Center: ${d.biz?.name||'—'} (${d.biz?.lat||'?'}, ${d.biz?.lng||'?'}) · Country: ${d.cfg?.gl}\n`;
    out += `Grid: ${d.cfg?.gridSize}×${d.cfg?.gridSize} · ${d.cfg?.gridDist}mi spacing · Mode: ${d.cfg?.mode}\n`;
    const kws = Object.keys(d.results||{});
    out += `Keywords scanned (${kws.length}):\n`;
    kws.forEach(kw=>{
      const r = d.results[kw];
      const done = r.points?.filter(p=>p.status==='done')||[];
      const found = done.filter(p=>p.rank);
      const avg = found.length ? Math.round(found.reduce((s,p)=>s+p.rank,0)/found.length*10)/10 : null;
      const top3 = done.filter(p=>p.rank&&p.rank<=3).length;
      out += `- "${kw}": ${found.length}/${done.length} ranked, avg pos ${avg!==null?'#'+avg:'—'}, ${top3} in top 3\n`;
    });
  } else if(src.id==='cg'){
    out += `You: ${d.you?.name||'—'} (${d.you?.website||'—'}, ${d.you?.country||''})\n`;
    out += `Competitors (${d.competitors?.length||0}): ${(d.competitors||[]).map(c=>c.name).join(', ')}\n`;
    // top gaps
    if(d.you){
      const yourCits = d.you.citations||{};
      const compCits = (d.competitors||[]).map(c=>c.citations||{});
      // For each known directory id in any comp, count how many comps have it
      const dirIds = new Set();
      compCits.forEach(c=>Object.keys(c).forEach(id=>{if(c[id].status==='found'||c[id].status==='partial')dirIds.add(id);}));
      const gaps = Array.from(dirIds).filter(id=>!(yourCits[id]?.status==='found'||yourCits[id]?.status==='partial'));
      out += `You're missing ${gaps.length} citations that competitors have.\n`;
      out += `Top gap directories: ${gaps.slice(0,15).join(', ')}\n`;
    }
  } else if(src.id==='sa'){
    out += `Audited URL: ${d.url||'—'}\n`;
    if(d.schemas) out += `Schemas detected: ${d.schemas.length} · Types: ${(d.schemas||[]).map(s=>s.type).join(', ')}\n`;
    if(d.issues) out += `Issues: ${d.issues.length}\n`;
  } else if(src.id==='kw'){
    out += `Keywords discovered: ${d.keywords?.length||0} (${d.clusters?.length||0} clusters)\n`;
    out += `City: ${d.seeds?.city||'—'} · Country: ${d.seeds?.country||'—'} · Industry: ${d.seeds?.industry||'—'}\n`;
    if(d.keywords?.length){
      const byIntent = {};
      d.keywords.forEach(k=>{byIntent[k.intent]=(byIntent[k.intent]||0)+1;});
      out += `By intent: ${Object.entries(byIntent).map(([i,n])=>i+':'+n).join(', ')}\n`;
      const easyOnes = d.keywords.filter(k=>k.difficulty!==null&&k.difficulty<30).slice(0,8);
      if(easyOnes.length) out += `Low-difficulty wins: ${easyOnes.map(k=>`"${k.kw}" (diff ${k.difficulty})`).join(', ')}\n`;
      const selected = d.keywords.filter(k=>k.selected);
      if(selected.length) out += `User has selected ${selected.length} keywords: ${selected.slice(0,5).map(k=>k.kw).join(', ')}\n`;
    }
  } else if(src.id==='ps'){
    out += `GBP posts queued: ${d.posts?.length||0}\n`;
    out += `Brand: ${d.brand?.name||'—'} · Tone: ${d.brand?.tone||'—'} · Industry: ${d.brand?.industry||'—'}\n`;
    if(d.posts?.length){
      const byStatus = {};
      d.posts.forEach(p=>{byStatus[p.status]=(byStatus[p.status]||0)+1;});
      out += `Status mix: ${Object.entries(byStatus).map(([s,n])=>s+':'+n).join(', ')}\n`;
      const byType = {};

    if(d.biz?.name) out += `Business: ${d.biz.name} (${d.biz.type})\n`;
    out += `Total photos: ${d.photos?.length||0}\n`;
    if(d.photos?.length){
      const byCat={};
      d.photos.forEach(p=>{byCat[p.category]=(byCat[p.category]||0)+1;});
      out += `By category: ${Object.entries(byCat).map(([c,n])=>c+':'+n).join(', ')}\n`;
      const graded=d.photos.filter(p=>p.score);
      if(graded.length){const avg=Math.round(graded.reduce((s,p)=>s+p.score,0)/graded.length);out += `AI-graded: ${graded.length} photos · avg ${avg}/100\n`;}
    }
  } else if(src.id==='ha'){
    if(d.url) out += `Audited URL: ${d.url}\n`;
    if(d.kw) out += `Target keyword: ${d.kw}\n`;
    if(d.results){
      out += `Heading Score: ${d.results.score}/100\n`;
      out += `Headings found: H1:${d.results.counts.h1} H2:${d.results.counts.h2} H3:${d.results.counts.h3} H4:${d.results.counts.h4} H5:${d.results.counts.h5} H6:${d.results.counts.h6}\n`;
      out += `Total issues: ${d.results.issues.length}\n`;
      const fails=d.results.issues.filter(i=>i.sev==='fail');
      if(fails.length) out += `Critical issues: ${fails.slice(0,5).map(i=>i.title).join('; ')}\n`;
    }
  } else if(src.id==='dis'){
    if(d.domain) out += `Target domain: ${d.domain}\n`;
    out += `Backlinks: ${d.links?.length||0}\n`;
    if(d.links?.length){
      out += `Toxicity threshold: ${d.threshold}/100\n`;
      const manual=Object.keys(d.manualDisavow||{}).length;
      if(manual) out += `Manual disavow marks: ${manual}\n`;
    }
  } else if(src.id==='nc'){
    if(d.biz?.name) out += `Business: ${d.biz.name}${d.biz.city?', '+d.biz.city:''}\n`;
    if(d.niche) out += `Industry niche: ${d.niche}\n`;
    const subs=Object.entries(d.submissions||{});
    if(subs.length){
      const live=subs.filter(([,s])=>s.status==='live').length;
      const submitted=subs.filter(([,s])=>s.status==='submitted').length;
      out += `Niche directories tracked: ${subs.length} (${live} live, ${submitted} submitted)\n`;
    }
  } else if(src.id==='bm'){
    if(d.brand) out += `Brand: ${d.brand}${d.domain?' ('+d.domain+')':''}\n`;
    out += `Mentions found: ${d.mentions?.length||0}\n`;
    if(d.mentions?.length){
      const unlinked=d.mentions.filter(m=>!m.hasLink).length;
      const linked=d.mentions.filter(m=>m.hasLink).length;
      out += `Unlinked: ${unlinked} (outreach opportunities) · Linked: ${linked}\n`;
      const govEdu=d.mentions.filter(m=>{try{const h=new URL(m.url).hostname;return /\.(gov|edu)$/.test(h);}catch(e){return false;}}).length;
      if(govEdu) out += `.gov/.edu mentions: ${govEdu}\n`;
      const top=d.mentions.filter(m=>!m.hasLink).sort((a,b)=>b.score-a.score).slice(0,5);
      if(top.length) out += `Top outreach targets: ${top.map(m=>{try{return new URL(m.url).hostname;}catch(e){return m.url;}}).join(', ')}\n`;
    }
  } else if(src.id==='lcl'){
    if(d.status){
      const done=Object.values(d.status).filter(v=>v==='done').length;
      out += `Checklist completion: ${done}/100 items\n`;
      out += `Last reset: ${d.lastReset||'never'}\n`;
    }
  } else if(src.id==='cp'){
    if(d.gbpClicks){
      out += `Channel traffic: ${d.gbpClicks} GBP clicks, ${d.organic} organic, ${d.direct} direct, ${d.referral} referral\n`;
      out += `Conversion path: ${d.gbpCR}% GBP→site, ${d.leadCR}% visit→lead, ${d.custCR}% lead→customer\n`;
      out += `AOV: $${d.aov} · Margin: ${d.margin}% · Spend: $${d.spend}/mo\n`;
    }
  } else if(src.id==='bsch'){
    if(d.type) out += `Schema type: ${d.type}\n`;
    if(d.results?.length){
      const ok=d.results.filter(r=>r.ok).length;
      out += `Generated: ${ok}/${d.results.length} valid JSON-LD schemas\n`;
      const errs=d.results.filter(r=>!r.ok).length;
      if(errs) out += `Errors: ${errs}\n`;
    }
  } else if(src.id==='km'){
    const kws=(d.keywords||'').split('\n').filter(k=>k.trim()).length;
    out += `Keywords in scope: ${kws}\n`;
    if(d.map){
      const entries=Object.entries(d.map);
      const mapped=entries.filter(([_,m])=>m.primary).length;
      const cann=entries.filter(([_,m])=>m.primary&&m.secondary?.length).length;
      const orphans=kws-mapped;
      out += `Mapped: ${mapped} · Orphans: ${orphans} · Cannibalizing: ${cann}\n`;
      const byIntent={};
      entries.forEach(([_,m])=>{if(m.intent)byIntent[m.intent]=(byIntent[m.intent]||0)+1;});
      if(Object.keys(byIntent).length) out += `By intent: ${Object.entries(byIntent).map(([k,n])=>k+':'+n).join(', ')}\n`;
    }
    if(d.city) out += `Local city: ${d.city}\n`;
  } else if(src.id==='hm'){
    if(d.snapshots?.length){
      out += `Total snapshots: ${d.snapshots.length}\n`;
      const latest=d.snapshots[d.snapshots.length-1];
      out += `Latest: ${latest.overall}/100 (${latest.date})\n`;
      if(d.snapshots.length>=2){
        const prev=d.snapshots[d.snapshots.length-2];
        out += `Trend: ${latest.overall-prev.overall>0?'+':''}${latest.overall-prev.overall} vs previous\n`;
      }
      const first=d.snapshots[0];
      out += `Lifetime change: ${latest.overall-first.overall>0?'+':''}${latest.overall-first.overall} (from ${first.date})\n`;
    }
  } else if(src.id==='gpi'){
    out += `Date range filter: ${d.range||30} days\n`;
    out += `Active view: ${d.view||'overview'}\n`;
  } else if(src.id==='ob'){
    if(d.done){
      const done=Object.values(d.done).filter(Boolean).length;
      out += `Onboarding tasks complete: ${done}\n`;
      out += `Current step: ${d.step||1}/12\n`;
    }
  } else if(src.id==='ba'){
    if(d.results?.length){
      const valid=d.results.filter(r=>!r.error);
      out += `Pages audited: ${d.results.length} (${valid.length} successful)\n`;
      if(valid.length){
        const avg=Math.round(valid.reduce((s,r)=>s+r.score,0)/valid.length);
        out += `Avg score: ${avg}/100\n`;
        out += `Passing (≥80): ${valid.filter(r=>r.score>=80).length}\n`;
        out += `Failing (<60): ${valid.filter(r=>r.score<60).length}\n`;
        const worst=valid.slice().sort((a,b)=>a.score-b.score).slice(0,3);
        if(worst.length)out += `Lowest scores: ${worst.map(r=>r.score+' ('+(r.title||r.url).substring(0,30)+')').join('; ')}\n`;
      }
    }
    if(d.kw) out += `Audit keyword context: ${d.kw}\n`;
  } else if(src.id==='at'){
    if(d.brand) out += `Brand: ${d.brand}${d.domain?' ('+d.domain+')':''}\n`;
    if(d.results){
      const r=d.results;
      out += `Anchor health score: ${r.score}/100\n`;
      out += `Total anchors analyzed: ${r.total}\n`;
      if(r.distribution){
        out += `Distribution: branded ${r.distribution.brand.pct.toFixed(1)}%, exact-match ${r.distribution.exact.pct.toFixed(1)}%, partial ${r.distribution.partial.pct.toFixed(1)}%, generic ${r.distribution.generic.pct.toFixed(1)}%, naked URL ${r.distribution.naked.pct.toFixed(1)}%\n`;
      }
      const fails=r.checks.filter(c=>c.status==='fail');
      if(fails.length) out += `Risk flags: ${fails.map(c=>c.title).join('; ')}\n`;
    }
  } else if(src.id==='hl'){
    if(d.map?.length){
      out += `Locale mappings: ${d.map.length}\n`;
      const hasXDefault=d.map.some(m=>m.locale==='x-default');
      out += `x-default: ${hasXDefault?'set':'missing'}\n`;
      out += `Locales: ${d.map.slice(0,8).map(m=>m.locale).join(', ')}${d.map.length>8?'…':''}\n`;
    }
  } else if(src.id==='bv'){
    if(d.snapshots?.length){
      out += `Backlink snapshots captured: ${d.snapshots.length}\n`;
      const latest=d.snapshots[d.snapshots.length-1];
      out += `Latest snapshot: ${latest.total} links (${latest.uniqueDomains} unique domains, ${latest.date})\n`;
      if(d.snapshots.length>=2){
        const first=d.snapshots[0];
        out += `Lifetime change: ${latest.total-first.total>=0?'+':''}${latest.total-first.total} links since ${first.date}\n`;
      }
    }
  } else if(src.id==='kp'){
    if(d.name) out += `Entity name: ${d.name}\n`;
    if(d.type) out += `Type/category: ${d.type}\n`;
    if(d.city) out += `City: ${d.city}\n`;
    out += `Wikipedia: ${d.wikipedia?'set':'missing'}\n`;
    out += `Wikidata: ${d.wikidata?d.wikidata:'missing'}\n`;
    const social=[d.fb&&'Facebook',d.twitter&&'X',d.linkedin&&'LinkedIn',d.instagram&&'Instagram',d.youtube&&'YouTube'].filter(Boolean);
    out += `Social profiles: ${social.length?social.join(', '):'none'}\n`;
    if(d.founded) out += `Founded: ${d.founded}\n`;
    if(d.founder) out += `Founder: ${d.founder}\n`;
  } else if(src.id==='press'){
    if(d.biz?.name) out += `Business: ${d.biz.name}${d.biz.city?' in '+d.biz.city:''}\n`;
    out += `Total pitches drafted: ${d.drafts?.length||0}\n`;
    if(d.drafts?.length){
      const angles={};d.drafts.forEach(p=>{angles[p.angle]=(angles[p.angle]||0)+1;});
      out += `By angle: ${Object.entries(angles).map(([a,n])=>a+':'+n).join(', ')}\n`;
      const sent=Object.keys(d.sent||{}).length;
      out += `Sent: ${sent}\n`;
    }
  } else if(src.id==='hol'){
    out += `Year: ${d.year||'2026'} · Region: ${d.region||'us'}\n`;
    if(d.hours){
      const dates=Object.entries(d.hours);
      out += `Dates with hours set: ${dates.length}\n`;
      const closed=dates.filter(([_,h])=>h.status==='closed').length;
      const special=dates.filter(([_,h])=>h.status==='special').length;
      const open=dates.filter(([_,h])=>h.status==='open').length;
      out += `Status: ${closed} closed, ${special} special hours, ${open} open regular\n`;
    }
    if(d.custom?.length) out += `Custom dates: ${d.custom.length}\n`;
  } else if(src.id==='gbpcat'){
    if(d.primary) out += `Primary GBP category: ${d.primary}\n`;
    if(d.secondary?.length) out += `Secondary categories (${d.secondary.length}): ${d.secondary.join(', ')}\n`;
    if(d.comps) out += `Competitor categories noted: ${d.comps.split('\n').filter(Boolean).length} entries\n`;
  } else if(src.id==='gbpsv'){
    if(d.biz?.name) out += `Business: ${d.biz.name}${d.biz.city?' in '+d.biz.city:''}\n`;
    if(d.services?.length){
      const cats=new Set(d.services.map(s=>s.category).filter(Boolean));
      out += `Total services: ${d.services.length} across ${cats.size} categories\n`;
      const priced=d.services.filter(s=>s.price).length;
      const desc=d.services.filter(s=>s.description).length;
      out += `Priced: ${priced} · With descriptions: ${desc}\n`;
      if(cats.size) out += `Categories: ${Array.from(cats).join(', ')}\n`;
    }
  } else if(src.id==='rd'){
    if(d.project?.name) out += `Migration project: ${d.project.name} (${d.project.type||'redesign'})\n`;
    if(d.project?.oldDomain || d.project?.newDomain) out += `From ${d.project.oldDomain||'?'} → ${d.project.newDomain||'?'}\n`;
    if(d.redirects?.length){
      out += `Total redirects: ${d.redirects.length}\n`;
      const valid=d.redirects.filter(r=>r.status==='ok').length;
      const issues=d.redirects.filter(r=>r.status==='err').length;
      out += `Validated: ${valid} OK · ${issues} issues\n`;
    }
  } else if(src.id==='gsc'){
    if(d.queries?.length){
      const totalClicks=d.queries.reduce((a,q)=>a+(q.clicks||0),0);
      const totalImp=d.queries.reduce((a,q)=>a+(q.impressions||0),0);
      out += `GSC queries loaded: ${d.queries.length}\n`;
      out += `Total clicks: ${totalClicks} · impressions: ${totalImp}\n`;
      const strikePos=d.proj?.strikePos||20;
      const strikeImp=d.proj?.strikeImp||50;
      const strike=d.queries.filter(q=>q.position>=4 && q.position<=strikePos && q.impressions>=strikeImp).length;
      out += `Striking-distance queries (pos 4-${strikePos}): ${strike}\n`;
    }
    if(d.pages?.length) out += `GSC pages loaded: ${d.pages.length}\n`;
  }
  return out;
}

/* ---------- RENDER MESSAGES ---------- */
function renderMsgs(){
  const wrap = document.getElementById('msgs');
  document.getElementById('stat-msg').textContent = state.msgs.length;
  if(!state.msgs.length){
    wrap.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <div class="et">AI Local SEO Assistant</div>
      <div class="ed">I read data from every tool in your toolkit (Citation Finder, NAP, GBP Audit, Geo-Grid, Competitor Gap, etc.) and give you specific advice grounded in your actual numbers.</div>
      <div class="qp-grid">
        ${QUICK_PROMPTS.map(q=>`<button class="qp" onclick="quickPrompt(${JSON.stringify(q.text).replace(/"/g,'&quot;')})"><span class="qi">${q.icon}</span><span class="qt">${escapeHtml(q.title)}</span><span class="qd">${escapeHtml(q.text.slice(0,90))}…</span></button>`).join('')}
      </div>
    </div>`;
    return;
  }
  wrap.innerHTML = state.msgs.map((m,i)=>`
    <div class="msg ${m.role==='user'?'user':'bot'}">
      <div class="avatar">${m.role==='user'?'U':'AI'}</div>
      <div>
        <div class="bubble">${md(m.content)}</div>
        <div class="meta"><span>${new Date(m.ts).toLocaleTimeString()}</span>${m.role==='assistant'?'<span>'+(PROVIDERS[m.provider||state.ai.provider]?.label||'AI')+'</span>':''}</div>
        ${m.role==='assistant'?`<div class="actions"><button onclick="copyMsg(${i})">Copy</button><button onclick="delMsg(${i})">Delete</button></div>`:''}
      </div>
    </div>`).join('');
  wrap.scrollTop = wrap.scrollHeight;
}

function copyMsg(i){ navigator.clipboard.writeText(state.msgs[i].content); toast('Copied','success'); }
function delMsg(i){ state.msgs.splice(i,1); saveState(); renderMsgs(); }
function clearChat(){ if(!state.msgs.length||!confirm('Clear chat history?')) return; state.msgs = []; saveState(); renderMsgs(); }

function quickPrompt(text){ document.getElementById('input').value = text; autoResize(document.getElementById('input')); sendMsg(); }

function renderQuickChips(){
  document.getElementById('quick-chips').innerHTML = QUICK_CHIPS.map(q=>`<button class="qchip" onclick="quickChip(${JSON.stringify(q).replace(/"/g,'&quot;')})">${escapeHtml(q)}</button>`).join('');
}
function quickChip(label){ document.getElementById('input').value = label.replace(/^[^\s]+\s/,''); autoResize(document.getElementById('input')); document.getElementById('input').focus(); }

/* ---------- INPUT ---------- */
function autoResize(el){ el.style.height='auto'; el.style.height = Math.min(180, el.scrollHeight)+'px'; }
function onInputKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
}

async function sendMsg(){
  const input = document.getElementById('input');
  const text = input.value.trim();
  if(!text) return;
  const p = PROVIDERS[state.ai.provider]; const keys = state.ai.keys[state.ai.provider]||{};
  if(!p.fields.every(f=>!f.required || keys[f.key]) || !keys.key){ toast('Configure AI provider first','err'); openSettings(); return; }

  // Push user msg
  state.msgs.push({role:'user', content:text, ts:Date.now()});
  saveState();
  input.value=''; autoResize(input);

  // Build context
  const context = buildContext();
  const system = state.ai.system + (context ? `\n\n=== CURRENT USER DATA (READ ONLY — for grounding your advice) ===\n\n${context}\n\n=== END USER DATA ===` : '\n\n(User has not yet collected data in their tools.)');

  // Insert placeholder for streaming
  const assistantIdx = state.msgs.push({role:'assistant', content:'', ts:Date.now(), provider:state.ai.provider, streaming:true}) - 1;
  renderMsgs();

  document.getElementById('btn-send').disabled = true;
  document.getElementById('ft-status').textContent = `${p.label} thinking…`;

  // Show typing indicator inside the bubble
  const msgsWrap = document.getElementById('msgs');
  const lastBubble = msgsWrap.querySelectorAll('.msg.bot .bubble');
  const targetBubble = lastBubble[lastBubble.length-1];
  if(targetBubble) targetBubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;

  try {
    const msgs = state.msgs.filter(m=>!m.streaming && (m.role==='user'||m.role==='assistant')).map(m=>({role:m.role, content:m.content}));
    const onToken = (tok, acc)=>{
      state.msgs[assistantIdx].content = acc;
      if(targetBubble) targetBubble.innerHTML = md(acc);
      msgsWrap.scrollTop = msgsWrap.scrollHeight;
    };
    const final = await p.chat({messages: msgs, system, stream: state.ai.stream, onToken, keys});
    if(!state.ai.stream){ state.msgs[assistantIdx].content = final; }
    delete state.msgs[assistantIdx].streaming;
    saveState(); renderMsgs();
    document.getElementById('ft-status').textContent = 'Ready';
  } catch(e){
    state.msgs[assistantIdx].content = `**Error:** ${e.message}\n\nCheck your API key in Settings. Some providers require CORS-friendly setup; if your key works in other tools, try a different provider.`;
    delete state.msgs[assistantIdx].streaming;
    saveState(); renderMsgs();
    document.getElementById('ft-status').textContent = 'Error';
    toast('AI failed: '+e.message,'err');
  } finally {
    document.getElementById('btn-send').disabled = false;
  }
}

/* ---------- SETTINGS ---------- */
function openSettings(){
  document.getElementById('prov-pills').innerHTML = Object.entries(PROVIDERS).map(([id,p])=>`<button class="pp ${state.ai.provider===id?'active':''}" onclick="selProv('${id}')">${escapeHtml(p.label)}<span class="free">${escapeHtml(p.free)}</span></button>`).join('');
  renderProvCfg();
  document.getElementById('set-system').value = state.ai.system||'';
  document.getElementById('set-stream').value = String(state.ai.stream);
  document.getElementById('set-modal').classList.add('show');
}
function closeSettings(){document.getElementById('set-modal').classList.remove('show');}
function selProv(id){
  state.ai.provider = id;
  document.querySelectorAll('#prov-pills .pp').forEach(b=>b.classList.toggle('active', b.textContent.includes(PROVIDERS[id].label)));
  renderProvCfg();
}
function renderProvCfg(){
  const p = PROVIDERS[state.ai.provider]; const k = state.ai.keys[state.ai.provider]||{};
  document.getElementById('prov-cfg').innerHTML = p.fields.map(f=>`<div class="field"><label>${escapeHtml(f.label)}</label><input type="${f.type}" id="prov-${f.key}" value="${escapeAttr(k[f.key]||'')}" placeholder="${escapeAttr(f.placeholder||'')}"></div>`).join('') + `<div class="field"><div class="hint">${p.note}</div></div>`;
}
function saveSettings(){
  const p = PROVIDERS[state.ai.provider];
  const keys = {}; p.fields.forEach(f=>{keys[f.key]=document.getElementById('prov-'+f.key).value.trim();});
  state.ai.keys[state.ai.provider] = keys;
  state.ai.system = document.getElementById('set-system').value;
  state.ai.stream = document.getElementById('set-stream').value === 'true';
  saveState(); closeSettings();
  document.getElementById('im-provider').textContent = `Provider: ${PROVIDERS[state.ai.provider].label}`;
  toast('Saved','success');
}

/* ---------- BOOT ---------- */
renderLeft();
renderMsgs();
renderQuickChips();
document.getElementById('im-provider').textContent = state.ai.keys[state.ai.provider]?.key ? `Provider: ${PROVIDERS[state.ai.provider].label}` : 'Provider: not configured';
window.addEventListener('storage', renderLeft); // refresh context if other tabs change data
window.addEventListener('beforeunload', saveState);
</script>
<script src="global-nav.js"></script>
</body>
