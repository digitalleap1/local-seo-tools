  --teal:#0d9488;
  --amber:#d97706;
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);

  --font:'Inter',system-ui,-apple-system,sans-serif;

[data-theme="dark"]{

  --border:#1e2d44; --border2:#2a3b56;

  --amber:#f59e0b;
  --danger:#ef4444; --success:#22c55e;

<script>
/* ==========================================================================
 * ROBOTS.TXT + SITEMAP BUILDER/VALIDATOR
 * ========================================================================== */

const STORE_KEY = 'rs_state_v1';
const defaultState = {
  robots: {
    rules: [
      {agent:'*', dir:'allow', path:'/'},
      {agent:'*', dir:'disallow', path:'/admin/'},
      {agent:'*', dir:'disallow', path:'/wp-admin/'},
      {agent:'*', dir:'disallow', path:'/cart/'},
      {agent:'*', dir:'disallow', path:'/checkout/'},
      {agent:'*', dir:'disallow', path:'/*?*'},
    ],
    sitemap: 'https://example.com/sitemap.xml',
  },
  robotsText: '',
  sitemap: {
    baseUrl: 'https://example.com',
    urls: '',
    changefreq: 'monthly',
    priority: '0.8',
  },
  sitemapText: '',
  view: 'robots-build',
};
let state = loadState();
function loadState(){ try { return Object.assign(clone(defaultState), JSON.parse(localStorage.getItem(STORE_KEY))||{}); } catch(e){ return clone(defaultState); } }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- THEME ---------- */
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('seohub_theme_v1', next);
  document.getElementById('theme-label').textContent = next==='dark'?'Dark':'Light';
}
document.getElementById('theme-label').textContent = (document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

/* ---------- UTILS ---------- */
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(msg,type){const t=document.getElementById('toast');t.className='';t.classList.add('show');if(type)t.classList.add(type);t.innerHTML='<span>'+escapeHtml(msg)+'</span>';setTimeout(()=>t.classList.remove('show'),2500);}
function download(text, name, mime){
  const blob = new Blob([text], {type:mime||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
}

/* ---------- VIEW ---------- */
function setView(v){
  state.view=v; saveState();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===v));
  const titles = {'robots-build':'Build robots.txt','robots-validate':'Validate / Audit robots.txt','sitemap-build':'Build XML Sitemap','sitemap-validate':'Validate Sitemap','sitemap-index':'Build Sitemap Index','guide':'Common Mistakes'};
  document.getElementById('view-title').textContent = titles[v];
  render();
}

/* ---------- ROBOTS BUILDER ---------- */
function buildRobots(){
  const lines = [];
  let lastAgent = '';
  // Group by agent
  const byAgent = {};
  state.robots.rules.forEach(r=>{ byAgent[r.agent]=byAgent[r.agent]||[]; byAgent[r.agent].push(r); });
  for(const [agent, rules] of Object.entries(byAgent)){
    if(lines.length) lines.push('');
    lines.push(`User-agent: ${agent}`);
    rules.forEach(r=>{
      if(r.dir==='allow') lines.push(`Allow: ${r.path}`);
      else if(r.dir==='disallow') lines.push(`Disallow: ${r.path}`);
      else if(r.dir==='crawl-delay') lines.push(`Crawl-delay: ${r.path}`);
    });
  }
  if(state.robots.sitemap){
    lines.push('');
    lines.push(`Sitemap: ${state.robots.sitemap}`);
  }
  state.robotsText = lines.join('\n');
  return state.robotsText;
}

function addRule(){state.robots.rules.push({agent:'*', dir:'disallow', path:'/'}); saveState(); render();}
function delRule(i){state.robots.rules.splice(i,1); saveState(); render();}

/* ---------- ROBOTS VALIDATOR ---------- */
function validateRobots(text){
  const checks = [];
  const lines = text.split('\n').map(l=>l.trim());
  let userAgent = null, hasUserAgent = false;
  const directives = [];
  const sitemaps = [];

  lines.forEach((line, i)=>{
    if(!line || line.startsWith('#')) return;
    const m = line.match(/^([\w-]+):\s*(.*)$/i);
    if(!m){ checks.push({sev:'fail', title:`Invalid line ${i+1}: <code>${escapeHtml(line)}</code>`, desc:'Not a valid directive. Format: <code>Directive: value</code>', fix:'Remove or fix this line.'}); return; }
    const directive = m[1].toLowerCase(); const value = m[2];
    if(directive === 'user-agent'){ userAgent = value; hasUserAgent = true; }
    else if(directive === 'disallow' || directive === 'allow'){
      if(!hasUserAgent){ checks.push({sev:'fail', title:`${directive} before User-agent`, desc:'A User-agent must come before any Allow/Disallow.', fix:'Add a <code>User-agent: *</code> before this line.'}); }
      directives.push({type:directive, path:value, agent:userAgent});
      // Check path validity
      if(value && !value.startsWith('/') && value !== ''){
        checks.push({sev:'warn', title:`Path doesn't start with /: <code>${escapeHtml(value)}</code>`, desc:'Robots.txt paths should start with /.', fix:'Add leading slash.'});
      }
    }
    else if(directive === 'sitemap'){ sitemaps.push(value); }
    else if(directive === 'crawl-delay'){ /* OK but bots ignore */ }
    else if(directive === 'host'){ /* legacy */ }
    else { checks.push({sev:'warn', title:`Unknown directive: <code>${escapeHtml(directive)}</code>`, desc:'Not a standard directive.', fix:''}); }
  });

  // Common-mistake checks
  if(!hasUserAgent && text.trim()){ checks.push({sev:'fail', title:'No User-agent directive', desc:'Every robots.txt needs at least one User-agent.', fix:'Add <code>User-agent: *</code> at the top.'}); }
  if(!sitemaps.length){ checks.push({sev:'warn', title:'No Sitemap reference', desc:'Robots.txt should reference your XML sitemap location.', fix:'Add <code>Sitemap: https://yoursite.com/sitemap.xml</code>'}); }
  // Disallow: /
  const disallowAll = directives.find(d=>d.type==='disallow' && (d.path==='/' || d.path===''));
  if(disallowAll){
    if(disallowAll.path==='/' && disallowAll.agent==='*'){ checks.push({sev:'fail', title:'🛑 Disallow: / for User-agent: *', desc:'This blocks ALL crawlers from your entire site. Are you sure?', fix:'If your site is live, change to allow specific paths or remove the disallow.'}); }
    else if(disallowAll.path===''){ checks.push({sev:'warn', title:'Empty Disallow path', desc:'<code>Disallow:</code> with no path is equivalent to "allow everything" — confusing.', fix:'Either set a path or remove the line.'}); }
  }
  // Multiple sitemaps not always wrong but worth flagging
  if(sitemaps.length>5){ checks.push({sev:'warn', title:`${sitemaps.length} sitemap references`, desc:'Many separate sitemap URLs — consider a sitemap index instead.', fix:'Use one sitemap-index.xml that lists all your sitemaps.'}); }
  // Conflicting Allow + Disallow with no specificity
  const wildPaths = directives.filter(d=>d.path.includes('*'));
  if(wildPaths.length>10){ checks.push({sev:'warn', title:'Heavy use of wildcards', desc:'Wildcards are supported by Google but not all crawlers. Be precise where possible.', fix:''}); }
  // File size
  if(text.length > 500000){ checks.push({sev:'fail', title:'File >500KB', desc:'Google ignores robots.txt files over 500KB. Yours may be truncated.', fix:'Trim unused rules.'}); }
  if(!checks.length || !checks.some(c=>c.sev==='fail')){ checks.unshift({sev:'ok', title:'No critical issues found', desc:'Your robots.txt looks valid.'}); }
  return {checks, stats: {lines:lines.filter(l=>l && !l.startsWith('#')).length, directives:directives.length, sitemaps:sitemaps.length}};
}

/* ---------- SITEMAP BUILDER ---------- */
function buildSitemap(){
  const urls = (state.sitemap.urls||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const base = (state.sitemap.baseUrl||'').replace(/\/$/,'');
  const today = new Date().toISOString().slice(0,10);
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls.map(u=>{
    const url = /^https?:\/\//.test(u) ? u : base + (u.startsWith('/')?u:'/'+u);
    return `  <url>\n    <loc>${escapeXml(url)}</loc>\n    <lastmod>${today}</lastmod>\n    <changefreq>${state.sitemap.changefreq||'monthly'}</changefreq>\n    <priority>${state.sitemap.priority||'0.8'}</priority>\n  </url>`;
  }).join('\n')}\n</urlset>`;
  state.sitemapText = xml;
  return xml;
}

function escapeXml(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));}

/* ---------- SITEMAP VALIDATOR ---------- */
function validateSitemap(text){
  const checks = [];
  let doc;
  try { doc = new DOMParser().parseFromString(text, 'text/xml'); } catch(e){ checks.push({sev:'fail', title:'XML parse error', desc:e.message, fix:'Check for unbalanced tags or invalid characters.'}); return {checks, stats:{}}; }
  // Check for parse error
  const perr = doc.querySelector('parsererror');
  if(perr){ checks.push({sev:'fail', title:'XML parse error', desc:escapeHtml(perr.textContent.slice(0,200)), fix:'Fix the XML syntax errors.'}); return {checks, stats:{}}; }
  // Identify type
  const isIndex = doc.querySelector('sitemapindex');
  const isUrlset = doc.querySelector('urlset');
  if(!isIndex && !isUrlset){ checks.push({sev:'fail', title:'Not a recognized sitemap', desc:'Root element should be <code>urlset</code> or <code>sitemapindex</code>.', fix:'Wrap URLs in <code>&lt;urlset&gt;</code>.'}); return {checks, stats:{}}; }
  const type = isIndex ? 'index' : 'urlset';
  const items = Array.from(doc.querySelectorAll(isIndex?'sitemap':'url'));
  const stats = {type, items:items.length, sizeKB:Math.round(text.length/1024)};
  // Spec limits
  if(items.length > 50000){ checks.push({sev:'fail', title:`${items.length} URLs (exceeds 50,000 limit)`, desc:'Per spec, a single sitemap can have at most 50,000 URLs.', fix:'Split into multiple sitemaps and use a sitemap index.'}); }
  if(text.length > 50*1024*1024){ checks.push({sev:'fail', title:`Size ${stats.sizeKB} KB exceeds 50 MB`, desc:'Uncompressed sitemaps cannot exceed 50 MB per spec.', fix:'Compress or split the sitemap.'}); }
  // URL validation
  const urls = items.map(u=>u.querySelector('loc')?.textContent?.trim()).filter(Boolean);
  const protocols = new Set();
  const hostnames = new Set();
  let invalidCount = 0;
  urls.forEach(u=>{
    try { const url = new URL(u); protocols.add(url.protocol); hostnames.add(url.hostname); }
    catch(e){ invalidCount++; }
  });
  if(invalidCount){ checks.push({sev:'fail', title:`${invalidCount} URLs are malformed`, desc:'Some <code>&lt;loc&gt;</code> values aren\'t valid URLs.', fix:'Fix or remove invalid URLs.'}); }
  if(protocols.has('http:') && protocols.has('https:')){ checks.push({sev:'warn', title:'Mixed http/https URLs', desc:'Sitemap should use a single protocol (preferably https).', fix:'Standardize on https.'}); }
  if(hostnames.size>1){ checks.push({sev:'warn', title:`${hostnames.size} different hostnames`, desc:'All URLs in a single sitemap should be on the same hostname.', fix:'Use sitemap index for cross-host.'}); }
  // Check for duplicates
  const seen = new Set(); let dupes = 0;
  urls.forEach(u=>{ if(seen.has(u)) dupes++; else seen.add(u); });
  if(dupes){ checks.push({sev:'warn', title:`${dupes} duplicate URLs`, desc:'Same URL listed multiple times wastes crawl budget.', fix:'Dedupe.'}); }
  // Empty lastmod / priority warnings
  const withLastmod = items.filter(u=>u.querySelector('lastmod')).length;
  if(type==='urlset' && withLastmod/items.length < 0.5){ checks.push({sev:'warn', title:'Most URLs missing <lastmod>', desc:'lastmod is the most important Google freshness signal.', fix:'Add lastmod to every URL.'}); }
  if(!checks.some(c=>c.sev==='fail')){ checks.unshift({sev:'ok', title:'Sitemap structure valid', desc:`${type} with ${items.length} entries.`}); }
  return {checks, stats:{...stats, urls:urls.length, uniqueUrls:seen.size, withLastmod, hostnames:hostnames.size}};
}

/* ---------- SITEMAP SPLITTING / INDEX ---------- */
function splitSitemap(urls, base, perFile){
  perFile = perFile || 45000;
  const chunks = [];
  for(let i=0;i<urls.length;i+=perFile) chunks.push(urls.slice(i, i+perFile));
  const today = new Date().toISOString().slice(0,10);
  const files = chunks.map((chunk, idx)=>({
    name: `sitemap-${idx+1}.xml`,
    content: `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${chunk.map(u=>`  <url>\n    <loc>${escapeXml(u)}</loc>\n    <lastmod>${today}</lastmod>\n  </url>`).join('\n')}\n</urlset>`,
  }));
  const indexXml = `<?xml version="1.0" encoding="UTF-8"?>\n<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${files.map(f=>`  <sitemap>\n    <loc>${base.replace(/\/$/,'')}/${f.name}</loc>\n    <lastmod>${today}</lastmod>\n  </sitemap>`).join('\n')}\n</sitemapindex>`;
  return {files, indexXml};
}

function buildIndex(){
  const base = document.getElementById('ix-base').value.trim();
  const mode = document.getElementById('ix-mode').value;
  const today = new Date().toISOString().slice(0,10);
  let indexXml = '', files = [];
  if(mode==='split'){
    const urls = document.getElementById('ix-urls').value.split('\n').map(l=>l.trim()).filter(Boolean);
    const perFile = parseInt(document.getElementById('ix-per').value)||45000;
    if(!urls.length){ toast('Add URLs first','err'); return; }
    const result = splitSitemap(urls, base, perFile);
    files = result.files;
    indexXml = result.indexXml;
  } else {
    const list = document.getElementById('ix-manual-list').value.split('\n').map(l=>l.trim()).filter(Boolean);
    if(!list.length){ toast('Add sitemap URLs','err'); return; }
    indexXml = `<?xml version="1.0" encoding="UTF-8"?>\n<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${list.map(u=>`  <sitemap>\n    <loc>${escapeXml(u)}</loc>\n    <lastmod>${today}</lastmod>\n  </sitemap>`).join('\n')}\n</sitemapindex>`;
  }
  document.getElementById('ix-output').innerHTML = `
    <div class="section"><div class="section-hdr"><h3>sitemap-index.xml</h3><button class="cb-btn primary" onclick="download(${JSON.stringify(indexXml).replace(/"/g,'&quot;')}, 'sitemap-index.xml', 'application/xml')">⬇ Download</button></div><div class="section-body"><pre class="code-out">${escapeHtml(indexXml)}</pre></div></div>
    ${files.length?`<div class="section"><div class="section-hdr"><h3>Child Sitemaps</h3><span class="badge">${files.length} files</span></div><div>${files.map(f=>`<div style="padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px"><div style="flex:1;font-family:var(--mono);font-size:11.5px">${escapeHtml(f.name)}</div><button class="cb-btn primary" onclick="download(${JSON.stringify(f.content).replace(/"/g,'&quot;')}, '${f.name}', 'application/xml')">⬇</button></div>`).join('')}</div></div>`:''}
  `;
}

function renderGuide(body){
  body.innerHTML = `
    <div class="section"><div class="section-hdr"><h3>robots.txt — Common Mistakes</h3></div><div class="section-body" style="font-size:13px;line-height:1.7">
      <h4 style="font-size:14px;font-weight:700">1. Blocking the entire site by accident</h4>
      <p style="color:var(--text2);font-size:12px">The dreaded <code>Disallow: /</code> for <code>User-agent: *</code> blocks Google entirely. This is the #1 cause of "why did my traffic disappear" panic.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">2. Blocking CSS / JS</h4>
      <p style="color:var(--text2);font-size:12px">Google needs CSS + JS to render and rank pages. Don't block <code>/wp-includes/js/</code> or similar paths.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">3. Using robots.txt for de-indexing</h4>
      <p style="color:var(--text2);font-size:12px">Disallowed pages can still appear in search results if linked to. To remove from index, use <code>noindex</code> meta tag (not robots.txt).</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">4. Forgetting the sitemap reference</h4>
      <p style="color:var(--text2);font-size:12px">Always add <code>Sitemap: https://yoursite.com/sitemap.xml</code> — easiest way for crawlers to find it.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">5. Not testing changes</h4>
      <p style="color:var(--text2);font-size:12px">Always test robots.txt changes via <a href="https://search.google.com/search-console/robots-testing-tool" target="_blank" style="color:var(--accent)">GSC robots tester</a> before deploying.</p>
    </div></div>

    <div class="section"><div class="section-hdr"><h3>Sitemap — Common Mistakes</h3></div><div class="section-body" style="font-size:13px;line-height:1.7">
      <h4 style="font-size:14px;font-weight:700">1. Including non-canonical URLs</h4>
      <p style="color:var(--text2);font-size:12px">Only include the version you want indexed. No www/non-www mixing, no /index.html, no parameter variants.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">2. Listing 404 / redirected pages</h4>
      <p style="color:var(--text2);font-size:12px">Wastes crawl budget. Only list <code>200 OK</code> URLs.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">3. Stale <code>&lt;lastmod&gt;</code></h4>
      <p style="color:var(--text2);font-size:12px">Don't fake "today" on every URL. Use the actual last modified date — Google detects fakery and de-emphasizes the signal.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">4. Hitting 50k or 50MB limits</h4>
      <p style="color:var(--text2);font-size:12px">Per spec, a single sitemap is capped at 50,000 URLs OR 50MB uncompressed. Bigger sites need a <strong>sitemap index</strong> pointing to multiple child sitemaps.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">5. Not submitting to Search Console</h4>
      <p style="color:var(--text2);font-size:12px">Adding the sitemap to robots.txt is helpful but submitting via GSC gives you indexation reports.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">6. Mixing protocols / hostnames</h4>
      <p style="color:var(--text2);font-size:12px">All URLs in a single sitemap should be on the same hostname + protocol (https). Use a sitemap index if you have multiple subdomains.</p>

      <h4 style="font-size:14px;font-weight:700;margin-top:18px">7. Forgetting media sitemaps</h4>
      <p style="color:var(--text2);font-size:12px">For image-heavy sites, build a separate <code>sitemap-images.xml</code>. For video-heavy, <code>sitemap-videos.xml</code>. Reference all from your index.</p>
    </div></div>
  `;
}
