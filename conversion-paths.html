<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversion Path Tracker - GBP → Site → Conversion Attribution</title>
<meta name="description" content="Track and visualize your local conversion funnel: GBP impressions → clicks → site visits → leads → customers. UTM builder, attribution modeling, cost per acquisition by channel, and Sankey-style flow visualization.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#7c3aed; --accent-h:#6d28d9; --accent-soft:rgba(124,58,237,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed; --green:#16a34a;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#a78bfa; --accent-h:#c4b5fd; --accent-soft:rgba(167,139,250,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa; --green:#22c55e;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--pink);border:1px solid var(--pink);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.conv strong{color:var(--accent);font-size:14px}
.hdr-stat.cpa strong{color:var(--warn)}
.hdr-stat.rev strong{color:var(--success)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:340px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}
.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.f label .src{font-size:9.5px;color:var(--success);font-weight:600;text-transform:none;letter-spacing:0}
.f input,.f select{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}
.input-prefix{position:relative}
.input-prefix::before{content:'$';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11.5px;color:var(--text3);font-weight:700}
.input-prefix input{padding-left:22px}
.input-suffix{position:relative}
.input-suffix::after{content:'%';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11.5px;color:var(--text3);font-weight:700}
.input-suffix input{padding-right:24px}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.s::before{background:var(--success)}.kpi.w::before{background:var(--warn)}.kpi.d::before{background:var(--danger)}.kpi.b::before{background:var(--blue)}
.kpi .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:900;font-family:var(--mono);color:var(--text);line-height:1.05}
.kpi.s .v{color:var(--success)}.kpi.w .v{color:var(--warn)}.kpi.d .v{color:var(--danger)}.kpi.b .v{color:var(--blue)}
.kpi .s{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}

.funnel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:24px;margin-bottom:14px}
.funnel-stage{display:flex;align-items:center;justify-content:center;margin:0 auto 5px;color:#fff;font-weight:800;font-family:var(--mono);font-size:15px;border-radius:8px;padding:14px;position:relative;transition:all .3s}
.funnel-stage .label{flex:1}
.funnel-stage .num{font-size:18px;font-weight:900;letter-spacing:-.4px}
.funnel-stage .conv{font-size:11px;opacity:.85;font-family:var(--mono);margin-left:8px}
.funnel-arrow{height:14px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px}

.channel-row{display:grid;grid-template-columns:14px 1fr auto auto auto auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center;font-size:12px}
.channel-row .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.channel-row .name{font-weight:700}
.channel-row .met{font-family:var(--mono);font-size:11.5px;color:var(--text2);text-align:right;min-width:60px}
.channel-row .met .ml{font-size:9px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:1px}
.channel-row .met .mv{font-weight:800;color:var(--text)}
.channel-row .met .mv.good{color:var(--success)}
.channel-row .met .mv.bad{color:var(--danger)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

.utm-output{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:var(--mono);font-size:12px;word-break:break-all;line-height:1.6;color:var(--accent);font-weight:700;position:relative}
.utm-output button{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;border:none;border-radius:5px;padding:4px 10px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:var(--font)}

.chart-wrap{position:relative;height:280px;padding:10px 14px}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:340px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></div>
    <div><div class="logo-name">Conv<span>Paths</span></div></div>
    <span class="logo-tag">FUNNEL</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat conv">Conv rate: <strong id="stat-conv">—</strong></div>
  <div class="hdr-stat cpa">CPA: <strong id="stat-cpa">—</strong></div>
  <div class="hdr-stat rev">Revenue: <strong id="stat-rev">$0</strong></div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">Dashboard</a>
  <a href="roi-calculator.html" class="hdr-link" style="border-color:rgba(22,163,74,.4);color:var(--success)">ROI Calc</a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">
  <div id="left">
    <div class="lh-bar"><h3>Funnel Inputs</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Channel Traffic (monthly)</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>GBP impressions <span class="src" id="src-gbp"></span></label><input type="number" id="i-gbp-imp" value="5000" min="0" oninput="recalc()"></div>
          <div class="f"><label>GBP profile clicks</label><input type="number" id="i-gbp-clicks" value="350" min="0" oninput="recalc()"></div>
          <div class="f"><label>Organic site visits <span class="src" id="src-org"></span></label><input type="number" id="i-organic" value="500" min="0" oninput="recalc()"></div>
          <div class="f"><label>Direct visits</label><input type="number" id="i-direct" value="200" min="0" oninput="recalc()"></div>
          <div class="f"><label>Referral visits</label><input type="number" id="i-referral" value="80" min="0" oninput="recalc()"></div>
          <div class="f"><label>Paid (Google Ads) visits</label><input type="number" id="i-paid" value="0" min="0" oninput="recalc()"></div>
          <button class="btn-sub" onclick="syncFromGbpPerf()">↻ Pull from GBP Performance</button>
        </div>
      </div>
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Conversion Rates</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>GBP click → site visit</label><div class="input-suffix"><input type="number" id="i-gbp-cr" value="60" min="0" max="100" step="1" oninput="recalc()"></div></div>
          <div class="f"><label>Site visit → lead</label><div class="input-suffix"><input type="number" id="i-lead-cr" value="8" min="0" max="100" step="0.5" oninput="recalc()"></div></div>
          <div class="f"><label>Lead → customer</label><div class="input-suffix"><input type="number" id="i-cust-cr" value="35" min="0" max="100" step="1" oninput="recalc()"></div></div>
          <div class="f"><label>GBP click-to-call directly</label><div class="input-suffix"><input type="number" id="i-c2c" value="15" min="0" max="100" step="1" oninput="recalc()"></div><div class="hint">Direct calls from GBP bypass the site.</div></div>
          <div class="f"><label>Call → customer</label><div class="input-suffix"><input type="number" id="i-call-cr" value="50" min="0" max="100" step="1" oninput="recalc()"></div></div>
        </div>
      </div>
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Economics</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Avg order value</label><div class="input-prefix"><input type="number" id="i-aov" value="250" min="0" oninput="recalc()"></div></div>
          <div class="f"><label>Gross margin</label><div class="input-suffix"><input type="number" id="i-margin" value="40" min="0" max="100" oninput="recalc()"></div></div>
          <div class="f"><label>Marketing spend/mo</label><div class="input-prefix"><input type="number" id="i-spend" value="1500" min="0" oninput="recalc()"></div></div>
        </div>
      </div>
      <div class="fsec collapsed">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>UTM Builder</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Target URL</label><input id="u-url" placeholder="https://yoursite.com" oninput="buildUtm()"></div>
          <div class="f"><label>utm_source</label><input id="u-src" placeholder="gbp" oninput="buildUtm()"></div>
          <div class="f"><label>utm_medium</label><input id="u-med" placeholder="organic" oninput="buildUtm()"></div>
          <div class="f"><label>utm_campaign</label><input id="u-camp" placeholder="local-may-2026" oninput="buildUtm()"></div>
          <div class="f"><label>utm_content</label><input id="u-cont" placeholder="profile-link" oninput="buildUtm()"></div>
        </div>
      </div>
    </div>
    <div id="left-footer">
      <button class="btn-go" onclick="exportReport()">Export Report</button>
      <div style="display:flex;gap:5px">
        <button class="btn-sub" onclick="exportCSV()">CSV</button>
        <button class="btn-sub" onclick="resetDefaults()">Reset</button>
      </div>
    </div>
  </div>

  <div id="center">
    <div id="cbar">
      <button class="tab active" data-tab="funnel" onclick="setTab('funnel')">Funnel</button>
      <button class="tab" data-tab="channels" onclick="setTab('channels')">Channels</button>
      <button class="tab" data-tab="utm" onclick="setTab('utm')">UTM Builder</button>
      <button class="tab" data-tab="guide" onclick="setTab('guide')">Best Practices</button>
      <div class="cb-sp"></div>
    </div>
    <div id="cbody"></div>
  </div>
</div>

<div id="footer">
  <div style="display:flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="ft-status">Track GBP → site → conversion attribution</span></div>
  <div class="ft-spacer"></div>
  <div>Built by <strong>Local SEO Tools</strong></div>
  <a class="ft-link" href="mailto:">Email</a>
</div>

<div id="toast"></div>

<script>
const STORE_KEY='cp_state_v1';
const defaultState={
  gbpImp:5000, gbpClicks:350, organic:500, direct:200, referral:80, paid:0,
  gbpCR:60, leadCR:8, custCR:35, c2c:15, callCR:50,
  aov:250, margin:40, spend:1500,
  utm:{url:'',src:'',med:'',camp:'',cont:''},
  view:'funnel'
};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}
function toggleSec(h){h.parentElement.classList.toggle('collapsed');}

function getInputs(){
  ['gbpImp','gbpClicks','organic','direct','referral','paid','gbpCR','leadCR','custCR','c2c','callCR','aov','margin','spend'].forEach(k=>{
    const id='i-'+k.replace(/([A-Z])/g,'-$1').toLowerCase().replace('imp','imp').replace('clicks','clicks');
    const el=document.getElementById(id);if(el){const v=parseFloat(el.value);if(!isNaN(v))state[k]=v;}
  });
  saveState();
}
function fillInputs(){
  ['gbpImp','gbpClicks','organic','direct','referral','paid','gbpCR','leadCR','custCR','c2c','callCR','aov','margin','spend'].forEach(k=>{
    const id='i-'+k.replace(/([A-Z])/g,'-$1').toLowerCase().replace('imp','imp').replace('clicks','clicks');
    const el=document.getElementById(id);if(el)el.value=state[k];
  });
  document.getElementById('u-url').value=state.utm.url||'';
  document.getElementById('u-src').value=state.utm.src||'';
  document.getElementById('u-med').value=state.utm.med||'';
  document.getElementById('u-camp').value=state.utm.camp||'';
  document.getElementById('u-cont').value=state.utm.cont||'';
}
function recalc(){getInputs();render();}

function syncFromGbpPerf(){
  try{const gp=JSON.parse(localStorage.getItem('gp_state_v1')||'null');
    if(!gp?.imports?.length){toast('No GBP Performance data','err');return;}
    const daily=gp.imports.filter(i=>i.type==='daily_actions').flatMap(i=>i.data||[]).slice(0,30);
    if(!daily.length){toast('No daily actions data','err');return;}
    const totWeb=daily.reduce((s,r)=>s+(r.websiteClicks||0),0);
    const totCalls=daily.reduce((s,r)=>s+(r.calls||0),0);
    state.gbpClicks=totWeb||state.gbpClicks;
    document.getElementById('src-gbp').textContent='✓ GBP';
    saveState();fillInputs();recalc();
    toast(`Loaded ${totWeb} web clicks + ${totCalls} calls`,'success');
  }catch(e){toast('Sync failed','err');}
}

function calc(){
  // From channel inputs → unified funnel
  const totalSiteVisits = Math.round(state.gbpClicks*state.gbpCR/100) + state.organic + state.direct + state.referral + state.paid;
  const directGbpCalls = Math.round(state.gbpClicks*state.c2c/100);
  const leads = Math.round(totalSiteVisits*state.leadCR/100);
  const customersFromSite = leads*state.custCR/100;
  const customersFromCalls = directGbpCalls*state.callCR/100;
  const totalCustomers = customersFromSite + customersFromCalls;
  const revenue = totalCustomers * state.aov;
  const profit = revenue * state.margin/100;
  const cpa = totalCustomers ? state.spend/totalCustomers : 0;
  const totalConvRate = (state.gbpImp+state.organic+state.direct+state.referral+state.paid) ? totalCustomers/(state.gbpImp+state.organic+state.direct+state.referral+state.paid)*100 : 0;
  // Per-channel revenue (proportional attribution)
  const channels=[
    {id:'gbp', name:'GBP / Maps', color:'#4285f4', traffic:state.gbpClicks},
    {id:'organic', name:'Organic Search', color:'#16a34a', traffic:state.organic},
    {id:'direct', name:'Direct', color:'#7c3aed', traffic:state.direct},
    {id:'referral', name:'Referral', color:'#0d9488', traffic:state.referral},
    {id:'paid', name:'Paid (Ads)', color:'#ea580c', traffic:state.paid},
  ];
  const totalTraffic=channels.reduce((s,c)=>s+c.traffic,0);
  channels.forEach(c=>{
    c.share=totalTraffic?c.traffic/totalTraffic*100:0;
    // For GBP, factor in direct calls + site path
    if(c.id==='gbp'){
      const channelCustomers=customersFromCalls + Math.round(state.gbpClicks*state.gbpCR/100)*state.leadCR/100*state.custCR/100;
      c.customers=channelCustomers;
      c.revenue=channelCustomers*state.aov;
      c.cpc=null; // direct from GBP, no cost
    } else {
      // Pro-rata of remaining customers
      const remaining=customersFromSite - (Math.round(state.gbpClicks*state.gbpCR/100))*state.leadCR/100*state.custCR/100;
      const nonGbpVisits=state.organic+state.direct+state.referral+state.paid;
      c.customers = nonGbpVisits ? remaining * (c.traffic/nonGbpVisits) : 0;
      c.revenue = c.customers*state.aov;
      // Cost allocation: assume only paid has cost
      c.cpa = c.id==='paid' && c.customers ? state.spend/c.customers : null;
    }
    c.profit = c.revenue * state.margin/100;
  });
  return {
    totalSiteVisits, directGbpCalls, leads, customersFromSite, customersFromCalls, totalCustomers, revenue, profit, cpa, totalConvRate, channels,
    totalImpressions: state.gbpImp+state.organic+state.direct+state.referral+state.paid // approximate
  };
}

function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

let chart;
function render(){
  const r=calc();
  document.getElementById('stat-conv').textContent=r.totalConvRate.toFixed(2)+'%';
  document.getElementById('stat-cpa').textContent=r.cpa?'$'+Math.round(r.cpa):'—';
  document.getElementById('stat-rev').textContent=r.revenue>=1000?'$'+Math.round(r.revenue/100)/10+'K':'$'+Math.round(r.revenue);
  if(state.view==='funnel') return renderFunnel(r);
  if(state.view==='channels') return renderChannels(r);
  if(state.view==='utm') return renderUtm();
  if(state.view==='guide') return renderGuide();
}

    {label:'Site Visits', num:r.totalSiteVisits, color:'#7c3aed', width:70},
    {label:'Leads', num:r.leads, color:'#db2777', width:50},
    {label:'Customers (site + call)', num:Math.round(r.totalCustomers), color:'#16a34a', width:35},

  document.getElementById('cbody').innerHTML=`

      <div class="kpi s"><div class="l">Revenue</div><div class="v">$${Math.round(r.revenue).toLocaleString()}</div><div class="s">$${Math.round(r.profit).toLocaleString()} profit</div></div>
    </div>

      ${stages.map((s,i)=>{
        const prev=i>0?stages[i-1].num:s.num;

      <p><strong>Visit → lead:</strong> ${state.leadCR}% convert to leads. Local business avg: 5-15%.</p>
      <p><strong>Lead → customer:</strong> ${state.custCR}% close. Service businesses avg: 25-50%.</p>
      ${r.totalConvRate<0.5?'<p style="color:var(--danger);font-weight:700;margin-top:10px">⚠ End-to-end conversion below 0.5% — investigate biggest drop-off step.</p>':''}

function renderChannels(r){
  const total=r.channels.reduce((s,c)=>s+c.customers,0);
  document.getElementById('cbody').innerHTML=`
    <div class="section"><div class="section-hdr"><h3>Per-Channel Performance</h3></div><div>
      ${r.channels.filter(c=>c.traffic>0).sort((a,b)=>b.revenue-a.revenue).map(c=>{
        const customerShare = total ? Math.round(c.customers/total*100) : 0;
        return `<div class="channel-row">
          <div class="dot" style="background:${c.color}"></div>
          <div class="name">${escapeHtml(c.name)}</div>
          <div class="met"><div class="ml">Traffic</div><div class="mv">${c.traffic.toLocaleString()}</div></div>
          <div class="met"><div class="ml">Customers</div><div class="mv">${Math.round(c.customers)}</div></div>
          <div class="met"><div class="ml">Revenue</div><div class="mv good">$${Math.round(c.revenue).toLocaleString()}</div></div>
          <div class="met"><div class="ml">% of customers</div><div class="mv">${customerShare}%</div></div>
        </div>`;
      }).join('')}
    </div></div>
    <div class="section"><div class="section-hdr"><h3>Revenue Mix by Channel</h3></div><div class="chart-wrap"><canvas id="ch-channels"></canvas></div></div>
  `;
  setTimeout(()=>{
    const ctx=document.getElementById('ch-channels')?.getContext('2d');if(!ctx)return;
    if(chart)chart.destroy();
    const isDark=document.documentElement.getAttribute('data-theme')==='dark';
    Chart.defaults.color=isDark?'#7e95b8':'#5b6b88';
    const filtered=r.channels.filter(c=>c.revenue>0);
    chart=new Chart(ctx,{type:'doughnut',data:{labels:filtered.map(c=>c.name),datasets:[{data:filtered.map(c=>c.revenue),backgroundColor:filtered.map(c=>c.color)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right'},tooltip:{callbacks:{label:c=>c.label+': $'+Math.round(c.parsed).toLocaleString()}}}}});
  },50);
}

function buildUtm(){
  state.utm={
    url:document.getElementById('u-url').value.trim(),
    src:document.getElementById('u-src').value.trim(),
    med:document.getElementById('u-med').value.trim(),
    camp:document.getElementById('u-camp').value.trim(),
    cont:document.getElementById('u-cont').value.trim(),
  };
  saveState();
  if(state.view==='utm') renderUtm();
}

function renderUtm(){
  const u=state.utm;
  const params=[];
  if(u.src)params.push('utm_source='+encodeURIComponent(u.src));
  if(u.med)params.push('utm_medium='+encodeURIComponent(u.med));
  if(u.camp)params.push('utm_campaign='+encodeURIComponent(u.camp));
  if(u.cont)params.push('utm_content='+encodeURIComponent(u.cont));
  const full = u.url ? u.url+(u.url.includes('?')?'&':'?')+params.join('&') : '';
  const presets=[
    {label:'GBP profile link', src:'gbp', med:'organic', camp:'gbp-profile'},
    {label:'GBP post (this week)', src:'gbp', med:'post', camp:'gbp-post-'+'2026-05-29'},
    {label:'Yelp listing', src:'yelp', med:'organic', camp:'yelp-listing'},
    {label:'Email signature', src:'email', med:'signature', camp:'sig'},
    {label:'Local Facebook page', src:'facebook', med:'organic', camp:'fb-page'},
    {label:'Newsletter', src:'newsletter', med:'email', camp:'monthly-newsletter'},
  ];
  document.getElementById('cbody').innerHTML=`
    <div class="section"><div class="section-hdr"><h3>Generated URL</h3></div><div style="padding:14px">
      ${full?`<div class="utm-output">${escapeHtml(full)}<button onclick="copyUtm()">Copy</button></div>`:'<div style="padding:20px;text-align:center;color:var(--text3);font-family:var(--mono);font-size:12px">Fill in URL and UTM params in left panel</div>'}
    </div></div>
    <div class="section"><div class="section-hdr"><h3>Common Presets</h3></div><div style="padding:8px">
      ${presets.map(p=>`<div onclick="loadPreset('${p.src}','${p.med}','${p.camp}')" style="padding:10px 14px;border-radius:7px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:11px;font-size:12px;transition:background .12s" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='transparent'"><div><div style="font-weight:700">${escapeHtml(p.label)}</div><div style="font-size:10.5px;color:var(--text3);font-family:var(--mono);margin-top:1px">${p.src} / ${p.med} / ${p.camp}</div></div><button style="background:var(--accent);color:#fff;border:none;border-radius:5px;padding:5px 11px;font-size:10.5px;font-weight:700">Use</button></div>`).join('')}
    </div></div>
    <div class="section"><div class="section-hdr"><h3>About UTMs</h3></div><div style="padding:16px;font-size:12.5px;color:var(--text2);line-height:1.7">UTM parameters let Google Analytics attribute visits to the specific channel/campaign that drove them. Apply to <strong>every link you control</strong> — GBP website field, email signatures, social bios — so you can see in GA4 what's actually driving conversions.</div></div>
  `;
}
function copyUtm(){navigator.clipboard.writeText(document.querySelector('.utm-output').textContent.replace('Copy',''));toast('URL copied','success');}
function loadPreset(src,med,camp){document.getElementById('u-src').value=src;document.getElementById('u-med').value=med;document.getElementById('u-camp').value=camp;buildUtm();}

    <ul style="padding-left:22px;margin-top:6px">
      <li><strong>Impression → click</strong>: 3-5% (good local pack)</li>

      <li><strong>Click-to-call directly from GBP</strong>: 10-20%</li>
      <li><strong>Site visit → lead</strong>: 5-15%</li>
      <li><strong>Lead → customer</strong>: 25-50% (service businesses)</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">How to Track Each Step</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li><strong>GBP impressions</strong>: Google Business Profile Insights</li>
      <li><strong>GBP clicks</strong>: GBP Insights (web, calls, directions)</li>
      <li><strong>Site visits</strong>: GA4 — segment by source/medium</li>
      <li><strong>Leads</strong>: GA4 conversion events (form_submit, phone_call)</li>
      <li><strong>Customers</strong>: CRM + call tracking attribution</li>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">UTM Discipline</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li>UTM <strong>every link you control</strong> — GBP website, email signatures, social bios</li>
      <li>Stay consistent — pick a UTM convention and stick to it (e.g. lowercase, no spaces)</li>
      <li>Use <code>utm_campaign</code> to A/B test (e.g., variant-a, variant-b)</li>
      <li>Don't UTM internal links — breaks attribution</li>

  </div></div>`;

function exportCSV(){
  const r=calc();

  rows.push(['GBP impressions',state.gbpImp]);
  rows.push(['GBP clicks',state.gbpClicks]);
  rows.push(['Site visits',r.totalSiteVisits]);
  rows.push(['Direct GBP calls',r.directGbpCalls]);
  rows.push(['Leads',r.leads]);
  rows.push(['Total customers',Math.round(r.totalCustomers)]);
  rows.push(['Revenue',Math.round(r.revenue)]);
  rows.push(['Profit',Math.round(r.profit)]);
  rows.push(['CPA',Math.round(r.cpa||0)]);
  r.channels.forEach(c=>{rows.push([`channel_${c.id}_traffic`,c.traffic]);rows.push([`channel_${c.id}_customers`,Math.round(c.customers)]);rows.push([`channel_${c.id}_revenue`,Math.round(c.revenue)]);});
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='conversion-paths.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('CSV exported','success');
}
