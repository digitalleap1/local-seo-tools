<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local SEO Toolkit — All your tools, neatly organized</title>
<meta name="description" content="A complete Local SEO toolkit organized into clear categories: Google Business Profile, citations, rankings, content, technical SEO, backlinks, reviews and AI. Pick a tool and go.">
<script>
(function(){
  var saved = localStorage.getItem('seohub_theme_v1');
  var d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --blue:#2563eb; --purple:#7c3aed;
  --font:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',monospace;
  --radius:14px; --shadow-sm:0 1px 3px rgba(15,26,46,.06); --shadow-md:0 6px 20px rgba(15,26,46,.08);
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --text:#eaf0fb; --text2:#9fb0cc; --text3:#6b7d9c;
  --blue:#3b82f6; --purple:#a78bfa;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.hero::before{content:'';position:absolute;inset:0;background:
  radial-gradient(circle at 15% 20%, rgba(37,99,235,.16), transparent 40%),
  radial-gradient(circle at 85% 30%, rgba(124,58,237,.16), transparent 42%),
  radial-gradient(circle at 50% 120%, rgba(13,148,136,.12), transparent 45%);pointer-events:none}
.hero-in{position:relative;text-align:center;padding:54px 20px 40px;max-width:760px;margin:0 auto}
.hero h1{font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-1px;line-height:1.1}
.hero h1 .grad{background:linear-gradient(120deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:clamp(13px,1.6vw,16px);color:var(--text2);margin:14px auto 26px;max-width:560px}
.search{position:relative;max-width:540px;margin:0 auto}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text3)}
.search input{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;padding:15px 44px 15px 46px;font-size:15px;color:var(--text);font-family:inherit;outline:none;box-shadow:var(--shadow-md);transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.search .clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--bg3);border:none;border-radius:8px;width:28px;height:28px;color:var(--text2);cursor:pointer;font-size:15px;display:none;align-items:center;justify-content:center}
.search .clr.show{display:flex}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.stats span{font-size:11.5px;font-family:var(--mono);font-weight:600;color:var(--text2);background:var(--bg2);border:1px solid var(--border);padding:5px 11px;border-radius:20px}
.stats b{color:var(--text);font-weight:800}

/* ---------- QUICK START ---------- */
.section-lbl{display:flex;align-items:center;gap:10px;margin:30px 0 14px}
.section-lbl h2{font-size:13px;font-family:var(--mono);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2)}
.section-lbl .ln{flex:1;height:1px;background:var(--border)}
.section-lbl .guide{font-size:12px;font-weight:700;color:var(--blue);display:inline-flex;align-items:center;gap:5px}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.qs a{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow-sm);transition:transform .14s,box-shadow .14s,border-color .14s}
.qs a:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.qs .badge{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.qs .badge svg{width:20px;height:20px}
.qs .qn{font-size:13.5px;font-weight:800;line-height:1.2}
.qs .qd{font-size:11.5px;color:var(--text2);margin-top:2px;line-height:1.35}

/* ---------- CATEGORY NAV (sticky) ---------- */
.catnav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);margin-top:30px}
.catnav-in{display:flex;gap:7px;overflow-x:auto;padding:11px 0;scrollbar-width:none}
.catnav-in::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .14s}
.chip:hover{color:var(--text);border-color:var(--border2)}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.chip .cnt{font-size:10px;opacity:.7;font-family:var(--mono)}

/* ---------- CATALOG ---------- */
.catalog{padding:8px 0 50px}
.cat{margin-top:30px;scroll-margin-top:70px}
.cat-head{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.cat-head .ci{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.cat-head .ci svg{width:20px;height:20px}
.cat-head .cn{font-size:17px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.cat-head .cn .pill{font-size:10.5px;font-family:var(--mono);font-weight:700;color:var(--text2);background:var(--bg3);padding:2px 8px;border-radius:10px}
.cat-head .cs{font-size:12px;color:var(--text3);font-family:var(--mono);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px}
.card{position:relative;display:flex;gap:11px;align-items:flex-start;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow-sm);transition:transform .14s,box-shadow .14s,border-color .14s;overflow:hidden}
.card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc,#64748b);opacity:0;transition:opacity .14s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border2)}
.card:hover::after{opacity:1}
.card .tcode{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;font-family:var(--mono);flex-shrink:0}
.card .ti{min-width:0;flex:1}
.card .tn{font-size:13.5px;font-weight:800;line-height:1.25;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .tn .new{font-size:8px;font-family:var(--mono);font-weight:800;color:#fff;background:var(--purple);padding:1px 4px;border-radius:4px;letter-spacing:.4px}
.card .td{font-size:11.5px;color:var(--text2);margin-top:3px;line-height:1.4}
.empty{display:none;text-align:center;padding:60px 20px;color:var(--text3)}
.empty.show{display:block}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.5}
.empty b{display:block;color:var(--text2);font-size:15px;font-weight:700;margin-bottom:4px}
@media (max-width:560px){
  .hero-in{padding:38px 16px 28px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-in">
    <h1>Your complete <span class="grad">Local SEO</span> toolkit</h1>
    <p>Every tool, neatly grouped into clear categories. Search, pick a tool, and get to work — no clutter.</p>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" placeholder="Search all tools — e.g. citations, schema, rankings…" autocomplete="off">
      <button class="clr" id="clr" aria-label="Clear">✕</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<div class="wrap">
  <div class="section-lbl">
    <h2>Start here</h2><span class="ln"></span>
    <a class="guide" href="guide.html">New here? Read the guide
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:13px;height:13px"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </div>
  <div class="qs" id="quickstart"></div>
</div>

<div class="catnav"><div class="wrap"><div class="catnav-in" id="catnav"></div></div></div>

<div class="wrap">
  <div class="catalog" id="catalog"></div>
  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <b>No tools match your search</b>
    <span>Try a different word, or clear the search to see everything.</span>
  </div>
</div>

<script src="global-nav.js"></script>
<script>
(function(){
  // Category icons (keyed by category id; falls back to a generic icon)
  var ICONS = {
    citations:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    gbp:'<path d="M3 9l1-5h16l1 5"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/>',
    reviews:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    rankings:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    content:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>',
    technical:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-2-2 2.1-2.1z"/>',
    backlinks:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
    visual:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
    ai:'<path d="M12 2l1.6 4.8L18 8l-4.4 1.2L12 14l-1.6-4.8L6 8l4.4-1.2z"/><path d="M5 16l.8 2.2L8 19l-2.2.8L5 22l-.8-2.2L2 19l2.2-.8z"/>',
    _default:'<rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="3" x2="9" y2="21"/>'
  };
  function svg(paths,cls){ return '<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+paths+'</svg>'; }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var QUICK = ['gbp','cf','gg','kw','aiw','sch']; // popular "start here" tools

  function boot(){
    if(!window.GlobalNav){ return setTimeout(boot, 60); }
    var cats = window.GlobalNav.listCategories();
    var tools = window.GlobalNav.listTools();
    var totalTools = 0;
    cats.forEach(function(c){ totalTools += c.tools.filter(function(id){return tools[id];}).length; });

    // stats
    document.getElementById('stats').innerHTML =
      '<span><b>'+totalTools+'</b> tools</span><span><b>'+cats.length+'</b> categories</span><span>Runs in your browser · <b>free</b></span>';

    // quick start
    document.getElementById('quickstart').innerHTML = QUICK.map(function(id){
      var t = tools[id]; if(!t) return '';
      var cat = cats.find(function(c){return c.tools.indexOf(id)>-1;});
      return '<a href="'+t.url+'"><span class="badge" style="background:'+(t.color||'#64748b')+'">'+svg(ICONS[cat?cat.id:'_default']||ICONS._default)+'</span>'+
             '<span><span class="qn">'+esc(t.name)+'</span><span class="qd">'+esc(t.desc||'')+'</span></span></a>';
    }).join('');

    // category nav chips
    var nav = '<button class="chip active" data-cat="all">All tools <span class="cnt">'+totalTools+'</span></button>';
    nav += cats.map(function(c){
      var n = c.tools.filter(function(id){return tools[id];}).length;
      return '<button class="chip" data-cat="'+c.id+'"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+' <span class="cnt">'+n+'</span></button>';
    }).join('');
    document.getElementById('catnav').innerHTML = nav;

    // catalog
    document.getElementById('catalog').innerHTML = cats.map(function(c){
      var list = c.tools.map(function(id){return tools[id];}).filter(Boolean);
      if(!list.length) return '';
      var cards = list.map(function(t){
        var s = (t.name+' '+(t.desc||'')+' '+(t.code||'')+' '+c.name).toLowerCase();
        return '<a class="card" href="'+t.url+'" data-search="'+esc(s)+'" style="--cc:'+(t.color||'#64748b')+'">'+
          '<span class="tcode" style="background:'+(t.color||'#64748b')+'">'+esc(t.code||'?')+'</span>'+
          '<span class="ti"><span class="tn">'+esc(t.name)+(t.isNew?'<span class="new">NEW</span>':'')+'</span>'+
          '<span class="td">'+esc(t.desc||'')+'</span></span></a>';
      }).join('');
      return '<section class="cat" id="cat-'+c.id+'" data-cat="'+c.id+'">'+
        '<div class="cat-head"><div class="ci" style="background:'+c.color+'">'+svg(ICONS[c.id]||ICONS._default)+'</div>'+
        '<div><div class="cn">'+esc(c.name)+'<span class="pill">'+list.length+' tools</span></div>'+
        '<div class="cs">'+esc(c.sub||'')+'</div></div></div>'+
        '<div class="grid">'+cards+'</div></section>';
    }).join('');

    wireFilters();
  }

  function wireFilters(){
    var q = document.getElementById('q'), clr = document.getElementById('clr');
    var chips = Array.prototype.slice.call(document.querySelectorAll('.chip'));
    var sections = Array.prototype.slice.call(document.querySelectorAll('.cat'));
    var activeCat = 'all';

    function apply(){
      var term = q.value.toLowerCase().trim();
      clr.classList.toggle('show', !!term);
      var anyVisible = false;
      sections.forEach(function(sec){
        var catMatch = (activeCat==='all' || sec.dataset.cat===activeCat);
        var cards = Array.prototype.slice.call(sec.querySelectorAll('.card'));
        var shown = 0;
        cards.forEach(function(card){
          var ok = catMatch && (!term || card.dataset.search.indexOf(term)>-1);
          card.style.display = ok ? '' : 'none';
          if(ok) shown++;
        });
        sec.style.display = shown ? '' : 'none';
        if(shown) anyVisible = true;
      });
      document.getElementById('empty').classList.toggle('show', !anyVisible);
    }
    q.addEventListener('input', apply);
    q.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ var first = document.querySelector('.card:not([style*="none"])'); if(first) location.href=first.getAttribute('href'); }
    });
    clr.addEventListener('click', function(){ q.value=''; apply(); q.focus(); });
    chips.forEach(function(ch){
      ch.addEventListener('click', function(){
        activeCat = ch.dataset.cat;
        chips.forEach(function(c){ c.classList.toggle('active', c===ch); });
        apply();
        if(activeCat!=='all'){ var el=document.getElementById('cat-'+activeCat); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
        else window.scrollTo({top:0,behavior:'smooth'});
      });
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
