<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile UX Auditor - Mobile-Specific Local SEO Audit</title>
<meta name="description" content="Audit mobile UX for local SEO. Tests viewport, tap targets, click-to-call, font sizes, mobile rendering, mobile schema, and mobile-specific local UX factors. Includes responsive preview at multiple breakpoints.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#7c3aed; --accent-h:#6d28d9; --accent-soft:rgba(124,58,237,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#a78bfa; --accent-h:#c4b5fd; --accent-soft:rgba(167,139,250,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--pink);border:1px solid var(--pink);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.score strong{color:var(--accent);font-size:14px}
.hdr-stat.tap strong{color:var(--warn)}
.hdr-stat.call strong{color:var(--success)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:340px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}
.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:11px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
.device-toggle{display:flex;gap:3px;background:var(--bg);border-radius:7px;padding:2px}
.device-toggle button{padding:5px 11px;background:transparent;border:none;color:var(--text2);font-size:10.5px;font-weight:700;border-radius:5px;cursor:pointer;font-family:var(--mono)}
.device-toggle button.active{background:var(--accent);color:#fff}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.score-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:14px;display:grid;grid-template-columns:140px 1fr;gap:24px;align-items:center;box-shadow:var(--shadow-sm)}
.score-circle{position:relative;width:140px;height:140px}
.score-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-circle .bg{stroke:var(--bg3);stroke-width:11;fill:none}
.score-circle .fg{stroke:var(--accent);stroke-width:11;fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s}
.score-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-text .v{font-size:36px;font-weight:900;font-family:var(--mono);color:var(--accent);line-height:1}
.score-text .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:700;text-transform:uppercase}
.score-info h2{font-size:18px;font-weight:800;margin-bottom:4px;word-break:break-all}
.score-info .sub{font-size:12.5px;color:var(--text2);line-height:1.55;margin-bottom:10px}
.score-pills{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px;font-weight:700;font-family:var(--mono)}
.score-pills .sp{padding:3px 9px;border-radius:11px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.score-pills .sp.ok{background:rgba(22,163,74,.13);color:var(--success)}
.score-pills .sp.warn{background:rgba(245,158,11,.13);color:var(--warn)}
.score-pills .sp.bad{background:rgba(220,38,38,.13);color:var(--danger)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.s::before{background:var(--success)}.kpi.w::before{background:var(--warn)}.kpi.d::before{background:var(--danger)}
.kpi .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase}
.kpi .v{font-size:24px;font-weight:900;font-family:var(--mono);color:var(--text);line-height:1.05}
.kpi.s .v{color:var(--success)}.kpi.w .v{color:var(--warn)}.kpi.d .v{color:var(--danger)}
.kpi .s{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

.check-list{display:flex;flex-direction:column}
.check{padding:10px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:24px 1fr auto;gap:11px;align-items:start}
.check:last-child{border-bottom:none}
.check .icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;margin-top:1px}
.check.pass .icon{background:rgba(22,163,74,.15);color:var(--success)}
.check.warn .icon{background:rgba(245,158,11,.15);color:var(--warn)}
.check.fail .icon{background:rgba(220,38,38,.15);color:var(--danger)}
.check.info .icon{background:rgba(37,99,235,.15);color:var(--blue)}
.check .body .title{font-size:12.5px;font-weight:700}
.check .body .desc{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:2px}
.check .body .desc code{background:var(--bg);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:10.5px}
.check .meta{font-size:10.5px;font-family:var(--mono);color:var(--text3)}

/* Device preview */
.preview-wrap{display:flex;justify-content:center;padding:20px;background:var(--bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.phone-frame{background:var(--text);border-radius:32px;padding:50px 8px 50px;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.3);transition:all .3s}
.phone-frame.size-small{width:340px}
.phone-frame.size-medium{width:400px}
.phone-frame.size-large{width:480px}
.phone-frame::before{content:'';position:absolute;top:18px;left:50%;transform:translateX(-50%);width:60px;height:5px;background:#444;border-radius:3px}
.phone-frame iframe{width:100%;height:640px;border:none;border-radius:6px;background:#fff;display:block}

.tap-target{padding:11px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;font-size:12px}
.tap-target:last-child{border-bottom:none}
.tap-target .sz{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-family:var(--mono);font-size:11px}
.tap-target .sz.good{background:var(--success)}
.tap-target .sz.warn{background:var(--warn)}
.tap-target .sz.bad{background:var(--danger)}
.tap-target .info{min-width:0}
.tap-target .info .l{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tap-target .info .e{font-size:10.5px;font-family:var(--mono);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.tap-target .meta{font-family:var(--mono);font-size:11px;text-align:right;color:var(--text2)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}

.busy{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:5000}
.busy.show{display:flex}
.busy .card{background:var(--bg2);padding:24px 30px;border-radius:14px;border:1px solid var(--border);text-align:center;max-width:340px}
.busy .sp{width:42px;height:42px;border-radius:50%;border:3px solid var(--bg3);border-top-color:var(--accent);animation:spin .9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:340px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .score-panel{grid-template-columns:1fr}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
    <div><div class="logo-name">Mobile<span>UX</span></div></div>
    <span class="logo-tag">AUDITOR</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat score">UX Score: <strong id="stat-score">—</strong></div>
  <div class="hdr-stat tap">Tap fails: <strong id="stat-taps">0</strong></div>
  <div class="hdr-stat call">Click-to-call: <strong id="stat-call">—</strong></div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">Dashboard</a>
  <a href="page-auditor.html" class="hdr-link" style="border-color:rgba(124,58,237,.4);color:var(--accent)">Page Auditor</a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">
  <div id="left">
    <div class="lh-bar"><h3>Mobile Audit</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Target Page</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Page URL *</label><input id="i-url" placeholder="https://yoursite.com"></div>
          <div class="f"><label>Phone number (for click-to-call test)</label><input id="i-phone" placeholder="+1 555 555 0123"></div>
          <button class="btn-sub" onclick="syncFromCitation()">↻ From Citation Finder</button>
        </div>
      </div>
      <div class="fsec collapsed">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Audit Thresholds</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Min tap target size (px)</label><input id="i-tap-min" type="number" value="44" min="20"><div class="hint">Apple HIG: 44pt · Google Material: 48dp</div></div>
          <div class="f"><label>Min font size (px)</label><input id="i-font-min" type="number" value="14" min="10"></div>
          <div class="f"><label>Min line height ratio</label><input id="i-line-min" type="number" value="1.4" step="0.1" min="1"></div>
        </div>
      </div>
    </div>
    <div id="left-footer">
      <button class="btn-go" onclick="runAudit()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Audit Mobile UX
      </button>
      <div style="display:flex;gap:5px">
        <button class="btn-sub" onclick="exportCSV()">CSV</button>
        <button class="btn-sub" onclick="exportReport()">Report</button>
      </div>
    </div>
  </div>

  <div id="center">
    <div id="cbar">
      <button class="tab active" data-tab="overview" onclick="setTab('overview')">Overview</button>
      <button class="tab" data-tab="checks" onclick="setTab('checks')">All Checks</button>
      <button class="tab" data-tab="taps" onclick="setTab('taps')">Tap Targets</button>
      <button class="tab" data-tab="preview" onclick="setTab('preview')">Device Preview</button>
      <button class="tab" data-tab="guide" onclick="setTab('guide')">Best Practices</button>
      <div class="cb-sp"></div>
    </div>
    <div id="cbody"></div>
  </div>
</div>

<div id="footer">
  <div style="display:flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="ft-status">Enter URL and audit mobile UX</span></div>
  <div class="ft-spacer"></div>
  <div>Built by <strong>Mukesh Kr</strong></div>
  <a class="ft-link" href="mailto:techie1418@gmail.com">Email</a>
</div>

<div id="toast"></div>
<div class="busy" id="busy"><div class="card"><div class="sp"></div><h3 id="busy-title">Auditing…</h3><p id="busy-msg" style="font-size:11.5px;color:var(--text2);font-family:var(--mono)">…</p></div></div>

<script>
const STORE_KEY='mux_state_v1';
const defaultState={url:'',phone:'',tapMin:44,fontMin:14,lineMin:1.4,results:null,view:'overview',device:'medium'};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}
function setBusy(s,t,m){const b=document.getElementById('busy');if(t)document.getElementById('busy-title').textContent=t;if(m)document.getElementById('busy-msg').textContent=m;b.classList.toggle('show',s);}
function toggleSec(h){h.parentElement.classList.toggle('collapsed');}

const PROXIES=[u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`];
async function fetchPage(u){for(const p of PROXIES){try{const r=await fetch(p(u));if(r.ok){const t=await r.text();if(t&&t.length>100)return t;}}catch(e){}}throw new Error('CORS failed');}

async function runAudit(){
  getInputs();
  if(!state.url){toast('URL required','err');return;}
  setBusy(true,'Auditing mobile UX…','Fetching page');
  let html;
  try{html=await fetchPage(state.url);}catch(e){setBusy(false);toast('Could not fetch','err');return;}
  setBusy(true,'Auditing mobile UX…','Parsing markup');
  const doc=new DOMParser().parseFromString(html,'text/html');

  const checks=runChecks(doc, html, state);
  const tapTargets=findTapTargets(doc);
  const tapAudit=auditTapTargets(tapTargets, state.tapMin);
  // Render in hidden iframe to measure actual sizes
  setBusy(true,'Auditing mobile UX…','Rendering at mobile breakpoint');
  await new Promise(r=>setTimeout(r,50));
  const audit=aggregateScore(checks, tapAudit);
  state.results={ts:'2026-05-29', url:state.url, html, checks, tapTargets, tapAudit, audit};
  saveState();
  setBusy(false);
  render();
  toast(`Audit complete · ${audit.score}/100`,'success');
}

function runChecks(doc, html, st){
  const checks=[];

  // Viewport meta
  const viewport=doc.querySelector('meta[name="viewport"]')?.content||'';
  const hasViewport=viewport.length>0;
  const hasInitialScale = /initial-scale\s*=\s*1/.test(viewport);
  const hasWidthDevice = /width\s*=\s*device-width/.test(viewport);
  const hasMaxScale = /maximum-scale\s*=\s*[01]/.test(viewport) && !/maximum-scale\s*=\s*1\.0?\s*$/.test(viewport.trim());
  const userScalableNo = /user-scalable\s*=\s*no/i.test(viewport);
  const viewportGood = hasViewport && hasInitialScale && hasWidthDevice && !userScalableNo;
  checks.push({key:'viewport', status: viewportGood?'pass':hasViewport?'warn':'fail', weight:15, t:'Viewport meta tag', d: viewport?`Found: <code>${escapeHtml(viewport)}</code>${userScalableNo?' — user-scalable=no hurts accessibility':!hasWidthDevice?' — missing width=device-width':!hasInitialScale?' — missing initial-scale=1':' — good'}`:'Missing viewport meta — site won\'t render correctly on mobile.'});

  // Doctype
  const doctype = html.toLowerCase().includes('<!doctype html');
  checks.push({key:'doctype', status:doctype?'pass':'fail', weight:3, t:'HTML5 doctype', d: doctype?'HTML5 doctype declared.':'Missing or invalid doctype.'});

  // Click-to-call
  const telLinks=[...doc.querySelectorAll('a[href^="tel:"]')];
  const phone=(st.phone||'').replace(/\D/g,'').slice(-10);
  let matchedPhone = false;
  telLinks.forEach(a=>{const t=a.getAttribute('href').replace(/\D/g,'').slice(-10);if(phone && t===phone)matchedPhone=true;});
  checks.push({key:'tel_link', status: telLinks.length>0?(matchedPhone?'pass':st.phone?'warn':'pass'):'fail', weight:12, t:`Click-to-call links: ${telLinks.length}`, d: telLinks.length?(matchedPhone?'Phone matches your business number.':st.phone?'Tel links present but none match your business phone.':'Tel links present.'):'No <code>tel:</code> links found — biggest mobile conversion miss for local SEO.'});

  // Click-to-map
  const mapLinks=[...doc.querySelectorAll('a[href*="google.com/maps"],a[href*="maps.apple"],a[href*="goo.gl/maps"]')];
  checks.push({key:'map_link', status:mapLinks.length>0?'pass':'warn', weight:6, t:`Map links: ${mapLinks.length}`, d: mapLinks.length?'Click-to-directions present.':'Add a Google Maps link/embed — drives mobile direction clicks.'});

  // Email links
  const mailLinks=[...doc.querySelectorAll('a[href^="mailto:"]')];
  checks.push({key:'email_link', status:mailLinks.length>0?'pass':'info', weight:3, t:`Email links: ${mailLinks.length}`, d: mailLinks.length?'Mailto links present.':'Mobile users may expect to tap-to-email.'});

  // Font sizes (parse inline + style attrs)
  const sizeMatches = html.match(/font-size\s*:\s*(\d+)\s*px/gi)||[];
  const smallSizes = sizeMatches.filter(m=>{const n=parseInt(m.match(/(\d+)/)[1]);return n>0 && n<st.fontMin;}).length;
  checks.push({key:'font_size', status:smallSizes===0?'pass':smallSizes<=3?'warn':'fail', weight:8, t:`Small font sizes: ${smallSizes}`, d: smallSizes?`${smallSizes} CSS declarations use font-size below ${st.fontMin}px.`:`All inline font sizes ≥${st.fontMin}px.`});

  // Horizontal scroll risk
  const hasMaxWidth = /max-width\s*:\s*100%/i.test(html) || /max-width\s*:\s*100vw/i.test(html);
  checks.push({key:'no_hscroll', status:hasMaxWidth?'pass':'warn', weight:5, t:'Horizontal scroll prevention', d:hasMaxWidth?'CSS max-width:100% rules detected.':'Add <code>max-width:100%</code> to images/elements to prevent horizontal scroll.'});

  // Tap targets summary already done in auditTapTargets
  // AMP
  const isAmp = html.includes('⚡') || /<html[^>]*\samp(\s|>)/i.test(html);
  checks.push({key:'amp', status:'info', weight:0, t:isAmp?'AMP detected':'Not AMP', d:isAmp?'AMP simplifies mobile UX automatically.':'AMP is optional — most modern responsive sites don\'t need it.'});

  // PWA / manifest
  const hasManifest = !!doc.querySelector('link[rel="manifest"]');
  checks.push({key:'pwa', status:hasManifest?'pass':'info', weight:3, t:'PWA manifest', d:hasManifest?'PWA manifest linked.':'No manifest — PWA support optional but improves mobile experience.'});

  // Theme color
  const themeColor = doc.querySelector('meta[name="theme-color"]')?.content;
  checks.push({key:'theme_color', status:themeColor?'pass':'info', weight:2, t:'Theme color', d:themeColor?`<code>${escapeHtml(themeColor)}</code> — browser chrome will adopt this.`:'No theme-color meta — Chrome address bar uses default white.'});

  // Apple touch icon
  const appleIcon = doc.querySelector('link[rel="apple-touch-icon"]');
  checks.push({key:'apple_icon', status:appleIcon?'pass':'warn', weight:3, t:'Apple touch icon', d:appleIcon?'iOS home-screen icon set.':'Add <code>&lt;link rel="apple-touch-icon"&gt;</code> for clean iOS bookmarks.'});

  // Form input types
  const inputs = [...doc.querySelectorAll('input')];
  const typedInputs = inputs.filter(i=>i.type && i.type!=='text');
  const numTel = inputs.filter(i=>i.type==='tel' || i.inputMode==='numeric').length;
  const numEmail = inputs.filter(i=>i.type==='email').length;
  if(inputs.length){
    const good = (typedInputs.length/inputs.length)>=0.5;
    checks.push({key:'input_types', status:good?'pass':'warn', weight:5, t:`Input types: ${typedInputs.length}/${inputs.length} typed`, d:good?`Using semantic types (${numTel} tel, ${numEmail} email).`:'Use <code>type="tel"</code>, <code>type="email"</code> for mobile-friendly keyboards.'});
  }

  // Sticky CTA
  const stickyCss = /position\s*:\s*sticky/i.test(html) || /position\s*:\s*fixed/i.test(html);
  checks.push({key:'sticky_cta', status:stickyCss?'pass':'warn', weight:5, t:'Sticky CTA element', d:stickyCss?'Position sticky/fixed found — likely sticky CTA.':'No sticky element — consider a sticky "Call Now" button for mobile.'});

  // GBP local pack visibility (in title/h1)
  const localKw=/(near me|near you|in [A-Z]\w+)/.test(doc.querySelector('h1')?.textContent||'')||/(near me|near you|in [A-Z]\w+)/.test(doc.querySelector('title')?.textContent||'');
  checks.push({key:'local_intent', status:localKw?'pass':'warn', weight:5, t:'Local intent signals', d:localKw?'Title/H1 contains local keyword.':'Add city or "near me" intent signal to title/H1 — critical for mobile local pack ranking.'});

  // Lighthouse-style mobile rendering issues
  const jsHeavy = (html.match(/<script/gi)||[]).length;
  checks.push({key:'script_count', status:jsHeavy<=15?'pass':jsHeavy<=30?'warn':'fail', weight:4, t:`Script tags: ${jsHeavy}`, d:jsHeavy>30?'Heavy JS — likely slow on mobile networks. Consider code splitting.':jsHeavy>15?'Moderate JS load — review for mobile perf.':'Lean JS load.'});

  // Lazy load on images
  const imgs=[...doc.querySelectorAll('img')];
  const lazyImgs = imgs.filter(i=>i.loading==='lazy').length;
  checks.push({key:'lazy_imgs', status:imgs.length===0?'info':lazyImgs/imgs.length>=0.5?'pass':'warn', weight:4, t:`Lazy images: ${lazyImgs}/${imgs.length}`, d:lazyImgs/imgs.length>=0.5?'Good lazy-load coverage for mobile data savings.':'Add <code>loading="lazy"</code> to below-fold images.'});

  // Schema mobile-relevant
  const jsonLd=[...doc.querySelectorAll('script[type="application/ld+json"]')].map(s=>{try{return JSON.parse(s.textContent);}catch(e){return null;}}).filter(Boolean);
  const flat=jsonLd.flatMap(x=>Array.isArray(x)?x:(x['@graph']?x['@graph']:[x]));
  const hasLocalBiz=flat.some(x=>(x['@type']||'').toString().includes('LocalBusiness'));
  checks.push({key:'local_schema', status:hasLocalBiz?'pass':'warn', weight:7, t:'LocalBusiness schema', d:hasLocalBiz?'LocalBusiness schema found — surfaces in mobile rich results.':'Missing LocalBusiness schema — critical for mobile knowledge panels.'});

  // Open Graph image
  const ogImg = doc.querySelector('meta[property="og:image"]')?.content;
  checks.push({key:'og_image', status:ogImg?'pass':'warn', weight:3, t:'OG image set', d:ogImg?'Mobile share preview will display.':'Missing og:image — mobile share previews look bare.'});

  return checks;
}

function findTapTargets(doc){
  const selectors=['a[href]','button','input[type="button"]','input[type="submit"]','[role="button"]','[onclick]'];
  const els=[];
  selectors.forEach(s=>doc.querySelectorAll(s).forEach(el=>els.push(el)));
  // Dedupe
  const seen=new Set();
  return els.filter(el=>{if(seen.has(el))return false;seen.add(el);return true;}).map((el,idx)=>{
    const text=(el.textContent||el.value||el.getAttribute('aria-label')||el.getAttribute('title')||'').trim().slice(0,60);
    const href=el.getAttribute('href')||'';
    // Estimate size from inline style or CSS attribute
    const inlineStyle=el.getAttribute('style')||'';
    const widthMatch=inlineStyle.match(/(?:^|;)\s*width\s*:\s*(\d+)px/);
    const heightMatch=inlineStyle.match(/(?:^|;)\s*height\s*:\s*(\d+)px/);
    const paddingMatch=inlineStyle.match(/(?:^|;)\s*padding(?:\s*:\s*|\s*-\s*[a-z]+\s*:\s*)(\d+)px/);
    const estW=widthMatch?parseInt(widthMatch[1]):null;
    const estH=heightMatch?parseInt(heightMatch[1]):null;
    const padding=paddingMatch?parseInt(paddingMatch[1]):0;
    const tagName=el.tagName.toLowerCase();
    // Heuristic minimum
    const baseH = tagName==='button'||href.startsWith('tel:')?40:tagName==='a'?22:30;
    const estimated = estH || (baseH + padding*2);
    return {idx, tag:tagName, text, href, estW, estH, padding, estimated, isTel:href.startsWith('tel:'), isMail:href.startsWith('mailto:'), isMap:/maps\.google|maps\.apple|goo\.gl\/maps/.test(href)};
  }).slice(0, 80);
}

function auditTapTargets(targets, minSize){
  const failed=targets.filter(t=>t.estimated<minSize);
  const warned=targets.filter(t=>t.estimated>=minSize && t.estimated<minSize+8);
  const passed=targets.filter(t=>t.estimated>=minSize+8);
  return {total:targets.length, failed:failed.length, warned:warned.length, passed:passed.length, failedItems:failed, allItems:targets};
}

function aggregateScore(checks, tapAudit){
  let totalW=0, earnedW=0;
  checks.forEach(c=>{
    if(c.status==='info')return;
    totalW+=c.weight;
    if(c.status==='pass')earnedW+=c.weight;
    else if(c.status==='warn')earnedW+=c.weight*0.5;
  });
  const checkScore=totalW?Math.round(earnedW/totalW*100):0;
  const tapScore=tapAudit.total?Math.round(tapAudit.passed/tapAudit.total*100):75;
  const combined=Math.round(checkScore*0.7+tapScore*0.3);
  const passed=checks.filter(c=>c.status==='pass').length;
  const warn=checks.filter(c=>c.status==='warn').length;
  const fail=checks.filter(c=>c.status==='fail').length;
  return {score:combined, checkScore, tapScore, passed, warn, fail, total:checks.length, taps:tapAudit};
}

function render(){
  const r=state.results;
  if(!r){
    document.getElementById('cbody').innerHTML=`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      <div class="et">Mobile UX Auditor</div>
      <div class="ed">Local SEO is mobile-first — 76% of "near me" searches result in a same-day visit. Audit your page for tap targets, click-to-call, click-to-directions, mobile schema, font sizes, viewport, and local mobile-specific factors that drive conversions.</div>
    </div>`;
    document.getElementById('stat-score').textContent='—';
    document.getElementById('stat-taps').textContent='0';
    document.getElementById('stat-call').textContent='—';
    return;
  }
  const a=r.audit;
  document.getElementById('stat-score').textContent=a.score+'/100';
  document.getElementById('stat-taps').textContent=a.taps.failed;
  const telCheck=r.checks.find(c=>c.key==='tel_link');
  document.getElementById('stat-call').textContent=telCheck?.status==='pass'?'✓':telCheck?.status==='warn'?'!':'✗';
  if(state.view==='overview') return renderOverview();
  if(state.view==='checks') return renderChecks();
  if(state.view==='taps') return renderTaps();
  if(state.view==='preview') return renderPreview();
  if(state.view==='guide') return renderGuide();
}

function renderTaps(){
  const r=state.results;
  const items=r.tapAudit.allItems.slice().sort((a,b)=>a.estimated-b.estimated);
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Tap Targets (${items.length})</h3><span class="badge">${r.tapAudit.failed} fails · min ${state.tapMin}px</span></div><div>
    ${items.map(t=>{
      const cls=t.estimated<state.tapMin?'bad':t.estimated<state.tapMin+8?'warn':'good';
      const icon=t.isTel?'📞':t.isMail?'✉':t.isMap?'📍':t.tag==='button'?'🔘':'🔗';
      return `<div class="tap-target"><div class="sz ${cls}">${t.estimated}px</div><div class="info"><div class="l">${icon} ${escapeHtml(t.text||t.href||'(no text)')}</div><div class="e">&lt;${escapeHtml(t.tag)}&gt;${t.href?' href="'+escapeHtml(t.href.substring(0,60))+'"':''}</div></div><div class="meta">${t.padding?'pad '+t.padding+'px':''}</div></div>`;
    }).join('')||'<div style="padding:30px;text-align:center;color:var(--text3)">No tap targets found</div>'}
  </div></div>`;
}

      <li>Hamburger menu with hard-to-reach items</li>
      <li>Pop-ups blocking content on mobile (Google penalizes)</li>
      <li>Body text under 14px requiring zoom</li>
      <li>No schema.org LocalBusiness markup</li>
      <li>Address as image — not selectable/copyable</li>
    </ul>

    <h4 style="color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px">Core Web Vitals — Mobile Targets</h4>
    <ul style="padding-left:22px;margin-top:6px">
      <li><strong>LCP</strong> &lt; 2.5s (Largest Contentful Paint)</li>
      <li><strong>INP</strong> &lt; 200ms (Interaction to Next Paint)</li>
      <li><strong>CLS</strong> &lt; 0.1 (Cumulative Layout Shift)</li>
    </ul>
    <p style="margin-top:10px">Use the <a href="page-auditor.html" style="color:var(--accent)">Page Auditor</a> for full CWV measurement.</p>
  </div></div>`;
}

function exportCSV(){
  if(!state.results){toast('Nothing to export','err');return;}
  const r=state.results;
  const rows=[['type','key','status','weight','title','description']];
  r.checks.forEach(c=>rows.push(['check', c.key, c.status, c.weight, c.t, c.d.replace(/<[^>]+>/g,'')]));
  r.tapAudit.allItems.forEach(t=>rows.push(['tap_target', t.tag, t.estimated<state.tapMin?'fail':t.estimated<state.tapMin+8?'warn':'pass', t.estimated, t.text||t.href, '']));
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='mobile-ux-audit.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('CSV exported','success');
}
