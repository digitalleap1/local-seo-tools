<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Business Onboarding Wizard - 12-Step Guided Setup</title>
<meta name="description" content="Step-by-step guided onboarding for new local businesses. 12 phases from foundation to monitoring, with tool deep-links and progress tracking. Use for new businesses, multi-location launches, or audit kickoffs.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#2563eb; --accent-h:#1d4ed8; --accent-soft:rgba(37,99,235,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed; --green:#16a34a; --orange:#ea580c;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#3b82f6; --accent-h:#60a5fa; --accent-soft:rgba(59,130,246,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa; --green:#22c55e; --orange:#fb923c;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--purple);border:1px solid var(--purple);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.step strong{color:var(--accent);font-size:14px}
.hdr-stat.done strong{color:var(--success)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:280px;min-width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:8px}

.step-list{display:flex;flex-direction:column;gap:2px}
.step-item{padding:9px 11px;background:var(--bg2);border:1px solid transparent;border-radius:7px;cursor:pointer;transition:all .12s;display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;font-size:12px}
.step-item:hover{background:var(--bg)}
.step-item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.step-item.done{opacity:.7}
.step-item .num{width:22px;height:22px;border-radius:6px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:11px;color:var(--text2)}
.step-item.active .num{background:var(--accent);color:#fff;border-color:var(--accent)}
.step-item.done .num{background:var(--success);color:#fff;border-color:var(--success)}
.step-item .title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-item.done .title{text-decoration:line-through}
.step-item .check{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--success)}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:10px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbody{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}

.welcome-banner{background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:var(--radius-lg);padding:36px 40px;color:#fff;margin-bottom:18px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.welcome-banner::before{content:'';position:absolute;top:-50px;right:-50px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);border-radius:50%}
.welcome-banner h1{font-size:30px;font-weight:900;line-height:1.1;letter-spacing:-.5px;margin-bottom:8px}
.welcome-banner p{font-size:14px;opacity:.92;line-height:1.6;max-width:680px;margin-bottom:18px}
.welcome-banner .progress-meter{height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-top:14px}
.welcome-banner .progress-meter .bar{height:100%;background:#fff;transition:width .3s}
.welcome-banner .progress-label{font-size:12px;font-family:var(--mono);opacity:.85;margin-top:6px;font-weight:700}

.step-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:18px}
.step-header{padding:24px 32px;background:linear-gradient(135deg,var(--bg3),var(--bg2));border-bottom:1px solid var(--border)}
.step-header .label{font-size:11px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.step-header h2{font-size:26px;font-weight:900;letter-spacing:-.4px;margin-bottom:6px}
.step-header .sub{font-size:14px;color:var(--text2);line-height:1.5;max-width:720px}

.step-body{padding:28px 32px}

.task-list{display:flex;flex-direction:column;gap:11px;margin-bottom:24px}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:all .12s;align-items:start}
.task:hover{border-color:var(--accent)}
.task.done{opacity:.65;background:var(--bg3)}
.task .check{width:22px;height:22px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px;flex-shrink:0;margin-top:1px}
.task.done .check{background:var(--success);border-color:var(--success)}
.task .body .title{font-size:13.5px;font-weight:700;margin-bottom:2px}
.task.done .body .title{text-decoration:line-through;color:var(--text3)}
.task .body .desc{font-size:12px;color:var(--text2);line-height:1.55}
.task .body .desc code{background:var(--bg2);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:11px}
.task .tool{padding:5px 11px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:5px;text-decoration:none;white-space:nowrap;flex-shrink:0}
.task .tool:hover{background:var(--accent-h)}

.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
.nav-row button{padding:9px 18px;border-radius:7px;font-size:12.5px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px}
.nav-row button:hover{border-color:var(--accent);color:var(--accent)}
.nav-row button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.nav-row button.primary:hover{background:var(--accent-h)}
.nav-row button:disabled{opacity:.4;cursor:not-allowed}
.nav-row .center{font-size:11.5px;font-family:var(--mono);color:var(--text3);font-weight:700}

.tip-box{padding:14px 18px;background:rgba(245,158,11,.08);border-left:4px solid var(--warn);border-radius:6px;margin-bottom:18px;font-size:12.5px;line-height:1.6;color:var(--text2)}
.tip-box strong{color:var(--warn)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:280px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .step-header{padding:18px 22px}
  .step-body{padding:18px 22px}
  .welcome-banner{padding:24px 26px}
  .welcome-banner h1{font-size:22px}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
    <div><div class="logo-name">Onboarding<span>Wizard</span></div></div>
    <span class="logo-tag">12-STEP</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat step">Step: <strong id="stat-step">1</strong>/12</div>
  <div class="hdr-stat done">Done: <strong id="stat-done">0</strong></div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--accent)">Dashboard</a>
  <a href="local-checklist.html" class="hdr-link" style="border-color:rgba(22,163,74,.4);color:var(--success)">Checklist</a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">
  <div id="left">
    <div class="lh-bar"><h3>12-Step Plan</h3></div>
    <div id="left-body"><div class="step-list" id="step-list"></div></div>
    <div id="left-footer">
      <button class="btn-go" onclick="state.step=0;saveState();render();">Show Welcome</button>
      <div style="display:flex;gap:5px">
        <button class="btn-sub" onclick="exportProgress()">Export</button>
        <button class="btn-sub" onclick="resetAll()">Reset</button>
      </div>
    </div>
  </div>

  <div id="center">
    <div id="cbody"></div>
  </div>
</div>

<div id="footer">
  <div style="display:flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span id="ft-status">Step-by-step setup for new local businesses</span></div>
  <div class="ft-spacer"></div>
  <div>Built by <strong>Local SEO Tools</strong></div>
  <a class="ft-link" href="mailto:">Email</a>
</div>

<div id="toast"></div>

<script>
const STORE_KEY='ob_state_v1';

const STEPS=[
  {id:1, title:'Define Your Business', desc:'Set the foundation — name, category, address, contact details. Everything downstream depends on getting this right.',
   tasks:[
     {id:'t1', title:'Document exact business name', desc:'Pick the legal/branded version. Use this exact spelling EVERYWHERE.', tool:null},
     {id:'t2', title:'Choose primary GBP category', desc:'Most important single decision. Pick the single most accurate option.', tool:'gbp-audit.html'},
     {id:'t3', title:'Document NAP (Name, Address, Phone)', desc:'Format exactly as it appears on legal documents. Use this verbatim everywhere.', tool:'nap-checker.html'},
     {id:'t4', title:'Decide storefront vs service area', desc:'If you visit customers, hide address in GBP. If they come to you, show it.', tool:'service-area-mapper.html'},
     {id:'t5', title:'Identify target city/region', desc:'Primary market for local SEO targeting.', tool:null},
   ]},
  {id:2, title:'Set Up Google Business Profile', desc:'Your GBP listing is the single most important asset for local visibility. Get it perfect from day one.',
   tasks:[
     {id:'t1', title:'Claim & verify your GBP', desc:'Postcard, video call, or instant verification depending on category.', tool:'gbp-audit.html'},
     {id:'t2', title:'Complete every profile field', desc:'Hours, attributes, services list, products, description (750 chars).', tool:'gbp-audit.html'},
     {id:'t3', title:'Run GBP audit for completeness', desc:'150-point check to find gaps before they hurt rankings.', tool:'gbp-audit.html'},
     {id:'t4', title:'Plan GBP photo strategy', desc:'Upload 25+ photos across categories before launch.', tool:'gbp-photos.html'},
     {id:'t5', title:'Check suspension risk score', desc:'Make sure your setup doesn\'t trigger Google\'s automated filters.', tool:'suspension-risk.html'},
   ]},
  {id:3, title:'Build Citation Foundation', desc:'Citations are the local equivalent of backlinks. Get the top 20-30 done in the first month.',
   tasks:[
     {id:'t1', title:'Run Citation Finder', desc:'Scan existing presence across 100+ directories.', tool:'citation-finder.html'},
     {id:'t2', title:'Submit to data aggregators', desc:'Data Axle, Foursquare, Neustar propagate to 100s of sites.', tool:'aggregator-tracker.html'},
     {id:'t3', title:'Check NAP consistency', desc:'Find and fix any variation in name/address/phone across listings.', tool:'nap-checker.html'},
     {id:'t4', title:'Submit to niche directories', desc:'Industry-specific (Healthgrades, Avvo, Houzz, etc.). Often higher ROI than general.', tool:'niche-citations.html'},
     {id:'t5', title:'Track citation status', desc:'Use the tool to track submitted/live/pending state.', tool:'citation-finder.html'},
   ]},
  {id:4, title:'Keyword Research', desc:'Know what people search for to find businesses like yours. Foundation for all content + on-page work.',
   tasks:[
     {id:'t1', title:'Discover 30-50 local keywords', desc:'Mix of branded, service, location, and "near me" terms.', tool:'keyword-research.html'},
     {id:'t2', title:'Cluster keywords by topic', desc:'Group into themes — each cluster will get a dedicated page.', tool:'keyword-research.html'},
     {id:'t3', title:'Identify priority targets', desc:'Top 10 most valuable keywords to focus first 90 days on.', tool:'keyword-research.html'},
     {id:'t4', title:'Map keywords to pages', desc:'One primary keyword per page — avoid cannibalization.', tool:'keyword-mapper.html'},
     {id:'t5', title:'Analyze competitor gaps', desc:'Keywords competitors rank for that you don\'t.', tool:'competitor-gap.html'},
   ]},
  {id:5, title:'Website Foundation', desc:'Your site needs to be technically sound, mobile-fast, and schema-rich before content efforts pay off.',
   tasks:[
     {id:'t1', title:'Add LocalBusiness schema', desc:'JSON-LD on every page. Required for rich results.', tool:'schema-generator.html'},
     {id:'t2', title:'Validate schema markup', desc:'Test live pages with the schema auditor.', tool:'schema-auditor.html'},
     {id:'t3', title:'Run on-page audit', desc:'150+ checks for title, meta, headings, content depth.', tool:'page-auditor.html'},
     {id:'t4', title:'Mobile UX audit', desc:'Click-to-call, tap targets, mobile schema, viewport.', tool:'mobile-ux.html'},
     {id:'t5', title:'Set up robots.txt + sitemap', desc:'Submit sitemap to Google Search Console.', tool:'robots-sitemap.html'},
     {id:'t6', title:'Heading hierarchy check', desc:'H1-H6 structure for SEO + accessibility.', tool:'heading-audit.html'},
   ]},
  {id:6, title:'Create Core Content', desc:'Your homepage, service pages, and location pages do 80% of the SEO heavy lifting. Get these right first.',
   tasks:[
     {id:'t1', title:'Optimize homepage title + meta', desc:'Brand + primary keyword + city in title. CTA in meta.', tool:'snippet-optimizer.html'},
     {id:'t2', title:'Build service pages', desc:'One page per service. 1000+ words. Specific, not generic.', tool:'content-brief.html'},
     {id:'t3', title:'Build city/area pages (if multi-area)', desc:'Unique content per area, not just city name swapped.', tool:'multi-location.html'},
     {id:'t4', title:'Add FAQ sections', desc:'5-10 questions per page with FAQPage schema.', tool:'voice-faq.html'},
     {id:'t5', title:'Optimize images', desc:'Alt text, file names, sizes, lazy loading.', tool:'image-seo.html'},
     {id:'t6', title:'Plan content calendar', desc:'Weekly blog + GBP post cadence.', tool:'content-calendar.html'},
   ]},
  {id:7, title:'Internal Linking', desc:'How pages link to each other tells Google which are most important. Get this structure right early.',
   tasks:[
     {id:'t1', title:'Audit internal link graph', desc:'Find orphans (no inbound links), dead-ends, missed opportunities.', tool:'internal-links.html'},
     {id:'t2', title:'Link service pages to each other', desc:'Related services should link with descriptive anchors.', tool:'internal-links.html'},
     {id:'t3', title:'Link content to service pages', desc:'Blog posts should link to the relevant service page they support.', tool:'internal-links.html'},
   ]},
  {id:8, title:'Review Acquisition System', desc:'Reviews are critical for rankings AND conversion. Build a system before launch, not after.',
   tasks:[
     {id:'t1', title:'Create direct Google review link', desc:'place_id-based shortlink. Send to every customer.', tool:'review-reply.html'},
     {id:'t2', title:'Set up review request automation', desc:'Email/SMS automatically post-service.', tool:null},
     {id:'t3', title:'Plan reply cadence', desc:'Goal: reply to every review within 48 hours.', tool:'review-reply.html'},
     {id:'t4', title:'Monitor sentiment', desc:'Track topics + flag fake reviews.', tool:'sentiment-monitor.html'},
   ]},
  {id:9, title:'Link Building Strategy', desc:'Local backlinks (sponsorships, chamber, press) are slower but build long-term authority.',
   tasks:[
     {id:'t1', title:'Set up link outreach pipeline', desc:'Organize prospects by stage (research → ready → sent → won).', tool:'link-outreach.html'},
     {id:'t2', title:'Identify local sponsorship opportunities', desc:'Schools, charities, events, sports teams.', tool:null},
     {id:'t3', title:'Join Chamber of Commerce', desc:'$200-500/year. Member directory link + networking.', tool:null},
     {id:'t4', title:'Find unlinked brand mentions', desc:'Easy wins — sites already mentioning you, just need link added.', tool:'brand-mentions.html'},
   ]},
  {id:10, title:'AI Search Optimization', desc:'AI search engines (ChatGPT, Perplexity, Google AI Overviews) increasingly drive local discovery.',
   tasks:[
     {id:'t1', title:'Run GEO/AEO audit', desc:'Optimize content for AI citation.', tool:'geo-optimizer.html'},
     {id:'t2', title:'Allow AI crawlers in robots.txt', desc:'GPTBot, ClaudeBot, PerplexityBot, Google-Extended.', tool:'robots-sitemap.html'},
     {id:'t3', title:'Add llms.txt to site root', desc:'Curated overview for AI crawlers.', tool:'geo-optimizer.html'},
     {id:'t4', title:'Brand SERP audit', desc:'Optimize knowledge panel + sitelinks appearance.', tool:'brand-serp.html'},
   ]},
  {id:11, title:'Set Up Monitoring', desc:'You can\'t improve what you don\'t measure. Set up tracking before assuming things are working.',
   tasks:[
     {id:'t1', title:'Set up rank tracking', desc:'Top 10 keywords, weekly cadence.', tool:'pack-tracker.html'},
     {id:'t2', title:'Run baseline geo-grid', desc:'Visual map of where you rank by location.', tool:'geo-grid-tracker.html'},
     {id:'t3', title:'Import GBP Performance data', desc:'Track calls, directions, web clicks over time.', tool:'gbp-performance.html'},
     {id:'t4', title:'Capture first health snapshot', desc:'Baseline scores for trend tracking.', tool:'health-monitor.html'},
     {id:'t5', title:'Set up conversion tracking', desc:'GBP → site → lead → customer funnel.', tool:'conversion-paths.html'},
   ]},
  {id:12, title:'Plan Ongoing Cadence', desc:'Local SEO is a marathon, not a sprint. Set up sustainable recurring tasks.',
   tasks:[
     {id:'t1', title:'Walk through tactical checklist', desc:'100-point checklist of all recurring tasks.', tool:'local-checklist.html'},
     {id:'t2', title:'Schedule weekly cadence', desc:'GBP posts, review replies, blog publishing, rank check.', tool:'content-calendar.html'},
     {id:'t3', title:'Plan monthly review', desc:'Capture health snapshot, review GBP Insights, adjust strategy.', tool:'health-monitor.html'},
     {id:'t4', title:'Forecast ROI + plan budget', desc:'Project 90-day position + revenue gains.', tool:'forecast.html'},
     {id:'t5', title:'Generate strategy doc', desc:'AI-generated 12-phase plan with KPIs/RACI/budgets.', tool:'strategy-generator.html'},
     {id:'t6', title:'Send first client report', desc:'White-label report of where you started.', tool:'white-label-report.html'},
   ]},
];

const defaultState={step:0, done:{}};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}

function isTaskDone(stepId, taskId){return state.done[stepId+':'+taskId]===true;}
function toggleTask(stepId, taskId){const k=stepId+':'+taskId;state.done[k]=!state.done[k];saveState();render();}
function isStepComplete(step){return step.tasks.every(t=>isTaskDone(step.id, t.id));}
function getTotalDone(){return Object.values(state.done).filter(Boolean).length;}
function getTotalTasks(){return STEPS.reduce((s,st)=>s+st.tasks.length,0);}

function renderStepList(){
  document.getElementById('step-list').innerHTML=STEPS.map(s=>{
    const complete=isStepComplete(s);
    return `<div class="step-item ${state.step===s.id?'active':''} ${complete?'done':''}" onclick="goToStep(${s.id})">
      <div class="num">${s.id}</div>
      <div class="title">${escapeHtml(s.title)}</div>
      ${complete?'<div class="check">✓</div>':''}
    </div>`;
  }).join('');
}
function goToStep(n){state.step=n;saveState();render();window.scrollTo(0,0);}

function render(){
  renderStepList();
  const done=getTotalDone();
  const total=getTotalTasks();
  document.getElementById('stat-step').textContent=state.step;
  document.getElementById('stat-done').textContent=done;
  if(state.step===0) return renderWelcome(done, total);
  const step=STEPS.find(s=>s.id===state.step);
  if(!step) return renderWelcome(done, total);
  renderStep(step, done, total);
}

function renderWelcome(done, total){
  const pct=Math.round(done/total*100);
  document.getElementById('cbody').innerHTML=`
    <div class="welcome-banner">
      <h1>Welcome to Your Local SEO Setup</h1>
      <p>This 12-step wizard walks you through every phase of launching local SEO for a new business. Each step combines tactical tasks with direct links to the right tool in the suite. Work through them in order for new launches, or jump to a specific area to fill gaps for existing businesses.</p>
      <p style="font-size:13px;opacity:.85;margin-bottom:0">Your progress is saved automatically. You can come back anytime.</p>
      <div class="progress-meter"><div class="bar" style="width:${pct}%"></div></div>
      <div class="progress-label">${done} / ${total} tasks complete · ${pct}%</div>
    </div>
    <div class="step-card">
      <div class="step-header">
        <div class="label">12 PHASES</div>
        <h2>What You'll Cover</h2>
        <div class="sub">From foundation to monitoring, this wizard covers everything a local business needs to rank, convert, and sustain growth.</div>
      </div>
      <div class="step-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px">
          ${STEPS.map(s=>{const complete=isStepComplete(s);return `<div onclick="goToStep(${s.id})" style="padding:13px 15px;border:1px solid var(--border);border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .12s;${complete?'background:rgba(22,163,74,.05);border-color:rgba(22,163,74,.3)':''}" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='${complete?'rgba(22,163,74,.3)':'var(--border)'}'">
            <div style="width:32px;height:32px;border-radius:8px;background:${complete?'var(--success)':'var(--bg)'};color:${complete?'#fff':'var(--text2)'};display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:800;font-size:13px;border:1px solid ${complete?'var(--success)':'var(--border)'}">${complete?'✓':s.id}</div>
            <div style="min-width:0;flex:1"><div style="font-weight:700;font-size:12.5px">${escapeHtml(s.title)}</div></div>
          </div>`;}).join('')}
        </div>
        <div style="margin-top:24px;text-align:center">
          <button onclick="goToStep(1)" style="padding:11px 26px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:800;border:none;cursor:pointer">Start at Step 1 →</button>
        </div>
      </div>
    </div>
  `;
}

function renderStep(step, totalDone, totalTasks){
  const stepDone=step.tasks.filter(t=>isTaskDone(step.id, t.id)).length;
  const stepPct=Math.round(stepDone/step.tasks.length*100);
  const prevStep=STEPS.find(s=>s.id===step.id-1);
  const nextStep=STEPS.find(s=>s.id===step.id+1);
  document.getElementById('cbody').innerHTML=`
    <div class="step-card">
      <div class="step-header">
        <div class="label">STEP ${step.id} OF 12 · ${stepDone}/${step.tasks.length} TASKS</div>
        <h2>${escapeHtml(step.title)}</h2>
        <div class="sub">${escapeHtml(step.desc)}</div>
        <div style="margin-top:14px;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden"><div style="height:100%;background:var(--accent);width:${stepPct}%;transition:width .3s"></div></div>
      </div>
      <div class="step-body">
        <div class="tip-box"><strong>How to use this step:</strong> Click each task to mark it complete. Use the linked tool to actually perform the work. Move to the next step when you're satisfied with progress here (you can return anytime).</div>
        <div class="task-list">
          ${step.tasks.map(t=>{const done=isTaskDone(step.id, t.id);return `<div class="task ${done?'done':''}" onclick="toggleTask(${step.id},'${t.id}')">
            <div class="check">${done?'✓':''}</div>
            <div class="body"><div class="title">${escapeHtml(t.title)}</div><div class="desc">${escapeHtml(t.desc)}</div></div>
            ${t.tool?`<a class="tool" href="${escapeAttr(t.tool)}" onclick="event.stopPropagation()">Open Tool ↗</a>`:''}
          </div>`;}).join('')}
        </div>
        <div class="nav-row">
          <button ${prevStep?`onclick="goToStep(${prevStep.id})"`:'disabled'}>← Step ${prevStep?prevStep.id+': '+prevStep.title.split(' ').slice(0,2).join(' '):''}</button>
          <div class="center">Progress: ${totalDone}/${totalTasks} (${Math.round(totalDone/totalTasks*100)}%)</div>
          ${nextStep?`<button class="primary" onclick="goToStep(${nextStep.id})">Next: ${escapeHtml(nextStep.title)} →</button>`:'<button class="primary" onclick="goToStep(0)">🎉 Finish</button>'}
        </div>
      </div>
    </div>
  `;
}

function exportProgress(){
  const rows=[['step','step_title','task','description','done','tool']];
  STEPS.forEach(s=>{s.tasks.forEach(t=>{rows.push([s.id, s.title, t.title, t.desc, isTaskDone(s.id, t.id)?'yes':'no', t.tool||'']);});});
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='onboarding-progress.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('Progress exported','success');
}
function resetAll(){if(!confirm('Reset ALL progress?'))return;state={step:0, done:{}};saveState();render();toast('Reset','success');}

render();
window.addEventListener('beforeunload',saveState);
</script>
<script src="global-nav.js"></script>
</body>
</html>
