<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local SEO Checklist - 100-Point Tactical Action List</title>
<meta name="description" content="100-point interactive Local SEO checklist organized by category with progress tracking, weekly/monthly cadence tasks, priority levels, and direct links to the right tool in the suite for each item.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#16a34a; --accent-h:#15803d; --accent-soft:rgba(22,163,74,.08);
  --teal:#0d9488; --pink:#db2777; --blue:#2563eb; --purple:#7c3aed;
  --danger:#dc2626; --success:#16a34a; --warn:#f59e0b; --amber:#d97706;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#22c55e; --accent-h:#4ade80; --accent-soft:rgba(34,197,94,.14);
  --teal:#14b8a6; --pink:#ec4899; --blue:#3b82f6; --purple:#a78bfa;
  --danger:#ef4444; --success:#22c55e; --warn:#fbbf24; --amber:#f59e0b;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--teal));border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--teal);border:1px solid var(--teal);border-radius:4px;padding:1.5px 6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.done strong{color:var(--success);font-size:14px}
.hdr-stat.todo strong{color:var(--warn)}
.hdr-stat.crit strong{color:var(--danger)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none}
.hdr-link:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px}

#app{flex:1;display:flex;overflow:hidden}

#left{width:300px;min-width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3)}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
#left-body{flex:1;overflow-y:auto;padding:14px}

.cat-list{display:flex;flex-direction:column;gap:4px}
.cat-item{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .12s;font-size:12px}
.cat-item:hover{border-color:var(--accent);transform:translateX(2px)}
.cat-item.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.cat-item .icon{font-size:15px;flex-shrink:0}
.cat-item .name{flex:1}
.cat-item .count{font-family:var(--mono);font-size:10.5px;color:var(--text3);background:var(--bg);padding:2px 6px;border-radius:10px;border:1px solid var(--border);font-weight:700}
.cat-item.active .count{background:var(--bg2);color:var(--accent)}

.filter-row{display:flex;flex-direction:column;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}
.filter-row label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.filter-pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:10px;font-family:var(--mono);font-weight:700;padding:3px 9px;border-radius:11px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer;text-transform:uppercase;letter-spacing:.3px}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill:hover{border-color:var(--accent)}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px;cursor:pointer}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.progress-hero{background:linear-gradient(135deg,var(--accent),var(--teal));border-radius:var(--radius-lg);padding:22px 26px;color:#fff;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.progress-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 70%);border-radius:50%}
.progress-hero h2{font-size:24px;font-weight:900;margin-bottom:5px;letter-spacing:-.4px}
.progress-hero .sub{font-size:13px;opacity:.92;line-height:1.5}
.progress-hero .ring{width:90px;height:90px;position:relative}
.progress-hero .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.progress-hero .ring .bg{stroke:rgba(255,255,255,.18);stroke-width:8;fill:none}
.progress-hero .ring .fg{stroke:#fff;stroke-width:8;fill:none;stroke-linecap:round;transition:stroke-dashoffset .8s}
.progress-hero .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;font-family:var(--mono)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.s::before{background:var(--success)}.kpi.w::before{background:var(--warn)}.kpi.d::before{background:var(--danger)}
.kpi .l{font-size:9.5px;font-family:var(--mono);color:var(--text2);font-weight:800;text-transform:uppercase}
.kpi .v{font-size:24px;font-weight:900;font-family:var(--mono);color:var(--text);line-height:1.05}
.kpi.s .v{color:var(--success)}.kpi.w .v{color:var(--warn)}.kpi.d .v{color:var(--danger)}
.kpi .s{font-size:10.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}

.cat-progress{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:7px}
.cat-progress .bar{height:100%;background:var(--accent);transition:width .3s}

.checklist{display:flex;flex-direction:column}
.check-item{padding:11px 14px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:24px 1fr auto;gap:11px;align-items:start;transition:background .12s;cursor:pointer}
.check-item:hover{background:var(--bg)}
.check-item:last-child{border-bottom:none}
.check-item.done{opacity:.6}
.check-item .checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:13px;flex-shrink:0;margin-top:1px;transition:all .15s}
.check-item .checkbox.done{background:var(--success);border-color:var(--success)}
.check-item .body .title{font-size:12.5px;font-weight:700;line-height:1.4}
.check-item.done .body .title{text-decoration:line-through;color:var(--text3)}
.check-item .body .desc{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:3px}
.check-item .body .flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.check-item .body .flag{font-size:9.5px;font-weight:700;font-family:var(--mono);padding:2px 7px;border-radius:3px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);text-transform:uppercase;letter-spacing:.3px}
.check-item .body .flag.critical{background:rgba(220,38,38,.13);color:var(--danger);border-color:rgba(220,38,38,.3)}
.check-item .body .flag.high{background:rgba(245,158,11,.13);color:var(--amber);border-color:rgba(245,158,11,.3)}
.check-item .body .flag.medium{background:rgba(37,99,235,.13);color:var(--blue);border-color:rgba(37,99,235,.3)}
.check-item .body .flag.low{background:rgba(124,134,160,.13);color:var(--text3);border-color:var(--border)}
.check-item .body .flag.cadence{background:rgba(124,58,237,.13);color:var(--purple);border-color:rgba(124,58,237,.3)}
.check-item .actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.check-item .actions a{padding:4px 9px;border-radius:5px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;text-decoration:none;white-space:nowrap}
.check-item .actions a:hover{background:var(--accent-h)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5500;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:300px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
  .progress-hero{grid-template-columns:1fr}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">

<div id="app">

<script>
const STORE_KEY='lc_state_v1';

const CATEGORIES=[
  {id:'foundation', name:'Foundation', icon:'🏗'},
  {id:'gbp',        name:'GBP Profile', icon:'🏷'},
  {id:'citations',  name:'Citations & NAP', icon:'📍'},
  {id:'reviews',    name:'Reviews', icon:'⭐'},
  {id:'onsite',     name:'On-Site SEO', icon:'📄'},
  {id:'content',    name:'Content', icon:'✍️'},
  {id:'technical',  name:'Technical', icon:'⚙️'},
  {id:'links',      name:'Links', icon:'🔗'},
  {id:'monitoring', name:'Monitoring', icon:'📊'},
  {id:'ai',         name:'AI Search', icon:'🤖'},
];

const ITEMS=[
  // FOUNDATION (10)
  {id:'f1', cat:'foundation', prio:'critical', cadence:'once', title:'Define your business category', desc:'Pick the single most accurate primary category. This determines everything downstream.', link:'gbp-audit.html'},
  {id:'f2', cat:'foundation', prio:'critical', cadence:'once', title:'Document NAP (Name, Address, Phone)', desc:'Exact spellings, abbreviations, formatting. Use everywhere identically.', link:'nap-checker.html'},
  {id:'f3', cat:'foundation', prio:'critical', cadence:'once', title:'Decide on service area vs storefront', desc:'Hide address if service-area only. Set service areas in GBP.', link:'service-area-mapper.html'},
  {id:'f4', cat:'foundation', prio:'high', cadence:'once', title:'Build keyword research foundation', desc:'Discover 20-50 target keywords with local intent.', link:'keyword-research.html'},
  {id:'f5', cat:'foundation', prio:'high', cadence:'once', title:'Identify your top 5 competitors', desc:'Real competitors in the local pack, not just industry leaders.', link:'competitor-gap.html'},
  {id:'f6', cat:'foundation', prio:'high', cadence:'once', title:'Set up Google Search Console', desc:'Verify domain + submit sitemap.', link:'robots-sitemap.html'},
  {id:'f7', cat:'foundation', prio:'high', cadence:'once', title:'Set up Google Analytics 4', desc:'Track conversions: calls, form fills, direction clicks.'},

const defaultState={
  status:{}, // id -> 'done' | 'todo'
  prio:'all',
  statusFilter:'all',
  cadenceFilter:'all',
  activeCat:'all',
  view:'overview',
  lastReset:'2026-05-29'
};
let state=loadState();
function loadState(){try{return Object.assign(clone(defaultState),JSON.parse(localStorage.getItem(STORE_KEY))||{});}catch(e){return clone(defaultState);}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o));}

function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('seohub_theme_v1',n);document.getElementById('theme-label').textContent=n==='dark'?'Dark':'Light';}
document.getElementById('theme-label').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'Dark':'Light';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(m,t){const x=document.getElementById('toast');x.className='';x.classList.add('show');if(t)x.classList.add(t);x.innerHTML='<span>'+escapeHtml(m)+'</span>';setTimeout(()=>x.classList.remove('show'),2500);}

function renderCatList(){
  const list=document.getElementById('cat-list');
  const total=ITEMS.length;
  const allDone=Object.values(state.status).filter(s=>s==='done').length;
  list.innerHTML=`<div class="cat-item ${state.activeCat==='all'?'active':''}" onclick="setCat('all')"><span class="icon">📋</span><span class="name">All Items</span><span class="count">${allDone}/${total}</span></div>` +
    CATEGORIES.map(c=>{
      const items=ITEMS.filter(i=>i.cat===c.id);
      const done=items.filter(i=>state.status[i.id]==='done').length;
      return `<div class="cat-item ${state.activeCat===c.id?'active':''}" onclick="setCat('${c.id}')"><span class="icon">${c.icon}</span><span class="name">${escapeHtml(c.name)}</span><span class="count">${done}/${items.length}</span></div>`;
    }).join('');
}
function setCat(c){state.activeCat=c;saveState();renderCatList();render();}
function setPrio(p){state.prio=p;saveState();document.querySelectorAll('#prio-pills .pill').forEach(el=>el.classList.toggle('active',el.dataset.p===p));render();}
function setStatus(s){state.statusFilter=s;saveState();document.querySelectorAll('#status-pills .pill').forEach(el=>el.classList.toggle('active',el.dataset.s===s));render();}
function setCadence(c){state.cadenceFilter=c;saveState();document.querySelectorAll('#cad-pills .pill').forEach(el=>el.classList.toggle('active',el.dataset.c===c));render();}

function getFilteredItems(){
  return ITEMS.filter(i=>{
    if(state.activeCat!=='all' && i.cat!==state.activeCat) return false;
    if(state.prio!=='all' && i.prio!==state.prio) return false;
    if(state.statusFilter==='done' && state.status[i.id]!=='done') return false;
    if(state.statusFilter==='todo' && state.status[i.id]==='done') return false;
    if(state.cadenceFilter!=='all' && i.cadence!==state.cadenceFilter) return false;
    return true;
  });
}

function toggleItem(id){
  state.status[id]=state.status[id]==='done'?'todo':'done';
  saveState();
  render();
  renderCatList();
}

function setTab(t){state.view=t;saveState();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();}

function render(){
  const all=ITEMS;
  const done=all.filter(i=>state.status[i.id]==='done').length;
  const todo=all.length-done;
  const crit=all.filter(i=>i.prio==='critical' && state.status[i.id]!=='done').length;
  document.getElementById('stat-done').textContent=done;
  document.getElementById('stat-todo').textContent=todo;
  document.getElementById('stat-crit').textContent=crit;
  if(state.view==='overview') return renderOverview(done, todo, crit);
  if(state.view==='checklist') return renderChecklist();
  if(state.view==='quick') return renderQuick();
  if(state.view==='recurring') return renderRecurring();
}

function renderOverview(done, todo, crit){
  const pct=Math.round(done/ITEMS.length*100);
  const dash=2*Math.PI*40;
  const off=dash*(1-pct/100);
  const critItems=ITEMS.filter(i=>i.prio==='critical' && state.status[i.id]!=='done').slice(0,6);
  const catStats=CATEGORIES.map(c=>{const items=ITEMS.filter(i=>i.cat===c.id);const d=items.filter(i=>state.status[i.id]==='done').length;return {...c, done:d, total:items.length, pct:items.length?Math.round(d/items.length*100):0};});
  document.getElementById('cbody').innerHTML=`
    <div class="progress-hero">
      <div>
        <h2>${done}/${ITEMS.length} items complete</h2>
        <div class="sub">${pct>=80?'🎉 You\'re crushing it. Local SEO is a marathon — keep up the cadence on recurring items.':pct>=50?'Solid progress. Focus on critical priority items to maximize impact.':pct>=20?'You\'re on the way. Tackle critical items first, then work through priority order.':'Just getting started. Begin with the Foundation category to build a strong base.'}</div>
      </div>
      <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" class="bg"/><circle cx="50" cy="50" r="40" class="fg" style="stroke-dasharray:${dash};stroke-dashoffset:${off}"/></svg><div class="pct">${pct}%</div></div>
    </div>
    <div class="kpi-grid">
      <div class="kpi s"><div class="l">Completed</div><div class="v">${done}</div><div class="s">items checked off</div></div>
      <div class="kpi w"><div class="l">Remaining</div><div class="v">${todo}</div><div class="s">in queue</div></div>
      <div class="kpi d"><div class="l">Critical Open</div><div class="v">${crit}</div><div class="s">do first</div></div>
      <div class="kpi"><div class="l">Categories</div><div class="v">${CATEGORIES.length}</div><div class="s">${catStats.filter(c=>c.pct===100).length} complete</div></div>
    </div>
    <div class="section"><div class="section-hdr"><h3>Progress by Category</h3></div><div style="padding:14px;display:flex;flex-direction:column;gap:9px">
      ${catStats.map(c=>`<div><div style="display:flex;align-items:center;gap:9px;margin-bottom:4px"><span style="font-size:14px">${c.icon}</span><span style="font-size:12.5px;font-weight:700;flex:1">${escapeHtml(c.name)}</span><span style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text2)">${c.done}/${c.total}</span></div><div class="cat-progress"><div class="bar" style="width:${c.pct}%"></div></div></div>`).join('')}
    </div></div>
    ${critItems.length?`<div class="section"><div class="section-hdr"><h3>🚨 Critical Items Still Open</h3><span class="badge">${crit}</span><button class="cb-btn" onclick="setTab('checklist');setPrio('critical');setStatus('todo')">See all →</button></div><div class="checklist">${critItems.map(renderCheckItem).join('')}</div></div>`:''}
  `;
}

function renderCheckItem(item){
  const isDone=state.status[item.id]==='done';
  const cat=CATEGORIES.find(c=>c.id===item.cat);
  return `<div class="check-item ${isDone?'done':''}" onclick="toggleItem('${item.id}')">
    <div class="checkbox ${isDone?'done':''}">${isDone?'✓':''}</div>
    <div class="body">
      <div class="title">${escapeHtml(item.title)}</div>
      <div class="desc">${escapeHtml(item.desc)}</div>
      <div class="flags">
        <span class="flag ${item.prio}">${item.prio}</span>
        <span class="flag cadence">${item.cadence}</span>
        ${cat?`<span class="flag">${cat.icon} ${escapeHtml(cat.name)}</span>`:''}
      </div>
    </div>
    <div class="actions">
      ${item.link?`<a href="${escapeAttr(item.link)}" onclick="event.stopPropagation()">Open Tool ↗</a>`:''}
    </div>
  </div>`;
}

function renderChecklist(){
  const items=getFilteredItems();
  document.getElementById('cbody').innerHTML=`<div class="section"><div class="section-hdr"><h3>Checklist</h3><span class="badge">${items.length} shown</span></div><div class="checklist">
    ${items.length?items.map(renderCheckItem).join(''):'<div style="padding:40px;text-align:center;color:var(--text3)">No items match filters</div>'}
  </div></div>`;
}

function renderQuick(){
  // Quick wins = high impact, low effort (critical + medium-low cadence)
  const quickWins=ITEMS.filter(i=>state.status[i.id]!=='done' && (i.prio==='critical'||i.prio==='high') && i.cadence==='once');
  const order={critical:0,high:1,medium:2,low:3};
  quickWins.sort((a,b)=>order[a.prio]-order[b.prio]);
  document.getElementById('cbody').innerHTML=`
    <div style="margin-bottom:14px;font-size:12.5px;color:var(--text2);background:var(--bg2);padding:11px 14px;border-radius:8px;border-left:3px solid var(--accent);line-height:1.55">Quick wins are high-impact one-time tasks you haven\'t completed yet. Do these first for biggest ROI.</div>
    <div class="section"><div class="section-hdr"><h3>Quick Wins</h3><span class="badge">${quickWins.length} pending</span></div><div class="checklist">
      ${quickWins.length?quickWins.map(renderCheckItem).join(''):'<div style="padding:30px;text-align:center;color:var(--success);font-weight:700">🎉 All critical + high one-time tasks complete!</div>'}
    </div></div>
  `;
}

function renderRecurring(){
  // Recurring tasks grouped by cadence
  const groups={weekly:[],monthly:[],quarterly:[]};
  ITEMS.forEach(i=>{if(groups[i.cadence])groups[i.cadence].push(i);});
  document.getElementById('cbody').innerHTML=`
    <div style="margin-bottom:14px;font-size:12.5px;color:var(--text2);background:var(--bg2);padding:11px 14px;border-radius:8px;border-left:3px solid var(--accent);line-height:1.55">Recurring tasks — checkboxes track current cycle. Click <strong>↻ Reset Recurring</strong> in left panel each cycle (or set a calendar reminder).</div>
    ${Object.entries(groups).map(([cad, items])=>`<div class="section"><div class="section-hdr"><h3>${cad.charAt(0).toUpperCase()+cad.slice(1)} Tasks</h3><span class="badge">${items.length}</span></div><div class="checklist">${items.map(renderCheckItem).join('')}</div></div>`).join('')}
  `;
}

function resetCadence(){
  if(!confirm('Reset all weekly/monthly/quarterly recurring items to "to-do"?'))return;
  ITEMS.filter(i=>i.cadence!=='once').forEach(i=>{delete state.status[i.id];});
  state.lastReset='2026-05-29';
  saveState();render();renderCatList();
  toast('Reset recurring items','success');
}

function clearAll(){if(!confirm('Clear ALL checkmarks?'))return;state.status={};saveState();render();renderCatList();toast('Cleared','success');}

function exportCSV(){
  const rows=[['id','category','priority','cadence','title','description','status','tool_link']];
  ITEMS.forEach(i=>{const cat=CATEGORIES.find(c=>c.id===i.cat);rows.push([i.id, cat?.name||i.cat, i.prio, i.cadence, i.title, i.desc, state.status[i.id]||'todo', i.link||'']);});
  const blob=new Blob([rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='local-seo-checklist.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},100);toast('CSV exported','success');
}

renderCatList();
render();
window.addEventListener('beforeunload',saveState);
</script>
<script src="global-nav.js"></script>
</body>
</html>
