<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Brief Generator - SERP-Driven Briefs for Local SEO Content</title>
<meta name="description" content="Enter target keyword + city → fetch top 10 SERP results → analyze each page (word count, H2s, FAQs, structure) → output strategic content brief with target word count, recommended sections, FAQ ideas, internal-link plan. AI-enhanced. 100% client-side.">

<script>
(function(){
  const saved = localStorage.getItem('seohub_theme_v1');
  const d = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', d);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f3f6fb; --bg2:#ffffff; --bg3:#e9eef7; --bg4:#dde4f0;
  --border:#d1d9e8; --border2:#c2cde0;
  --accent:#0d9488; --accent-h:#0f766e; --accent-soft:rgba(13,148,136,.08);
  --teal:#0d9488;
  --amber:#d97706;
  --danger:#dc2626; --success:#16a34a;
  --purple:#7c3aed; --pink:#db2777; --blue:#2563eb;
  --text:#0f1a2e; --text2:#5b6b88; --text3:#8a9ab5;
  --shadow-sm:0 1px 3px rgba(15,26,46,.07);
  --shadow-md:0 4px 14px rgba(15,26,46,.09);
  --shadow-lg:0 10px 30px rgba(15,26,46,.14);
  --radius:8px; --radius-lg:12px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --code-bg:#0c1828;
}
[data-theme="dark"]{
  --bg:#06101f; --bg2:#0c1828; --bg3:#142236; --bg4:#1c2e45;
  --border:#1e2d44; --border2:#2a3b56;
  --accent:#14b8a6; --accent-h:#2dd4bf; --accent-soft:rgba(20,184,166,.14);
  --teal:#14b8a6;
  --amber:#f59e0b;
  --danger:#ef4444; --success:#22c55e;
  --purple:#a78bfa; --pink:#ec4899; --blue:#3b82f6;
  --text:#e2ecf8; --text2:#7e95b8; --text3:#506a8c;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);
  --shadow-lg:0 10px 30px rgba(0,0,0,.6);
  --code-bg:#040b18;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--mono);outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

#header{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--shadow-sm);z-index:200}
.logo-wrap{display:flex;align-items:center;gap:9px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--blue));border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(13,148,136,.3)}
.logo-icon svg{width:18px;height:18px;color:#fff}
.logo-name{font-size:16px;font-weight:800;letter-spacing:-.4px}
.logo-name span{color:var(--accent)}
.logo-tag{font-size:9.5px;font-family:var(--mono);font-weight:700;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:1.5px 6px;letter-spacing:.6px}
.hdr-sep{width:1px;height:24px;background:var(--border)}
.hdr-stat{font-size:11.5px;color:var(--text2);display:flex;align-items:center;gap:5px}
.hdr-stat strong{color:var(--text);font-size:13px;font-family:var(--mono);font-weight:700;min-width:18px;text-align:center}
.hdr-stat.kw strong{color:var(--accent)}
.hdr-stat.serp strong{color:var(--blue)}
.hdr-stat.target strong{color:var(--purple)}
.hdr-spacer{flex:1}
.hdr-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--bg3);color:var(--text);font-size:11.5px;font-weight:600;text-decoration:none;transition:all .15s}
.hdr-link:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hdr-link svg{width:13px;height:13px}
.theme-toggle{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--border);border-radius:20px;background:var(--bg3);color:var(--text2);font-size:11.5px;font-weight:600}
.theme-toggle svg{width:14px;height:14px;transition:transform .4s}
[data-theme="dark"] .theme-toggle svg{transform:rotate(40deg)}

#app{flex:1;display:flex;overflow:hidden}

/* LEFT */
#left{width:320px;min-width:300px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.lh-bar{padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:6px}
.lh-bar h3{font-size:11px;font-weight:700;color:var(--text2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;flex:1}

#left-body{flex:1;overflow-y:auto;padding:14px}

.fsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden}
.fsec-hdr{padding:9px 13px;background:var(--bg2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.fsec-hdr h4{font-size:11px;font-weight:700;flex:1}
.fsec-hdr .toggle{font-family:var(--mono);font-size:13px;color:var(--text3);transition:transform .2s}
.fsec.collapsed .toggle{transform:rotate(-90deg)}
.fsec.collapsed .fsec-body{display:none}
.fsec-body{padding:11px 13px;display:flex;flex-direction:column;gap:8px}

.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.f input,.f select,.f textarea{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;color:var(--text)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.f .hint{font-size:10px;color:var(--text3);font-family:var(--mono);line-height:1.5}
.f .hint a{color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.pp-row{display:flex;flex-wrap:wrap;gap:4px}
.pp{padding:5px 9px;border-radius:5px;font-size:10px;font-family:var(--mono);font-weight:700;background:var(--bg2);border:1px solid var(--border);color:var(--text2);cursor:pointer}
.pp:hover{border-color:var(--accent);color:var(--accent)}
.pp.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pp .free{font-size:9px;background:rgba(255,255,255,.25);padding:1px 4px;border-radius:3px;margin-left:4px}
.pp:not(.active) .free{background:rgba(22,163,74,.13);color:var(--success)}

#left-footer{padding:11px 14px;border-top:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:6px}
.btn-go{padding:11px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;border:none;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-go:hover{background:var(--accent-h)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}
.btn-sub{padding:7px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-sub:hover{border-color:var(--accent);color:var(--accent)}

/* CENTER */
#center{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#cbar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.tab{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab svg{width:13px;height:13px}
.tab .count{font-family:var(--mono);background:rgba(255,255,255,.25);border-radius:3px;padding:0 5px;font-size:10px}
.tab:not(.active) .count{background:var(--bg);color:var(--text2)}
.cb-sp{flex:1}
.cb-btn{padding:6px 11px;border-radius:6px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;gap:5px}
.cb-btn:hover{border-color:var(--accent);color:var(--accent)}
.cb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.cb-btn svg{width:13px;height:13px}

#cbody{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}

.section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.section-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3)}
.section-hdr h3{font-size:12.5px;font-weight:700;flex:1}
.section-hdr .badge{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:4px;background:var(--bg);color:var(--text2);border:1px solid var(--border)}
.section-body{padding:14px}

/* COMPETITOR CARD */
.comp-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px}
.comp-card .ch{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.comp-card .cnum{width:24px;height:24px;border-radius:5px;background:var(--bg3);color:var(--text2);font-family:var(--mono);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comp-card .cnum.top3{background:var(--success);color:#fff}
.comp-card .cinfo{flex:1;min-width:0}
.comp-card .ctitle{font-size:13px;font-weight:700;color:var(--blue);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.comp-card .ctitle a{color:inherit;text-decoration:none}
.comp-card .curl{font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp-card .cstatus{font-size:10px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.4px}
.comp-card .cstatus.pending{background:var(--bg3);color:var(--text3)}
.comp-card .cstatus.fetching{background:var(--amber);color:#fff;animation:pulse 1s infinite}
.comp-card .cstatus.done{background:rgba(22,163,74,.13);color:var(--success)}
.comp-card .cstatus.err{background:rgba(220,38,38,.13);color:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.comp-card .cmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text2);font-family:var(--mono);margin-top:6px}
.comp-card .cmeta strong{color:var(--text)}

/* BRIEF OUTPUT */
.brief-output{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 18px;line-height:1.65;font-size:13px;color:var(--text)}
.brief-output h1{font-size:20px;font-weight:800;margin:18px 0 8px;line-height:1.3}
.brief-output h2{font-size:16px;font-weight:700;margin:22px 0 8px;color:var(--accent);line-height:1.3}
.brief-output h3{font-size:14px;font-weight:700;margin:18px 0 6px}
.brief-output p{margin:8px 0}
.brief-output ul,.brief-output ol{margin:8px 0;padding-left:22px}
.brief-output li{margin-bottom:4px}
.brief-output code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:11.5px}
.brief-output strong{font-weight:700}
.brief-output blockquote{border-left:3px solid var(--accent);padding-left:14px;margin:10px 0;color:var(--text2);font-style:italic}
.brief-output table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.brief-output th{background:var(--bg3);padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
.brief-output td{padding:7px 10px;border-bottom:1px solid var(--border)}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;box-shadow:var(--shadow-sm)}
.stat-card .sl{font-size:10px;font-family:var(--mono);font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.stat-card .sv{font-size:24px;font-weight:800;font-family:var(--mono);line-height:1.1;color:var(--text);margin-top:4px}
.stat-card .ss{font-size:10.5px;color:var(--text3);margin-top:3px;font-family:var(--mono)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);gap:14px;padding:40px}
.empty svg{width:64px;height:64px;opacity:.24}
.empty .et{font-size:18px;font-weight:700;color:var(--text)}
.empty .ed{font-size:13px;line-height:1.6;max-width:580px}

.progress-line{height:3px;background:var(--bg3);overflow:hidden;flex-shrink:0}
.progress-line .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue));width:0;transition:width .3s}

#footer{height:32px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;font-size:11px;color:var(--text2)}
.ft-item{display:flex;align-items:center;gap:5px}
.ft-item svg{width:12px;height:12px}
.ft-spacer{flex:1}
.ft-link{color:var(--accent);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px}

#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text);z-index:5000;transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.success{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
#toast.info{border-color:var(--accent);color:var(--accent)}

@media (max-width:920px){
  #left{position:absolute;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s;width:85%;max-width:320px;box-shadow:var(--shadow-lg)}
  #left.open{transform:translateX(0)}
  .mobile-toggle{display:flex !important}
}
.mobile-toggle{display:none;padding:6px 10px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:11px;font-weight:700;align-items:center;gap:5px}
</style>
</head>
<body>

<div id="header">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    </div>
    <div><div class="logo-name">Content<span>Brief</span></div></div>
    <span class="logo-tag">SERP</span>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-stat kw">"<strong id="stat-kw">—</strong>"</div>
  <div class="hdr-stat serp"><strong id="stat-serp">0</strong>/10 analyzed</div>
  <div class="hdr-stat target"><strong id="stat-target">—</strong> target words</div>
  <button class="mobile-toggle" onclick="document.getElementById('left').classList.toggle('open')">Menu</button>
  <div class="hdr-spacer"></div>
  <a href="dashboard.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    Dashboard
  </a>
  <a href="ai-content-writer.html" class="hdr-link" style="border-color:rgba(109,40,217,.4);color:#6d28d9">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19l7-7 3 3-7 7-3-3z"/></svg>
    Writer
  </a>
  <a href="keyword-research.html" class="hdr-link" style="border-color:rgba(8,145,178,.4);color:#0891b2">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="7" x2="11" y2="15"/><line x1="7" y1="11" x2="15" y2="11"/></svg>
    Keywords
  </a>
  <a href="ai-assistant.html" class="hdr-link" style="border-color:rgba(37,99,235,.4);color:var(--blue)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>
    AI
  </a>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <span id="theme-label">Light</span>
  </button>
</div>

<div id="app">

  <!-- LEFT -->
  <div id="left">
    <div class="lh-bar"><h3>Brief Inputs</h3></div>
    <div id="left-body">
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>Target Keyword</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="f"><label>Primary keyword *</label><input id="i-kw" placeholder="emergency plumber boston" oninput="saveInputs()"></div>
          <div class="row2">
            <div class="f"><label>City</label><input id="i-city" placeholder="Boston" oninput="saveInputs()"></div>
            <div class="f"><label>Country</label><select id="i-country" onchange="saveInputs()">
              <option value="us">US</option><option value="ca">CA</option><option value="uk">UK</option><option value="au">AU</option><option value="in">IN</option>
            </select></div>
          </div>
          <div class="f"><label>Search intent</label><select id="i-intent" onchange="saveInputs()">
            <option value="local">Local (near me, in city)</option>
            <option value="commercial">Commercial (best, compare, reviews)</option>
            <option value="transactional">Transactional (buy, book, hire)</option>
            <option value="informational">Informational (how, what, why)</option>
          </select></div>
          <div class="f"><label>Page type</label><select id="i-pagetype" onchange="saveInputs()">
            <option value="service">Service page</option>
            <option value="location">Location/store page</option>
            <option value="blog">Blog post</option>
            <option value="comparison">Comparison/listicle</option>
            <option value="faq">FAQ / guide</option>
          </select></div>
        </div>
      </div>
      <div class="fsec">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>SERP Provider</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="pp-row" id="prov-pills"></div>
          <div id="prov-cfg"></div>
          <div class="f"><label>CORS proxy (for fetching competitor pages)</label><select id="i-proxy" onchange="saveInputs()">
            <option value="allorigins">AllOrigins (no key)</option>
            <option value="corsproxy">CorsProxy.io</option>
            <option value="codetabs">Codetabs</option>
          </select></div>
        </div>
      </div>
      <div class="fsec collapsed">
        <div class="fsec-hdr" onclick="toggleSec(this)"><h4>AI Enhancement (optional)</h4><span class="toggle">▼</span></div>
        <div class="fsec-body">
          <div class="pp-row" id="ai-pills"></div>

<script>
/* ==========================================================================

/* ---------- PROVIDERS ---------- */
const SERP_PROVIDERS = {
  serper: {label:'Serper', free:'2,500', fields:[{key:'key',label:'API Key',type:'password'}],
    async search({query,num,country,key}){
      const res = await fetch('https://google.serper.dev/search', {method:'POST', headers:{'X-API-KEY':key.key,'Content-Type':'application/json'}, body:JSON.stringify({q:query,num:num||10,gl:country||'us'})});
      if(!res.ok) throw new Error('Serper '+res.status); const j = await res.json();
      return {organic:(j.organic||[]).map((o,i)=>({pos:o.position||i+1,title:o.title,link:o.link,snippet:o.snippet})), paa:(j.peopleAlsoAsk||[]).map(p=>p.question), related:(j.relatedSearches||[]).map(r=>r.query)};
    }
  },
  serpapi: {label:'SerpAPI', free:'100/mo', fields:[{key:'key',label:'API Key',type:'password'}],

      if(!r.ok) throw new Error('SerpAPI '+r.status); const j = await r.json();

      if(!r.ok) throw new Error('ValueSERP '+r.status); const j = await r.json();
      return {organic:(j.organic_results||[]).map(o=>({pos:o.position,title:o.title,link:o.link,snippet:o.snippet})), paa:(j.related_questions||[]).map(p=>p.question), related:(j.related_searches||[]).map(r=>r.query)};

const FETCHERS = {
  allorigins: async (url)=>{ const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`); if(!r.ok) throw new Error('AO '+r.status); return await r.text(); },

/* ---------- STATE ---------- */
const STORE_KEY = 'cb_state_v1';
const defaultState = {
  inputs: {kw:'', city:'', country:'us', intent:'local', pagetype:'service', proxy:'allorigins'},
  serp: {provider:'serper', keys:{}},
  ai: {provider:'gemini', keys:{}, useFaqs:true, useHeadings:true},
  serpResults: null,    // {organic, paa, related, fetchedAt}
  competitors: [],      // [{pos, title, link, snippet, html, words, h1, h2:[], h3:[], faqs:[], schemaTypes, hasFaqSchema, status, error}]
  brief: null,          // {markdown, html, stats:{...}}
  aiOutput: {faqs:'', headings:''},
  view: 'brief',
};
let state = loadState();
function loadState(){ try { return Object.assign(clone(defaultState), JSON.parse(localStorage.getItem(STORE_KEY))||{}); } catch(e){ return clone(defaultState); } }
function saveState(){ try { localStorage.setItem(STORE_KEY, JSON.stringify({...state, competitors: state.competitors.map(c=>({...c, html: undefined}))})); } catch(e){} }
function clone(o){return JSON.parse(JSON.stringify(o));}

// Inherit keys from other tools
(function inherit(){
  try {
    if(!Object.keys(state.serp.keys).length){
      const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
      if(cf?.settings?.keys){ state.serp.keys = clone(cf.settings.keys); state.serp.provider = cf.settings.provider || state.serp.provider; }
    }
    if(!Object.keys(state.ai.keys).length){
      ['gbp_state_v1','rr_state_v1','ai_state_v1','kw_state_v1','ps_state_v1','sm_state_v1'].forEach(k=>{
        const o = JSON.parse(localStorage.getItem(k)||'null');
        if(o?.ai?.keys){ Object.entries(o.ai.keys).forEach(([id, keys])=>{if(keys.key && !state.ai.keys[id]?.key) state.ai.keys[id] = clone(keys);}); }
      });
    }
    // Inherit kw + city from keyword research
    if(!state.inputs.kw){
      const kw = JSON.parse(localStorage.getItem('kw_state_v1')||'null');
      const sel = kw?.keywords?.filter(k=>k.selected)?.[0];
      if(sel) state.inputs.kw = sel.kw;
      if(kw?.seeds?.city) state.inputs.city = kw.seeds.city;
    }
    if(!state.inputs.kw){
      const cf = JSON.parse(localStorage.getItem('cf_state_v1')||'null');
      const b = cf?.businesses?.[0];
      if(b?.city) state.inputs.city = b.city;
    }
  } catch(e){}
  saveState();
})();

/* ---------- THEME ---------- */

/* ---------- UTILS ---------- */
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function toast(msg,type){const t=document.getElementById('toast');t.className='';t.classList.add('show');if(type)t.classList.add(type);t.innerHTML='<span>'+escapeHtml(msg)+'</span>';setTimeout(()=>t.classList.remove('show'),2500);}
function toggleSec(hdr){hdr.parentElement.classList.toggle('collapsed');}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function domainOf(s){try{ if(!s) return ''; if(!/^https?:\/\//.test(s)) s='http://'+s; return new URL(s).hostname.replace(/^www\./,''); }catch(e){return s||'';}}

/* ---------- INPUTS ---------- */
function saveInputs(){
  state.inputs.kw = document.getElementById('i-kw').value.trim();
  state.inputs.city = document.getElementById('i-city').value.trim();
  state.inputs.country = document.getElementById('i-country').value;
  state.inputs.intent = document.getElementById('i-intent').value;
  state.inputs.pagetype = document.getElementById('i-pagetype').value;
  state.inputs.proxy = document.getElementById('i-proxy').value;

  state.ai.useHeadings = document.getElementById('i-ai-headings').checked;

  document.getElementById('stat-kw').textContent = state.inputs.kw||'—';
}
function fillInputs(){
  document.getElementById('i-kw').value = state.inputs.kw||'';
  document.getElementById('i-city').value = state.inputs.city||'';
  document.getElementById('i-country').value = state.inputs.country||'us';
  document.getElementById('i-intent').value = state.inputs.intent||'local';
  document.getElementById('i-pagetype').value = state.inputs.pagetype||'service';
  document.getElementById('i-proxy').value = state.inputs.proxy||'allorigins';
  document.getElementById('i-ai-faqs').checked = state.ai.useFaqs!==false;
  document.getElementById('i-ai-headings').checked = state.ai.useHeadings!==false;

  // SERP pills
  document.getElementById('prov-pills').innerHTML = Object.entries(SERP_PROVIDERS).map(([id,p])=>`<button class="pp ${state.serp.provider===id?'active':''}" onclick="selSerp('${id}')">${escapeHtml(p.label)}<span class="free">${escapeHtml(p.free)}</span></button>`).join('');

  document.getElementById('ai-pills').innerHTML = Object.entries(AI_PROVIDERS).map(([id,p])=>`<button class="pp ${state.ai.provider===id?'active':''}" onclick="selAi('${id}')">${escapeHtml(p.label)}<span class="free">${escapeHtml(p.free)}</span></button>`).join('');
  renderAiCfg();
}
function selSerp(id){
  state.serp.provider = id; saveState();
  document.querySelectorAll('#prov-pills .pp').forEach(b=>b.classList.toggle('active', b.textContent.includes(SERP_PROVIDERS[id].label)));
  renderSerpCfg();
}
function renderSerpCfg(){
  const p = SERP_PROVIDERS[state.serp.provider]; const k = state.serp.keys[state.serp.provider]||{};
  document.getElementById('prov-cfg').innerHTML = p.fields.map(f=>`<div class="f"><label>${escapeHtml(f.label)}</label><input type="${f.type}" id="serp-${f.key}" value="${escapeAttr(k[f.key]||'')}" oninput="saveSerpKey()"></div>`).join('');
  document.getElementById('ft-prov').textContent = p.label;
}
function saveSerpKey(){
  const p = SERP_PROVIDERS[state.serp.provider];
  const keys = state.serp.keys[state.serp.provider]||{};
  p.fields.forEach(f=>{keys[f.key] = document.getElementById('serp-'+f.key).value.trim();});

}
function selAi(id){
  state.ai.provider = id; saveState();
  document.querySelectorAll('#ai-pills .pp').forEach(b=>b.classList.toggle('active', b.textContent.includes(AI_PROVIDERS[id].label)));
  renderAiCfg();
}
function renderAiCfg(){
  const p = AI_PROVIDERS[state.ai.provider]; const k = state.ai.keys[state.ai.provider]||{};
  document.getElementById('ai-cfg').innerHTML = p.fields.map(f=>`<div class="f"><label>${escapeHtml(f.label)}</label><input type="${f.type}" id="ai-${f.key}" value="${escapeAttr(k[f.key]||'')}" oninput="saveAiKey()"></div>`).join('') + (p.note?`<div class="f"><div class="hint">${p.note}</div></div>`:'');
  document.getElementById('ft-ai').textContent = state.ai.keys[state.ai.provider]?.key ? p.label : 'offline';
}
function saveAiKey(){
  const p = AI_PROVIDERS[state.ai.provider];
  const keys = state.ai.keys[state.ai.provider]||{};
  p.fields.forEach(f=>{keys[f.key] = document.getElementById('ai-'+f.key).value.trim();});
  state.ai.keys[state.ai.provider] = keys; saveState();
  document.getElementById('ft-ai').textContent = keys.key ? AI_PROVIDERS[state.ai.provider].label : 'offline';

/* ---------- GENERATE ---------- */
async function generateBrief(){
  saveInputs();
  if(!state.inputs.kw){ toast('Enter a target keyword','err'); return; }
  const sp = SERP_PROVIDERS[state.serp.provider]; const keys = state.serp.keys[state.serp.provider]||{};
  if(!sp.fields.every(f=>keys[f.key])){ toast('Set SERP provider key','err'); return; }

  document.getElementById('btn-go').disabled = true;
  document.getElementById('prog-fill').style.width = '5%';
  document.getElementById('ft-status').textContent = 'Fetching SERP...';

  // 1. Fetch SERP
  let serp;
  try {
    serp = await sp.search({query: state.inputs.kw, num:10, country: state.inputs.country, key: keys});
  } catch(e){ toast('SERP fetch failed: '+e.message,'err'); document.getElementById('btn-go').disabled = false; return; }
  state.serpResults = {...serp, fetchedAt: Date.now()};
  state.competitors = serp.organic.slice(0,10).map(o=>({...o, status:'pending'}));
  saveState();
  document.getElementById('prog-fill').style.width = '20%';
  renderAll();

  // 2. Fetch + analyze each top-10 result
  const fetcher = FETCHERS[state.inputs.proxy] || FETCHERS.allorigins;
  let done = 0;
  for(const c of state.competitors){
    c.status = 'fetching';
    renderAll();
    document.getElementById('ft-status').textContent = `Analyzing ${done+1}/10: ${c.link}`;
    try {
      const html = await fetcher(c.link);
      const analysis = analyzePage(html, c.link);
      Object.assign(c, analysis, {status:'done'});
    } catch(e){
      c.status = 'err';
      c.error = String(e.message||e).slice(0,200);
    }
    done++;
    document.getElementById('prog-fill').style.width = (20 + done/10*60)+'%';
    saveState(); renderAll();
    await sleep(300);
  }

  // 3. Generate brief
  document.getElementById('ft-status').textContent = 'Generating brief...';
  document.getElementById('prog-fill').style.width = '85%';
  await buildBrief();

  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('btn-go').disabled = false;
  setTimeout(()=>document.getElementById('prog-fill').style.width = '0', 600);
  setTab('brief');
  toast('Brief generated','success');
}

/* ---------- PAGE ANALYSIS ---------- */
function analyzePage(html, url){
  const p = new DOMParser().parseFromString(html, 'text/html');
  const main = p.querySelector('main, article, [role="main"]') || p.body;
  const text = main?.textContent?.trim()||'';
  const words = (text.match(/\b\w+\b/g)||[]).length;
  const h1 = p.querySelector('h1')?.textContent?.trim()||'';
  const h2s = Array.from(p.querySelectorAll('h2')).map(h=>h.textContent.trim()).filter(Boolean).slice(0,20);
  const h3s = Array.from(p.querySelectorAll('h3')).map(h=>h.textContent.trim()).filter(Boolean).slice(0,30);
  const title = p.querySelector('title')?.textContent?.trim()||'';
  const description = p.querySelector('meta[name="description"]')?.getAttribute('content')?.trim()||'';

  // Detect FAQs (look for elements with question marks in h2/h3/strong, common FAQ markup)
  const faqs = [];
  const allHeadings = [...p.querySelectorAll('h2, h3, h4, strong, summary')].slice(0,40);
  allHeadings.forEach(h=>{
    const t = h.textContent.trim();
    if(t.endsWith('?') && t.length>10 && t.length<150) faqs.push(t);
  });

  // Schema
  const schemaTypes = [];
  Array.from(p.querySelectorAll('script[type="application/ld+json"]')).forEach(s=>{
    try { const obj = JSON.parse(s.textContent.trim().replace(/^<!--/,'').replace(/-->$/,'')); const items = Array.isArray(obj)?obj:[obj]; items.forEach(i=>{const t=i['@type']; (Array.isArray(t)?t:[t]).forEach(x=>{if(x) schemaTypes.push(String(x));});}); } catch(e){}
  });
  const hasFaqSchema = schemaTypes.includes('FAQPage');

  // Images
  const imgs = p.querySelectorAll('img').length;

  return {title, description, words, h1, h2s, h3s, faqs: Array.from(new Set(faqs)).slice(0,8), schemaTypes, hasFaqSchema, imgs};
}

/* ---------- BRIEF BUILDER ---------- */
async function buildBrief(){
  const i = state.inputs;
  const done = state.competitors.filter(c=>c.status==='done');
  if(!done.length){ toast('No competitor data — can\'t build brief','err'); return; }
  const wordCounts = done.map(c=>c.words).filter(Boolean);
  const avgWords = wordCounts.length?Math.round(wordCounts.reduce((a,b)=>a+b,0)/wordCounts.length):0;
  const maxWords = wordCounts.length?Math.max(...wordCounts):0;
  const minWords = wordCounts.length?Math.min(...wordCounts):0;
  const targetWords = Math.round(avgWords * 1.15); // Aim 15% above avg
  const avgH2 = Math.round(done.reduce((s,c)=>s+(c.h2s?.length||0),0)/done.length);
  const avgImgs = Math.round(done.reduce((s,c)=>s+(c.imgs||0),0)/done.length);
  const withFaq = done.filter(c=>c.faqs?.length>=2 || c.hasFaqSchema).length;

  // Aggregate H2s and find common patterns
  const allH2s = done.flatMap(c=>c.h2s||[]);
  const h2Stems = {};
  allH2s.forEach(h=>{
    const stem = h.toLowerCase().replace(/[^a-z0-9 ]/g,'').slice(0,80);
    h2Stems[stem] = (h2Stems[stem]||0)+1;
    // Also count phrase frequency
  });
  const commonH2Topics = Object.entries(h2Stems).sort((a,b)=>b[1]-a[1]).slice(0,12);

  // Aggregate FAQs
  const allFaqs = Array.from(new Set(done.flatMap(c=>c.faqs||[]))).slice(0,15);

  // Term frequency across competitor pages
  const allText = done.flatMap(c=>[c.title, c.description, ...(c.h2s||[]), ...(c.h3s||[])]).join(' ').toLowerCase();
  const words = (allText.match(/\b[a-z]{3,}\b/g)||[]).filter(w=>!STOPWORDS.has(w));
  const termFreq = {};
  words.forEach(w=>{termFreq[w] = (termFreq[w]||0)+1;});
  const topTerms = Object.entries(termFreq).sort((a,b)=>b[1]-a[1]).slice(0,20);

  // Optionally AI-augment FAQs/headings
  let aiFaqs = '', aiHeadings = '';
  if(state.ai.keys[state.ai.provider]?.key){
    if(state.ai.useFaqs){
      try { aiFaqs = await aiAsk(`Generate 6 high-intent FAQ questions a customer would ask before searching "${i.kw}"${i.city?' in '+i.city:''}. Output ONLY the questions, one per line, no numbering, no extra text.`); } catch(e){}
    }
    if(state.ai.useHeadings){
      try { aiHeadings = await aiAsk(`For a ${i.pagetype} page targeting "${i.kw}"${i.city?' in '+i.city:''} with ${i.intent} intent, suggest 8 essential H2 section headings. Output ONLY the headings, one per line, no numbering or markdown.`); } catch(e){}
    }
  }
  state.aiOutput = {faqs: aiFaqs, headings: aiHeadings};

  state.brief = {
    stats: {targetWords, avgWords, maxWords, minWords, avgH2, avgImgs, withFaq, commonH2Topics, topTerms, allFaqs, aiFaqs, aiHeadings},
  };
  saveState();
}

async function aiAsk(prompt){
  const p = AI_PROVIDERS[state.ai.provider]; const keys = state.ai.keys[state.ai.provider];
  if(!keys?.key) return '';
  return await p.ask(prompt, keys);
}

function buildBriefMarkdown(){
  const i = state.inputs;
  const s = state.brief.stats;
  const kw = i.kw, city = i.city, country = i.country.toUpperCase(), intent = i.intent, pagetype = i.pagetype;
  const competitors = state.competitors.filter(c=>c.status==='done');

  const pageTypeText = ({service:'Service page',location:'Location/store page',blog:'Blog post',comparison:'Comparison / listicle',faq:'FAQ / guide'})[pagetype];

  let md = `# Content Brief: "${kw}"\n\n`;
  md += `**Target keyword:** ${kw}  \n`;
  md += city ? `**Location:** ${city}  \n` : '';
  md += `**Country:** ${country}  \n`;
  md += `**Intent:** ${intent}  \n`;
  md += `**Page type:** ${pageTypeText}  \n`;
  md += `**Generated:** ${new Date().toLocaleDateString()}\n\n`;

  md += `## Quick Stats\n\n`;
  md += `| Metric | Value | Source |\n`;
  md += `|---|---|---|\n`;
  md += `| Target word count | **${s.targetWords}** | 15% above avg of top 10 |\n`;
  md += `| Competitor avg | ${s.avgWords} | top 10 SERPs |\n`;
  md += `| Competitor range | ${s.minWords}–${s.maxWords} | min/max |\n`;
  md += `| Recommended H2 count | ${Math.max(5, s.avgH2)} | based on competitors |\n`;
  md += `| Recommended images | ${Math.max(3, s.avgImgs)} | based on competitors |\n`;
  md += `| Include FAQ section | ${s.withFaq>=4?'**Yes** (most top results do)':s.withFaq>=1?'Recommended':'Optional'} | ${s.withFaq}/10 competitors have one |\n\n`;

  // Title + Meta
  md += `## Title Tag (≤ 60 chars)\n\n`;
  if(city) md += `\`${kw.charAt(0).toUpperCase()+kw.slice(1)} | [Your Brand] in ${city}\`\n\n`;
  else md += `\`${kw.charAt(0).toUpperCase()+kw.slice(1)} | [Your Brand]\`\n\n`;

  md += `## Meta Description (~150 chars)\n\n`;
  if(intent==='local') md += `> ${city?`Looking for ${kw.toLowerCase()} in ${city}? `:`Need ${kw.toLowerCase()}? `}[Your brand] offers [X benefit]. Call us at [phone] for same-day service.\n\n`;
  else if(intent==='transactional') md += `> ${city?`Book ${kw.toLowerCase()} in ${city} online in 60 seconds. `:`Book ${kw.toLowerCase()} online today. `}[Your USP]. Free quotes — call [phone] or get started.\n\n`;
  else if(intent==='commercial') md += `> Compare the best ${kw.toLowerCase()}${city?' in '+city:''}: pricing, reviews, and what to expect. Updated for ${new Date().getFullYear()}.\n\n`;
  else md += `> Learn about ${kw.toLowerCase()} from [your brand] — what it is, how it works, and what to expect. Updated ${new Date().getFullYear()}.\n\n`;

  // H1
  md += `## H1 (one only)\n\n`;
  if(city) md += `\`${kw.charAt(0).toUpperCase()+kw.slice(1)} in ${city}\`\n\n`;
  else md += `\`${kw.charAt(0).toUpperCase()+kw.slice(1)}\`\n\n`;

  // Recommended H2 sections
  md += `## Recommended H2 Sections\n\n`;
  md += `Use these as section anchors. ${pagetype==='service'?'Include all of them.':'Pick the most relevant 5-7 for your page.'}\n\n`;
  if(s.aiHeadings){
    md += s.aiHeadings.split('\n').filter(l=>l.trim()).map(h=>`- ${h.replace(/^[-•*\d.]+\s*/,'')}`).join('\n')+'\n\n';
  } else {
    // Default headings by page type
    const baseHeadings = {
      service: [
        city?`What our ${kw.toLowerCase().replace(' '+city.toLowerCase(),'').replace(city.toLowerCase()+' ','')} service includes`:`What's included`,
        `Why choose us${city?' in '+city:''}`,
        `Pricing & what to expect`,
        city?`Service areas we cover near ${city}`:`Where we work`,
        `Our process — step by step`,
        `Common ${kw.toLowerCase()} situations we handle`,
        `What customers are saying`,
        `Frequently asked questions`,
      ],
      location: [
        `About our ${city||'this'} location`,
        `Services available at this location`,
        `Hours & contact info`,
        `Directions & parking`,
        `Meet the team`,
        `Reviews from local customers`,
        `What's near us`,
        `Book online`,
      ],
      blog: [
        `What is ${kw.toLowerCase()}?`,
        `Why it matters`,
        `How to ${kw.toLowerCase().replace(/^how to /,'')} — step by step`,
        `Common mistakes to avoid`,
        `Tools or services you'll need`,
        `When to call a pro`,
        `FAQs`,
        `Related reading`,
      ],
      comparison: [
        `Quick verdict`,
        `Comparison table`,
        `Option 1: [name]`,
        `Option 2: [name]`,
        `Option 3: [name]`,
        `What to look for when choosing`,
        `Our recommendation`,
        `FAQs`,
      ],
      faq: [
        `Quick answers (TL;DR)`,
        `General questions`,
        `Pricing & cost`,
        `Process & timing`,
        `Booking & cancellation`,
        `${city?city+'-specific questions':'Location-specific questions'}`,
        `Common situations`,
        `Still have questions?`,
      ],
    };
    (baseHeadings[pagetype]||baseHeadings.service).forEach(h=>md += `- ${h}\n`);
    md += '\n';
  }

  // Topics competitors cover (from H2 analysis)
  if(s.commonH2Topics.length){
    md += `### Topics covered by top-ranking pages\n\n`;
    s.commonH2Topics.slice(0,10).forEach(([topic, count])=>{
      const cap = topic.charAt(0).toUpperCase()+topic.slice(1);
      md += `- ${cap} (${count}/${competitors.length} competitors)\n`;
    });
    md += '\n';
  }

  // FAQs
  md += `## FAQ Section (recommended)\n\n`;
  if(s.aiFaqs){
    md += `### AI-suggested questions:\n\n`;
    s.aiFaqs.split('\n').filter(l=>l.trim()).slice(0,8).forEach(q=>{
      const clean = q.replace(/^[-•*\d.]+\s*/,'').trim();
      md += `- **${clean}**\n`;
    });
    md += '\n';
  }
  if(s.allFaqs.length){
    md += `### Questions competitors are answering:\n\n`;
    s.allFaqs.slice(0,8).forEach(q=>md += `- ${q}\n`);
    md += '\n';
  }

  // Term frequency
  if(s.topTerms.length){
    md += `## Key Terms to Include\n\nUse these terms naturally (don't stuff). Aim for the LSI distribution that competitors use.\n\n`;
    md += `| Term | Frequency in top 10 |\n|---|---|\n`;
    s.topTerms.slice(0,15).forEach(([t,n])=>md += `| ${t} | ${n} |\n`);
    md += '\n';
  }

  // Internal linking
  md += `## Internal Linking Plan\n\n`;
  md += `### Link TO this page from:\n`;
  md += `- Homepage (if a primary service)\n`;
  md += `- /services/ index page\n`;
  if(city) md += `- Other ${city}-area location pages\n`;
  md += `- Related blog posts (3-5)\n`;
  md += `- Footer (if a core service)\n\n`;
  md += `### Link FROM this page to:\n`;
  md += `- Related service pages (3-5)\n`;
  if(city) md += `- /locations/${city.toLowerCase()}/ if exists\n`;
  md += `- Contact / booking page (in CTAs)\n`;
  md += `- Reviews / testimonials page\n`;
  md += `- 2-3 authoritative external sources (boost E-E-A-T)\n\n`;

  // Schema
  md += `## Schema.org Markup\n\n`;
  if(pagetype==='service' || pagetype==='location'){
    md += `- **LocalBusiness** (subtype: ${state.inputs.service||'Plumber/Restaurant/etc.'}) — name, address, phone, hours, geo, sameAs\n`;
    md += `- **Service** for the specific service\n`;
    md += `- **BreadcrumbList** for navigation\n`;
    if(s.withFaq>=3) md += `- **FAQPage** for the FAQ section\n`;
  } else if(pagetype==='blog'){
    md += `- **Article** with headline, image, datePublished, author, publisher\n`;
    md += `- **BreadcrumbList**\n`;
    if(s.withFaq>=3) md += `- **FAQPage**\n`;
  } else if(pagetype==='faq'){
    md += `- **FAQPage** with all Q&A pairs\n`;
    md += `- **BreadcrumbList**\n`;
  }
  md += `\nFor exact JSON-LD output, use the [Schema Generator](schema-generator.html).\n\n`;

  // Competitor benchmarks
  md += `## Competitor Benchmarks (Top 10 SERPs)\n\n`;
  md += `| Pos | Domain | Words | H2s | Has FAQ |\n|---|---|---|---|---|\n`;
  competitors.forEach(c=>{
    md += `| ${c.pos} | ${domainOf(c.link)} | ${c.words||'—'} | ${c.h2s?.length||0} | ${(c.faqs?.length>=2||c.hasFaqSchema)?'✓':'—'} |\n`;
  });
  md += '\n';

  // Final guidelines
  md += `## Content Quality Guidelines\n\n`;
  md += `- **Originality:** Write at least 70% unique content. Don't paraphrase competitors.\n`;
  md += `- **First-hand expertise:** Add specifics only an insider would know (real customer scenarios, internal process, photos of real work).\n`;
  if(city) md += `- **Local relevance:** Mention "${city}" naturally 3-7 times. Include neighborhood references, local landmarks, area-specific challenges.\n`;
  md += `- **E-E-A-T:** Author bio, photo, credentials. Cite primary sources. Real customer reviews (real first names + specifics).\n`;
  md += `- **Readability:** Short paragraphs (2-4 sentences). Use lists. Aim for grade 8 reading level.\n`;
  md += `- **CTAs:** Above-the-fold, mid-page, and end. Click-to-call wrapped in tel: links.\n`;
  md += `- **Updates:** Add "Updated [date]" near the title to signal freshness.\n\n`;

  md += `## Generated by Content Brief Generator · ${new Date().toLocaleString()}\n`;

  return md;
}

/* ---------- MD TO HTML ---------- */
function mdToHtml(md){
  let html = md
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Tables
  html = html.replace(/^\|(.+)\|\n\|[-:|\s]+\|\n((?:\|.+\|\n)+)/gm, (m, head, body)=>{
    const headers = head.split('|').map(h=>h.trim()).filter(Boolean);
    const rows = body.trim().split('\n').map(r=>r.split('|').map(c=>c.trim()).filter((_,i,a)=>i<a.length-0));
    return '<table><thead><tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.slice(1,-1).map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
  });
  // Lists
  const lines = html.split('\n');
  const out = [];
  let inUl=false;
  lines.forEach(line=>{
    const ulM = line.match(/^- (.+)$/);
    if(ulM){ if(!inUl){ out.push('<ul>'); inUl=true; } out.push(`<li>${ulM[1]}</li>`); }
    else { if(inUl){ out.push('</ul>'); inUl=false; } out.push(line); }
  });
  if(inUl) out.push('</ul>');
  html = out.join('\n');
  // Paragraphs
  html = html.split(/\n\n+/).map(b=>b.trim()).filter(Boolean).map(b=>{
    if(b.startsWith('<h')||b.startsWith('<ul')||b.startsWith('<ol')||b.startsWith('<table')||b.startsWith('<blockquote')) return b;
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  }).join('\n');
  return html;
}

/* ---------- EXPORTS ---------- */
function copyBrief(){
  if(!state.brief){toast('No brief','err'); return;}
  navigator.clipboard.writeText(buildBriefMarkdown()).then(()=>toast('Copied','success'));
}
function downloadBrief(){
  if(!state.brief){toast('No brief','err'); return;}
  const md = buildBriefMarkdown();
  const blob = new Blob([md], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`brief-${(state.inputs.kw||'kw').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.md`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('Downloaded','success');
}
function downloadHTML(){
  if(!state.brief){toast('No brief','err'); return;}
  const md = buildBriefMarkdown();
  const css = `*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{padding:24px;background:#f3f6fb;color:#0f1a2e;font-size:14px;line-height:1.65}.wrap{max-width:860px;margin:0 auto;background:#fff;border-radius:14px;padding:42px;box-shadow:0 4px 16px rgba(15,26,46,.1)}h1{font-size:26px;font-weight:800;margin-bottom:14px;border-bottom:2px solid #0d9488;padding-bottom:12px}h2{font-size:18px;font-weight:700;margin:28px 0 10px;color:#0d9488}h3{font-size:15px;font-weight:700;margin:18px 0 8px}p{margin:8px 0}ul{margin:8px 0;padding-left:24px}li{margin-bottom:4px}code{background:#e9eef7;padding:2px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:12px}blockquote{border-left:3px solid #0d9488;padding-left:14px;margin:10px 0;color:#5b6b88;font-style:italic}table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}th{background:#f3f6fb;padding:8px 11px;text-align:left;border-bottom:1px solid #d1d9e8}td{padding:8px 11px;border-bottom:1px solid #e9eef7}strong{font-weight:700}a{color:#0d9488;text-decoration:none}@media print{body{padding:0;background:#fff}.wrap{box-shadow:none;border-radius:0;padding:24px}}`;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Brief: ${escapeHtml(state.inputs.kw)}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><style>${css}</style></head><body><div class="wrap">${mdToHtml(md)}<div style="margin-top:32px;padding-top:14px;border-top:1px solid #e9eef7;font-size:11px;color:#5b6b88;text-align:center">Generated by Content Brief Generator · ${new Date().toLocaleString()}<br>Mukesh Kr · techie1418@gmail.com</div></div><script src="global-nav.js"><\/script>
</body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`brief-${(state.inputs.kw||'kw').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.html`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},100);
  toast('HTML exported','success');
}

}
